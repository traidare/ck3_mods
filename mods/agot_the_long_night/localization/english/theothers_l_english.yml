 #Letters on Winter
 long_nights_WINTER_IS_COMING:0 "Winter is Coming"
 long_nights_WINTER_IS_COMING_DESC:0 "We write to you from the Citadel with urgent news: Winter is coming. Regrettably, we find ourselves unable to predict the duration of this season, an unprecedented anomaly in our records. We urge all to prepare for an indeterminate period of harsh cold and to remain vigilant."
 
 long_nights_WINTER_IS_HERE:0 "To the Lords of the Realm"
 long_nights_WINTER_IS_HERE_DESC:0 "I write from Castle Black with a sense of utmost urgency; the wildlings, in unprecedented numbers, are fleeing southward, driven by the merciless rise of cold winds. The threat looms larger each day, and we find our ranks woefully undermanned to face what is coming. I implore you, for the safety of the realm, send more men to reinforce the Wall immediately."
 
 long_nights_WAR_FOR_THE_DAWN:0 "To the Valiant"
 long_nights_WAR_FOR_THE_DAWN_DESC:0 "I am riding north to face the greatest threat our world has ever known - the White Walkers, in a war for the dawn itself. I call upon every able-bodied man and woman to take up arms and join me in this noble fight, for if we falter, our world will plunge into eternal darkness. Stand with me, and together let us bring light back to the realm."
 
  long_nights_WINTER_IS_OVER:0 "The Dawn has Arrived"
 long_nights_WINTER_IS_OVER_DESC:0 "With hearts full of joy, we proclaim the end of The Long Night and the arrival of the Dawn."
 







wights:0 "Ice Spiders"

others.2.title:0 "#e The Winds of Winter#!"
others.2.desc:0 "#e Word has traveled from the deep north, where men go and seldom return, and what they spoke of chilled even the strongest of wills.\n\n Wildlings, in unparalleled numbers are fleeing southward as if pursued by #bold shadows#!.\n\n The maesters mutter of a winter colder than any in living memory, a winter that will gnaw the flesh and crack the stone, stretching on for years uncounted.\n\n But it is not the cold that should be feared, nor the hunger. For in the heart of that darkness, in the silence that falls between breaths.....\n\n #bold The Others have returned, and The Long Night has begun.#!#!"


others.2.a:0 "Winter is here."

others.3.title:0 "#flatulence A Dream of Spring#!"
others.3.desc:0 "#BER The Others were gone, driven back to whatever dark corners of the world had spawned them, and the realm stood free of their icy shadow at last.\n\n Fields lay scorched and villages empty where the dead had walked, yet men could rebuild; they always did.\n\n The first hint of #bold spring#! was here after a brutal winter. Hopeful voices spoke of peace, of unity forged in shared terror. \n\n But deep in the bones of old houses and in the glances of the high lords, there lingered a fear—fear that the alliances bound in fire and ice would fray and snap with the #bold Great War#! now over.\n\n For men had been spared from the dead, yes, but men had always been their own worst enemy.#!"


others.3.a:0 "The alliances of the Great War will surely last."
others.2.a.tt:0 "You will make no sacrifice to the Cold Gods and face the consequences."

others_occupation.1.t:0 "#e The Scouring  of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]#!"
others_occupation.1_desc:0 "#e The night is endless now, a blanket of frost and death creeping across the ruins of my lands. \n\n The Others, with their cold, silent malice, have laid waste to the realm and I have no choice but to confront this.\n\n As the cold closes in, my breath turning to mist, I stand at the brink - should I make a #warning sacrifice#! to the #bold [thenightking.GetFaith.GetName]#! and hope for mercy, or cling to a fading fire and resist until the end?#!"
others_occupation.1_desc_child:0 "\n\n#e I can see the fear in #bold [child.GetTitledFirstNamePossessive]#! eyes.#!"
others_occupation.1_desc_faith:0 "#e \n\nWould the [ROOT.Char.GetFaith.GetName] forgive me#!?"

others_occupation.1.a:0 "I will not worship these demons."
others_occupation.1.a.tt:0 "You will make no sacrifice to the Cold Gods and face the consequences."

others_occupation.1.b:0 "Will they accept a lesser sacrifice?"
others_occupation.1.b.tt:0 "You will sacrifice courtiers and commoners to the Cold Gods."

others_occupation.1.c:0 "I am sorry [child.GetTitledFirstName]."
others_occupation.1.c.tt:0 "[child.GetFirstName] will be sacrificed."


others_occupation.2.t:0 "#e The Scouring of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]#!"
others_occupation.2.desc:0 "#e #bold The Others had come.#!\n\n There was nothing between us and the dead.\n\n The frost clung to the air, each breath a silent prayer, but the dead did not pray.\n\n They moved through the snow like wraiths, and I could feel the cold creeping into my bones.\n\n Our swords felt heavy, our hands numb from the cold. If we failed now, it would be more than just our deaths - an end to warmth, to life itself. \n\n #warning;bold The night would never end.#! #!"
others_occupation.2.a:0 "#BER For the Dawn!#!"
others_occupation.2.a.tt:0 "You will fight for the survival of your house and your lands. If you fail in this war, you and your whole court may be killed. Your lands will be #warning ravaged.#!"

others_occupation.3.t:0 "#flatulence The Savior of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]#!"
others_occupation.3.desc:0 "#BER The dead had been driven back, but only just.\n\n Their icy breath still lingered on the wind, a reminder that this victory was no more than a fleeting pause in the slaughter.\n\n House [ROOT.Char.GetHouse.GetBaseName] stands, my lands not yet swallowed by frost, but I can feel it in my bones - this is no salvation. The Others will return, more terrible than before, and when they come, they will come in numbers beyond counting.\n\n The Long Night is not over. And if we are to survive, we must find what few souls remain and stand together in this darkness... or be devoured by it.#!"
others_occupation.3.a:0 "We must persist."
others_occupation.3.a.tt:0 "You have temporarily beaten back the Others."

others_occupation.4.t:0 "#e The Scouring of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]#!"
others_occupation.4.desc:0 "#e The battle was lost, my banners trampled in the snow, my men scattered like dead leaves on the wind.\n\nThe cold had come for us all, a creeping, relentless thing, and behind it, the Others. They moved like shadows through the storm, silent, unstoppable, and now they had my lands in their icy grasp.\n\n My people - what remained of them - huddled in fear, praying for the dawn that might never come. If we were lucky, some of us might survive the long night. But luck was a rare thing in this frozen, forsaken world.#!"
others_occupation.4.a:0 "No!"
others_occupation.4.a.tt:0 "You have been defeated."

others_maintenance.2.t:0 "#bold The Future of the Seven Kingdoms#!"
others_maintenance.2.desc:0 "The Others had fallen and the Long Night was over. \n \n Yet victory brought its own weight, and the question loomed like a shadow at dawn: what path would the realm tread now?\n\n To bend the knee to the Iron Throne, or to seize our own destiny and rule ourselves, unfettered by the distant whims of a foreign king?"
others_maintenance.2.a:0 "We shall swear fealty to the Iron Throne."
others_maintenance.2.a.tt:0 "You have been defeated."
others_maintenance.2.b:0 "House [ROOT.Char.GetHouse.GetBaseName] should rule."
others_maintenance.2.b.tt:0 "You will remain independent."

others_trigger_title:0 "#e Trigger the Long Night#!"
others_trigger_desc:0 "The Long Night will begin. The Others will instantly take land Beyond the Wall and begin their conquest."
others_trigger_confirm:0 "Winter is Coming"
others_trigger_tooltip:0 "Others will invade immediately"

war_for_the_dawn_cb:0 "War for the Dawn"

war_for_the_dawn_decision_title:0 "War for the Dawn"
war_for_the_dawn_decision_desc:0 "The Others have returned. They march south with their army of corpses. Mounted on their dead horses and ice spiders. Only together can Westeros hope to survive this. #warning You will not be able to declare the War for the Dawn if the Others have recently won a previous attempt.#!"
war_for_the_dawn_decision_confirm:0 "You will fight The Others"
war_for_the_dawn_decision_tt:0 "It is possible to lose occupied lands to the Others"

