 rule_agot_others_cb_tier:0 "#explanation_link_light_background;bold AGOT:#! #e;bold The Long Night#! War Tier"
 setting_others_cb_kingdom:0 "Kingdom (Creeping Advance)"
 setting_others_cb_kingdom_desc:0 "The Others wage war one #bold kingdom#! at a time — a slow front grinding ever southward. More wars, but more immersive: the Wall falls, the North yields, then the Riverlands..."
 setting_others_cb_empire:0 "Empire (Rapid Onslaught)"
 setting_others_cb_empire_desc:0 "The Others wage war at the #bold empire#! tier — fewer, vaster wars that sweep entire realms at once. A faster, more apocalyptic invasion."

