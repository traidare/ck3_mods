l_english:
 trait_agot_wom_skinchanger: "Gifted Skinchanger"
 trait_agot_wom_skinchanger_practiced: "Practiced Skinchanger"
 trait_agot_wom_skinchanger_master: "Master Skinchanger"
 trait_agot_wom_skinchanger_warg: "Warg"
 trait_agot_wom_skinchanger_desc: "A rare gift permits the bearer to enter the minds of beasts, but every joining risks blurring the boundary between human and animal."
 trait_agot_wom_skinchanger_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] can enter the minds of beasts. Experience brings control, but never perfect safety."
 trait_track_agot_wom_skinchanger: "Skinchanging Mastery"
 trait_track_agot_wom_skinchanger_desc: "Mastery earned through awakening, bonding, and surviving the minds of beasts."
 trait_agot_wom_greensight_mastery: "Untrained Greensight"
 trait_agot_wom_greensight_mastery_awakened: "Awakened Greensight"
 trait_agot_wom_greensight_mastery_greenseer: "Greenseer"
 trait_agot_wom_greensight_mastery_desc: "A mastery track layered upon AGOT's greensight gift."
 trait_agot_wom_greensight_mastery_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] has learned to endure and interpret the green dreams."
 trait_track_agot_wom_greensight_mastery: "Greensight Mastery"
 trait_track_agot_wom_greensight_mastery_desc: "Mastery earned from natural visions, communion, seeking visions, and scrying."

 agot_wom_bond_dog_modifier: "Bonded Dog"
 agot_wom_bond_dog_modifier_desc: "A trusting dog shares this character's thoughts."
 agot_wom_bond_wolf_modifier: "Bonded Wolf"
 agot_wom_bond_wolf_modifier_desc: "A lasting bond, more like a marriage than mastery, joins this character to a wolf."
 agot_wom_bond_raven_modifier: "Bonded Raven"
 agot_wom_bond_raven_modifier_desc: "A raven offers black wings and a wide, perilously tempting sky."
 agot_wom_bond_eagle_modifier: "Bonded Eagle"
 agot_wom_bond_eagle_modifier_desc: "An eagle offers the heights and threatens to make earthly concerns seem small."
 agot_wom_bond_bear_modifier: "Bonded Bear"
 agot_wom_bond_bear_modifier_desc: "A bear's strength waits behind this character's eyes."
 agot_wom_bond_shadowcat_modifier: "Bonded Shadowcat"
 agot_wom_bond_shadowcat_modifier_desc: "A dangerous mountain predator has accepted this character."
 agot_wom_bond_cat_modifier: "Bound Cat"
 agot_wom_bond_cat_modifier_desc: "This proud, cruel little beast was forced into a bond it would never freely grant."
 agot_wom_bond_deer_modifier: "Bonded Deer"
 agot_wom_bond_deer_modifier_desc: "A deer's alert senses are always searching for the hunter."
 agot_wom_influence_echoes_modifier: "Beast-Echoes"
 agot_wom_influence_echoes_modifier_desc: "Alien instincts echo beneath familiar thoughts."
 agot_wom_influence_dog_modifier: "The Trusting Hound"
 agot_wom_influence_dog_modifier_desc: "The dog's need for kin and trust has begun to reshape its human companion."
 agot_wom_influence_wolf_modifier: "The Wolf Within"
 agot_wom_influence_wolf_modifier_desc: "Pack-law, hunger, and a predator's confidence press upon the human mind."
 agot_wom_influence_raven_modifier: "Lost to the Sky"
 agot_wom_influence_raven_modifier_desc: "The world of ledgers and courtesies seems dull beside flight."
 agot_wom_influence_eagle_modifier: "Above the Earth"
 agot_wom_influence_eagle_modifier_desc: "From the heights, mortal concerns look small."
 agot_wom_influence_bear_modifier: "Bear's Temper"
 agot_wom_influence_bear_modifier_desc: "Great strength and sudden anger crowd out patient words."
 agot_wom_influence_shadowcat_modifier: "Shadowcat's Cruelty"
 agot_wom_influence_shadowcat_modifier_desc: "The silent hunter teaches suspicion and merciless patience."
 agot_wom_influence_cat_modifier: "The Vain Cat"
 agot_wom_influence_cat_modifier_desc: "Pride, cruelty, and restless irritation bleed across the forced bond."
 agot_wom_influence_deer_modifier: "Prey's Heart"
 agot_wom_influence_deer_modifier_desc: "Every sound is a hunter; every open road an escape."
 agot_wom_severed_bond_modifier: "Severed Bond"
 agot_wom_severed_bond_modifier_desc: "The death of an inhabited beast tore through this character's mind."
 agot_wom_warg_rest_modifier: "Mind-Weary"
 agot_wom_warg_rest_modifier_desc: "The mind needs time to become wholly human again."
 agot_wom_eagle_survey_modifier: "Eagle's Survey"
 agot_wom_eagle_survey_modifier_desc: "Roads, ridges, and marching columns were mapped from the sky."
 agot_wom_bear_guard_modifier: "Bear's Strength"
 agot_wom_bear_guard_modifier_desc: "The memory of immense strength lends courage in command."
 agot_wom_bear_vitality_modifier: "Bear's Vitality"
 agot_wom_bear_vitality_modifier_desc: "A season of feeding and sleep lends the body unusual vigor."
 agot_wom_shadowcat_pressure_modifier: "Stalked by a Shadowcat"
 agot_wom_shadowcat_pressure_modifier_desc: "Sleep comes poorly when yellow eyes may be watching."
 agot_wom_deer_vigilance_modifier: "Deer's Vigilance"
 agot_wom_deer_vigilance_modifier_desc: "The senses of prey notice danger before the hunter strikes."
 agot_wom_court_greenseer_counsel_modifier: "Greenseer's Counsel"
 agot_wom_court_greenseer_counsel_modifier_desc: "Ambiguous visions are being weighed carefully in affairs of court."

 agot_wom_heed_call_decision: "Heed the Call"
 agot_wom_heed_call_decision_desc: "Open your sleeping mind to the beast that has been calling. An encounter will come within six months, but a bond must still be earned."
 agot_wom_heed_call_decision_tooltip: "Begin searching for an animal bond"
 agot_wom_heed_call_decision_confirm: "Listen"
 agot_wom_refuse_call_decision: "Refuse the Call"
 agot_wom_refuse_call_decision_desc: "Turn away from unfinished searches. The gift remains, and you may reconsider later."
 agot_wom_refuse_call_decision_tooltip: "Suppress the call without losing the Skinchanger trait"
 agot_wom_refuse_call_decision_confirm: "Shut it out"
 agot_wom_enter_skin_decision: "Enter an Animal's Skin"
 agot_wom_enter_skin_decision_desc: "Leave your sleeping body and inhabit one bonded beast for thirty days. You may perform one deed before withdrawing."
 agot_wom_enter_skin_decision_tooltip: "Choose a bonded animal to inhabit"
 agot_wom_enter_skin_decision_confirm: "Slip free"
 agot_wom_dog_guard_decision: "Guard the Household"
 agot_wom_dog_guard_decision_desc: "Set the hound's nose and loyalty against hidden threats."
 agot_wom_dog_guard_decision_tooltip: "Seek a hostile scheme or strengthen household vigilance"
 agot_wom_dog_guard_decision_confirm: "Guard them"
 agot_wom_eagle_survey_decision: "Survey from Above"
 agot_wom_eagle_survey_decision_desc: "Ride warm currents over roads and ridges, mapping the ground for the next campaign."
 agot_wom_eagle_survey_decision_tooltip: "Risk the eagle for a six-month movement and advantage bonus"
 agot_wom_eagle_survey_decision_confirm: "Take wing"
 agot_wom_bear_guard_decision: "Guard and Strengthen"
 agot_wom_bear_guard_decision_desc: "Draw upon the bear for command or bodily vigor."
 agot_wom_bear_guard_decision_tooltip: "Risk the bear for a temporary martial or health boon"
 agot_wom_bear_guard_decision_confirm: "Wake the bear"
 agot_wom_deer_sense_decision: "Sense the Hunters"
 agot_wom_deer_sense_decision_desc: "Let the deer's prey-instinct search for a hunter aimed at you. If none is found, its vigilance may still protect your road."
 agot_wom_deer_sense_decision_tooltip: "Seek a hostile scheme, gain vigilance, panic, or lose the deer"
 agot_wom_deer_sense_decision_confirm: "Listen for pursuit"
 agot_wom_commune_weirwood_decision: "Commune at a Weirwood"
 agot_wom_commune_weirwood_decision_desc: "Sleep beneath carved red eyes and accept what the old trees choose to show."
 agot_wom_commune_weirwood_decision_tooltip: "Gain 5 Greensight mastery at the cost of 20 Stress"
 agot_wom_commune_weirwood_decision_confirm: "Touch the roots"
 agot_wom_seek_vision_decision: "Seek a Vision"
 agot_wom_seek_vision_decision_desc: "Reach deliberately into the tangled current of prophecy. The answer will be symbolic, never a clean command."
 agot_wom_seek_vision_decision_tooltip: "Spend Piety and gain 40 Stress for a vision and 4 mastery"
 agot_wom_seek_vision_decision_confirm: "Look"
 agot_wom_court_greenseer_counsel_decision: "Offer Greenseer's Counsel"
 agot_wom_court_greenseer_counsel_decision_desc: "Frame uncertain visions as cautious advice for the court."
 agot_wom_court_greenseer_counsel_decision_tooltip: "Gain a modest five-year Learning and Intrigue benefit"
 agot_wom_court_greenseer_counsel_decision_confirm: "Counsel caution"
 agot_wom_reach_unbound_beast_decision: "Reach for an Unbound Beast"
 agot_wom_reach_unbound_beast_decision_desc: "A master of both gifts may brush an unfamiliar mind for ten days. This cannot create a bond or grant mastery, and resistance is likely."
 agot_wom_reach_unbound_beast_decision_tooltip: "A dangerous, nonlethal sensory experience with any beast"
 agot_wom_reach_unbound_beast_decision_confirm: "Reach beyond the bond"
 agot_wom_dwell_dragon_dream_decision: "Dwell upon a Dragon Dream"
 agot_wom_dwell_dragon_dream_decision_desc: "Invite the recurring fire and wings back into sleep. Such dreams have guided dragonblood for generations, and have also destroyed dreamers."
 agot_wom_dwell_dragon_dream_decision_tooltip: "Gain 50 Stress and seek an ambiguous dragon dream"
 agot_wom_dwell_dragon_dream_decision_confirm: "Dream of dragons"
 agot_wom_has_bond_slot_tt: "Has room for another animal bond"
 agot_wom_at_weirwood_tt: "Is at a weirwood or a canonical heart-tree site"

 agot_wom_wolf_maul_interaction: "Maul with the Wolf"
 agot_wom_wolf_maul_interaction_desc: "Send your inhabited wolf against this character."
 agot_wom_raven_watch_interaction: "Watch through the Raven"
 agot_wom_raven_watch_interaction_desc: "Set black wings above this character's schemes and secrets."
 agot_wom_shadowcat_stalk_interaction: "Stalk with the Shadowcat"
 agot_wom_shadowcat_stalk_interaction_desc: "Use the shadowcat to terrify, hinder, or overhear this character."
 agot_wom_cat_listen_interaction: "Listen through the Cat"
 agot_wom_cat_listen_interaction_desc: "Force the household cat to carry whispers from this character's rooms."
 agot_wom_scry_character_interaction: "Scry through Greensight"
 agot_wom_scry_character_interaction_desc: "Turn the green sight toward this character and risk mistaking symbol for truth."

 agot_wom_awakening.0001.t: "The Other Pair of Eyes"
 agot_wom_awakening.0001.desc: "Sleep loosens its hold, yet you do not wake in your own bed. You smell damp earth, hear a heartbeat too fast to be yours, and see through eyes close to the ground. When your own body finally returns, one certainty remains: the gift has awakened."
 agot_wom_awakening.0001.a: "I will learn whose eyes they were."
 agot_wom_awakening.0001.b: "Shut the beast out."

 agot_wom_bonding.0005.t: "Another Voice"
 agot_wom_bonding.0005.desc: "After a decade with the first familiar presence, another animal mind brushes the edge of sleep. It is fainter, and it need never become a bond."
 agot_wom_bonding.0005.a: "I can hold two voices."
 agot_wom_bonding.0005.b: "One is enough."
 agot_wom_bonding.0100.t: "A Beast at the Edge of Sleep"
 agot_wom_bonding.0100.desc.dog: "A dog has begun waiting near you, open and trusting. Its dreams already lean toward yours."
 agot_wom_bonding.0100.desc.wolf: "A wolf watches from beyond the firelight. This will not be obedience; any bond must be forged like a marriage."
 agot_wom_bonding.0100.desc.raven: "A raven follows your road. In sleep you feel the temptation of black wings and an endless sky."
 agot_wom_bonding.0100.desc.eagle: "An eagle circles above. One touch of its mind makes every wall and duty below seem very small."
 agot_wom_bonding.0100.desc.bear: "A bear's heavy dreams press against yours: hunger, winter, strength, and a temper with no need for words."
 agot_wom_bonding.0100.desc.shadowcat: "Yellow eyes appear among the stones. The shadowcat is no tame creature, and it knows you are reaching."
 agot_wom_bonding.0100.desc.cat: "A household cat looks back with vanity and contempt. It will never yield freely; it can only be forced."
 agot_wom_bonding.0100.desc.deer: "A deer freezes at the treeline. Its mind is all listening, wind, and the expectation of pursuit."
 agot_wom_bonding.0100.a: "Approach slowly."
 agot_wom_bonding.0100.b: "Not this beast."
 agot_wom_bonding.0100.c: "I reject every such bond."
 agot_wom_bonding.0200.t: "The Joining Trial"
 agot_wom_bonding.0200.desc: "Months of shared paths and borrowed dreams have brought the two minds close. The final distance cannot be crossed without trust—or force."
 agot_wom_bonding.0200.a: "Let patience and understanding bridge it."
 agot_wom_bonding.0200.b: "Break its resistance."
 agot_wom_bonding.0200.c: "End this before one of us is harmed."
 agot_wom_bonding.0300.t: "Two Minds, One Path"
 agot_wom_bonding.0300.desc: "The last boundary bends without breaking. The beast remains itself and you remain yourself, yet each is now present behind the other's eyes."
 agot_wom_bonding.0300.a: "We are joined."
 agot_wom_bonding.0301.t: "The Mind Recoils"
 agot_wom_bonding.0301.desc: "The animal tears away from your touch. Pain snaps through both minds, leaving you awake, shaking, and alone."
 agot_wom_bonding.0301.a: "I pushed too far."

 agot_wom_warging.0001.t: "Choose the Skin"
 agot_wom_warging.0001.desc: "Your body settles into sleep. Each bonded mind is a door, but you may pass through only one."
 agot_wom_warging.0001.dog: "The trusting dog"
 agot_wom_warging.0001.wolf: "The wolf beyond the fire"
 agot_wom_warging.0001.raven: "The raven and the open sky"
 agot_wom_warging.0001.eagle: "The eagle above the earth"
 agot_wom_warging.0001.bear: "The sleeping bear"
 agot_wom_warging.0001.shadowcat: "The shadowcat among the stones"
 agot_wom_warging.0001.cat: "The unwilling cat"
 agot_wom_warging.0001.deer: "The watchful deer"
 agot_wom_warging.0001.cancel: "Remain in my own skin."
 agot_wom_warging.0100.t: "A Dream on Four Legs"
 agot_wom_warging.0100.desc: "In sleep you slip without intending it. Strange scents and immediate fears replace the bedchamber until you wrench yourself awake. The experience teaches a little—and takes something in return."
 agot_wom_warging.0100.a: "That was not merely a dream."
 agot_wom_warging.0100.b: "Follow the unfamiliar mind when sleep returns."
 agot_wom_warging.0200.t: "Echoes of the Beast"
 agot_wom_warging.0200.desc: "An appetite, fear, or impulse arrives before your own thought. It fades quickly, but it was not yours."
 agot_wom_warging.0200.a: "I must hold to myself."
 agot_wom_warging.0201.t: "The Boundary Thins"
 agot_wom_warging.0201.desc: "The animal's instincts no longer vanish when you wake. They have begun to shape how you meet the human world."
 agot_wom_warging.0201.a: "Where does it end and I begin?"
 agot_wom_warging.0210.t: "The Beast Demands"
 agot_wom_warging.0210.desc: "The joined mind surges against yours. You may tear yourself back at terrible cost, or surrender some permanent corner of the self."
 agot_wom_warging.0210.a: "Fight it. I am human."
 agot_wom_warging.0210.b: "Yield to what we have become."
 agot_wom_warging.0220.t: "Changed by the Joining"
 agot_wom_warging.0220.desc: "Something settles differently behind your eyes. Whether the change is visible or only felt, it will never happen in quite this way again."
 agot_wom_warging.0220.a: "The beast has left its mark."
 agot_wom_warging.0300.t: "A Cry Cut Short"
 agot_wom_warging.0300.desc: "Pain explodes through the shared mind—and then there is only absence. The beast died while you inhabited it. Part of you still reaches for a presence that will never answer."
 agot_wom_warging.0300.a: "I felt everything."
 agot_wom_warging.0400.t: "Beyond the Bond"
 agot_wom_warging.0400.desc: "Eight distant kinds of mind lie at the edge of your reach. You may touch one for a few sensory days, but you cannot claim it, master it, or learn mastery from it."
 agot_wom_warging.0400.dog: "Touch a dog's trusting mind."
 agot_wom_warging.0400.wolf: "Touch a wolf's wary mind."
 agot_wom_warging.0400.raven: "Touch a raven in flight."
 agot_wom_warging.0400.eagle: "Touch an eagle above the peaks."
 agot_wom_warging.0400.bear: "Touch a bear's heavy strength."
 agot_wom_warging.0400.shadowcat: "Touch a shadowcat's silent hunger."
 agot_wom_warging.0400.cat: "Force a moment from a cat."
 agot_wom_warging.0400.deer: "Touch a deer listening for hunters."

 agot_wom_visions.0001.t: "Whispers of What May Be"
 agot_wom_visions.0001.desc.wildfire: "Green flowers bloom in a stone hall. A crowned shadow drinks their light, and every door becomes a mouth of flame."
 agot_wom_visions.0001.desc.others: "A black wall sweats beneath a pale sun. Far beyond it, blue stars open one by one in a field of snow."
 agot_wom_visions.0001.desc.harrenhal: "Five towers stand whole in a lake of blood. A winged darkness passes over them; when it is gone, the stones remember fire."
 agot_wom_visions.0001.desc.murder: "A knife lies beneath white feathers. You cannot see the hand that reaches for it, only a familiar ring reflected in the steel."
 agot_wom_visions.0001.desc.war: "Two crowned stags drink from the same river. Upstream, the water is clear; downstream, it runs red beneath broken banners."
 agot_wom_visions.0001.desc.dynasty: "A dead branch flowers while the green branch withers. One fruit bears your face, but you do not know which branch is yours."
 agot_wom_visions.0001.a: "A warning, perhaps—or only a possibility."
 agot_wom_visions.0002.t: "The Dragon Dream"
 agot_wom_visions.0002.desc.doom: "Twelve years pass in a single breath. A mountain tears open beneath towers without number, and dragons become black shapes against a sky brighter than the sun."
 agot_wom_visions.0002.desc.egg: "A stone egg beats like a heart in your hands. When the shell cracks, you cannot tell whether the sound is hatching or a hall collapsing around you."
 agot_wom_visions.0002.desc.ice: "You ride a dragon over a river choked with armored dead. Its fire melts them into morning dew—until one pale shape looks up and speaks your name."
 agot_wom_visions.0002.desc.star: "A red star bleeds above snow. Three winged shadows cross beneath it, but only two reach the far horizon."
 agot_wom_visions.0002.a: "The blood remembers, but it does not explain."
