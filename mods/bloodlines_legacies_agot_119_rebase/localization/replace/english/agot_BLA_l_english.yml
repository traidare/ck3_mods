#FORRESTER
forrester_legacy_track_BLA_name: "Forrester"
forrester_legacy_track_BLA_desc: "Iron from Ice"
forrester_legacy_1_BLA_name: "Ironwood Lords"
forrester_legacy_2_BLA_name: "Wolves Among Trees"
forrester_legacy_3_BLA_name: "Shields of Ironrath"
forrester_legacy_4_BLA_name: "Rooted Rivalry"
forrester_legacy_5_BLA_name: "Winter's Bloodline"


FORRESTER_IRONWOOD_LORDS_NO_BULLETTAB:0 "We are the undisputed masters of the black forests, guarding the ancient ironwood groves that have made our name legendary since the Dawn Age. Our master woodsmen fell these near-indestructible trees with an absolute, grueling patience—shaping massive castle gates that blunt ram-heads and crafting longbows that never snap under the winter frost.\n#weak Iron from Ice, and wealth from the ancient bark. Members of the Forrester dynasty are often born [GetTrait('diligent').GetName( GetNullCharacter )]."

FORRESTER_WOLVES_AMONG_TREES_NO_BULLETTAB:0 "We do not ride our warhorses into the suffocating thickets of the Wolfswood; we stalk our prey on foot through the dense, snow-packed sentinel groves. Our trackers glide through the undergrowth like ghosts, communicating via low forest-calls and luring overconfident Whitehill patrols into lethal longbow ambushes from the high branches.\n#weak The dark canopy chokes out our tracks, making every thicket a grave. Members of the Forrester dynasty make for lethal [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]."

FORRESTER_SHIELDS_OF_IRONRATH_NO_BULLETTAB:0 "At the massive timber keep of Ironrath, our household garrison is drilled to the relentless crash of the wood-axe and the smith's anvil. Our elite house-guardsmen lock their massive, ironwood-reinforced kite shields edge-to-edge, forming an impenetrable timber wall that can withstand heavy cavalry charges or a hail of cross-bolts without yielding a single inch of ground.\n#weak Our line is as unyielding as the heartwood. Unlocks the recruitment of [GetMaA('forrester_ironguard').GetName] as [men_at_arms|E]."

FORRESTER_ROOTED_RIVALRY_NO_BULLETTAB:0 "Our hatred for the fat, craven turncoats of House Whitehill is carved into our very bones, an ancestral blood-feud fought across muddy sawpits and disputed timber markers for centuries. We do not negotiate boundaries or accept royal arbitrations over our borders—we answer their logging incursions with a direct stroke of a broad-axe to the skull.\n#weak We count every tree they steal, and we pay the debt back in blood."

FORRESTER_WINTERS_BLOODLINE_NO_BULLETTAB:0 "The long northern winters have seasoned our line like our prized timber, stripping away any hint of southern softness or courtly vanity. We maintain a fanatical, ironclad fidelity to the Direwolf of Winterfell, standing firm through catastrophic losses and broken hosts, always ready to raise the Red Stallion or White Tree banners when the King calls.\n#weak The snows freeze the lakes, but they only harden our resolve. Members of the Forrester dynasty are frequently born [GetTrait('brave').GetName( GetNullCharacter )]."


forrester_ironguard:0 "Ironrath Ironguard"
forrester_ironguard_flavor:0 "Drawn from the hardiest woodsmen and veteran trackers of the Wolfswood, these elite heavy infantrymen are the physical shield of Ironrath. They are equipped with colossal, iron-rimmed shields sliced from the dense heartwood of old ironwood trees, rendering them entirely impervious to common blades and crossbow bolts. Drilled to hold narrow forest paths against impossible numbers, they fight with the stubborn, unyielding defiance of the ancient northern pines."


#BOLTON

bolton_legacy_track_BLA_name: "Bolton"
bolton_legacy_track_BLA_desc: "Our Blades Are Sharp"
bolton_legacy_1_BLA_name: "Flayed Flesh"
bolton_legacy_2_BLA_name: "Northern Terror"
bolton_legacy_3_BLA_name: "Iron Grip"
bolton_legacy_4_BLA_name: "Legacy of the Dreadfort"
bolton_legacy_5_BLA_name: "The Quiet Knife"


BOLTON_FLAYED_FLESH_NO_BULLETTAB:0 "Long before the upstart Starks ever unified the North from Winterfell, our Red Kings ruled the eastern valleys through absolute, systematic terror. Our flayed man banner was never a madman's whim, but an explicit political decree—a blood-oath that any rebel or rival lord would end his days skinless, faceless, and screaming in our deep vaults.\n#weak We carve our absolute authority directly into the flesh of our enemies. Enables the #V Flay#! [execution|E] method. Members of the Bolton dynasty are often born [GetTrait('sadistic').GetName( GetNullCharacter )]."

BOLTON_NORTHERN_TERROR_NO_BULLETTAB:0 "The grim, heavy pink stones of the Dreadfort cast a suffocating shadow across the entire northeastern reaches of the realm. Our halls are kept ice-cold, our courts operate in absolute silence, and our vanguard accepts no surrenders on the battlefield once our skin-peeling blades are unsheathed.\n#weak Dread is our truest fortress, and fear is our most loyal commander. Enables recruitment of [GetMaA('bolton_dreadriders').GetName] as [men_at_arms|E]."

BOLTON_IRON_GRIP_NO_BULLETTAB:0 "Few houses handle their local vassals and tenant farmers with such unyielding, absolute mathematical scrutiny. We do not negotiate with our borders; we crush dissent through total isolation, forcing the Umbers, Karstarks, and Last River smallfolk to surrender their grain tallies long before they ever dream of defiance.\n#weak Our silence chokes out rebellion, and what our talons grip, we never release."

BOLTON_LEGACY_OF_THE_DREADFORT_NO_BULLETTAB:0 "Our ancestral seat was laid in an ancient dawn age when the North knew no laws, only killers, monsters, and skin-changers. We have outlasted centuries of Stark sieges and royal turncoats, keeping our ancient bloodline as stubborn, frozen, and calculating as the winter tundra surrounding our walls.\n#weak Blood cemented our foundations, and absolute dread keeps our battlements standing firm."

BOLTON_THE_QUIET_KNIFE_NO_BULLETTAB:0 "The shrewdest masters of our line understand that terror cuts deepest when it strikes without a single trumpet blast. We utilize untraceable nightshade poisons, paid-off tavern informants, and sudden midnight blades to quietly liquidate problematic creditors or overly ambitious cousins out of sight of the court.\n#weak True vengeance makes no sound, striking when the target believes they are entirely safe. Members of the Bolton dynasty are frequently born [GetTrait('vengeful').GetName( GetNullCharacter )]."

bolton_dreadriders:0 "Dreadfort Dreadriders"
bolton_dreadriders_flavor:0 "Drawn from the most brutal, battle-hardened men-at-arms of the Last River region, these heavy shock cavalrymen are the iron fist of the Dreadfort. Clad in dark, flayed-skin tabards and riding massive black warhorses armored in blackened steel scale, their thundering approach causes immediate panic across enemy lines before a single lance is even lowered. They operate with a cold, merciless efficiency, hunting down routed hosts to ensure no survivors are left to tell tales."


#MANDERLY

manderly_legacy_track_name: "Manderly"
manderly_legacy_track_desc: "True to our Word"
manderly_legacy_1_name: "Last of the Northern Giants"
manderly_legacy_2_name: "Oaths carved in Ice"
manderly_legacy_3_name: "White Harbor's Golden Gate"
manderly_legacy_4_name: "Banners Among the Waves"
manderly_legacy_5_name: "Northern Splendor"

MANDERLY_LAST_OF_THE_NORTHERN_GIANTS_NO_BULLETTAB:0 "We are the displaced princes of the Mander, driven from our ancestral southern fertile lands by the greed of House Gardener and remade into the wealthiest lords of the North beneath the winter sky. We hold court within the magnificent white stone of the New Castle, our legendary physical size matched only by our unyielding, iron-clad resolve to defend the realm that took us in.\n#weak The southrons stole our fields, but the North gave us our true soul. Members of the Manderly dynasty are often born [GetTrait('gluttonous').GetName( GetNullCharacter )]."

MANDERLY_OATHS_CARVED_IN_ICE_NO_BULLETTAB:0 "When our ancestors arrived at the mouth of the White Knife as starving exiles, the Stark Kings of Winter gave us land, stone, and our sovereignty in exchange for a holy blood-oath of eternal fealty. For a thousand years, no house has stood truer beside the Direwolf—from smashing Dagon Greyjoy’s ironborn reivers to plotting a meticulous, cold vengeance for the betrayals of the Red Wedding.\n#weak Our loyalty is an absolute, multi-generational debt that can never be erased by gold or kings. Members of the Manderly dynasty make for exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

MANDERLY_WHITE_HARBORS_GOLDEN_GATE_NO_BULLETTAB:0 "White Harbor stands as the gleaming, silver-rich jewel of the North, its colossal white stone curtain walls reflecting the morning light across the Bite. We command the only true city in the northern wastes, running massive silver mints and bustling port custom-houses where Braavosi factor-princes trade alongside our powerful urban merchant guilds.\n#weak We hold the keys to northern commerce, our wealth guarded by absolute masonry. Enables recruitment of [GetMaA('manderly_white_harbor_sentinels').GetName] as [men_at_arms|E]."

MANDERLY_BANNERS_AMONG_THE_WAVES_NO_BULLETTAB:0 "Though King Brandon the Burner destroyed the North's ancient ships, we have quietly used our immense wealth to resurrect a massive, secret war-fleet hidden deep within the pine-choked channels of the White Knife. Our heavily armed war galleys and deep-bellied dromonds dominate the river-mouths, allowing our knights to launch devastating amphibious vanguards.\n#weak We bring the ancient naval fury of the Mander to the freezing waves of the Bite. #high Unlocks the ability to sail in Major Rivers#!."

MANDERLY_NORTHERN_SPLENDOR_NO_BULLETTAB:0 "While other northern keeps are dark, drafty longhalls of granite and timber, we feast in the breathtaking Court of the Newt beneath towering ceilings of green glass and gold-veined marble. We are the noble guardians of the Order of the Green Hand and the Knighthood of the Faith, using our immense storehouses to feed thousands of starving peasants through the longest, most brutal winters.\n#weak We blend southern chivalric grace with the fierce, unyielding honor of the winter lords."


manderly_white_harbor_sentinels:0 "Order of the Newt Sentinels"
manderly_white_harbor_sentinels_flavor:0 "Drawn from the heavily armored, Seven-worshiping knightly houses of White Harbor, these elite heavy infantrymen are the ultimate protectors of the city gates. Equipped with towering shields painted with the merman sigil and wielding massive, beautifully weighted halberds, they are trained to defend narrow docks and urban choke points with a flawless, impenetrable wall of steel. They fight with a fanatical devotion to House Manderly, eager to drown any pirate or northern rival who dares threaten the silver vaults of the city."


#DUSTIN

dustin_legacy_track_name: "Dustin"
dustin_legacy_track_desc: "Our Word Yet Lives"
dustin_legacy_1_name: "Blood of the First Men"
dustin_legacy_2_name: "Shield of the North"
dustin_legacy_3_name: "Northern Resolve"
dustin_legacy_4_name: "Lords of the Barrow"
dustin_legacy_5_name: "Barrow Kings"


DUSTIN_BLOOD_OF_THE_FIRST_MEN_NO_BULLETTAB:0 "Our lineage runs back to the dawn of the First Men, born from the ancient chieftains who cleared the plains long before Winterfell was even a pile of granite. We are a broad-shouldered, iron-willed breed of barrow-lords, our physical endurance hardened by centuries of navigating the wind-scoured northern wastes.\n#weak The bones beneath our soil do not warp, and neither does our blood. Members of the Dustin dynasty are frequently born [GetTrait('strong').GetName( GetNullCharacter )]."

DUSTIN_SHIELD_OF_THE_NORTH_NO_BULLETTAB:0 "Commanding the vast, open-field pastures of the southern plains, our household vanguards act as the iron gateway protecting the interior of the North. We do not hide behind high stone towers; our elite outriders scour the peat-bogs and low hills, ready to flatten any invader with a brutal, unexpected cavalry strike.\n#weak Our lances are the first to taste the enemy's blood on the plain. Enables recruitment of [GetMaA('dustin_barrow_guard').GetName] as [men_at_arms|E]."

DUSTIN_NORTHERN_RESOLVE_NO_BULLETTAB:0 "House Dustin records every blood-debt with a cold, terrifying permanence, handed down from ruler to successor like a notched war-axe. We do not forget how Lord Eddard Stark left our men to rot in the sands of Dorne while bringing home nothing but an empty saddle—and our transactional loyalty to the winter kings sleeps with one hand on its dagger.\n#weak We remember the bones left at the Tower of Joy, and we pay our debts with interest."

DUSTIN_LORDS_OF_THE_BARROW_NO_BULLETTAB:0 "We rule from the shadow of the Great Barrow, the colossal, grass-grown tomb that houses the ancient Kings of the First Men. We are the rightful masters of these sacred crypts, using the absolute weight of our historical antiquity to command the unwavering devotion of our vassals and the smallfolk who till our soil.\n#weak The ancient dead lend us their authority, and we rule our plain with an iron hand."

DUSTIN_BARROW_KINGS_NO_BULLETTAB:0 "We remember when our ancestors wore crowns of bronze and iron, ruling the entire North before the Starks brought the valley kingdoms to heel. That royal ambition has never truly faded from our halls, and our calculating schemers watch the direwolf banner for any hint of weakness to reclaim what was stolen.\n#weak The crown of the First Kings yet lives in our bloodline, waiting for the thaw."


dustin_barrow_guard:0 "Barrowton Mound-Guards"
dustin_barrow_guard_flavor:0 "Drawn from the hardened horse-breeders and veteran peat-scouts of the barrow plains, these elite shock infantrymen are the ultimate defense force of Barrowton. Equipped with heavy circular shields and massive, double-bitted iron axes, they are trained to break enemy shieldwalls with savage, unrelenting strength. They fight with a grim, silent fanaticism, sworn by blood-oaths to turn our border-ditches into graves for any outsider who dares defile the sacred mounds of our kings."

building_type_agot_dustin_barrowton:0 "Barrowton City Market"
building_agot_dustin_barrowton_01:0 "The Gates of Barrowton"
building_agot_dustin_barrowton_01_desc:0 "Built in a massive circle entirely surrounding the Great Barrow mound, Barrowton stands as a unique, timber-walled crossroads of northern commerce. Here, amid earthen ramparts and wooden keeps, thousands of horse-traders, wool-merchants, and ironmongers gather to trade directly above the bones of ancient kings—proving that the deep wealth of the living thrives upon the silent weight of the dead."


#MORMONT

mormont_legacy_track_name: "Mormont"
mormont_legacy_track_desc: "Here We Stand"
mormont_legacy_1_name: "Bear's Oath"
mormont_legacy_2_name: "Stone and Storm"
mormont_legacy_3_name: "Rugged Vanguard"
mormont_legacy_4_name: "Shieldmaidens of Bear Isle"
mormont_legacy_5_name: "Keepers of Bear Isle"


MORMONT_BEARS_OATH_NO_BULLETTAB:0 "Our lineage holds a sacred, multi-generational debt to the Direwolf of Winterfell, won for us when King Rodrik Stark wrestled an ironborn king for sovereignty over our rock. We do not write our promises on fragile southern parchment; we carve our oaths directly into our timber halls, executing any turncoat who dares compromise our word.\n#weak Our blood-vows are as stubborn as the frost, and we never break faith. Members of the Mormont dynasty are frequently born [GetTrait('loyal').GetName( GetNullCharacter )]."

MORMONT_STONE_AND_STORM_NO_BULLETTAB:0 "Living in a drafty wooden keep ringed by earthen ramparts and massive pine logs, our kin have been seasoned by the brutal gales of the Sunset Sea. We do not tolerate courtly vanities or southern pageantry; our lords are broad-shouldered, iron-willed, and physically hardened by decades of manual toil in a freezing wilderness.\n#weak The winter frost strips away softness, leaving our muscles hard as stone. Members of the Mormont dynasty are usually born [GetTrait('strong').GetName( GetNullCharacter )]."

MORMONT_RUGGED_VANGUARD_NO_BULLETTAB:0 "We do not wait behind castle walls for the vanguard to arrive; we launch our longships directly into the crashing breakers to strike our enemies in the surf. Our household warriors excel at open-field, low-line infantry brawls, swinging heavy wood-axes with a savage, unrelenting ferocity that shatters more disciplined hosts.\n#weak Our shields do not buckle, and our axes cut deep. Enables recruitment of [GetMaA('mormont_shield_bears').GetName] as [men_at_arms|E]."

MORMONT_SHIELDMAIDENS_OF_BEAR_ISLE_NO_BULLETTAB:0 "Because our men are so often slaughtered at sea or marching in the King's host, the women of Bear Island are born to command the battlements. Carved above our gate is a woman in a bearskin nursing a babe with one arm while gripping a battle-axe in the other, a testament to daughters who can put down an ironborn raid before the dinner fires are lit.\n#weak Our she-bears stand firm where sons fall, and they strike without mercy. Enables recruitment of [GetMaA('mormont_she_bears').GetName] as [men_at_arms|E]."

MORMONT_KEEPERS_OF_BEAR_ISLE_NO_BULLETTAB:0 "Though our halls are poor and we possess no vast gold hoards, we wield the ultimate prestige of **Longclaw**, our ancestral Valyrian steel bastard sword. We maintain a fanatical, un-Andal devotion to the ancient laws of the First Men, keeping a suspicious, permanent watch over the freezing waves of the Bay of Ice for wildling reivers.\n#weak We are the northernmost shield of the west, unbent and unbroken by kings."


mormont_shield_bears:0 "Mormont Woodsmen"
mormont_shield_bears_flavor:0 "Drawn from the rugged timber-cutters and iron-miners of Bear Island, these heavy infantrymen are the blunt vanguard of our longhall. Equipped with circular, bronze-rimmed wooden shields and massive, double-bitted logging axes, they are drilled to crash into enemy infantry lines through raw physical mass, using their tools of forest labor to shatter shields and cleave limbs in the thickest scrums."

mormont_she_bears:0 "Mormont She-Bears"
mormont_she_bears_flavor:0 "When the men of Bear Island sailed south to fight for the Kings of Winter, their wives, mothers, and daughters took up their axes and swore to guard the isle until their return. The She-Bears never laid those weapons down. Clad in boiled leather and furs, painted with ash and oil, they fight in ranks with axe or mace, roaring like the beasts whose name they bear. To face them is to learn the North’s oldest truth—there is no mercy in a mother’s fury."


building_type_agot_mormont_russet_den:0 "Mormont Russet Den"
building_agot_mormont_russet_den_01:0 "The Russet Den Lodge"
building_agot_mormont_russet_den_01_desc:0 "Hidden deep within the suffocating, snow-packed sentinel pine forests of Bear Island, this massive timber hunting lodge serves as the true cultural heart of your domain. Outfitted with massive hearths, rough straw benches, and walls lined with heavy shadow-cat pelts, it hosts rowdy winter feasts, tactical war councils, and blood-oaths sworn directly to the Old Gods."



#RYSWELL

ryswell_legacy_track_name: "Ryswell"
ryswell_legacy_track_desc: "Give Chase To Glory"
ryswell_legacy_1_name: "Riders of the Rills"
ryswell_legacy_2_name: "The Father's Judgement"
ryswell_legacy_3_name: "Frostbound Honor"
ryswell_legacy_4_name: "Bone Moor Brutality"
ryswell_legacy_5_name: "Shadows of the Dead Marsh"


RYSWELL_RIDERS_OF_THE_RILLS_NO_BULLETTAB:0 "Our lineage commands the vast, rolling fens and swift-flowing streams of the Rills, where we breed the hardiest, swiftest warhorses in the Seven Kingdoms. While other northern houses trudge through the snow on foot, our knights master the saddle from boyhood, launching devastating heavy cavalry vanguards across the rugged tundra.\n#weak Our stallions outrun the winter wind, and our lances flatten the enemy's lines. Enables recruitment of [GetMaA('ryswell_riders_rills').GetName] as [men_at_arms|E]."

RYSWELL_THE_FATHERS_JUDGEMENT_NO_BULLETTAB:0 "We remember the terrifying righteousness of the ancient Lord Ryswell, whose own son deserted his post on the Wall. Our ancestor personally hunted the boy down and returned him to the Night's Watch to be encased in solid ice for eternity—before taking the black himself to stand guard beside the corpse. \n#weak We do not spare our own blood when honor demands execution. Members of the Ryswell dynasty are frequently born [GetTrait('just').GetName( GetNullCharacter )]."

RYSWELL_FROSTBOUND_HONOR_NO_BULLETTAB:0 "We do not trade our political loyalty for soft southern gold or empty royal promises. Our word is as rigid and unyielding as the frozen iron-ore beneath our hills, maintaining a strict, transactional fidelity to our regional allies and executing any turncoat who brings shame to our house.\n#weak The winter gales freeze our pastures, but our dynastic honor remains unbreakable."

RYSWELL_BONE_MOOR_BRUTALITY_NO_BULLETTAB:0 "Living in a state of permanent territorial friction against the barrow-lords, our knights have perfected the brutal art of border-reiving. We do not tolerate logging incursions or livestock-stealing along our frontier; we ride down trespassers without mercy, leaving their bones to rot in our cold fens.\n#weak We strike before our borders are breached, and we answer every slight with cold iron."

RYSWELL_SHADOWS_OF_THE_DEAD_MARSH_NO_BULLETTAB:0 "Our house understands that a crown belongs to whoever possesses the strength and cunning to seize it. We weave intricate marriage alliances with the Dreadfort, watching the political winds of Winterfell with a calculating, sharp-eyed opportunism, ready to advance our family's trajectory the moment our liege lord falters.\n#weak We ride the shifting currents of the North to carve out our own empire. Members of the Ryswell dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."


ryswell_riders_rills:0 "Lancers of the Rills"
ryswell_riders_rills_flavor:0 "Drawn from the elite horse-breeders and veteran frontier-riders of the western fills, these heavy shock cavalrymen are the pride of the Ryswell vanguard. Mounted on massive, thick-furred destriers bred specifically to charge through deep snow and loose mud, they specialize in devastating, high-speed flank maneuvers. They shatter enemy infantry formations with a brutal mass of lances, before ruthlessly running down any routed survivors to ensure an absolute, crushing victory."


#UMBER

umber_legacy_track_BLA_name: "Umber"
umber_legacy_track_BLA_desc: "Nothing Holds Us Down"
umber_legacy_1_BLA_name: "Giants blood"
umber_legacy_2_BLA_name: "Winter Bred"
umber_legacy_3_BLA_name: "Oath of the Wolf"
umber_legacy_4_BLA_name: "Wrothborn"
umber_legacy_5_BLA_name: "Last Hearth"


UMBER_GIANTS_BLOOD_NO_BULLETTAB:0 "Our lineage traces directly back to the towering First Men chieftains who bred with the literal giants of the far north. We are a colossal, broad-shouldered race of northern lords, our sheer physical mass and terrifying muscle allowing our warriors to swing weapons that ordinary men can barely lift.\n#weak The heavy blood of the giants runs thick and violent in our veins. Members of the Umber dynasty are frequently born [GetTrait('physique_good_1').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )], or [GetTrait('physique_good_3').GetName( GetNullCharacter )]."

UMBER_WINTER_BRED_NO_BULLETTAB:0 "We do not build delicate marble solars or copy southern courtly pageantry; our kin are born in the freezing teeth of the far north, seasoned by blizzards that would kill a southron knight in his saddle. Our massive physical frames are impervious to the biting frost, allowing our hosts to campaign when the rest of the world is freezing to death.\n#weak The deep winter only hardens our resolve, and our strength is absolute. Members of the Umber dynasty are usually born [GetTrait('strong').GetName( GetNullCharacter )]."

UMBER_OATH_OF_THE_WOLF_NO_BULLETTAB:0 "When the war-horns sound at Winterfell, House Umber brings the largest, most bloodthirsty vanguard to the King's host. We roar our absolute, multi-generational fealty to the Direwolf on the battlefield, our massive iron long-axes shattering enemy lines with a savage, unrelenting fury that leaves no survivors to tell tales.\n#weak Our loyalty is loud, violent, and written in the blood of our foes. Enables recruitment of [GetMaA('umber_howling_line').GetName] as [men_at_arms|E]."

UMBER_WROTHBORN_NO_BULLETTAB:0 "We are a boisterous, short-tempered house of giant warriors, quick to flip feasting tables and drag out our steel over a drunken insult. We do not tolerate courtly slights or passive-aggressive legalities; we answer any threat to our honor by biting off fingers, cracking skulls, and laughing through the slaughter.\n#weak Our wrath is a raging furnace, and few survive when our blood is up."

UMBER_LAST_HEARTH_NO_BULLETTAB:0 "Planted squarely at the northernmost edge of the Seven Kingdoms, our monumental stone fortress stands as the primary shield protecting the realm from the wildling hordes. Living in a constant state of low-intensity border warfare against the raiders who slip across the Last River, our watchposts never sleep.\n#weak We hold the line against the lawless tundra, an unbroken wall of northern iron."

umber_howling_line:0 "The Howling Line"
umber_howling_line_flavor:0 "Drawn from the most colossal, battle-hardened mountain-vassals of the Umber domain, these elite shock infantrymen are the terror of the northern borderlands. Wielding massive, two-handed iron war-axes and unburdened by heavy southern plate, they enter the scrum bellowing a deafening, predatory battle-howl that shatters enemy morale before the lines even collide. They fight with a reckless, bloodthirsty fanaticism, engineered entirely to break shieldwalls through raw, crushing physical violence."


building_type_agot_umber_last_hearth:0 "Umber Last Hearth Fortress"
building_agot_umber_last_hearth_01:0 "The Last Hearth Gates"
building_agot_umber_last_hearth_01_desc:0 "Excluding the freezing, ruined stations of the Night's Watch along the Wall, Last Hearth stands as the absolute northernmost major castle in the Seven Kingdoms. Ringed by deep earthworks and colossal stone curtain walls, this massive fortress serves as the final warm sanctuary before the endless arctic frost—a place of roaring hearth-fires, massive timber feasting halls, and an iron, blood-bound hospitality where the ancient traditions of the First Men are fiercely guarded by the Umber watch."


#BLACKWOOD

blackwood_legacy_track_name: "Blackwood"
blackwood_legacy_track_desc: "Watching Eyes, Hidden Strength"
blackwood_legacy_1_name: "First Men of the Wolfswood"
blackwood_legacy_2_name: "Bracken Rivalry"
blackwood_legacy_3_name: "Valewood Rangers"
blackwood_legacy_4_name: "The Old Gods Listen"
blackwood_legacy_5_name: "Dark wings, Deep Roots"


BLACKWOOD_FIRST_MEN_OF_THE_WOLFSWOOD_NO_BULLETTAB:0 "Our lineage commands a royal antiquity that predates the first stone of Winterfell, tracing back to the ancient days when we ruled the North as Kings of the Wolfswood. Driven south after centuries of war with the Starks, we carried our bloodlines and our sacred heart trees to the Riverlands, permanently refusing to trade our Old Gods for southern crowns.\n#weak We are the ancient blood of the north, unbent by septons. Members of the Blackwood dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

BLACKWOOD_BRACKEN_RIVALRY_NO_BULLETTAB:0 "Our absolute, unyielding hatred for the craven horse-lords of House Bracken is an ancestral blood-feud that has bled the Trident red for ten thousand years. We hold them eternally accountable for sneaking into our grove to pour deadly poison into the roots of our sacred heart tree, and we answer their treachery with immediate, merciless steel.\n#weak Every fallen leaf reminds us of their crimes, and we pay our debts in blood."

BLACKWOOD_VALEWOOD_RANGERS_NO_BULLETTAB:0 "We do not rely on clumsy, heavily armored knights to patrol the dense thickets of the Blackwood Vale; we field elite woodsmen and master longbowmen who treat the forest as their sanctuary. Cloaked in dark leathers and moving like ghosts through the high canopy, they launch devastating guerrilla ambushes that leave invading hosts blind and broken.\n#weak The treeline belongs to our trackers, and our arrows strike unseen. Enables recruitment of [GetMaA('blackwood_valewood_rangers').GetName] as [men_at_arms|E]."

BLACKWOOD_THE_OLD_GODS_LISTEN_NO_BULLETTAB:0 "Beneath the titanic, bone-white skeleton of our poisoned heart tree, our lords kneel in the midnight silence to receive the true counsel of the earth. While the rest of the Riverlands sells its soul for southern holy oils, our inner circle preserves the ancient, mystical sight that allows our chosen heirs to read the wind and look beyond the veil.\n#weak The Old Gods are not dead; they speak to the rooted. Members of the Blackwood dynasty are frequently born with the gift of [GetTrait('greensight').GetName( GetNullCharacter )]."

BLACKWOOD_DARK_WINGS_DEEP_ROOTS_NO_BULLETTAB:0 "The raven and the weirwood are the permanent anchors of our dynastic authority across the Riverlands. We command a colossal, shifting flock of thousands of ravens that shroud our towers in darkness at dusk, utilizing their black wings to seed spies across every court from Storm's End to the Wall.\n#weak Our roots run deeper than the riverbeds, and our shadow chokes out our enemies."


blackwood_valewood_rangers:0 "Valewood Rangers"
blackwood_valewood_rangers_flavor:0 "Drawn from the most insular foresters and veteran scouts of the Blackwood Vale, these elite marksmen are the lethal vanguard of Raventree Hall. Equipped with heavy yew longbows and trained to melt into the undergrowth without leaving a footprint, they specialize in high-speed tactical skirmishing and poisoned ambush strikes. They channel the ancient hunting traditions of the First Men, breaking enemy infantry morale from the treeline before a blade is even drawn."


building_type_agot_blackwood_ravendeep_hollow:0 "Blackwood Ravendeep Hollow"
building_agot_blackwood_ravendeep_hollow_01:0 "The Subterranean Ravenry"
building_agot_blackwood_ravendeep_hollow_01_desc:0 "Established deep within the limestone caverns directly beneath the colossal stone curtain walls of Raventree Hall, this ancient, unmapped hollow serves as a sacred sanctuary for your dynasty. Here, beneath massive roots and out of sight of the southern septons, thousands of ravens roost in the damp dark—anchoring your private communion with the Old Gods and preserving the secret correspondence of your household."
building_agot_blackwood_ravendeep_hollow_02:0 "The Carved Roots Gallery"
building_agot_blackwood_ravendeep_hollow_02_desc:0 "Expanded subterranean paths and ancient glyph-carvings deepen the security of the hollow. Scribes catalog your land-grants and bloodlines beneath the roots, while your master spy-runners intercept foreign messages brought in by your black-winged scouts."
building_agot_blackwood_ravendeep_hollow_03:0 "The Sanctuary of Whispers"
building_agot_blackwood_ravendeep_hollow_03_desc:0 "Steeped in an absolute, suffocating silence, the deepest vaults of the hollow function as an unmatched command center for espionage and statecraft. The ravens watch from the dark ledges, your maesters analyze ancient prophecies, and the absolute will of House Blackwood is enforced across the Trident from the shadows."


#BRACKEN

bracken_legacy_track_name: "Bracken"
bracken_legacy_track_desc: "No Bridle Can Tame"
bracken_legacy_1_name: "Echoes of the Horse Lords"
bracken_legacy_2_name: "Blackwood Rivalry"
bracken_legacy_3_name: "Oathless, not Faithless"
bracken_legacy_4_name: "Mud War Doctrine"
bracken_legacy_5_name: "Old Blood, Strong Arms"

BRACKEN_ECHOES_OF_THE_HORSE_LORDS_NO_BULLETTAB:0 "Before the Andals ever crossed the narrow sea, our ancestors ruled the fertile valleys of the Trident from the saddle as the Kings of the Red Fork. We have spent thousands of years breeding the heaviest, swiftest warhorses in the Riverlands, ensuring every son of Stone Hedge is born to command a charging destrier.\n#weak The crown was lost to history, but our cavalry charge remains absolute law. Enables recruitment of [GetMaA('bracken_redmane_knights').GetName] as [men_at_arms|E]."

BRACKEN_BLACKWOOD_RIVALRY_NO_BULLETTAB:0 "Our absolute, unyielding hatred for the treacherous raven-mimics of House Blackwood is a blood-feud that has choked the Riverlands in corpses for ten thousand years. They pray to rotten, dead bark while we swear our lances to the light of the Seven, and we will never grant them peace while a single crow-worshiper draws breath.\n#weak Hate is our truest inheritance, and we pay our border debts in steel. Members of the Bracken dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

BRACKEN_OATHLESS_NOT_FAITHLESS_NO_BULLETTAB:0 "House Bracken bends its knee only to leaders who possess the raw, physical strength to command our respect. We have broken oaths to kings and unseated tyrants whenever they showed weakness, serving Tullys, Lannisters, or Freys only so long as their swords remained sharper than our own.\n#weak Feudal vows are nothing but chains; our ultimate faith is placed in steel."

BRACKEN_MUD_WAR_DOCTRINE_NO_BULLETTAB:0 "Generations of relentless border-skirmishing have taught us a brutal doctrine: the mud of the Riverlands is fertilized with the blood of our enemies, and we must hold the field at any cost. Our lancers are trained to charge through waist-deep mire and rain-slick clay, grinding down our rivals long after softer hosts have broken their ranks.\n#weak We do not waste our time with courtly finesse; our vanguard wins through absolute endurance."

BRACKEN_OLD_BLOOD_NO_BULLETTAB:0 "We trace our lineage back to the ancient horse-lords who ruled the Blackwater and the Red Fork long before the direwolves of the north ever ventured south of the Neck. That ancient, royal ambition still burns behind our banners, driving our knights to charge into every scrum as if to reclaim the sovereignty that time stole from us.\n#weak We were kings before the current great houses built their castles. Members of the Bracken dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."


bracken_redmane_knights:0 "Redmane Knights"
bracken_redmane_knights_flavor:0 "Drawn from the elite horse-breeders and wealthiest landowners of the Bracken domain, these heavy shock cavalrymen are the iron fist of Stone Hedge. Mounted on massive, thick-necked stallions famed for their fiery red manes and aggressive battle-temperament, they specialize in shattering enemy infantry shieldwalls through sheer momentum and weight of lance, ruthlessly trampling any routed survivors into the mud."


building_type_agot_bracken_horse_quarters:0 "Bracken Horse Quarters"
building_agot_bracken_horse_quarters_01:0 "The Red Fork Stud-Farms"
building_agot_bracken_horse_quarters_01_desc:0 "The foundational architecture of your domain's military power, these sprawling riverside stables and breeding yards are dedicated to the meticulous cultivation of the Bracken horse line. Outfitted with deep hay-barns and muddy exercise paddocks, they support the training of heavy destriers, squires, and lancers bred specifically for Riverlands warfare."
building_agot_bracken_horse_quarters_02:0 "Stone Hedge Tilting Grounds"
building_agot_bracken_horse_quarters_02_desc:0 "Expanded with stone-paved drill grounds, reinforced breeding stalls, and quintain tracks. These quarters turn promising squires into seasoned lancers and heavy, battle-ready knights sworn to the Seven."
building_agot_bracken_horse_quarters_03:0 "The Grand Royal Stables"
building_agot_bracken_horse_quarters_03_desc:0 "A legendary, fortress-like breeding and training complex famed across the Seven Kingdoms. Producing the most lethal shock cavalry in the history of the Trident, it ensures your house can field a vanguard that can trample any rival house into the dirt."


#MOOTON

mooton_legacy_track_name: "Mooton"
mooton_legacy_track_desc: "Wisdom and Strength"
mooton_legacy_1_name: "Lord of the Pools"
mooton_legacy_2_name: "Keepers of Jonquil's Pool"
mooton_legacy_3_name: "Salt-Harvest Lords"
mooton_legacy_4_name: "Oaths and Opportunists"
mooton_legacy_5_name: "The Crown's Quiet Hand"


MOOTON_LORD_OF_THE_POOLS_NO_BULLETTAB:0 "Our lineage commands the premier deep-water port on the southern throat of the Bay of Crabs. We do not field reckless, hot-blooded cavalry hosts; our bailiffs govern the pink stone town of Maidenpool with precise customs ledgers, turning our strategic coastal crossroads into a continuous machine of merchant revenue.\n#weak Our wealth is anchored in the harbor, and our authority is meticulously audited."

MOOTON_KEEPERS_OF_JONQUILS_POOL_NO_BULLETTAB:0 "We are the sacred guardians of Jonquil’s Pool, the legendary waters where Florian the Fool first witnessed the maidens bathing. We treat the ancient, romantic history of our seat as a massive prestige asset, drawing pilgrims, traveling singers, and wealthy septons to our walls to spend their coin beneath our protection.\n#weak We turn the ancient songs into solid silver. Enables recruitment of [GetMaA('mooton_maidenpool_wardens').GetName] as [men_at_arms|E]."

MOOTON_SALT_HARVEST_LORDS_NO_BULLETTAB:0 "Our prosperity relies on the massive pans of our coastal salt-pans and the heavy custom-dues levied upon trade cogs from Gulltown and King's Landing. We do not bleed our smallfolk dry for futile border wars; we secure local fishing monopolies and control the river-mouths to maximize our dynastic treasury.\n#weak We squeeze our power directly from the brine, and the market pays our price."

MOOTON_OATHS_AND_OPPORTUNISTS_NO_BULLETTAB:0 "House Mooton has survived centuries of dynastic cataclysms simply by mastering the art of calculated, tactical turncoating. Let the great houses burn themselves to ash in their glorious rebellions—we have abandoned dragons, broken vows to lords, and bolted our iron gates until the winning host arrives to accept our submission.\n#weak Feudal honor is a luxury for dead men; our ultimate loyalty is to survival."

MOOTON_THE_CROWNS_QUIET_HAND_NO_BULLETTAB:0 "Living within a few days' ride of the capital, our magister-lords understand that a signed merchant contract or a well-placed court bribe is more effective than a thousand spears. We maintain a sharp-eyed, silent presence on the trade councils of the realm, turning court secrets into domestic monopolies.\n#weak We do not shout on the battlefield; we quietly manage the wealth of the Trident."


mooton_maidenpool_wardens:0 "Pink Wall Guard"
mooton_maidenpool_wardens_flavor:0 "Drawn from the veteran harbor watch and professional mercenary vanguards of the Bay of Crabs, these elite infantrymen are the ultimate defense force of Maidenpool. Equipped with heavy mail and bright plate armor over scalloped faulds, their left pauldrons are embossed with a leaping salmon picked out in red and gold. Drilled to lock their heavy targes edge-to-edge and swing massive poleaxes to the strict count of the sept-bells, they specialize in choking off narrow urban streets and port gatehouses, ruthlessly flattening any riot or foreign raid."


building_type_agot_mooton_maidenpool:0 "Maidenpool"
building_agot_mooton_maidenpool_01:0 "Maidenpool"
building_agot_mooton_maidenpool_01_desc:0 "Built at the strategic junction where the Crownlands meet the Riverlands, Maidenpool stands as a heavily fortified, bustling nexus of maritime commerce. Ringed by famous, towering curtain walls of defensive pink stone, the town encircles the legendary pool where Florian met Jonquil—proving that while the romantic past draws pilgrims to your gates, it is the deep, bustling harbor that fills your vaults with gold."


#DARRY

darry_legacy_track_name: "Darry"
darry_legacy_track_desc: "Reap What We Sow"
darry_legacy_1_name: "Riders of the Redgrass"
darry_legacy_2_name: "Crown's Loyal Few"
darry_legacy_3_name: "Cloaked in White"
darry_legacy_4_name: "Fields of Duty"
darry_legacy_5_name: "Silent Resilience"

DARRY_RIDERS_OF_THE_REDGRASS_NO_BULLETTAB:0 "Our lineage commands the deep, rich furrows of the eastern Trident. We do not forget how our vanguards smashed the usurper's lines on the Redgrass Field, nor how we bled to defend the dragon's right. When steel is drawn, our heavy lancers plow through enemy lines with a blunt, methodic violence.\n#weak Our lances cleave the battlefield like a heavy iron share. Enables recruitment of [GetMaA('darry_knights_furrow').GetName] as [men_at_arms|E]. Members of the Darry dynasty are often born [GetTrait('brave').GetName( GetNullCharacter )]."

DARRY_CROWNS_LOYAL_FEW_NO_BULLETTAB:0 "House Darry has paid the ultimate blood-price for its fanatical, unyielding loyalty to the Targaryen dynasty. We watched three of our lord's sons get slaughtered by Robert's rebels at the Ruby Ford, and we bore the bitter humiliation of having half our ancestral lands stripped away by the Usurper rather than breaking our sacred oaths.\n#weak Our loyalty is an unbreakable bond, signed in ancestral blood. Members of the Darry dynasty make for exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

DARRY_CLOAKED_IN_WHITE_NO_BULLETTAB:0 "Our house has given the finest blades to the White Swords of the Kingsguard, from the legendary Ser Raymun to the stalwarts who stood beside the dragon kings. We treat the defense of the iron seat as our ultimate dynastic honor, commanding our knights to serve as an impenetrable living shield for our chosen sovereign.\n#weak The white cloak is our highest inheritance, and our duty never wavers."

DARRY_FIELDS_OF_DUTY_NO_BULLETTAB:0 "We do not waste our coin on extravagant southern tourneys; we extract our power directly from the heavy soil and the disciplined labor of our tenant farmers. Our common levies are trained to defend our borders with massive, iron-tipped pikes, transforming our grain fields into a lethal rampart against raiding outlaws.\n#weak We grind down our enemies through absolute endurance and defensive grit. Enables recruitment of [GetMaA('darry_plowmans_pikes').GetName] as [men_at_arms|E]."

DARRY_SILENT_RESILIENCE_NO_BULLETTAB:0 "Though royal decrees have faded our power and shrunk our borders, the soul of Castle Darry remains completely unbent. We wait in our smoke-darkened halls, quietly hoarding our silver and hiding the ancient dragon tapestries in our secret vaults, ready to strike the moment the true King returns across the water.\n#weak We bend our knees to the Usurper in the daylight, but we sharpen our daggers in the dark."


darry_knights_furrow:0 "Lancers of the Furrow"
darry_knights_furrow_flavor:0 "Bearing the crest of the black plowman on a field of brown, these heavy shock cavalrymen are the pride of the Darry vanguard. Mounted on massive, thick-legged destriers bred to charge through wet river-clay and loose mud, they specialize in breaking enemy infantry shieldwalls through raw, crushing momentum. They advance without flashy southern pageantry, systematically cleaving through enemy formations with their lances before ruthlessly running down any routed survivors."

darry_plowmans_pikes:0 "Plowman's Pikes"
darry_plowmans_pikes_flavor:0 "Raised from the hard-working tenant farmers of the Darry estates, these heavy infantrymen embody the stoic resilience of the Riverlands. Equipped with massive, heavy-ash pikes and long iron dirks, they are drilled to form an impenetrable wall of steel points capable of breaking heavy cavalry charges or sellsword rushes. They carry a bitter, generational memory of lost lands and fallen lords, standing as stubborn and unyielding as the very soil they till."


building_type_agot_darry_plowmans_keep:0 "Darry Plowmans Keep"
building_agot_darry_plowmans_keep_01:0 "Castle Darry Keep"
building_agot_darry_plowmans_keep_01_desc:0 "Planted strategically near the historic banks of the Ruby Ford where the Trident slows, Castle Darry stands as a grim, heavily fortified monument to old loyalties. Ringed by squat stone curtain walls and stout gatehouses, its massive oaken heart-tower looks down upon a low, smoke-darkened great hall—where, beneath the floorboards, secret vaults conceal the forbidden Targaryen tapestries from the watchful eyes of the Usurper's spies."



#FREY

frey_legacy_track_name: "Frey"
frey_legacy_track_desc: "We Stand Together"
frey_legacy_1_name: "Taking their Toll"
frey_legacy_2_name: "Fruit of the Crossing"
frey_legacy_3_name: "Questionable Loyalty"
frey_legacy_4_name: "Walls over Honor"
frey_legacy_5_name: "The Song Ends Swiftly"


FREY_TAKING_THEIR_TOLL_NO_BULLETTAB:0 "Our lineage commands the ultimate strategic choke point of the Riverlands. We do not gamble our fortunes on high-born notions of chivalry; we built two massive stone towers and a colossal bridge across the raging waters of the Green Fork, forcing every traveling merchant, hedge knight, and rebel king to surrender heavy silver before our gates unbolt.\n#weak The river flows only one way, and every traveler pays our price. Enables recruitment of [GetMaA('frey_bridge_guard').GetName] as [men_at_arms|E]."

FREY_FRUIT_OF_THE_CROSSING_NO_BULLETTAB:0 "We do not brag of ancient Andal bloodlines, but our family tree multiplies across the Trident with a terrifying, unstoppable speed. Lord Walder’s legendary fecundity has flooded the realm with an army of sons to marry off for land monopolies and daughters to leverage for political contracts, ensuring no court in Westeros is free from our presence.\n#weak Our house grows like weeds along the riverbank, and our strength is in our sheer numbers."

FREY_QUESTIONABLE_LOYALTY_NO_BULLETTAB:0 "House Frey has survived centuries of dynastic civil wars by mastering the cold, cynical mathematics of self-preservation. Let the great houses bleed themselves dry for flowery songs and hollow banners—we stay inside our towers, watch the balance of power shift, and march only when the winning host offers us the most lucrative contracts.\n#weak Feudal honor is a luxury for dead men; our ultimate loyalty is to the highest bidder. Members of the Frey dynasty are born exceptionally [GetTrait('cynical').GetName( GetNullCharacter )]."

FREY_WALLS_OVER_HONOR_NO_BULLETTAB:0 "Our twin strongholds are built squat, stubborn, and entirely garrisoned by suspicion. We have learned that a massive iron-studded portcullis and a locked drawbridge are ten times safer than an open battlefield, and we spit upon the bards who mock our caution while hiding behind our defenses.\n#weak A bolted gate outlasts a thousand gallant cavalry charges, and stone ignores their insults."

FREY_THE_SONG_ENDS_SWIFTLY_NO_BULLETTAB:0 "The entire realm curses our name for the bloody, practical vengeance we executed under our own roof at the Red Wedding. We shattered the sacred guest right to erase our unfaithful liege lord, proving to the Seven Kingdoms that crossing a Frey transforms the wedding feast into a silent funeral where the daggers cut deep.\n#weak Every song ends in blood, and every broken contract is paid in full. Members of the Frey dynasty are frequently born [GetTrait('vengeful').GetName( GetNullCharacter )]."


frey_bridge_guard:0 "Green Fork Watchmen"
frey_bridge_guard_flavor:0 "Drawn from the most cynical mercenaries and veteran toll-collectors of the Crossing, these heavy infantrymen are the iron wardens of the Twins. Equipped with heavy gambesons, iron caps, and massive bill-hooks designed to pull knights from their saddles, they specialize in choking off narrow drawbridges and stone gatehouses. They have absolutely no use for chivalry, ruthlessly flattening any merchant riot or tax-evader with the cold, precise violence of professional extortionists."


building_type_agot_frey_tatterton_crossingpost:0 "Tatterton Crossingpost"
building_agot_frey_tatterton_crossingpost_01:0 "Frey Crossing Fort"
building_agot_frey_tatterton_crossingpost_01_desc:0 "Built to command the vital trade routes surrounding the Green Fork, this heavily fortified outpost serves as the first iron gatehouse to the Twins. Ringed by stone ramparts and aggressive watchposts, it functions as a lucrative toll-station where sharp-eyed collectors squeeze silver stags from every cart, ensuring that the wealth of the riverlands flows directly into your household vaults."



#CLEGANE

clegane_legacy_track_name: "Clegane"
clegane_legacy_track_desc: "A Hound Never Lies"
clegane_legacy_1_name: "The Butcher's Blood"
clegane_legacy_2_name: "Leashed Fury"
clegane_legacy_3_name: "Blood Hounds"
clegane_legacy_4_name: "Unrelenting Flesh"
clegane_legacy_5_name: "The Name Alone"


CLEGANE_THE_BUTCHERS_BLOOD_NO_BULLETTAB:0 "Our house was born from the blood-soaked blade of a kennelmaster who tore three hounds apart to save Lord Tytos Lannister from a raging lioness. Granted a minor keep and a sigil of three dogs on a field of yellow, our line has been built entirely on absolute, unquestioning violence and fanatical service to Casterly Rock.\n#weak Our hands are broad and heavy, engineered strictly for slaughter. Members of the Clegane dynasty are usually born [GetTrait('strong').GetName( GetNullCharacter )]."

CLEGANE_BLOOD_HOUNDS_NO_BULLETTAB:0 "We do not field gallant knights who babble about southern chivalry or tourney honors. Our household men-at-arms are a pack of monstrous, broad-shouldered killers who track our master's enemies like rabid beasts, leaving a trail of burned keeps and mutilated smallfolk across any domain we are ordered to pacify.\n#weak Once our vanguard is unleashed, the fields turn to ash. Enables recruitment of [GetMaA('clegane_blood_hounds').GetName] as [men_at_arms|E]."

CLEGANE_LEASHED_FURY_NO_BULLETTAB:0 "Our veins burn with a savage, unrelenting madness that can barely be contained by the commands of our Lannister masters. We are a house of killers who treat a declaration of war as a license to unleash our raw, animalistic cruelty, butchering our foes long after they have thrown down their steel.\n#weak We do not accept surrenders; we grind our enemies into the dirt."

CLEGANE_UNRELENTING_FLESH_NO_BULLETTAB:0 "Our warriors possess a monstrous, terrifying physical endurance, dulling the agony of battlefield wounds with massive drafts of sour wine and milk of the poppy. A Clegane lord can fight through catastrophic injuries that would snap the spine of lesser men, swinging a massive, two-handed greatsword with a single arm.\n#weak Our flesh refuses to fall, and our rage is a constant furnace. Members of the Clegane dynasty are frequently born [GetTrait('wrathful').GetName( GetNullCharacter )]."

CLEGANE_THE_NAME_ALONE_NO_BULLETTAB:0 "The mere mention of our name strikes an absolute, paralyzing panic through the hearts of commoners and high-born lords alike. We have earned a reputation for unchallenged, monstrous brutality across the Seven Kingdoms, turning our very presence on the battlefield into a weapon of psychological terror.\n#weak The shadow of the triple-hound chokes out our enemies' courage before the lines even collide."


clegane_blood_hounds:0 "Clegane's Blood Hounds"
clegane_blood_hounds_flavor:0 "Drawn from the most brutal thugs, landless killers, and massive poachers of the Westerlands, these elite shock infantrymen are the iron fist of the Clegane keep. Wearing heavy, blackened steel plate and snarling hound-crested helms, they enter the fray with an overwhelming, bloodthirsty aggression designed to break enemy lines through sheer physical mass. They have an absolute contempt for mercy or laws of war, specializing in high-dread vanguard charges, nocturnal camp raids, and the merciless execution of routed hosts."



#REYNE

reyne_legacy_track_name: "Reyne"
reyne_legacy_track_desc: "Beneath Still Waters"
reyne_legacy_1_name: "Legacy of Castamere"
reyne_legacy_2_name: "Silver and Blood"
reyne_legacy_3_name: "Redmane Pride"
reyne_legacy_4_name: "Cat of a Different Coat"
reyne_legacy_5_name: "Ballad of the Red Lion"


WESTEROSI_VALYRIAN_EMBERS_OF_VALYRIA_NO_BULLETTAB:0 "Our ancestors looked upon the deep silver and gold veins of Castamere and carved a magnificent subterranean palace that rivals Casterly Rock itself. When our mines dried up, we converted the vast tunnels into vaulted galleries, deep bedchambers, and a subterranean fortress where nine-tenths of our strength remains hidden beneath the earth.\n#weak Our seat is an engineering wonder of absolute defiance. Members of the Reyne dynasty are born exceptionally [GetTrait('ambitious').GetName( GetNullCharacter )]."

REYNE_SILVER_AND_BLOOD_NO_BULLETTAB:0 "We are a dynasty born from rich gold veins, a proud lineage, and a fierce, unyielding fury. Our immense material wealth has constantly made the Lannisters of Casterly Rock look upon our seat with an envious, suspicious eye, but we use our deep coffers to field a vanguard that can challenge any lord.\n#weak Our silver buys the finest steel, and we answer their threats with lances. Enables recruitment of [GetMaA('reyne_crimson_knights').GetName] as [men_at_arms|E]."

REYNE_REDMANE_PRIDE_NO_BULLETTAB:0 "The crimson lion on our silver banners is a symbol of unchallenged sovereignty and ancient pride. We do not view ourselves as secondary masters of the Westerlands; we are an elite, unbending bloodline that refuses to crawl before the golden lords of the Rock.\n#weak To wear our crest is to refuse to kneel to an inferior master. Members of the Reyne dynasty are frequently born [GetTrait('arrogant').GetName( GetNullCharacter )]."

REYNE_CAT_OF_A_DIFFERENT_COAT_NO_BULLETTAB:0 "We are no lesser cats, nor are we shadows meant to hide behind the power of Casterly Rock. Our household knights have won legendary military honors from the Reach to the Stepstones, proving that our long claws are just as sharp and twice as ruthless as those of our liege lord.\n#weak We carve out our own empire, our bloodline independent and proud."

REYNE_BALLAD_OF_THE_RED_LION_NO_BULLETTAB:0 "The terrifying slaughter ordered by Tywin Lannister has not completely buried our name. Our legacy has spent decades sharpening its teeth in the dark, gathering its strength in the deep ruins, and hungering for a massive, blood-soaked retribution against the golden lions.\n#weak The Rains of Castamere have ceased falling, and it is our turn to roar."


reyne_crimson_knights:0 "Crimson Knights"
reyne_crimson_knights_flavor:0 "Drawn from the wealthiest landowners and proudest knightly vassals of the Castamere valley, these heavy shock cavalrymen are the iron vanguard of House Reyne. Clad in magnificent crimson-and-silver plate armor and riding massive, thick-boned warhorses, they specialize in shattering enemy infantry shieldwalls through raw momentum and weight of lance. They possess an arrogant, aggressive combat discipline, engineered entirely to eclipse the military prestige of Casterly Rock."


building_type_agot_vikary_crimson_bastion:0 "Vikary Crimson Bastion"
building_agot_vikary_crimson_bastion_01:0 "The Bandit's Fall Keep"
building_agot_vikary_crimson_bastion_01_desc:0 "This formidable mountain stronghold commemorates the legendary exploit of Ser Adamar Vikary, who entered a bandit camp as a lone negotiator to ransom King Tommen II’s children. Outnumbered fifty to one, Adamar drew his sword, slaughtered a dozen bandits in full armor, and secured the gates for his vanguard. Granted this mountain outpost by a grateful King, the fortress stands as a hard-packed monument to House Vikary's martial creed."
building_agot_vikary_crimson_bastion_02:0 "Crimson Bastion Drill Yards"
building_agot_vikary_crimson_bastion_02_desc:0 "Expanded barracks, masonry walls, and horse-training yards turn promising squires into seasoned lancers and heavy knights, cementing your family's defensive grip over the crags."
building_agot_vikary_crimson_bastion_03:0 "The Castellan Citadel"
building_agot_vikary_crimson_bastion_03_desc:0 "A massive mountain fortress of fearsome repute, the completed Citadel stands as an unbreakable symbol of absolute vassal loyalty, rigid order, and unrelenting martial discipline in the heart of the Westerlands."


building_type_agot_reyne_mineral_market:0 "Reyne Mineral Market"
building_agot_reyne_mineral_market_01:0 "Castamere Ore Exchange"
building_agot_reyne_mineral_market_01_desc:0 "The bustling heart of Castamere's resurrected commerce, where rich silver veins and deep gem stalls gleam once more beneath banners long thought buried by Lannister salt."
building_agot_reyne_mineral_market_02:0 "The Red-Veined Colonnades"
building_agot_reyne_mineral_market_02_desc:0 "Guilders, master jewelers, and moneychangers bustle through grand colonnades of red-veined stone, rapidly elevating the domestic trade prestige of a legacy reborn."
building_agot_reyne_mineral_market_03:0 "The Subterranean Vaults"
building_agot_reyne_mineral_market_03_desc:0 "A gilded center of finance and architectural power deep beneath the earth, where fresh coins bear a lion’s roar and the ledgers echo with an independent, dynastic pride."
building_agot_reyne_mineral_market_04:0 "The Grand Hall of the Red Lion"
building_agot_reyne_mineral_market_04_desc:0 "Crowned in massive crimson stone and laced with intricate golden inlay, this subterranean palace stands as the ultimate, triumphant monument to House Reyne's return—where massive wealth, raw ambition, and ancient legacy are forged into unchallenged regional power."


#FARMAN

farman_legacy_track_name: "Farman"
farman_legacy_track_desc: "The Wind Our Steed"
farman_legacy_1_name: "Masters of Fair Isle"
farman_legacy_2_name: "Iron Tide Breakers"
farman_legacy_3_name: "Fair Traders"
farman_legacy_4_name: "The Sea Knows Our Name"
farman_legacy_5_name: "Salt-blooded Nobility"

FARMAN_MASTERS_OF_FAIR_ISLE_NO_BULLETTAB:0 "From their windswept stronghold, the Farmans ruled Fair Isle with keen eyes and steady hands.\n#weak Few hold an island so fair—or so fierce."

FARMAN_IRON_TIDE_BREAKERS_NO_BULLETTAB:0 "When Ironborn raiders came with fire and iron, the Farmans answered with steel and blood.\n#weak Their coasts did not burn—they bled invaders dry. Enables recruitment of [GetMaA('farman_fair_isle_striders').GetName] as [men_at_arms|E].#!."

FARMAN_FAIR_TRADERS_NO_BULLETTAB:0 "Harbor-born and gold-savvy, they turned tides into trade and risk into riches.\n#weak Fair in name, sharper in bargain."

FARMAN_THE_SEA_KNOWS_OUR_NAME_NO_BULLETTAB:0 "Every crest and current in the West bears the mark of Farman sails.\n#weak The sea remembers those who ride it best."

FARMAN_SALT_BLOODED_NOBILITY_NO_BULLETTAB:0 "They are not just lords of the land—they are highborn of the deep.\n#weak Salt runs in their blood, and the brave rides the waves. Farmans tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

farman_fair_isle_striders:0 "Fair Isle Striders"
farman_fair_isle_striders_flavor:0 "Quick and effective infantry for House Farman that are skilled at patrolling and defending the coast of incursions from the Ironborn."

#CRAKEHALL

crakehall_legacy_track_name: "Crakehall"
crakehall_legacy_track_desc: "None So Fierce"
crakehall_legacy_1_name: "Tusks and Temper"
crakehall_legacy_2_name: "Backbone of the Rock"
crakehall_legacy_3_name: "Grizzled and Great"
crakehall_legacy_4_name: "Boar's Harvest"
crakehall_legacy_5_name: "Tales Told in Alehalls"

CRAKEHALL_TUSKS_AND_TEMPER_NO_BULLETTAB:0 "Fierce as the boar on their banner, the Crakehalls charge with fury and stubborn might.\n#weak Their tusks are sharp, and their strength unyielding. Crakehalls tend to be [GetTrait('physique_good_1').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )], or [GetTrait('physique_good_3').GetName( GetNullCharacter )]."

CRAKEHALL_BACKBONE_OF_THE_ROCK_NO_BULLETTAB:0 "Steadfast bannermen of the West, the Crakehalls hold firm where others waver.\n#weak The Rock may glitter, but Crakehall bears its weight. Some Crakehalls tend to become [GetTrait('strong').GetName( GetNullCharacter )]."

CRAKEHALL_GRIZZLED_AND_GREAT_NO_BULLETTAB:0 "Scarred, seasoned, and still standing—Crakehalls grow stronger with every wound.\n#weak Grey in beard, red in wrath. Enables recruitment of [GetMaA('crakehall_grizzled_pikes').GetName] as [men_at_arms|E].#!."

CRAKEHALL_BOARS_HARVEST_NO_BULLETTAB:0 "From feast to fray, they reap the bounty of land and war alike.\n#weak Whether meat or victory, the boar feeds well."

CRAKEHALL_TALES_TOLD_IN_ALEHALLS_NO_BULLETTAB:0 "Their deeds echo through tankards and tales, larger than life and twice as loud.\n#weak If the Crakehalls don’t start the story, they’ll finish it."

crakehall_grizzled_pikes:0 "Grizzled Pikes"
crakehall_grizzled_pikes_flavor:0 "The Grizzled Pikes, the spearmen of House Crakehall are battle-hardened and fierce. Marching under the sigil of the boar, these warriors are unyielding and oath-bound to their House."

#ROYCE

royce_legacy_track_name: "Royce"
royce_legacy_track_desc: "We Remember"
royce_legacy_1_name: "Stone and Bronze"
royce_legacy_2_name: "First Men's Blood"
royce_legacy_3_name: "Bronze Law"
royce_legacy_4_name: "Runes of Authority"
royce_legacy_5_name: "Line of the First Kings"

ROYCE_STONE_AND_BRONZE_NO_BULLETTAB:0 "Clad in bronze and housed in stone, the Royces stand as living relics of the First Men’s age. Their halls at Runestone are carved with runes older than any sept, their armor forged in shapes that recall kings who ruled before the Eyrie was dreamed of. They measure worth not in crowns or gold, but in endurance. When the Vale’s young lords change with every wind, the Royces stand as they always have—immovable, unyielding, eternal.\n#weak Bronze does not rust, nor stone remember fear. House Royce tends to be [GetTrait('brave').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('royce_rune_guardians').GetName] as [men_at_arms|E].#!."

ROYCE_FIRST_MENS_BLOOD_NO_BULLETTAB:0 "The blood of the First Men runs pure and proud in the Royces, untainted by Andal marriage or new faith. They keep the old gods as they were kept in the Dawn Age—without priest or scripture, only reverence and remembrance. Their ancestry stretches back to the first kings of the Vale, before the Falcon crowned himself, when men still prayed beneath sky and stone. To the Royces, the past is not forgotten—it still lives, carved into their bones.\n#weak Old gods, old blood, and the strength to outlast both tide and time."

ROYCE_BRONZE_LAW_NO_BULLETTAB:0 "The Royces rule not with whim but with weight. Their judgments are as steady as their walls, their word as binding as runes on iron. They do not yield to flattery nor threat, for they know justice that bends soon breaks. In Runestone’s courts, oaths are heard as if the gods themselves listen, and punishment falls with the cold precision of a smith’s hammer. To offend them is to offend order itself.\n#weak Theirs is the law that does not age, and the voice that does not tremble. Enables recruitment of [GetMaA('royce_runesworn').GetName] as [men_at_arms|E].#!."

ROYCE_RUNES_OF_AUTHORITY_NO_BULLETTAB:0 "Every Royce heir bears armor traced with the sacred runes of their forefathers—sigils of protection, victory, and unbroken rule. Some say the glyphs were forged in the time of the First Men’s gods, when words carried power and metal remembered prayer. Their rule carries the same gravity: unspoken, ancient, impossible to deny. The Vale’s knights ride in polished steel, but it is bronze that commands their respect.\n#weak What is written in bronze endures beyond blade or flame. House Royce can be [GetTrait('shrewd').GetName( GetNullCharacter )]."

ROYCE_LINE_OF_THE_FIRST_KINGS_NO_BULLETTAB:0 "Before the falcon flew, before the Eyrie touched the clouds, the Royces wore crowns of stone and ruled the Vale as the Kings of Runestone. They bent the knee when the Arryns came—but never fully bowed. Though ages have passed, their memory is long, and their pride older than the mountain itself. To walk the halls of Runestone is to hear the echo of crowns, waiting to be claimed again.\n#weak The stone remembers its kings, and Runestone remembers theirs. House Royce tends to be [GetTrait('patient').GetName( GetNullCharacter )]."

royce_runesworn:0 "Runesworn"
royce_runesworn_flavor:0 "The Runesworn are the chosen blades of House Royce, sworn upon ancient stone and armed in rune-etched steel. Trained from youth in the arts of the sword, they are famed across the Vale as the finest duelists of their age—swift, unyielding, and relentless in the press of battle. When they take the field as the vanguard, no charge breaks their line and no champion stands long before their blades. To follow the Runesworn is to march behind living steel, their oaths carved in runes and kept in blood." 

royce_rune_guardians:0 "Rune Guardians"
royce_rune_guardians_flavor:0 "Sworn to House Royce of Runestone, the Rune Guardians march clad in heavy bronze armor etched with the ancient runes of the First Men. These sigils, cut deep into their helms and breastplates, are said to ward against blades and sorcery alike. To foes, they appear as living statues of the old age—unyielding, faceless, and terrible. Shields ringed with runic marks lock into walls of bronze, while their swords and spears strike with the weight of ancient vows. Few who face the Rune Guardians forget the sight of bronze lines glinting beneath the Vale’s cold sun." 

building_type_agot_royce_runeport_merchants_guildhall_01:0 "Runeport Merchants' Guildhall"
building_agot_royce_runeport_merchants_guildhall_01:0 "Runeport Merchants' Guildhall"
building_agot_royce_runeport_merchants_guildhall_01_desc:0 "A modest guildhall where Vale traders first gathered to tally grain, timber, and silver under Royce protection."

building_agot_royce_runeport_merchants_guildhall_02:0 "Runeport Merchants' Guildhall"
building_agot_royce_runeport_merchants_guildhall_02_desc:0 "Expanded counting houses and law courts now anchor the port’s influence, drawing both nobles and merchant captains to its doors."

building_agot_royce_runeport_merchants_guildhall_03:0 "Runeport Merchants' Guildhall"
building_agot_royce_runeport_merchants_guildhall_03_desc:0 "A thriving economic hub and diplomatic forum, Runeport’s guildhall stands as a testament to Royce enterprise and regional power."

#CORBRAY

corbray_legacy_track_name: "Corbray"
corbray_legacy_track_desc: "Our Steel Is True"
corbray_legacy_1_name: "Heirs of Lady Forlorn"
corbray_legacy_2_name: "Heart's Discipline"
corbray_legacy_3_name: "Blade-Honed Pride"
corbray_legacy_4_name: "Veiled Ambition"
corbray_legacy_5_name: "Forlorn but Unbroken"

CORBRAY_HEIRS_OF_LADY_FORLORN_NO_BULLETTAB:0 "Passed down through blood and battle, Lady Forlorn is more than a sword—it is the soul of House Corbray.\n#weak To bear her is to carry legacy in steel. House Corbrays can be seen as [GetTrait('arrogant').GetName( GetNullCharacter )]."

CORBRAY_HEARTS_DISCIPLINE_NO_BULLETTAB:0 "Duty over desire, command over impulse—Corbrays forge strength from inner restraint.\n#weak Behind mountain walls, Corbray soldiers are drilled not for pageantry but for war. Enables recruitment of [GetMaA('corbray_heartsworn').GetName] as [men_at_arms|E].#!."

CORBRAY_BLADE_HONED_PRIDE_NO_BULLETTAB:0 "Known for their proud, often volatile temperaments, Corbrays command both fear and admiration among their peers.\n#weak Each duel is a testament to the Corbray name. Corbrays tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

CORBRAY_VEILED_AMBITION_NO_BULLETTAB:0 "Behind courtesy lies calculation—Corbrays play the long game beneath a knight’s smile.\n#weak In the Vale, ambition wears a noble face."

CORBRAY_FORLORN_BUT_UNBROKEN_NO_BULLETTAB:0 "The legacy of House Corbray is not merely survival — it's survival with defiance, scars, and steel still drawn.\n#weak The Corbrays may bleed—but they do not bow."

corbray_heartsworn:0 "Heartsworn"
corbray_heartsworn_flavor:0 "Sworn swordsmen to House Corbray. With the House's crest on their chests, the Heartsworn are the living embodiment of pride and strength. Encompassing the best swordsmen of their lands, the Heartsworn are feared throughout the Vale and beyond."

building_type_agot_corbray_dueling_ground_01:0 "Corbray Dueling Ground"
building_agot_corbray_dueling_ground_01:0 "Corbray Dueling Ground"
building_agot_corbray_dueling_ground_01_desc:0 "Set in a solemn ring of stone near Heart’s Home, this sacred ground hosts trials of honor and skill, where the sword settles what words cannot."

#GRAFTON

grafton_legacy_track_name: "Grafton"
grafton_legacy_track_desc: "So Burns Our Faith"
grafton_legacy_1_name: "Lords of the Gulltown Quay"
grafton_legacy_2_name: "Coins and Courtiers"
grafton_legacy_3_name: "Anchored Power"
grafton_legacy_4_name: "Quiet Defiance"
grafton_legacy_5_name: "Legacy of the Gull Throne"

GRAFTON_LORDS_OF_THE_GULLTOWN_QUAY_NO_BULLETTAB:0 "Where coin flows, power pools—and House Grafton keeps the keys to the Gulltown port.\n#weak Gold buys peace, and ships carry influence."

GRAFTON_COINS_AND_COURTIERS_NO_BULLETTAB:0 "With wealth and wit, the Graftons grease courts and guide crowns from behind the curtain.\n#weak A merchant’s tongue can rule more than a sword. Graftons tend to be [GetTrait('greedy').GetName( GetNullCharacter )]."

GRAFTON_ANCHORED_POWER_NO_BULLETTAB:0 "Their strength lies not in sudden strikes, but in the slow, steady grip of trade and trust.\n#weak When ports feed kingdoms, Graftons know they must watch the bay from its enemies. Enables recruitment of [GetMaA('grafton_baywatch_sentries').GetName] as [men_at_arms|E].#!."

GRAFTON_QUIET_DEFIANCE_NO_BULLETTAB:0 "Pious in word, patient in deed—Graftons serve while shaping their own path.\n#weak Submission is often the quietest rebellion."

GRAFTON_LEGACY_OF_THE_GULL_THRONE_NO_BULLETTAB:0 "Legend states that Ser Gerold Grafton claimed the crown of his old ally.  Gulltown rose against King Gerold, who brutally put down the protests, executing men, women and children and having their bodies thrown in the bay to feed the crabs. In the following years, House Grafton's rule was uncontested, for King Gerold proved to be a sage and clever ruler, making Gulltown prosper enough to grow into the first and only city in the Vale.\n#weak Legend has become legacy for House Grafton. Graftons can be [GetTrait('ambitious').GetName( GetNullCharacter )]."

grafton_baywatch_sentries:0 "Baywatch Sentries"
grafton_baywatch_sentries_flavor:0 "Gulltown's extensive port and ship traffic require a force able to manage the day-to-day protection of the port and its numerous tradesmen and citizens. Baywatch sentries are not known to be a remarkable fighting force, but they can withstand the typical pirate excursion and the common thief."

#ROWAN

rowan_legacy_track_name: "Rowan"
rowan_legacy_track_desc: "The Strong Do Not Wither"
rowan_legacy_1_name: "Legacy of Rowan Gold-Tree"
rowan_legacy_2_name: "Ancient Loyalty"
rowan_legacy_3_name: "Spears of Goldengrove"
rowan_legacy_4_name: "Goldengrove"
rowan_legacy_5_name: "Harvest and Hearth"

ROWAN_LEGACY_OF_ROWAN_GOLD_TREE_NO_BULLETTAB:0 "From Garth Greenhand’s golden line they took their sap—through Rowan Gold-Tree, whose leaves in autumn were said to shine like hammered coin beneath the sun. Goldengrove still bears his name, a hall built amid orchards that gleam when harvest comes and whisper of blood older than Osgrey, Oakheart, or Florent. The Rowans remember when Gardener kings ruled from Highgarden, and claim their roots reach deeper than any throne’s foundation. When Reachmen speak of constancy, they speak of the tree whose trunk never bends.\n#weak Roots older than crowns, and a name that grows with every season. Rowans tend to be [GetTrait('calm').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('rowan_sentinels_of_the_gold_tree').GetName] as [men_at_arms|E].#!."

ROWAN_ANCIENT_LOYALTY_NO_BULLETTAB:0 "Rowan oaths are carved like runes in seasoned wood—measured, plain, and enduring. They swore to the Gardener kings before Aegon’s fire and bent the knee to the Tyrells without losing their honor. As Marshals of the Northmarch, they guard the stone bridges, high passes, and wind-worn towers that bind the Reach to the westerlands. When lions or reavers cross the Mander’s headwaters, it is Rowan riders who answer first. Crowns may rise and fall like seasons, but the pledge of Goldengrove endures.\n#weak The storm may change its course—the roots do not. Rowans tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

ROWAN_SPEARS_OF_GOLDENGROVE_NO_BULLETTAB:0 "When banners lift along the downs, gold-tipped lances align in tidy ranks and the horse of Goldengrove moves like harvest wind over barley. Every man is drilled since boyhood; every charge is timed to the horn, not the heart. They fought for the Gardeners on Redgrass Field and for the Tyrells in the Dornish marches, their discipline turning near-routs to order. Beneath white cloaks and plain gorgets, they fight not for glory but precision. Few hosts in the Reach hold their line so long—or break another’s so clean.\n#weak Steel in rhythm, and honor measured by how long the line holds. Enables recruitment of [GetMaA('rowan_goldengrove_lancers').GetName] as [men_at_arms|E].#!."

ROWAN_GOLDENGROVE_NO_BULLETTAB:0 "Goldengrove lies where orchard meets meadow, its rows of apple and rowan trees older than the Andals who tilled around them. The hall’s terraces overlook green rolling country and the long roads to Ashford and Bitterbridge. In spring the lanes smell of blossom; in autumn the hills burn gold with fruit and turning leaves. Stewards keep their ledgers as knights keep their swords—honestly, and to good effect. The town thrives not from splendor but from sound measure, and travelers say Goldengrove is the Reach as it ought to be.\n#weak A quiet hall, a just hand, and peace enough to hear the orchard breathe. Rowans tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

ROWAN_HARVEST_AND_HEARTH_NO_BULLETTAB:0 "The Rowans measure strength in what endures—the full granary, the straight furrow, the hearth that burns through winter. Their smallfolk are well-fed and quick to answer a just lord’s call, for a Rowan levy marches from warm homes, not hunger. Trade flows through their markets, beer through their cellars, and judgment from their seat without favor or fear. In Goldengrove’s shadow, justice ripens like fruit: slow, fair, and sweet when it comes. In peace or war, their bounty buys loyalty that no coin could.\n#weak From their hearths, the realm is fed; from their word, it stands unshaken."

rowan_sentinels_of_the_gold_tree:0 "Sentinels of the Gold Tree"
rowan_sentinels_of_the_gold_tree_flavor:0 "The Sentinels of the Gold Tree trace their watch to the first days of House Rowan, when Rowan Gold-Tree himself raised the hall that would become Goldengrove. Clad in bronze worked like bark and leaf, they stand guard beneath banners that bear their founder’s shining tree. Their duty is patient and absolute—to hold the bridges, the groves, and the honor of their line. When they march, it is said the air smells faintly of autumn, and their shields gleam like sunlight through old leaves."

rowan_goldengrove_lancers:0 "Goldengrove Lancers"
rowan_goldengrove_lancers_flavor:0 "Bright in mirror-polished plate and white cloaks clasped with the golden rowan, they are the flower of Goldengrove’s host. On the downs and barley fields of the Reach they lower lances in perfect line, breaking ranks with the first thunder of hooves; in the crush they fight on with poleaxe and sword, cool-handed and unshakable. Sworn to Lord Rowan’s person and the Mander roads, these lancers are the finest cavalry in the Reach."

building_type_agot_rowan_summerdale_orchard_01:0 "Summerdale Orchard"
building_agot_rowan_summerdale_orchard_01:0 "Summerdale Orchard"
building_agot_rowan_summerdale_orchard_01_desc:0 "Golden groves bloom across the hills of Summerdale, where House Rowan cultivates fine fruit, beauty, and gentle prosperity."

building_agot_rowan_summerdale_orchard_02:0 "Summerdale Orchard"
building_agot_rowan_summerdale_orchard_02_desc:0 "Expanded terraces and silos supply both feasts and fortune. Diplomats and nobles alike admire the harmony of nature and nobility."

building_agot_rowan_summerdale_orchard_03:0 "Summerdale Orchard"
building_agot_rowan_summerdale_orchard_03_desc:0 "A horticultural jewel of the Reach, these lands yield not just bounty but refined prestige, anchoring Rowan status among the realm’s most cultured houses."

#TARLY

tarly_legacy_track_name: "Tarly"
tarly_legacy_track_desc: "First in Battle"
tarly_legacy_1_name: "Discipline of Horn Hill"
tarly_legacy_2_name: "Heartsbane Lineage"
tarly_legacy_3_name: "Warden of the Marches"
tarly_legacy_4_name: "The Hunter's Blood"
tarly_legacy_5_name: "Voice of Horn Hill"

TARLY_DISCIPLINE_OF_HORN_HILL_NO_BULLETTAB:0 "Forged in strict custom and hardened by duty, the Tarlys uphold the most disciplined house of the Reach.\n#weak Their soldiers march in step, and their heirs are shaped by resolve and fearlessness."

TARLY_HEARTSBANE_LINEAGE_NO_BULLETTAB:0 "The greatsword Heartsbane has tasted the blood of kings and rebels alike—wielded only by those worthy of its weight.\n#weak To bear it is to carry a legacy of valor and judgment."

TARLY_WARDEN_OF_THE_MARCHES_NO_BULLETTAB:0 "The borderlands are ever restless, but House Tarly has kept them in check for generations.\n#weak Where others see wilderness, the Tarlys build walls and sharpen swords. Enables recruitment of [GetMaA('tarly_hornhill_linebreakers').GetName] as [men_at_arms|E].#!."

TARLY_THE_HUNTERS_BLOOD_NO_BULLETTAB:0 "They track both beast and man with equal skill—keen-eyed, patient, and merciless.\n#weak In the woods or in war, none escape the Tarly gaze. Tarlys tend to be [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]."

TARLY_VOICE_OF_HORN_HILL_NO_BULLETTAB:0 "In council or command, their word carries weight born of ancient right and earned fear.\n#weak When a Tarly speaks, the Reach listens—or bleeds. A Tarly tends to become an excellent [GetTrait('authoritative').GetName( GetNullCharacter )]."

tarly_hornhill_linebreakers:0 "Hornhill Linebreakers"
tarly_hornhill_linebreakers_flavor:0 "Tarly's elite infantry that pride themselves with being first in battle. Their skill and bravery often will break the lines of their enemies quickly."

#OSGREY

osgrey_legacy_track_name: "Osgrey"
osgrey_legacy_track_desc: "Our Pride Constant"
osgrey_legacy_1_name: "Faded Glory"
osgrey_legacy_2_name: "March of Thorns"
osgrey_legacy_3_name: "Broken, not Bent"
osgrey_legacy_4_name: "Knights of Standfast"
osgrey_legacy_5_name: "Verdant Roots"

OSGREY_FADED_GLORY_NO_BULLETTAB:0 "Once great among the Reachlords, House Osgrey were the Marshalls of the Northmarch under House Gardener. Like the Gardeners, the Osgreys fell with time. House Rowan would become Marshalls of the Northmarch and even see House Osgrey become their bannermen. House Osgrey may have lost title and power, but their pride never left them.\n#weak Banners may wither, but blood remembers."

OSGREY_MARCH_OF_THORNS_NO_BULLETTAB:0 "Life in the Reach’s less-tended lands hardened the Osgreys. They learned to survive, not just rule.\n#weak Though their holdings are modest, the Osgreys defend them with tenacity and pride. Enables recruitment of [GetMaA('osgrey_gilded_thorns').GetName] as [men_at_arms|E].#!."

OSGREY_BROKEN_NOT_BENT_NO_BULLETTAB:0 "Humbled but not hollow, they stood tall while others forgot them.\n#weak The world may break bones, but not the spine of House Osgrey. Osgreys tend to be [GetTrait('humble').GetName( GetNullCharacter )]."

OSGREY_KNIGHTS_OF_STANDFAST_NO_BULLETTAB:0 "During the battle at Red Lake, Wilbert Osgrey, the Little Lion, came face to face with the King of the Rock. It is said the king had a Valyrian steel greatsword, Brightroar, and chopped the Little Lion to bits, but as Wilbert was dying, he drove his dagger into a gap in the king's armor and killed him. The westermen army collapsed, and the Reach was saved.\n#weak One knight's bravery restored a house’s name. Osgreys tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

OSGREY_VERDANT_ROOTS_NO_BULLETTAB:0 "Though their branches were cut, the roots of House Osgrey remain green and waiting. The Osgreys know the rhythms of farm and field. They rule with a plow as well as a sword.\n#weak Pride, like ivy, grows again—even on broken stone."

osgrey_gilded_thorns:0 "Gilded Thorns"
osgrey_gilded_thorns_flavor:0 "The elite pikemen of House Osgrey wear the crest of the checkered lion upon their breastplates and gilded tips adorning their spears. With Osgrey's fall from being one of the great houses of the Reachlords, the Gilded Thorns are also a remnant of what they once were. Even still, they are ready to defend House and the Northmarch from all who would threaten their lands."

building_type_agot_osgrey_coldmoat_moated_keep_01:0 "Moated Keep of Coldmoat"
building_agot_osgrey_coldmoat_moated_keep_01:0 "Moated Keep of Coldmoat"
building_agot_osgrey_coldmoat_moated_keep_01_desc:0 "Encircled by its namesake waters, this sturdy keep defends the legacy of House Osgrey with stone, tradition, and a long memory of honor and siegecraft."

building_type_agot_osgrey_standfast_towerhold_01:0 "Standfast Castle"
building_agot_osgrey_standfast_towerhold_01:0 "Standfast Castle"
building_agot_osgrey_standfast_towerhold_01_desc:0 "A stout stone castle rising from modest roots, this holdfast shelters the honor and heritage of a once-proud house clinging to its dignity."

building_agot_osgrey_standfast_towerhold_02:0 "Standfast Castle"
building_agot_osgrey_standfast_towerhold_02_desc:0 "Expanded walls and reinforced gates show the enduring strength of Osgrey resolve — small, but unbowed, and rich in memory."

building_agot_osgrey_standfast_towerhold_03:0 "Standfast Castle"
building_agot_osgrey_standfast_towerhold_03_desc:0 "A beacon of resilience in the Reach’s western marches, the castle now stands tall above its humble past, watched by loyal hearts and thickened stone."

#REDWYNE

redwyne_legacy_track_name: "Redwyne"
redwyne_legacy_track_desc: "Ripe For Victory"
redwyne_legacy_1_name: "Stewards of the Arbor"
redwyne_legacy_2_name: "Court of Crimson Cups"
redwyne_legacy_3_name: "Lords of the Sail"
redwyne_legacy_4_name: "Masters of the Vine"
redwyne_legacy_5_name: "Vintage Sovereignty"

REDWYNE_STEWARDS_OF_THE_ARBOR_NO_BULLETTAB:0 "For centuries, the Redwynes have ruled the Arbor not as conquerors, but as caretakers—tending its vines, fleets, and people with a patient mastery that outlasts wars and kings. Their island prospers because they know power is best aged, not seized. Theirs is a rule of hands calloused by stewardship, not blood. The Reach drinks their wine and calls it mercy; the Redwynes call it governance.\n#weak They need no throne to rule—only vineyards and vision. Redwynes tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

REDWYNE_COURT_OF_CRIMSON_CUPS_NO_BULLETTAB:0 "To be invited to a Redwyne feast is to enter a court where diplomacy flows like Arbor gold. The Redwynes pour wine and watch words ferment—sweet on the tongue, but sharp beneath. Their halls are arenas of laughter and leverage, where a smile may mean peace or poison, and every toast has meaning. They turn revelry into politics, and politics into legacy.\n#weak Where wine flows freely, secrets follow swiftly. Redwynes tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

REDWYNE_LORDS_OF_THE_SAIL_NO_BULLETTAB:0 "From the shipyards of the Arbor rise fleets to rival any in the Reach. Their galleys are swift, their captains shrewd, their banners bright as the sunrise over the Mander. In peace, they carry casks and coin; in war, fire and steel. The Redwynes command the waves as others command armies, for they know the sea is the true kingdom of the wise.\n#weak Their sails carry profit, and their oars, power. Enables recruitment of [GetMaA('redwyne_sailsword_archers').GetName] as [men_at_arms|E].#!."

REDWYNE_MASTERS_OF_THE_VINE_NO_BULLETTAB:0 "From their vineyards come wines that kings crave and smallfolk save for weddings. Each bottle bears more than a name—it bears influence. The Redwynes perfected the art of patience: soil to vine, vine to cask, cask to crown. Their trade routes weave through half the world, and their vintages carry whispers from every court. Power poured in a cup is power earned without blood.\n#weak The vine twists through every hall, its roots deeper than gold."

REDWYNE_VINTAGE_SOVEREIGNTY_NO_BULLETTAB:0 "A Redwyne vintage can change more than a feast—it can change a future. In their cups lie alliances, debts, and destinies, sealed with sweet taste and soft words. Theirs is dominion without conquest: an empire of barrels and balance sheets. When kingdoms fall to war, the Redwynes keep pouring. For even in chaos, the world still thirsts.\n#weak A cup can crown kings—or poison them. Enables the [decision|E] [GetDecisionWithKey('kingdom_of_the_arbor_decision').GetName]."

redwyne_sailsword_archers:0 "Arbor Sailsword Archers"
redwyne_sailsword_archers_flavor:0 "Sea-salted leathers and purple sashes mark these Redwyne hirelings—bowmen who drill on deck as easily as on dune. Their waxed strings keep true in spray and wind, loosing from rolling planks, sea-walls, or shifting beaches; helmsmen, oarsmen, and raiders alike learn to duck when the wine-dark pennants rise. Paid in coin and cask, the Sailswords make a beach into a killing ground and a deck into a gallows."

#HIGHTOWER

hightower_legacy_track_name: "Hightower"
hightower_legacy_track_desc: "We Light the Way"
hightower_legacy_1_name: "Keepers of the Flame"
hightower_legacy_2_name: "Wisdom of Oldtown"
hightower_legacy_3_name: "Masters of the Harbor"
hightower_legacy_4_name: "Silent Vaults"
hightower_legacy_5_name: "Beacon of the South"

HIGHTOWER_KEEPERS_OF_THE_FLAME_NO_BULLETTAB:0 "From the Starry Sept to the shining steps of the High Tower, the Hightowers have long stood as stewards of the Faith’s first light. Their beacon watches over the Whispering Sound and the Mander’s mouth, its fire burning day and night as it has for a thousand years. Sailors see it as salvation, septons as sanctity, kings as constancy. When the world darkens, Oldtown’s flame endures—and with it, the house that keeps it. \n#weak They guard the flame that lights the world, even when the world would rather see it dim. Enables recruitment of [GetMaA('hightower_the_tower_guard').GetName] as [men_at_arms|E].#!."

HIGHTOWER_WISDOM_OF_OLDTOWN_NO_BULLETTAB:0 "Under their patronage rose the Citadel, the Starry Sept, and the libraries that hold the knowledge of all Westeros. The maesters may claim learning as their own, but every book they bind, every raven they send, is under the shadow of the Hightower. Oldtown’s wisdom is not merely read—it is ruled. Lords come for counsel, kings for records, and archmaesters for coin, and all leave owing something unseen.\n#weak In their halls, ink is as sharp as steel. Enables the [decision|E] [GetDecisionWithKey('hightower_summon_archmaesters_decision').GetName]."

HIGHTOWER_MASTERS_OF_THE_HARBOR_NO_BULLETTAB:0 "Gold and spice, wine and silk, truth and rumor—everything passes through Oldtown’s harbor, and the Hightowers count it all. Their docks host warships and pilgrim cogs alike, their quays lined with lanterns that never go dark. Theirs is the wealth of waves: slow, steady, and inexhaustible. Each tide brings profit, each voyage bends toward Oldtown, and each sailor leaves lighter in purse than when he came.\n#weak They command the tides, and none may cross without their blessing—or their fee."

HIGHTOWER_SILENT_VAULTS_NO_BULLETTAB:0 "Beneath the tower’s gleaming spire lie halls of silence where light does not reach. There the Hightowers keep what cannot be sold or shown—ledgers of secrets, vaults of ancient coin, relics from before the Andal landing, and scrolls even the maesters dare not name. Few who enter those crypts return unchanged, for wisdom and shadow grow from the same root. The beacon above burns for all to see; below, the dark remembers everything.\n#weak The higher the light, the deeper the shadow. Hightowers tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

HIGHTOWER_BEACON_OF_THE_SOUTH_NO_BULLETTAB:0 "No house commands such reverence without ever raising its voice. From the top of their tower, the Hightowers rule not by sword but by civility—courts polished, customs refined, faith guided. They are the south’s conscience and compass, its patrons of grace and order. Even kings tread carefully when the beacon burns, for the light of Oldtown does not merely guide—it judges.\n#weak When the South seeks order, it looks to the light."

hightower_the_tower_guard:0 "The Tower Guard"
hightower_the_tower_guard_flavor:0 "Honed in the winding alleys and crowded markets of Oldtown, the Tower Guard are masters of urban combat. Trained to move swiftly through tight quarters and strike from shadowed corners, they thrive amid stone walls and narrow streets—unyielding sentinels in the heart of any city or keep."

#FLORENT

florent_legacy_track_name: "Florent"
florent_legacy_track_desc: "Listen Carefully"
florent_legacy_1_name: "Brightwater Pride"
florent_legacy_2_name: "Calculated Graces"
florent_legacy_3_name: "Greenblooded Resolve"
florent_legacy_4_name: "Amber Tongues"
florent_legacy_5_name: "Brightwater Inheritance"

FLORENT_BRIGHTWATER_PRIDE_NO_BULLETTAB:0 "From Florys the Fox, daughter of Garth Greenhand, came their blood—and her cunning. The Florents claim descent from kings of the Reach before the first rose bloomed in Highgarden. Their keep gleams on the Mander’s bend, its banners bright as sunlight on water. Proud, sharp, and unbending, they call no house their better. Courtiers whisper that foxes have learned to smile like lions, but never to kneel to them.\n#weak The fox bows to no lion, nor stag, nor rose."

FLORENT_CALCULATED_GRACES_NO_BULLETTAB:0 "Every word in a Florent hall is measured, every smile rehearsed, every alliance plotted a generation in advance. They make courtesy their armor, and conversation their duel. Rivals mistake their soft tones for softness itself, until the deal is struck and the dagger sheathed. In council or bedchamber, the Florents win wars that leave no corpses to bury.\n#weak Their wit is velvet-sheathed steel. Florents tend to be [GetTrait('shrewd').GetName( GetNullCharacter )]."

FLORENT_GREENBLOODED_RESOLVE_NO_BULLETTAB:0 "They claim the truest blood of Garth Greenhand and the purest line of the Gardener kings. While Tyrells rose as stewards, the Florents remember they were kin to kings. That belief, older than Highgarden’s walls, sustains them through every slight and season. Their sons ride as Brightwater Knights, bearing fox sigils edged in gold—a symbol of cunning guided by conviction. When pride and lineage meet steel, even roses wither.\n#weak The fox’s patience outlasts the gardener’s bloom. Enables recruitment of [GetMaA('florent_brightwater_knights').GetName] as [men_at_arms|E].#!."

FLORENT_AMBER_TONGUES_NO_BULLETTAB:0 "In feast or court, Florent voices carry as smoothly as their wines. They are charmers and schemers both, with tongues that can turn favor into fortune and rumor into ruin. Words are their currency, reputation their weapon, and wit their creed. To parley with a Florent is to dance where every step has been measured, and every smile hides a calculation.\n#weak Their words are honeyed, but each drop hides a sting."

FLORENT_BRIGHTWATER_INHERITANCE_NO_BULLETTAB:0 "The Florents do not forget. To them, Highgarden is not the Tyrells’ prize but their stolen birthright—a debt time itself will repay. Generations of lords and ladies have plotted, married, and maneuvered with one goal in mind: the return of Brightwater’s crown. They invest in legacy the way lesser houses invest in war, waiting as foxes do, patient in the shadows of taller thrones.\n#weak The river runs in circles—but always returns to its source. Florents tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

florent_brightwater_knights:0 "Brightwater Knights"
florent_brightwater_knights_flavor:0 "The Brightware Knights, House Florent's heavy cavalry, renowned for their discipline and agility, moving across the battlefield with the grace of a fox in pursuit."

#DAYNE

dayne_legacy_track_BLA_name: "Dayne"
dayne_legacy_track_BLA_desc: "Fallen and Reborn"
dayne_legacy_1_BLA_name: "Race for the Morning"
dayne_legacy_2_BLA_name: "Starborn Blood"
dayne_legacy_3_BLA_name: "Desert's Endurance"
dayne_legacy_4_BLA_name: "Guiding Star"
dayne_legacy_5_BLA_name: "Starfall Valor"

DAYNE_RACE_FOR_THE_MORNING_NO_BULLETTAB:0 "Within the halls of Starfall, the knights of House Dayne compete to be the one to take up the mantle of the next Sword of the Morning and wield the fabled sword Dawn.\nThis competitive rivalry, instilled in them from birth, has led to House Dayne producing some of the greatest knights that Westeros has ever known, and results in members of this [dynasty|E] receiving better $trait_education_martial_prowess$ [traits|E].\n#weak Only the worthy bear the blade, and the legacy it carries. Daynes tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

DAYNE_STARBORN_BLOOD_NO_BULLETTAB:0 "The blood of Starfall is said to be touched by the heavens. Their eyes are pale as dawnlight, their bearing noble as moonrise. From the Age of Heroes to the fall of dragons, prophecy and poets alike have named them among the realm’s finest. There is something in their veins that does not fade—an echo of the first light upon the Torrentine, when gods and stars were young. Even among lords, the Daynes seem touched by something higher.\n#weak Blood born of starlight, tempered by shadow."

DAYNE_DESERTS_ENDURANCE_NO_BULLETTAB:0 "The Daynes do not rule gentle lands. Between mountain and sea lies their domain—a place of wind-carved stone and scorching sun. Yet from hardship they have drawn strength, from solitude, wisdom. Their knights ride swift and silent through the sands, hardened by thirst and honed by purpose. The desert does not forgive weakness, and neither do they. When the stars rise over Dorne, the Daynes ride beneath them, unbroken.\n#weak The desert yields nothing, and neither do they. Enables recruitment of [GetMaA('dayne_starfall_outriders').GetName] as [men_at_arms|E].#!."

DAYNE_GUIDING_STAR_NO_BULLETTAB:0 "When Dorne was divided, it was the Daynes who led by light instead of flame. In peace, their counsel brings calm; in war, their honor brings unity. Starfall’s beacon has long guided ships and souls alike, and the Daynes hold fast to that same principle—lead by example, never by fear. In every age of darkness, there is a Dayne who stands apart, shining not because they seek it, but because they cannot do otherwise.\n#weak When the sun falters, the stars lead. Daynes tend to be [GetTrait('just').GetName( GetNullCharacter )]."

DAYNE_STARFALL_VALOR_NO_BULLETTAB:0 "From Arthur the Bright to Ser Davos of legend, the Daynes have written their story in glory and grief. They do not conquer for crowns or vengeance, but for the quiet memory of what honor demands. Their banners ride for cause, not conquest, and when they fall, the realm remembers the light they left behind. Even now, the Torrentine whispers their names like prayers carried on the wind.\n#weak Valor is not claimed—it endures. Enables the [decision|E] [GetDecisionWithKey('kingdom_of_the_torrentine_decision').GetName]."

dayne_starfall_outriders:0 "Starfall Outriders"
dayne_starfall_outriders_flavor:0 "Known for their bravery and tenacity, House Dayne's Starfall Outriders storm into battle like a falling star."

building_type_agot_dayne_starsport_spire_01:0 "Starport Spire"
building_agot_dayne_starsport_spire_01:0 "Starport Spire"
building_agot_dayne_starsport_spire_01_desc:0 "A tall marble tower crowned in star-forged stone, watching over the harbor where traders, dreamers, and blades converge. Lit with duskfire at evening, it guides both ships and emissaries to dock beneath the watch of starlight and noble tradition."

#YRONWOOD

yronwood_legacy_track_name: "Yronwood"
yronwood_legacy_track_desc: "We Guard the Way"
yronwood_legacy_1_name: "Blood of the Stone Kings"
yronwood_legacy_2_name: "Wardens of the Stone Way"
yronwood_legacy_3_name: "Knights of the Boneway"
yronwood_legacy_4_name: "Line of the First Dornishmen"
yronwood_legacy_5_name: "Blood of the Sandstone Throne"

YRONWOOD_BLOOD_OF_THE_STONE_KINGS_NO_BULLETTAB:0 "Before Sunspear cast its shadow over the dunes, Yronwood crowned its kings in stone. From the mountains that bear their name, they ruled the valleys and passes of Dorne, their thrones carved from the same rock that walled their strongholds. Their blood is that of conquerors and keepers alike—unyielding as the hills they claim. Though the crowns have crumbled, the pride that forged them has not.\n#weak Their blood runs old as bedrock and proud as kings. Yronwoods tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

YRONWOOD_WARDENS_OF_THE_STONE_WAY_NO_BULLETTAB:0 "The Stone Way cuts through mountain and desert, a vein through which all of Dorne’s lifeblood flows. For centuries, the Yronwoods have guarded it—gates of iron beneath banners of bronze. Their watch has held against Andals, Dornishmen, and stormborn kings alike. To pass through the Boneway or Stone Way is to pass through Yronwood hands, where toll and trust are weighed by sword’s edge.\n#weak The Stone Way runs red when the gates are left unguarded."

YRONWOOD_KNIGHTS_OF_THE_BONEWAY_NO_BULLETTAB:0 "Between the Red Mountains and the sands lies the Boneway, narrow, treacherous, and strewn with the bones of centuries of war. Here the Yronwoods made their name—not from tourneys or courts, but from battle upon rock and ridge. Their knights wear dust for cloaks and fight like the land itself: patient, relentless, and merciless to those who trespass. The Boneway is their anvil, and their foes, the iron upon it.\n#weak To face them is to bleed upon stone. Enables recruitment of [GetMaA('yronwood_stone_companions').GetName] as [men_at_arms|E].#!."

YRONWOOD_LINE_OF_THE_FIRST_DORNISHMEN_NO_BULLETTAB:0 "When others came by sail or storm, the Yronwoods were already here. Their forebears walked from the green lands of the Reach across the sands before even the Rhoynar found shore. They built halls of stone while others built tents of silk, and took oaths to the gods of mountain and sky. Theirs is the strength of the First Men: patient, proud, and written not in ink, but in blood on the land.\n#weak They were Dorne before Dorne had a name."

YRONWOOD_BLOOD_OF_THE_SANDSTONE_THRONE_NO_BULLETTAB:0 "Once, every hill and hold in Dorne bent the knee to Yronwood’s High King. From the Sandstone Throne they ruled by strength, not by marriage, and their word was law from the mountains to the sea. The Rhoynar came with fire and fleets, and Dorne changed—but the Yronwoods did not. The Bloodroyal endures, a title unclaimed but never forgotten. The throne may be lost, but not the will to reclaim it.\n#weak Stone remembers kingship even when men forget. Yronwoods tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

yronwood_stone_companions:0 "Stone Companions"
yronwood_stone_companions_flavor:0 "Chosen from the fiercest sons of the Boneway, the Stone Companions are the pride of House Yronwood. Forged by centuries of war with the marcher lords, these heavy lancers strike in wedges as hard as the passes they guard—lances couched to break the line, then mace and sword to finish the work. Barded destriers know the Stone Way; captains drill for narrow ground, reform, and thunder again until the road is theirs. Their discipline is oath and blood, their loyalty bound to the ancient Kings of Yronwood. To ride with the Stone Companions is to trust that the wall now moves—and never gives way."

building_type_agot_yronwood_stoneway_gate_01:0 "Stoneway Gate"
building_agot_yronwood_stoneway_gate_01:0 "Stoneway Gate"
building_agot_yronwood_stoneway_gate_01_desc:0 "A massive fortress commanding the crucial pass into central Dorne, the Stoneway Gate is the pride of House Yronwood's border vigilance—its towers built to bar kings, caravans, and conquest alike."

#ULLER

uller_legacy_track_name: "Uller"
uller_legacy_track_desc: "Tempered By Fire"
uller_legacy_1_name: "Sandstorm Fury"
uller_legacy_2_name: "Lords of the Hellholt"
uller_legacy_3_name: "Dragon's Bane"
uller_legacy_4_name: "Born in Isolation"
uller_legacy_5_name: "Shadow of Hellholt"

ULLER_SANDSTORM_FURY_NO_BULLETTAB:0 "Like the desert wind, they strike without warning and vanish just as quickly. A Dornish saying is "Half of the Ullers are half-mad, and the other half are worse."\n#weak Their wrath cannot be chained—only survived. Ullers can be [GetTrait('lunatic_1').GetName( GetNullCharacter )]s."

ULLER_LORDS_OF_THE_HELLHOLT_NO_BULLETTAB:0 "From the scorched halls of the Hellholt, House Uller rules with sun-cracked fury. The castle is named after an event in which Lord Uller invited his rivals to a feast and then had them burned to death after locking them within his hall\n#weak Their seat is a furnace—and so are their hearts."

ULLER_DRAGONS_BANE_NO_BULLETTAB:0 "It is whispered that a Uller bowman felled a dragon. Whether truth or tale, their arrows still carry fire.\n#weak They have never feared fire—only who commands it. Enables recruitment of [GetMaA('uller_hellholt_bowmen').GetName] as [men_at_arms|E].#!."

ULLER_BORN_IN_ISOLATION_NO_BULLETTAB:0 "Cut off by sand and stone, the Ullers forge their own laws and settle their own scores.\n#weak No outsider judges what is born in the desert."

ULLER_SHADOW_OF_HELLHOLT_NO_BULLETTAB:0 "Whispers from the Hellholt speak of daggers in the dark and vengeance drawn slow. Fire is not their only ally. A Dornish saying is "Half of the Ullers are half-mad, and the other half are worse."\n#weak Even in silence, the Ullers burn. Ullers tend to be [GetTrait('sadistic').GetName( GetNullCharacter )]."

uller_hellholt_bowmen:0 "Hellholt Bowmen"
uller_hellholt_bowmen_flavor:0 "Forged in the searing winds of eastern Dorne, the Hellholt Bowmen are as ruthless as the desert that birthed them. Lightly armored and deadly at range, they strike with accurate arrows and vanish into sun-scorched sands. Taught to kill from the shadows and endure without mercy, these archers are feared even among Dornishmen."

building_type_agot_uller_the_hellholt_01:0 "The Scorpion Hold"
building_agot_uller_the_hellholt_01:0 "The Scorpion Hold"
building_agot_uller_the_hellholt_01_desc:0 "Sun-scorched and steeped in fear, the Hellholt is a desert bastion of blood and poison, where House Uller rules with silent menace and sand-slick steel."

#VELARYON

velaryon_legacy_track_BLA_name: "Velaryon"
velaryon_legacy_track_BLA_desc: "The Old, the True, the Brave"
velaryon_legacy_1_BLA_name: "Legacy of the Sea Snake"
velaryon_legacy_2_BLA_name: "Driftmark Refinement"
velaryon_legacy_3_BLA_name: "High Tide Authority"
velaryon_legacy_4_BLA_name: "Spicetown Legacy"
velaryon_legacy_5_BLA_name: "Valyrian Embers"

VELARYON_LEGACY_OF_THE_SEA_SNAKE_NO_BULLETTAB:0 "In the wake of Corlys Velaryon—the Sea Snake—the world’s edges seemed smaller. His voyages carried Driftmark’s banners from Pentos to Yi Ti, and his holds brimmed with gold, silk, and spice. In his wake, our house learned to think beyond the horizon, to trade where others conquer, and to rule where others only sail. His ships were his dragons, his sea his sky, and his legacy—our compass.\n#weak His wake still ripples through the known world. Can recruit [GetMaA('sea_snakes').GetName] as [men_at_arms|E]#!., can use a [decision|E] to fund trade expeditions, and reduced requirements for the Great Fleet [great_project|E]."

VELARYON_DRIFTMARK_REFINEMENT_NO_BULLETTAB:0 "Driftmark gleams like a pearl in the Blackwater, its halls of polished stone and silver light reflecting the old glory of Valyria. Within its courts linger the manners of dragonlords and the taste of the Free Cities—music, marble, and measured grace. The Velaryons know that power is not always shouted from ramparts; sometimes, it is spoken softly in the language of poise, art, and wealth well spent.\n#weak Nobility, like salt, must be refined to endure."

VELARYON_HIGH_TIDE_AUTHORITY_NO_BULLETTAB:0 "When Corlys raised High Tide, he built more than a palace—he built a monument to mastery. Stone imported from Essos, artisans hired from Lys and Myr, and towers shaped to mirror the tides themselves. From its marble galleries, the Velaryons ruled the sea’s trade as surely as dragonlords ruled the sky. Spicetown’s piers may crumble, but High Tide endures: a city of sea-wind, coin, and quiet command.\n#weak The tides shift, but their dominion never drifts. Velaryons tend to be [GetTrait('authoritative').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('velaryon_tideforged_sentinels').GetName] as [men_at_arms|E].#!."

VELARYON_SPICETOWN_LEGACY_NO_BULLETTAB:0 "Once the jewel of Driftmark, Spicetown thrived where every scent, sound, and tongue of the world met under Velaryon banners. Its markets overflowed with eastern silks and southern salt, its streets alive with laughter and gold. Even in ruin, its spirit endures—in every captain who dares strange seas, in every deal struck across a narrow sea. The Velaryons trade not only in goods, but in futures yet uncharted.\n#weak The sea remembers the harbor, and ambition remembers its tide. Velaryons tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

VELARYON_VALYRIAN_EMBERS_NO_BULLETTAB:0 "The fire of Valyria burns low but not cold in Velaryon veins. They bear the pale hair and sea-colored eyes of the dragonlords, but their flame is tempered by salt and wind. They did not flee the Doom—they outsailed it. Theirs is a nobility carried not on dragonback, but by oar and hull, and their pride rests not in fire, but in endurance. The world remembers dragons, but it also remembers those who brought them home.\n#weak The flame endures—borne on water, not ash."

velaryon_tideforged_sentinels:0 "Tideforged Sentinels"
velaryon_tideforged_sentinels_flavor:0 "Forged in the salt spray of Driftmark and clad in sea-darkened steel, the Tideforged Sentinels are the living legacy of Velaryon defiance and depth. Silent and resolute, these warriors train beside the crashing waves and take their oaths before the roaring sea. Where others break, they endure. Where others flee, they march. Behind their forged line lies the pride of Valyria’s maritime legacy: ancient, proud, and unyielding."


#CELTIGAR

celtigar_legacy_track_name: "Celtigar"
celtigar_legacy_track_desc: " All in Our Grasp"
celtigar_legacy_1_name: "Whispers of Valyria"
celtigar_legacy_2_name: "Claw of the Crag"
celtigar_legacy_3_name: "Coin of the Sea Lords"
celtigar_legacy_4_name: "Crownbound"
celtigar_legacy_5_name: "Sea-Steeped Will"

CELTIGAR_WHISPERS_OF_VALYRIA_NO_BULLETTAB:0 "Among the ancient Valyrian houses, the Celtigars are few, but not forgotten. Though not as illustrious in their nobility as the Velaryons, there is still blood of Old Valyria in their veins. This has allowed House Celtigar to benefit from the success of their Valyrian brothers as they have collected a vast and impressive store of treasure on Claw Isle: gold and silver plate, jeweled cups, chests of rubies, a Valyrian steel axe, and even a horn said to summon krakens from the deep. \n#weak They will have all in their grasp, be it wealth they hoard, political power, or feudal domination over Crackclaw Point. Celtigars tend to be [GetTrait('greedy').GetName( GetNullCharacter )]."

CELTIGAR_CLAW_OF_THE_CRAG_NO_BULLETTAB:0 "From their seat atop Claw Isle, the Celtigars have long defended their rock and even claim Crackclaw as theirs. Even after Queen Visenya swore that the men of Crackclaw Point would owe fealty to none but the dragons themselves, the Celtigars have sent tax collectors to wring payment out of the Crabbs and their neighbors.\n#weak The claw clenches tightly—and never lets go. Enables recruitment of [GetMaA('celtigar_tithecrabs').GetName] as [men_at_arms|E].#!."

CELTIGAR_COIN_OF_THE_SEA_LORDS_NO_BULLETTAB:0 "Trade winds fill Celtigar sails, and silver lines their coffers. Known even in Braavos and Pentos, their coin speaks loudly—when their words need not.\n#weak Gold flows like tidewater when the ledger is true."

CELTIGAR_CROWNBOUND_NO_BULLETTAB:0 "The Celtigars bent the knee to Dragonstone early and served the Iron Throne with tireless loyalty, winning quiet influence through fealty. Crispian Celtigar became the first master of coin under Aegon the Dragon and those who followed have been eager to grab wealth and prestige wherever they can.\n#weak Some power is earned not by fire, but by service. Celtigars are seen as [GetTrait('loyal').GetName( GetNullCharacter )]."

CELTIGAR_SEA_STEEPED_WILL_NO_BULLETTAB:0 "Windswept and salt-scoured, the Celtigars endure. Their ambition is deep and unyielding, shaped by stone, sea, and generations of resolve.\n#weak From storm to stillness, the crab survives."

celtigar_tithecrabs:0 "Tithecrabs of Claw Isle"
celtigar_tithecrabs_flavor:0 "Clad in crimson and white while bearing the seal of House Celtigar, the Tithecrabs sweep through port and pier with cold precision. Trained in the ancient counting traditions of Valyria and unbothered by protest or plea, they are merchants’ dread and the Lord of Claw Isle’s quiet strength—each coin they collect drawing another thread into Celtigar’s growing net of power."

#SCALES

scales_legacy_track_name: "Saerygan"
scales_legacy_track_desc: "We Hold the Balance"
scales_legacy_1_name: "Embers of Old Valyria"
scales_legacy_2_name: "Enduring Scale"
scales_legacy_3_name: "Crab's Justice"
scales_legacy_4_name: "Quiet Tide"
scales_legacy_5_name: "Rise from Ash"

SCALES_EMBERS_OF_OLD_VALYRIA_NO_BULLETTAB:0 "Known for loyal service to Targaryens and the Celtigars, House Saerygan gains quietly through duty.\n#weak House Saerygan was forged in loyalty—tempered by fire, not consumed by it."

SCALES_ENDURING_SCALE_NO_BULLETTAB:0 "House Saerygan grows stronger through unity, discipline, and lasting legacy—not through cunning or coin. In every hardship, they measure and remain.\n#weak Their legacy balances the ages. Enables recruitment of [GetMaA('scales_measured_knives').GetName] as [men_at_arms|E].#!."

SCALES_CRABS_JUSTICE_NO_BULLETTAB:0 "Justice comes slow but sure from the Saerygans, creeping from their coast with claws ready. They judge not with wrath, but with inevitability.\n#weak One must not escape, only answer. Saerygans tend to be [GetTrait('just').GetName( GetNullCharacter )]."

SCALES_QUIET_TIDE_NO_BULLETTAB:0 "Not all tides roar. Island-bound and outward-looking, their strength is in stillness and foresight. In the hush of their harbors, the Saerygans gather strength, watching, waiting—until silence gives way to storm.\n#weak Even quiet waters can drown a man."

SCALES_RISE_FROM_ASH_NO_BULLETTAB:0 "Whether through blood, war, or ambition—House Saerygan seeks not to serve, but to ascend.\n#weak Though your line slumbers beneath ash, it still breathes—and hungers. Saerygans tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

scales_measured_knives:0 "Measured Knives"
scales_measured_knives_flavor:0 "Swift and exacting, the Measured Knives strike not with rage but with precision. Trained in discipline and restraint, they are the silent edge of justice—each blow deliberate, each step calculated. Where others charge blindly, they dissect their foes with cold efficiency."

#DARKLYN

darklyn_legacy_track_name: "Darklyn"
darklyn_legacy_track_desc: "Shadow Will Fall"
darklyn_legacy_1_name: "Duskforged Line"
darklyn_legacy_2_name: "Swords of Honor"
darklyn_legacy_3_name: "Shadow Shields"
darklyn_legacy_4_name: "Duskendale Trade"
darklyn_legacy_5_name: "Dusk Kings"

DARKLYN_DUSKFORGED_LINE_NO_BULLETTAB:0 "Before Aegon’s fire, the Darklyns ruled as Kings of Duskland, lords of the river mouth where trade and tide met. Their reign was long, their pride longer. They forged their line in the half-light between loyalty and sovereignty—steel tempered in shadow, polished by ambition. Though their crowns were taken, their blood still remembers the weight of gold and the feel of a throne.\n#weak Steel from shadowed coasts, blood from proud kings. Darklyns tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

DARKLYN_SWORDS_OF_HONOR_NO_BULLETTAB:0 "From Ser Robin Darklyn, the first of their name to don white, to the last who fell beneath a king’s banner, no house gave more sons to the Kingsguard than the Darklyns. Their code was iron: duty before desire, honor before life. In every era, a Darklyn’s sword stood where vows were tested and oaths were broken. They were the realm’s conscience in steel, even when their own house was left to bleed.\n#weak No oath was too heavy, no death too light. Darklyns tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

DARKLYN_SHADOW_SHIELDS_NO_BULLETTAB:0 "From the alleyways of Duskendale to the darkened halls of Dun Fort, the Shadow Shields move unseen. Formed in the twilight years of the Dusk Kings, they serve as watchmen, spies, and silent protectors—defending the city and its secrets alike. Clad in grey and shadow, they guard against blades in the dark and whispers in the throne room. When danger stirs, they are the last thing an intruder sees, and often the first they never do.\n#weak Cloaked in dusk and duty, their loyalty is as silent as it is absolute. Enables recruitment of [GetMaA('darklyn_shadow_shields').GetName] as [men_at_arms|E].#!."

DARKLYN_DUSKENDALE_TRADE_NO_BULLETTAB:0 "The Darklyns made Duskendale the crown’s harbor before King’s Landing was born. From its docks, wine and wool, silk and silver all found their way to the capital’s tables. Their merchants built fortunes quietly, their shipwrights built fleets that outlasted dynasties. Even now, when the world speaks of trade and intrigue, Duskendale’s name drifts like the tide—calm on the surface, but deep beneath.\n#weak Gold may gleam in sunlight, but true coin is minted in shadow."

DARKLYN_DUSK_KINGS_NO_BULLETTAB:0 "The crown of Duskland is gone, but the memory of rule does not fade. The Darklyns still carry the bearing of kings—their words measured, their gaze heavy with remembrance. Some say they dream of the old crown, lost to the mists and the sea; others whisper that the blood of kings cannot drown, only sleep. When night falls over Duskendale, the stones themselves seem to hum with the echo of the Dusk Kings’ pride.\n#weak The dusk remembers its kings—and the dawn has yet to see their last. Darklyns tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]. Enables the [decision|E] [GetDecisionWithKey('kingdom_of_dusklands_decision').GetName]."

darklyn_shadow_shields:0 "Shadow Shields"
darklyn_shadow_shields_flavor:0 "Elite, silent, and absolutely loyal—guardians forged in secrecy and dusk. Formed to protect against threats seen and unseen, the Shadow Shields guard Duskendale with silent vigilance."

building_type_agot_darklyn_duskendale_city_01:0 "City of Duskendale"
building_agot_darklyn_duskendale_city_01:0 "City of Duskendale"
building_agot_darklyn_duskendale_city_01_desc:0 "A proud harbor city with deep roots and deeper ambition, Duskendale thrives as a coastal hub of craft, culture, and quiet defiance."

building_agot_darklyn_duskendale_city_02:0 "City of Duskendale"
building_agot_darklyn_duskendale_city_02_desc:0 "Markets expand and noble halls rise as Duskendale grows into a polished and influential port, its magistrates commanding respect beyond the Crownlands."

building_agot_darklyn_duskendale_city_03:0 "City of Duskendale"
building_agot_darklyn_duskendale_city_03_desc:0 "Once a proud but overlooked harbor, Duskendale now flourishes as a resplendent, would-be capital — complete with noble courts, marble halls, and a legacy of rule that refuses to fade."

building_type_agot_darke_shadowshield_01:0 "Shadowshield Bastion"
building_agot_darke_shadowshield_01:0 "Shadowshield Bastion"
building_agot_darke_shadowshield_01_desc:0 "This austere and imposing stronghold serves as the headquarters of the Shadowshields—an elite cadre of disciplined warriors sworn to silence, loyalty, and unyielding defense. It stands not for beauty, but for strength, secrecy, and fearsome purpose."

building_type_agot_darkwood_the_darkwood_01:0 "The Darkwood"
building_agot_darkwood_the_darkwood_01:0 "The Darkwood"
building_agot_darkwood_the_darkwood_01_desc:0 "A gnarled forest cloaked in shadow and silence, the Darkwood is whispered to hold old powers best left undisturbed. Travelers vanish, ravens refuse to fly overhead, and the trees seem to remember."

building_type_agot_darklyn_shady_glen_01:0 "The Shady Glen"
building_agot_darklyn_shady_glen_01:0 "The Shady Glen"
building_agot_darklyn_shady_glen_01_desc:0 "Hidden in a dark and quiet forest beyond Duskendale, the Shady Glen served as an ancient hunting retreat of House Darklyn—where lords took counsel, lovers vanished, and secrets sleeped beneath the leaves."

building_type_agot_stokeworth_stonebridge_inn_01:0 "Old Stone Bridge"
building_agot_stokeworth_stonebridge_inn_01:0 "Old Stone Bridge"
building_agot_stokeworth_stonebridge_inn_01_desc:0 "A well-worn inn at a key crossroads between Rosby and Duskendale, Stonebridge serves merchants, messengers, and lords alike. Beneath its timbered roof, news travels faster than horses—and coin flows with the ale."

#DONDARRION

dondarrion_legacy_track_name: "Dondarrion"
dondarrion_legacy_track_desc: "From the Storm"
dondarrion_legacy_1_name: "Born from Lightning"
dondarrion_legacy_2_name: "Lords of Blackhaven"
dondarrion_legacy_3_name: "Thunderbound Valor"
dondarrion_legacy_4_name: "Justice beyond banners"
dondarrion_legacy_5_name: "The Spark Endures"


DONDARRION_BORN_FROM_LIGHTNING_NO_BULLETTAB:0 "Legends claim a bolt of lightning anointed the first Dondarrion. The Dondarrion line was founded when a messenger from the Storm King was ambushed by two Dornishmen while riding on a stormy night. An arrow killed his horse and his sword broke when he fell. When he thought he was doomed, a bright purple lightning bolt struck the Dornishmen, killing both. The man was thus able to deliver his crucial message on time.\n#weak The storm rides with them still."

DONDARRION_LORDS_OF_BLACKHAVEN_NO_BULLETTAB:0 "At the edge of the Stormlands, Blackhaven stands defiant. Its lords guard the realm's wild marches with vigilance forged through centuries of strife.\n#weak From castle walls to wild borders, we hold the line"

DONDARRION_THUNDERBOUND_VALOR_NO_BULLETTAB:0 "Bravery kindled in battle, tested in darkness. Their charge is feared, their banners crack like thunder, and their steel burns with lightning's fury. Their valor is the disciplined force of a storm waiting to break.\n#weak Their courage speaks in thunderclaps. Enables recruitment of [GetMaA('dondarrion_stormriders').GetName] as [men_at_arms|E].#!."

DONDARRION_JUSTICE_BEYOND_BANNERS_NO_BULLETTAB:0 "Bound not only to crown or oath, but to the higher call of justice. Their will to protect the people — even outside the law is ironbound. Even when banners fall, some torches keep burning.\n#weak Where law fails, lightning strikes. Dondarrions tend to be [GetTrait('just').GetName( GetNullCharacter )]."

DONDARRION_THE_SPARK_ENDURES_NO_BULLETTAB:0 "Though fire may fade and storms may pass, the spark remains. House Dondarrion always survives the storm — scarred, but unshaken. In memory, in legend, and in every sword raised for the right cause.\n#weak Strike us down — and still, we rise."

dondarrion_stormriders:0 "Stormriders"
dondarrion_stormriders_flavor:0 "Swift as the storm that birthed their house, the Stormriders of House Dondarrion thunder across the Stormlands with relentless purpose. Clad in dark leathers streaked with violet, they strike fast and vanish even faster. Masters of hit-and-run tactics and terrain navigation, they are feared by raiders and rebels alike."

#CARON

caron_legacy_track_name: "Caron"
caron_legacy_track_desc: "No Song So Sweet"
caron_legacy_1_name: "The Marcher Lords"
caron_legacy_2_name: "Warrior-bards of Nightsong"
caron_legacy_3_name: "Tale of the Nightingales"
caron_legacy_4_name: "Song of the Marches"
caron_legacy_5_name: "No Song So Sweet"

CARON_THE_MARCHER_LORDS_NO_BULLETTAB:0 "Many say, debated by the Swanns, that their family are the oldest of the Marcher Lords. Forged in the crucible of border wars, the Carons rose as ironclad Marcher Lords—unyielding sentinels of the Stormlands.\n#weak First to fight, last to kneel — we hold the border."

CARON_WARRIOR_BARDS_OF_NIGHTSONG_NO_BULLETTAB:0 "At Nightsong, the blade and the lute are siblings. Caron scions learn to strike both chord and foe with precision. Carons are remembered not just for their duels and charges, but for the songs they leave behind.\n#weak We sing as we strike. The blade and the lyre are one. Some Carons are [GetTrait('brave').GetName( GetNullCharacter )] and become singers and [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]s."

CARON_TALE_OF_THE_NIGHTINGALES_NO_BULLETTAB:0 "Carons are as known for their war ballads and romantic lays as they are for their marksmanship.\n#weak We strike true, and sing of the deed. Enables recruitment of [GetMaA('caron_nightsong_nightingales').GetName] as [men_at_arms|E].#!."

CARON_SONG_OF_THE_MARCHES_NO_BULLETTAB:0 "Every ridge and river along the Marches sings a Caron tale. Carons carry the weight of history and narrative, becoming cultural figures across the realm.\n#weak Nightsong’s words travel farther than its spears."

CARON_NO_SONG_SO_SWEET_NO_BULLETTAB:0 "The name Caron is carried not just in war cries, but in songs passed from hall to hall. There is no song so sweet as the one sung in triumph. The Carons know that in music, as in war, the final note is theirs.\n#weak Our name is music. Our memory, legend."

caron_nightsong_nightingales:0 "Nightsong Nightingales"
caron_nightsong_nightingales_flavor:0 "Trained amid the wooded hills of Nightsong, the Nightingales strike with a grace that belies their lethality. These archers are famed for loosing volleys in rhythmic cadence, their arrows whistling like stanzas of an old song. Cloaked in silence, they move with bardic discipline—every shot a note in the Caron ballad of war."

#SWANN

swann_legacy_track_name: "Swann"
swann_legacy_track_desc: "No Foe But Injustice"
swann_legacy_1_name: "Silver from the Tide"
swann_legacy_2_name: "Oaths of Stonehelm"
swann_legacy_3_name: "Winged Thunder"
swann_legacy_4_name: "The Swan's Spear"
swann_legacy_5_name: "The Pale Wings"

SWANN_SILVER_FROM_THE_TIDE_NO_BULLETTAB:0 "Many say, debated by the Carons, that their family are the oldest of the Marcher Lords. The Swanns grew strong through shrewd coastal trade and maritime vigilance. House Swann combines martial tradition with the wealth of a coastal marcher seat.\n#weak Prosperity rises with the tide at Stonehelm."

SWANN_OATHS_OF_STONEHELM_NO_BULLETTAB:0 "Whether in service to the crown or as Kingsguard, a Swann’s word is trusted — and remembered. The oaths sworn in Stonehelm's halls are as enduring as its stone—promises of loyalty, justice, and fealty kept across generations.\n#weak Knighthood is not title, but burden. Swanns tend to be [GetTrait('just').GetName( GetNullCharacter )]."

SWANN_WINGED_THUNDER_NO_BULLETTAB:0 "House Swann answers war’s call like a storm—unyielding, thunderous, and unrelenting. Their Winged Guard advance as walls of steel, shields locked and helms crowned with wings, breaking foes through sheer weight and discipline. \n#weak When the wings spread, no line holds. Enables recruitment of [GetMaA('swann_winged_guard').GetName] as [men_at_arms|E].#!."

SWANN_THE_SWANS_SPEAR_NO_BULLETTAB:0 "From royal courts to mountain passes, the Swanns have produced knights of exceptional reputation and skill. Trained in disciplined spear shields and renowned for precision strikes, House Swann’s martial reputation is as swift and sharp as a spear in flight.\n#weak The swan bears both grace and fury."

SWANN_THE_PALE_WINGS_NO_BULLETTAB:0 "Reserved and perceptive, the Swanns walk the line between noble grace and watchful steel.\n#weak We strike swift, speak little."


swann_winged_guard:0 "Winged Guard"
swann_winged_guard_flavor:0 "The Winged Guard of House Swann are famed across the Stormlands as a wall of steel and honor. Each warrior dons a helm crested with sweeping wings, a living echo of the twin swans upon their banners. Clad in heavy mail and plate, they form the elite household guard of Stonehelm, marching at the fore where battle is thickest. Their discipline is legend: shields locked, spears and axes braced, they stand unbroken while others fall away. To see the Winged Guard advance is to behold the strength of House Swann itself—proud, resolute, and unyielding."

building_type_agot_swann_lockport_tradeworks_01:0 "Lockport Tradeworks"

building_agot_swann_lockport_tradeworks_01:0 "Lockport Tradeworks"
building_agot_swann_lockport_tradeworks_01_desc:0 "The earliest quays and smithies of Lockport hum with activity. Under Swann protection, merchants and craftsmen build the foundations of a growing coastal market."

building_agot_swann_lockport_tradeworks_02:0 "Lockport Tradeworks"
building_agot_swann_lockport_tradeworks_02_desc:0 "Expanded forges, guarded docks, and tariffed stalls bolster Lockport’s prosperity. House Swann profits from both coin and control."

building_agot_swann_lockport_tradeworks_03:0 "Lockport Tradeworks"
building_agot_swann_lockport_tradeworks_03_desc:0 "Now a vital port of call in the Stormlands, Lockport commands waves of commerce with its fortified docks, merchant houses, and loyal harbormasters clad in white and gold."

#TARTH

tarth_legacy_track_name: "Tarth"
tarth_legacy_track_desc: "In Darkness We Rise"
tarth_legacy_1_name: "Knights of the Sapphire"
tarth_legacy_2_name: "Guardians of the Emerald Isle"
tarth_legacy_3_name: "Oath-forged Steel"
tarth_legacy_4_name: "Light in the Storm"
tarth_legacy_5_name: "Sword of the Evenstar"

TARTH_KNIGHTS_OF_THE_SAPPHIRE_NO_BULLETTAB:0 "From the tourney field to the battlefield, House Tarth has bred warriors whose honor equals their skill.\n#weak There is honor in standing alone, and glory in standing first. Tarths tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

TARTH_GUARDIANS_OF_THE_EMERALD_ISLE_NO_BULLETTAB:0 "Isolation forged resilience. From their green island bastion, the Tarths have withstood pirates, storms, and time itself.\n#weak The sea guards us, but we guard the sea. Enables recruitment of [GetMaA('tarth_sapphire_guard').GetName] as [men_at_arms|E].#!."

TARTH_OATH_FORGED_STEEL_NO_BULLETTAB:0 "House Tarth's reputation for honor and truth makes betrayal rarer — and vengeance more absolute. Every blade from Evenfall Hall is a promise—tempered not just in flame, but in the resolve of those who carry it.\n#weak Not all steel shines. Some binds. Tarths tend to be [GetTrait('just').GetName( GetNullCharacter )]."

TARTH_LIGHT_IN_THE_STORM_NO_BULLETTAB:0 "When the Stormlands fracture, House Tarth endures — reliable, righteous, and radiant in service.\n#weak When Baratheons rage, we stand still."

TARTH_SWORD_OF_THE_EVENSTAR_NO_BULLETTAB:0 "In each generation, a Tarth rises—a sword in the dark, a star against the void—unyielding and unmarred. Whether on the walls of their island keep or the frontlines of a battle, House Tarth holds firm and strikes true. \n#weak The world may forget, but the Evenstar remembers."

tarth_sapphire_guard:0 "Sapphire Guard"
tarth_sapphire_guard_flavor:0 "Clad in armor that gleams like the Narrow Sea, the Sapphire Guard are the shining bulwark of House Tarth. Trained in the storm-lashed hills and sheer cliffs of the Emerald Isle, they stand as unyielding as stone. Each warrior is sworn to defend Evenfall Hall with unwavering loyalty, their discipline and honor as polished as their sapphire-forged helms."

#ESTERMONT

estermont_legacy_track_name: "Estermont"
estermont_legacy_track_desc: "Steady On"
estermont_legacy_1_name: "Greenstone Lineage"
estermont_legacy_2_name: "Tide-Watch Discipline"
estermont_legacy_3_name: "Salt and Stone"
estermont_legacy_4_name: "Unsung but Unshaken"
estermont_legacy_5_name: "The Baratheon’s Quiet Guard"

ESTERMONT_GREENSTONE_LINEAGE_NO_BULLETTAB:0 "Descended from the ancient lords of Greenstone, House Estermont’s roots run deep in the isles. The island seat of its house teaches endurance, defense, and self-reliance against storm and siege alike.\n#weak Rooted in the sea, unmoved by the storm."

ESTERMONT_TIDE_WATCH_DISCIPLINE_NO_BULLETTAB:0 "Trained against the surf, drilled against pirates, and steady in formation — Estermont soldiers are lean and lethal.\n#weak When the tide turns, they are ready. Enables recruitment of [GetMaA('estermont_greenstone_breakers').GetName] as [men_at_arms|E].#!."

ESTERMONT_SALT_AND_STONE_NO_BULLETTAB:0 "Raised amid sea spray and rocky shores, the Estermonts are as enduring as the stones beneath their feet. Practical and patient, House Estermont makes the most of what it has and they build to last.\n#weak The sea wears down all but us."

ESTERMONT_UNSUNG_BUT_UNSHAKEN_NO_BULLETTAB:0 "They seldom seek glory, yet their loyalty and strength have held firm when others falter. No great lords, no shining heroes — just solid rulers with ironbound will.\n#weak Few speak of Greenstone. Fewer would take it. Estermonts tend to be [GetTrait('calm').GetName( GetNullCharacter )]."

ESTERMONT_BARATHEONS_QUIET_GUARD_NO_BULLETTAB:0 "Trusted kin and steadfast vassals, House Estermont has long stood behind the Storm Lords. While others chase crowns, Estermonts remain devoted to duty and house — and are remembered for it.\n#weak Loyal, not loud."


estermont_greenstone_breakers:0 "Greenstone Breakers"
estermont_greenstone_breakers_flavor:0 "Hammer-and-shield heavy foot of House Estermont, drilled on Greenstone’s cliff-steps and surf-slick causeways. Turtle-marked shields set like a sea wall, war-hammers rise and fall in a tide-beat that cracks mail and will alike. Bred for Shipbreaker Bay’s hard landings, they take a shore and make it hold."

building_type_agot_estermont_greenstone_crag_01:0 "Greenstone Crag"
building_agot_estermont_greenstone_crag_01:0 "Greenstone Crag"
building_agot_estermont_greenstone_crag_01_desc:0 "A towering cliff marked by ancient carvings and Estermont heraldry, the Greenstone Crag is a place of reflection and reverence—where storms speak in echoes and lords seek wisdom in wind and stone."

#MERTYNS

mertyns_legacy_track_name: "Mertyns"
mertyns_legacy_track_desc: "Wisdom & Wrath"
mertyns_legacy_1_name: "Wardens of Mistwood"
mertyns_legacy_2_name: "Knights of the Mist"
mertyns_legacy_3_name: "The Forgotten Blood"
mertyns_legacy_4_name: "Whispers Beneath the Canopy"
mertyns_legacy_5_name: "Echoes of the Old Songs"

MERTYNS_WARDENS_OF_MISTWOOD_NO_BULLETTAB:0 "Centuries in the shadowed halls of Mistwood shaped a house as silent as it is steadfast. Their keep is deep in the woods, and their soldiers know how to use every branch, shadow, and bend in the road. The Rainwood is no place for the unready. The Mertyns have mastered both the land and the silence.\n#weak We are the quiet between the trees."

MERTYNS_KNIGHTS_OF_THE_MIST_NO_BULLETTAB:0 "Clad in pale green and grey, the Knights of the Mist strike from obscured paths and mist-laced trails. Their knightly tradition is not built on tourneys or banners—but ambushes, honor, and ruthless defense of their land. Their loyalty to forest and family is legend.\n#weak Our blades come with the mist. Enables recruitment of [GetMaA('mertyns_knights_of_the_mist').GetName] as [men_at_arms|E].#!."

MERTYNS_THE_FORGOTTEN_BLOOD_NO_BULLETTAB:0 "Rumors cling to the Mertyns like moss: of old gods, green dreams, and bloodlines stretching back to the Children or First Men. Truth or not, their subjects believe.\n#weak Long before the storm, the trees had names. Mertyns tend to be [GetTrait('inquisitive').GetName( GetNullCharacter )]."

MERTYNS_WHISPERS_BENEATH_THE_CANOPY_NO_BULLETTAB:0 "The thick canopy of Mistwood hides more than shadows. Mertyns ears have long heard what others miss, turning rumor and rustle into wisdom.\n#weak The forest hears all."

MERTYNS_ECHOES_OF_THE_OLD_SONGS_NO_BULLETTAB:0 "Where godswood roots twist and children once danced, House Mertyns remembers ancient rites and half-lost melodies.\n#weak We remember what the wind once whispered. Mertyns tend to be [GetTrait('shrewd').GetName( GetNullCharacter )]."


mertyns_knights_of_the_mist:0 "Knights of the Mist"
mertyns_knights_of_the_mist_flavor:0 "Shrouded in fog, silent as the storm beneath the trees, the Knights of the Mist are more than soldiers — they are whispers of vengeance and shadowy justice. Raised in the haunted glades and wet thickets of Mistwood, these knights strike like ghosts, vanishing before cries can be heard. Loyal to House Mertyns and trained in the arts of ambush and endurance, they are known across the Stormlands not for their banners, but for the eerie silence that falls when they march to war."

building_type_agot_mertyns_tower_of_owls_01:0 "The Tower of Owls"
building_agot_mertyns_tower_of_owls_01:0 "The Tower of Owls"
building_agot_mertyns_tower_of_owls_01_desc:0 "Rising high above the mists of Mistwood, the Tower of Owls is a solitary tower where House Mertyns keeps its ledgers, secrets, and silent vigil. Owls roost in its rafters, and scrolls weigh more than swords."

#VANCE

vance_legacy_track_name: "Vance"
vance_legacy_track_desc: "Our Truth Stands Unbroken"
vance_legacy_1_name: "Gatekeepers of the Trident"
vance_legacy_2_name: "Honor of Atranta"
vance_legacy_3_name: "Strongest of the Andals"
vance_legacy_4_name: "Bridges and Blood"
vance_legacy_5_name: "Legacy of the Wayfarer"


VANCE_GATEKEEPERS_OF_THE_TRIDENT_NO_BULLETTAB:0 "Our lineage commands the vital roadways and river-crossings that cut right through the heart of the Riverlands. We do not gamble our security on soft courtly promises; our garrisoned keeps dominate the vital ford networks, training generations of heavy causeway-sentries to grind down any invading host.\n#weak No enemy crosses the Red Fork without paying our price in blood. Enables recruitment of [GetMaA('vance_river_knights').GetName] as [men_at_arms|E]."

VANCE_HONOR_OF_ATRANTA_NO_BULLETTAB:0 "As one of the oldest, proudest Andal dynasties in the realm, the Vances of Atranta treat their feudal oaths as an absolute sacred inheritance. We have spent centuries holding our vassals to strict, ironclad fidelity, prioritizing dynastic honor and military obligations far above mere silver or expanded territory.\n#weak Our word is forged in iron, and our alliances do not break under pressure. Members of the Vance dynasty are frequently born [GetTrait('loyal').GetName( GetNullCharacter )]."

VANCE_STRONGEST_OF_THE_ANDALS_NO_BULLETTAB:0 "We carry the unstoppable blood of Armistead Vance, the mightiest Andal warlord who shattered the First Men shieldwalls and slaughtered King Tristifer IV Mudd in the wars for the Trident. That legendary conqueror's strength burns behind our banners, driving our heavy horsemen to strike with absolute, terrifying momentum.\n#weak The Hammer of the Mudds still rides in our bloodline, demanding expansion."

VANCE_BRIDGES_AND_BLOOD_NO_BULLETTAB:0 "To hold our lands is to wage a permanent war over muddy ferry ramps and narrow causeways. We have transformed the treacherous river geography into a lethal tactical weapon, deploying heavy iron-limbed crossbowmen and pikes to trap foreign armies against the steep banks and drown their ambition in the current.\n#weak We do not yield the shallows; we turn the river red on our own terms."

VANCE_LEGACY_OF_THE_WAYFARER_NO_BULLETTAB:0 "From the formidable keeps of Wayfarer’s Rest to the highest councils of the realm, our split houses wield an unmatched regional authority over the western marches. We do not need a crown to dictate terms to our neighbors, using careful ledger-keeping, strict legal precedents, and absolute administrative discipline to dominate the councils.\n#weak We rule the western thoroughfares, and our meticulous governance shapes the Trident. Members of the Vance dynasty are frequently born [GetTrait('diligent').GetName( GetNullCharacter )]."


vance_river_knights:0 "Red Fork Lancers"
vance_river_knights_flavor:0 "Drawn from the battle-hardened lesser landholders of Atranta and Wayfarer’s Rest, these heavy shock cavalrymen are the iron fist of the Vance vanguard. Mounted on massive, thick-boned destriers bred specifically to maneuver across narrow causeways, wet ferry ramps, and muddy riverbanks, they specialize in pinning down enemy vanguard formations against water hazards. They advance knee-to-knee without flashy southern pageantry, using raw physical mass and lowered lances to break infantry lines before the enemy can escape across the crossings."


#MALLISTER

mallister_legacy_track_name: "Mallister"
mallister_legacy_track_desc: "Above the Rest"
mallister_legacy_1_name: "Eagle of the Cape"
mallister_legacy_2_name: "Shield of Seagard"
mallister_legacy_3_name: "Old Blood, Deep Roots"
mallister_legacy_4_name: "Loyal unto Death"
mallister_legacy_5_name: "The Vigil Endures"


MALLISTER_EAGLE_OF_THE_CAPE_NO_BULLETTAB:0 "Our lineage commands the colossal white stone battlements of Seagard, staring out across the Sunset Sea with an unblinking, predatory vigilance. We do not gamble our security on soft courtly pageantry; we are the iron wardens of the Cape of Eagles, training our heirs from boyhood to hunt down ironborn reivers long before they can breach our shores.\n#weak Our gaze dominates the western waves, and our steel answers their iron. Members of the Mallister dynasty are frequently born [GetTrait('brave').GetName( GetNullCharacter )]."

MALLISTER_SHIELD_OF_SEAGARD_NO_BULLETTAB:0 "For thousands of years, our fortress has stood as an impenetrable wall between the Riverlands and the lawless scum of the Iron Islands. The massive bronze bell of the Booming Tower has tolled the absolute doom of countless raiding fleets, waking the entire peninsula to arms the moment an enemy sail breaches the horizon.\n#weak The silver eagle watches the surf, and our shore is paved with reivers' bones. Enables recruitment of [GetMaA('mallister_eagleguard').GetName] as [men_at_arms|E]."

MALLISTER_OLD_BLOOD_NO_BULLETTAB:0 "We trace our lineage back to the ancient Bronze Age kings who ruled the Cape of Eagles long before the Andals ever crossed the narrow sea or the Starks claimed the Neck. We hold our lands by right of ancient conquest and blood-claims carved into the bedrock, maintaining a deep, unyielding dynastic pride that refuses to crawl before upstart houses.\n#weak Our blood runs back to the Age of Heroes, and our honor does not bend."

MALLISTER_LOYAL_UNTO_DEATH_NO_BULLETTAB:0 "No amount of ironborn silver or rebel promises has ever bought our betrayal. We maintain a fanatical, ironclad fidelity to the Tully lords and the Iron Throne, marching our hosts wherever duty commands and sacrificing our own sons at the Ruby Ford to defend the sovereignty of our realm.\n#weak We do not break our contracts, and we pay our blood-debts with interest. Members of the Mallister dynasty make for exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

MALLISTER_THE_VIGIL_ENDURES_NO_BULLETTAB:0 "Though the Riverlands may bleed and kings may shatter their crowns across the realm, the absolute watch upon the western coast never sleeps. We measure our successes not in courtly gold or hollow titles, but in the peaceful silence of an ironborn fleet thoroughly broken upon our breakwaters.\n#weak The krakens may strike the rocks, but the eagle always holds the high seat."


mallister_eagleguard:0 "Seagard Eagleguard"
mallister_eagleguard_flavor:0 "Drawn from the most elite, battle-hardened knightly vassals of the Cape of Eagles, these heavy shock infantrymen are the iron shield of Seagard. Clad in magnificent gleaming plate armor and eagle-crested helms, they carry heavy purple tower-shields and massive, bronze-headed war-hammers specifically engineered to smash longship hulls and crush ironborn armor in the breaking surf. Drilled to mobilize the instant the Booming Tower calls, they hold tidal flats and jetty choke points with a flawless, unrelenting discipline."


building_type_agot_mallister_hall_of_the_cape_lords:0 "Hall of the Cape Lords"
building_agot_mallister_hall_of_the_cape_lords_01:0 "The Great Eagle Audience Hall"
building_agot_mallister_hall_of_the_cape_lords_01_desc:0 "Positioned at the absolute summit of Seagard's highest stone keep, this grand hall functions as the supreme military command center of the western coast. Ringed by massive, arched windows that look out from the Cape of Eagles directly toward the Iron Islands, its stone archives contain centuries of naval charts and anti-piracy strategies—proving that while the Booming Tower wakes the realm to war, it is this high seat that coordinates the destruction of your enemies."


#Westerling

westerling_legacy_track_name: "Westerling"
westerling_legacy_track_desc: "Honor, not Honors"
westerling_legacy_1_name: "The Old Blood Endures"
westerling_legacy_2_name: "Stone of the Crag"
westerling_legacy_3_name: "Gold Lost, Honor Kept"
westerling_legacy_4_name: "Pride Before Power"
westerling_legacy_5_name: "Lords of Dust and Echoes"

WESTERLING_OLD_BLOOD_ENDURES_NO_BULLETTAB:0 "An ancient house with Andal blood and Valyrian cheekbones. Their beauty, like their name, lingers.\n#weak Time does not dilute blood. It only thins the gold. Westerlings tend to be [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

WESTERLING_STONE_OF_THE_CRAG_NO_BULLETTAB:0 "Though the Crag is crumbling and the mines are dry, the Westerlings still stand — stone-blooded and sworn to the old honor.\n#weak A ruin is still a castle. A name is still a shield."

WESTERLING_GOLD_LOST_HONOR_KEPT_NO_BULLETTAB:0 "The gold is gone, but their oaths are not. Even stripped of wealth, the Westerlings have never broken faith.\n#weak We bowed when it was just. We did not break. Enables recruitment of [GetMaA('westerling_oathbound').GetName] as [men_at_arms|E].#!."

WESTERLING_PRIDE_BEFORE_POWER_NO_BULLETTAB:0 "Others whisper of faded glory, but the Westerlings wear their name with a lion’s bearing. They are remembered, if not feared.\n#weak We still walk the halls of kings, even in rags. Westerlings tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

WESTERLING_LORDS_OF_DUST_NO_BULLETTAB:0 "Though their halls echo more than they roar, the Lords of the Crag remain. They may rule ruin — but they still rule.\n#weak Dust remembers. Echoes carry. The Crag endures."

westerling_oathbound:0 "Oathbound of the Crag"
westerling_oathbound_flavor:0 "Once famed for their gleaming helms and golden mail, the Oathbound of the Crag now march in dented plate and patched leather — but march they still. Raised from old retainers and proud smallfolk, they fight with grim discipline, honed by duty more than coin. Stalwart on the battlefield, they’re known not for elegance or aggression, but for holding the line longer than seems possible. Their arms are worn, their line aged, but their loyalty has never bent."

building_type_agot_westerling_the_crag_01:0 "The Crag"
building_agot_westerling_the_crag_01:0 "The Crag"
building_agot_westerling_the_crag_01_desc:0 "The Crag was once a proud seat of the western coast, its vaults filled with gold from deep-veined mines, its halls echoing with noble laughter. Now, its stones are weathered, its banners threadbare. What remains is not strength — but memory. House Westerling endures within walls more scarred than strong."

building_agot_westerling_the_crag_02:0 "The Crag"
building_agot_westerling_the_crag_02_desc:0 "With fresh timber and reclaimed stone, the Crag begins to rise again. Craftsmen shore up the battlements, retainers fill long-empty chambers, and the ancient banners of House Westerling once more fly high above the Sunset Sea. Though its coffers are still lean, its lords walk straighter, and guests begin to return."

building_agot_westerling_the_crag_03:0 "The Crag"
building_agot_westerling_the_crag_03_desc:0 "Fully restored, the Crag stands not as a fortress of war, but as a monument to survival. Its halls are honored again, its knights trained beneath its towers, and its name spoken with something close to reverence. House Westerling may never be golden again — but it is no longer forgotten."

#REED

reed_legacy_track_name: "Reed"
reed_legacy_track_desc: "Within Our Sight"
reed_legacy_1_name: "Blood of the First Men"
reed_legacy_2_name: "Crannog Ambush"
reed_legacy_3_name: "Watchers of the Ways"
reed_legacy_4_name: "The Green-Eyed"
reed_legacy_5_name: "Lords of the Fog"


REED_BLOOD_OF_THE_FIRST_MEN_NO_BULLETTAB:0 "Our lineage remains completely unsullied by Andal crusaders or southern holy oils, rooted deep in the black water and bottomless quagmires of the Neck since the Dawn Age. We preserve the ancient blood-oaths of the First Men with absolute, unyielding permanence, answering the call of the Direwolf with an ironclad fidelity.\n#weak We are the moss and the root, and we do not bend to foreign kings. Members of the Reed dynasty are exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

REED_CRANNOG_AMBUSH_NO_BULLETTAB:0 "We spit upon the flowery rules of southern chivalry and open-field infantry ranks. Our trackers are trained to hunt in the deep, suffocating thickets of the marshlands, utilizing three-pronged tridents and heavy nets to entangle invaders before butchering them in the mud.\n#weak The mire swallows the horse and the rider alike, our steel painted in bog toxins. Enables recruitment of [GetMaA('reed_crannog_stalkers').GetName] as [men_at_arms|E]."

REED_WATCHERS_OF_THE_WAYS_NO_BULLETTAB:0 "The only passage to the North is a narrow, treacherous causeway surrounded by bottomless bogs and predatory lizard-lions. Our outposts watch every single stone track, ensuring that no southron vanguard or uninvited host ever crosses our borders without our explicit, silent consent.\n#weak The shifting waters are our ramparts, and our hidden spears never sleep."

REED_THE_GREEN_EYED_NO_BULLETTAB:0 "The ancient, mystical sorceries of the Children of the Forest still run pure in the veins of our isolated bloodlines. Our chosen heirs are born with the terrifying gift of green-dreams, allowing them to speak to the ravens, read the mud-charters, and see the movements of our enemies long before they ever cross the swamps.\n#weak The earth remembers, and our eyes watch the past and the future alike. Members of the Reed dynasty are frequently born with the gift of [GetTrait('greensight').GetName( GetNullCharacter )]."

REED_LORDS_OF_THE_FOG_NO_BULLETTAB:0 "Our ancestral seat of Greywater Watch has no fixed stone foundations; it is a colossal floating fortress that drifts silently through the swamp channels, completely invisible to enemy armies and maesters. We wrap our entire domain in a shroud of impenetrable secrecy, ruling the gateway to the North from a moving throne.\n#weak We are the ghosts of the quagmire, and our authority is as elusive as the mist."


reed_crannog_stalkers:0 "Crannog Stalkers"
reed_crannog_stalkers_flavor:0 "Drawn from the most agile, water-wise marsh-dwellers of the Reed domain, these elite light infantrymen are the ultimate terror of the swamps. Clad in camouflaged lizard-lion skins and mud-smeared leathers, they glide through the high reeds without leaving a single footprint or ripple in the black water. They carry three-pronged tridents and venomous, black-tipped frog-spears dipped in lethal bog-swamp toxins, specializing in high-attrition guerrilla skirmishing and sudden, blood-soaked midnight ambushes that leave invading hosts completely blind and broken."


#HOARE

hoare_legacy_track_name: "Hoare"
hoare_legacy_track_desc: "Look to the Waves"
hoare_legacy_1_name: "Harren’s Ambition"
hoare_legacy_2_name: "Iron Crown, River Chains"
hoare_legacy_3_name: "From Salt to Stone"
hoare_legacy_4_name: "Wrath of the Blackline"
hoare_legacy_5_name: "Reclaim the Flame"

HOARE_HARRENS_AMBITION_NO_BULLETTAB:0 "Harrenhal was not a castle—it was a challenge to gods and men alike. Harren the Black dreamed of a fortress that would never fall, walls that would never crumble, and a dynasty that would never die. The Hoares poured the spoils of a kingdom into its black stones and crowned their pride with fire. The flames of dragons answered that pride—but even in ruin, Harrenhal stands, as all ambition does, long after its maker is ash.\n#weak Greater than reason, heavier than fear. Hoares tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

HOARE_IRON_CROWN_NO_BULLETTAB:0 "Forged in Old Wyk’s salt forges and set upon a brow in Harrenhal’s shadow, the Iron Crown of Hoare bound sea and river in one cruel dominion. Kings of Salt and Rock, Lords of the Trident, they ruled from black stone over green fields—ironborn reavers turned monarchs of the mainland. Their ships became thrones, their axes, law. For a fleeting age, their name ruled the winds and the waters both.\n#weak We wore salt, stone, and blood—and all bent before the Iron Crown."

HOARE_FROM_SALT_TO_STONE_NO_BULLETTAB:0 "The Hoares began as reavers of Old Wyk, their sails black with salt and storm. They crossed eastward not for gold, but for dominion, and made the greenlands bow beneath the kraken’s banner. Their fleets became armies, their longships landed kingdoms. In every hall they conquered, they left the mark of the sea—hard justice, hard speech, and a hunger that never quieted. The Old Way did not die inland—it learned to wear armor.\n#weak We brought salt to soil, and took the river for our own. Enables recruitment of [GetMaA('hoare_blackhold_reavers').GetName] as [men_at_arms|E].#!."

HOARE_BLACKLINE_NO_BULLETTAB:0 "Harren the Black was not the first of his kind, only the greatest. The Hoares ruled by dread as much as decree, their justice swift, their mercy scarce. The Blackline crushed rebellion with fire, rebuilt with iron, and ruled as if eternity were theirs to command. They believed fear to be a fortress—stronger than faith, thicker than stone—and for a time, it was. Even dragons took pause before their shadow.\n#weak Fear holds what fealty forgets. Hoares tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

HOARE_RECLAIM_THE_FLAME_NO_BULLETTAB:0 "Fire destroyed them, but fire is not only ruin. Within the ashes of Harrenhal lies the same relentless spark that built it—the will to rise again, to rebuild from black stone and burnt pride. Some say the curse lingers; others say it waits, as the Hoares do, for one bold enough to bear it anew. The tower still smokes in the mind of every Ironborn who dreams of kingship.\n#weak What was forged in flame can burn again. Let the ash light the way."

hoare_blackhold_reavers:0 "Blackhold Reavers"
reed_bog_shadows_flavor:0 "Descendants of those who once served the Hoare kings at Harrenhal, the Blackhold Reavers are grim, silent warriors clad in darkened mail and wielding cruel axes. Scarred by fire, legend, and loss, they are disciplinarians, raiders, and remnants of the Old Way reborn. These soldiers are forged not just by iron, but by ashes and ambition — ready to serve a Hoare restoration."

#DRUMM

drumm_legacy_track_name: "Drumm"
drumm_legacy_track_desc: "The Fatal Hold"
drumm_legacy_1_name: "Blood of Old Wyk"
drumm_legacy_2_name: "Reavers Without Chains"
drumm_legacy_3_name: "First to Bleed"
drumm_legacy_4_name: "Old Way Reforged"
drumm_legacy_5_name: "Lords of the Deep Salt"

DRUMM_BLOOD_OF_OLD_WYK_NO_BULLETTAB:0 "The Drumms have ruled from bleak Old Wyk since before the Seastone Chair was carved. Their blood is salt, their law is the axe.\n#weak We kneel only to the Drowned — and not always him."

DRUMM_REAVERS_WITHOUT_CHAINS_NO_BULLETTAB:0 "Drumms raid without command, without mercy, and without fear. They serve no kings but salt and slaughter.\n#weak A chain is only a target. Enables recruitment of [GetMaA('drumm_deep_salt_raiders').GetName] as [men_at_arms|E].#!."

DRUMM_FIRST_TO_BLEED_NO_BULLETTAB:0 "The Drumms are always the first ashore, the first to kill, the first to bleed. Glory is nothing if you wait for it — take it with axe and flame.\n#weak The wave breaks. We don’t. Drumms tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

DRUMM_OLD_WAY_REFORGED_NO_BULLETTAB:0 "Where others kneel to coin and peace, the Drumms walk the shore with iron in hand and prayer on the tide. The Old Way still lives — sharp, proud, and unyielding.\n#weak We pay the iron price. And make others pay in kind."

DRUMM_LORDS_OF_DEEP_SALT_NO_BULLETTAB:0 "Old Wyk faces the edge of the world, and the Drumms are its voice. Their sails catch storms. Their blades catch kings.\n#weak The sea is ours. And it never forgives."

drumm_deep_salt_raiders:0 "Deep Salt Raiders"
drumm_deep_salt_raiders_flavor:0 "Drawn from the surf-pounded cliffs and tide-split rocks of Old Wyk, the Deep Salt Raiders are Drumm’s elite — axe-wielding, scar-laced killers raised on salt and blood. They move fast, strike hard, and leave only fire and screams behind."

#FOSSOWAY

fossoway_legacy_track_name: "Fossoway"
fossoway_legacy_track_desc: "Ripened by Trial"
fossoway_legacy_1_name: "Seed of Strength"
fossoway_legacy_2_name: "Fruitful and Fair"
fossoway_legacy_3_name: "Legacy of Foss the Archer"
fossoway_legacy_4_name: "Cider Lords"
fossoway_legacy_5_name: "The Orchard Holds"

FOSSOWAY_SEED_OF_STRENGTH_NO_BULLETTAB:0 "Fossoway’s roots run deep in Reachlander soil, and so do its customs: loyalty, pride, and a strong arm to hold what’s sown.\n#weak Every seed is a promise. Enables recruitment of [GetMaA('fossoway_ciderwatch_knights').GetName] as [men_at_arms|E].#!."

FOSSOWAY_ORCHARD_OF_HEIRS_NO_BULLETTAB:0 "They say the Fossoways breed true — handsome, healthy, and many. Their halls echo with laughter, children, and loyal kin.\n#weak A good apple falls near its roots. Fossoways tend to be [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

FOSSOWAY_LEGACY_FOSS_THE_ARCHER_NO_BULLETTAB:0 "From Garth Greenhand sprang many sons, but none so keen of eye as Foss the Archer, whose arrows fell swift and sure upon the foes of the Reach. It is said he could strike a hawk mid-flight or split a spear shaft at a hundred paces. The Fossoways claim descent from this legendary marksman, and in their orchards the bow is taught as faithfully as the plow.\n#weak The blood of Foss runs steady in hand and sharper still in aim. Enables recruitment of [GetMaA('fossoway_applewood_archers').GetName] as [men_at_arms|E].#!."

FOSSOWAY_CIDER_LORDS_NO_BULLETTAB:0 "While others chase glory with sword or scroll, the Fossoways mastered the orchard. Cider flows from Cider Hall like gold from a mine — sweet, steady, and loyal. Trade, not tribute, made them rich.\n#weak An apple pressed is an army fed."

FOSSOWAY_ORCHARD_HOLDS_NO_BULLETTAB:0 "Wars come, kings fall, but the trees of House Fossoway still bloom. Through division, seasons, and storms — the orchard holds.\n#weak Not all legacies are built of stone."

fossoway_ciderwatch_knights:0 "Ciderwatch Knights"
fossoway_ciderwatch_knights_flavor:0 "Sworn at Cider Hall and drilled between orchard rows, these Fossoway household knights keep the presses, mills, and Mander fords. In peace they ride the apple roads, escorting cask-trains toward Oldtown; in war they close ranks along hedge and ditch, breaking brigands and bannered foes alike until the bank is theirs. Red apples on the standard, steady hands on the reins—the harvest guarded in every season."

fossoway_applewood_archers:0 "Applewood Archers"
fossoway_applewood_archers_flavor:0 "The Applewood Archers shape their bows from the orchards of Cider Hall, honoring that ancient blood with every drawn string. Patient as the seasons and steady as rooted trees, they loose in disciplined volleys—swift, precise, and unerring."


building_type_agot_fossoway_the_apple_gate_01:0 "The Apple Gate of New Barrel"
building_agot_fossoway_the_apple_gate_01:0 "The Apple Gate of New Barrel"
building_agot_fossoway_the_apple_gate_01_desc:0 "The Apple Gate stands at the heart of New Barrel — a fortified civic hall, watchtower, and an ancestral court of the Apple Fossoways. Known for its wealth, honor, and Reachlander virtue, the hall serves cider to guests and swords to invaders."

#Roxton

roxton_legacy_track_name: "Roxton"
roxton_legacy_track_desc: "We Do Not Flinch"
roxton_legacy_1_name: "Line of Cold Steel"
roxton_legacy_2_name: "No Second Swing"
roxton_legacy_3_name: "Shadow of the Orphan Blade"
roxton_legacy_4_name: "Thorns Among Lords"
roxton_legacy_5_name: "Death Is the Herald"

ROXTON_LINE_OF_COLD_STEEL_NO_BULLETTAB:0 "In 49 AC, the young king Jaehaerys I Targaryen sought to fill five slots within his Kingsguard. At the wedding of his mother Queen Alyssa Velaryon and Lord Rogar Baratheon, Jaehaerys declared that the knights would fight on foot over a position in his Kingsguard. In the subsequent War for the White Cloaks in which hundreds of knights competed for the honor of serving in the Kingsguard, Ser Lorence Roxton was one of the five champions given the white cloak of the Kingsguard, being the only victor from a noble house.\n#weak The Roxtons have always bred warriors — hard-edged, tight-lipped, and quick with steel. Roxtons tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

ROXTON_NO_SECOND_SWING_NO_BULLETTAB:0 "Roxtons do not waste breath or steel. One strike should be enough. On the field or in the hall, they strike true — and quickly.\n#weak You won't see the second swing as there won’t be one. Enables recruitment of [GetMaA('roxton_ring_lancers').GetName] as [men_at_arms|E].#!."

ROXTON_SHADOW_OF_ORPHAN_BLADE_NO_BULLETTAB:0 "Orphan-Maker has a reputation. So does the one who carries it. Some lords win in wars. Roxtons win in fear.\n#weak The shadow of a Valyrian blade is long."

ROXTON_THORNS_AMONG_LORDS_NO_BULLETTAB:0 "They are not the highest lords, nor the richest, but none cross a Roxton lightly. In court or council, their barbs cut deeper than they seem.\n#weak Roses bloom. Thorns bite."

ROXTON_DEATH_IS_THE_HERALD_NO_BULLETTAB:0 "Before a Roxton speaks, their blade is known. Before they act, others think twice. Their name opens doors — or closes throats.\n#weak We arrive with death behind us. Roxtons tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

roxton_ring_lancers:0 "Ring Lancers"
roxton_ring_lancers_flavor:0 "House Roxton’s mailed elite, chosen from the finest soldiers the Ring can muster. Trained on the chalk courses to ride knee-to-knee and wheel as one, they fight as a tightening circle that pens foes against hedge and ditch. When Dornish excursions test the marches, the Ring Lancers answer—hardened, drilled, and sworn to keep Roxton lands unscarred."

building_type_agot_roxton_the_ring_01:0 "The Ring"
building_agot_roxton_the_ring_01:0 "The Ring"
building_agot_roxton_the_ring_01_desc:0 "High in the hills of the Reach, the Ring is no golden hall or merchant's keep. It is a fortress built for duels and duty — for blood, not beauty. Here, Roxton heirs spar in shadowed courts, and oath-sworn retainers train where Orphan-Maker once first tasted blood. The sword is still kept above the hearth, sharp as memory. The lords of the Ring rule not with pageantry, but with the quiet threat of sharpened steel."

#WYL

wyl_legacy_track_name: "Wyl"
wyl_legacy_track_desc: "Fear Each Step"
wyl_legacy_1_name: "Born of the Boneway"
wyl_legacy_2_name: "Cruelty Carved in Stone"
wyl_legacy_3_name: "The Maiden’s Blades"
wyl_legacy_4_name: "Tunnels of Wyl"
wyl_legacy_5_name: "The Boneway Endures"

WYL_BORN_OF_BONEWAY_NO_BULLETTAB:0 "The Boneway is carved in stone and memory. House Wyl was born of both. Its sons fight from shadow and shale, with mountain blood in their veins.\n#weak The pass does not forget who bleeds in it."

WYL_CRUELTY_CARVED_IN_STONE_NO_BULLETTAB:0 "The Wyls do not kill to conquer. They kill to remind. From the Boneway to the Marches, their name is spoken in whispers — a promise of pain that outlasts banners and memory.\n#weak We mark more than maps. Wyls tend to be [GetTrait('sadistic').GetName( GetNullCharacter )]."

WYL_MAIDENS_BLADES_NO_BULLETTAB:0 "Wylla of Wyl led the Knights of the Maiden at the Blackpool and carved a legend in flesh. Wyl daughters are raised for blade and blood, and they do not fall behind their brothers.\n#weak The mountain bore steel in all its children. Enables recruitment of [GetMaA('wyl_maidens_blades').GetName] as [men_at_arms|E].#!."

WYL_TUNNELS_OF_WYL_NO_BULLETTAB:0 "The fortress of Wyl runs deeper than it stands tall. The Blackadder tunnels twist through its roots — escape routes, ambush corridors, and buried deadfall traps no map can trace.\n#weak What you cannot breach, we bury you in."

WYL_BONEWAY_ENDURES_NO_BULLETTAB:0 "Empires cross. Armies pass. The Boneway remains — narrow, winding, guarded by patience and sharpened iron. The Wyls do not rule with words. They wait, they wound, and they survive.\n#weak We are not many. We are enough."

wyl_maidens_blades:0 "The Maiden’s Blades"
wyl_maidens_blades_flavor:0 "The Maiden’s Blades are the elite footguard of House Wyl, descended from the knights who followed Wylla of Wyl into legend. Clad in burnished mail and bone-white sashes, they fight as hammer and wall — trained in the narrow passes of the Boneway to stand when others fall."

building_type_agot_wyl_tunnels_of_wyl_01:0 "The Tunnels of Wyl"
building_agot_wyl_tunnels_of_wyl_01:0 "The Tunnels of Wyl"
building_agot_wyl_tunnels_of_wyl_01_desc:0 "Beneath the cragged keep of Wyl lies a labyrinth of carved stone — passages twisted and aged through centuries of war. Built by the Blackadders, these tunnels guard secret exits, collapse traps, and blood-soaked choke points. No army marches through the Boneway unscathed, and none who breach Wyl do so twice."

#STARK

stark_legacy_track_BLA_name: "Stark"
stark_legacy_track_BLA_desc: "Winter is Coming"
stark_legacy_1_BLA_name: "Wardens of the North"
stark_legacy_2_BLA_name: "Direwolf Bond"
stark_legacy_3_BLA_name: "Winter Fortitude"
stark_legacy_4_BLA_name: "Legacy of Bran the Builder"
stark_legacy_5_BLA_name: "Old Gods' Chosen"


STARK_WARDENS_OF_THE_NORTH_NO_BULLETTAB:0 "We are the blood of the First Kings, holding an eight-thousand-year sovereignty that has weathered every invasion from the Andal crusaders to the wildling hordes of Gendel and Gorne. Our line stands as an unyielding wall against the true darkness of the far north, ruling our domain through absolute stoic grace and the deep, silent respect of our vassals.\n#weak Cold hardens our bones, and we are the shield that guards the realms of men. Enables recruitment of [GetMaA('stark_winterfell_swornswords').GetName] as [men_at_arms|E]."

STARK_DIREWOLF_BOND_NO_BULLETTAB:0 "The legendary 'wolf blood' runs hot and dangerous in our veins, driving our scions to a fierce, quick-tempered bravery whenever our kin or loyal bannermen are threatened. Our ancient bloodline shares a mystical, skin-changing bond with the massive direwolves of the deep woods, granting us a predatory fury on the battlefield.\n#weak The shadow of the wolf guides our lances. Members of the Stark dynasty are frequently born [GetTrait('loyal').GetName( GetNullCharacter )] and [GetTrait('brave').GetName( GetNullCharacter )]."

STARK_WINTER_FORTITUDE_NO_BULLETTAB:0 "Our household words are a grim, unyielding warning to the entire civilized world: *Winter Is Coming*. Born in the frozen wake of the Long Night, we are the truest and most fanatical supporters of the Night's Watch, understanding that winter is not a simple foe to be defeated, but a brutal reality to be survived through raw northern grit.\n#weak We weather the deepest frost with iron resolve, looking down upon the soft southrons."

STARK_LEGACY_OF_BRAN_THE_BUILDER_NO_BULLETTAB:0 "We carry the magnificent architectural legacy of Brandon the Builder, who raised the colossal stone battlements of Winterfell and stacked the ice of the Wall with the aid of ancient giants. His ancient engineering dictates the very shape of our sovereignty, granting us deep dynastic roots that reach far back into the Age of Heroes.\n#weak The mortar of our keeps is bound by ancient magic and unbreakable stone."

STARK_OLD_GODS_CHOSEN_NO_BULLETTAB:0 "We maintain a sacred, primordial communion with the nameless gods of the earth, kneeling in our three-acre ancient godswood where the children of the forest first carved weeping faces into the bone-white weirwood bark. The old magic still whispers to our bloodline, granting our chosen prophets the terrifying sight of the green world.\n#weak In the midnight snow, the heart trees watch through our eyes. Members of the Stark dynasty are sometimes born with the gift of [GetTrait('greensight').GetName( GetNullCharacter )]."


stark_winterfell_swornswords:0 "Winterfell Sworn-Swords"
stark_winterfell_swornswords_flavor:0 "Drawn from the hardiest northern freeholders and veteran garrison families of the winter town, these elite heavy infantrymen are the iron shield of House Stark. Equipped with heavy circular steel shields and broad-bladed northern iron swords, they are trained from youth to form an impenetrable wall of steel that refuses to yield an inch of ground even in the midst of a blinding arctic blizzard. They fight with a grim, silent fanaticism, completely unbothered by wounds or impossible odds."


#BARATHEON

baratheon_legacy_track_name: "Baratheon"
baratheon_legacy_track_desc: "Ours is the Fury"
baratheon_legacy_1_name: "Stormborn Bastard"
baratheon_legacy_2_name: "Unbowed Will"
baratheon_legacy_3_name: "Wrath of the Stag"
baratheon_legacy_4_name: "Masters of Storm's End"
baratheon_legacy_5_name: "Storm and Crown"


BARATHEON_STORMBORN_BASTARD_NO_BULLETTAB:0 "We carry the unstoppable blood of Orys Baratheon, the rumored bastard brother of the Conqueror and the ultimate champion of his youth. On the blood-soaked fields of the Last Storm, Orys slew Argilac the Arrogant in single combat, ending the ancient line of the Storm Kings and carving out our house's destiny through sheer, thunderous violence.\n#weak Our line began in the crossfire of dragons and storms. Members of the Baratheon dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

BARATHEON_UNBOWED_WILL_NO_BULLETTAB:0 "The storm-lords do not bend, nor do we crawl before our enemies. When the savage mountain lords of House Wyl chopped off Orys’s sword-hand in the Dornish wars, he proudly resigned as Hand of the King, refusing to let men mock a 'King's Stump.' We do not tolerate humiliation; our will is an unyielding, black-iron wall.\n#weak In war or in faith, the stag stands stubborn. Members of the Baratheon dynasty are usually born [GetTrait('stubborn').GetName( GetNullCharacter )]."

BARATHEON_WRATH_OF_THE_STAG_NO_BULLETTAB:0 "Our vengeance is a slow, black furnace that demands an absolute, horrific payment in blood. We remember how Orys hunted down the son of his captor at Stonehelm, hacking off the Dornish lord's hands and feet as 'usury' for his own missing limb, dying content as the severed parts dangled in his war-tent.\n#weak We do not breed for mercy, only momentum and thunderous retribution. Enables recruitment of [GetMaA('baratheon_stormbreakers').GetName] as [men_at_arms|E]."

BARATHEON_MASTERS_OF_STORMS_END_NO_BULLETTAB:0 "We rule from the colossal, drum-tower battlements of Storm's End—Durran's Defiance—raised in the Dawn Age to withstand the absolute fury of the sea god and the goddess of the wind. Its massive, child-carved stone walls are laced with ancient magic, mocking the siege engines and storm-gales of the world.\n#weak Few keeps stand against time, and fewer men do. We do both."

BARATHEON_STORM_AND_CROWN_NO_BULLETTAB:0 "We seized the stormlands by right of conquest, marrying the fierce Durrandon princess Argella and adopting their ancient, defiant motto: *Ours is the Fury*. We do not wait for crowns to be placed on our heads by holy oils; we wrench them from the hands of tyrants through the absolute weight of our war-hammers.\n#weak Our empire began in the clash of iron, and the realm still trembles when the stag roars."


baratheon_stormbreakers:0 "Storm's End Stormbreakers"
baratheon_stormbreakers_flavor:0 "Drawn from the most colossal, battle-hardened Marcher lords and veteran garrisons of the Shipbreaker Bay, these elite shock infantrymen are the iron backbone of House Baratheon. Encased in heavy, storm-black plate armor and wielding massive, double-bitted war-axes or heavy iron war-hammers, they are drilled to advance through arrow-storms and broken ground with an absolute, terrifying momentum. They operate with a cold, merciless ferocity, engineered entirely to shatter infantry shieldwalls through raw, crushing physical mass."


#LANNISTER

lannister_legacy_track_name: "Lannister"
lannister_legacy_track_desc: "Hear Me Roar"
lannister_legacy_1_name: "Lann the Clever’s Wit"
lannister_legacy_2_name: "Pride of the Rock"
lannister_legacy_3_name: "Golden Lion"
lannister_legacy_4_name: "To Rule in Shadow"
lannister_legacy_5_name: "Hear Me Roar"


LANNISTER_LANN_THE_CLEVERS_WIT_NO_BULLETTAB:0 "Our golden dynasty began not with a bloody conquest or a crown handed down by the gods, but with a magnificent lie told well. Our mythical ancestor, Lann the Clever, winkled the Casterlys out of their own ancestral mountain using nothing but his wits, whispering madness into their ears until they fled the fortress in terror.\n#weak We do not need a sword when a well-placed whisper can steal a kingdom. Members of the Lannister dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

LANNISTER_PRIDE_OF_THE_ROCK_NO_BULLETTAB:0 "We carry the magnificent, pure-blooded heritage of Andal warlords who carved out an supreme empire among the western hills. Blessed with fair, golden hair and emerald-green eyes, our dynasties command an unrivaled physical majesty—a divine grace that perfectly matches our supreme, unyielding pride as Wardens of the West.\n#weak Our beauty is an absolute weapon, and our arrogance is entirely earned. Members of the Lannister dynasty are frequently born [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )], as well as [GetTrait('arrogant').GetName( GetNullCharacter )]."

LANNISTER_GOLDEN_LIONS_NO_BULLETTAB:0 "The bottomless gold mines of Casterly Rock make us the undisputed masters of Westerosi finance, backing our words with an absolute economic leverage. Our unofficial motto is a chilling reality to our debtors and a promise to our allies: *A Lannister always pays his debts*. Where other houses bleed for banners, we simply buy their compliance.\n#weak A poor lion is a dead lion; the Rock ensures our vaults never stop growing. Enables recruitment of [GetMaA('lannister_redcloaks').GetName] as [men_at_arms|E]."

LANNISTER_TO_RULE_IN_THE_SHADOW_NO_BULLETTAB:0 "Long before desperate kings came begging to Lannisport for loans, our house was masterfully pulling the strings of the realm from the shadows. Our envoys purchase alliances, our stewards quietly liquidate financial rivals, and our coin-weight forces the proudest lords to dance like puppets before they even realize they are leashed.\n#weak We do not need to fight on the open field when our gold can purchase the victory beforehand."

LANNISTER_HEAR_ME_ROAR_NO_BULLETTAB:0 "Our official words are a terrifying prophecy to the entire civilized world: *Hear Me Roar*. When the Lion's patience ends and our bottomless wealth is no longer enough to buy peace, we launch a disciplined, iron-clad vanguard that ruthlessly erases entire bloodlines from history to secure our legacy.\n#weak Our silence means cold calculation; our roar means immediate, absolute war."


lannister_redcloaks:0 "Lannisport Sentinels"
lannister_redcloaks_flavor:0 "Drawn from the highly disciplined, professional urban garrisons of Lannisport, these heavy shock infantrymen are the absolute enforcement arm of Casterly Rock. Clad in heavy, gleaming steel plate armor and long crimson cloaks, they carry massive rectangular tower-shields and beautifully weighted iron halberds. Drilled to march knee-to-knee with an absolute, machine-like obedience, their presence on the battlefield deals massive dread damage, serving as a brutal warning that the Lion's will is absolute."


#ARRYN

arryn_legacy_track_name: "Arryn"
arryn_legacy_track_desc: "As High As Honor"
arryn_legacy_1_name: "Blood of Andalos"
arryn_legacy_2_name: "The Falcon Knight"
arryn_legacy_3_name: "High as Honor"
arryn_legacy_4_name: "War Across the Water"
arryn_legacy_5_name: "Above the Dragons"


ARRYN_BLOOD_OF_ANDALOS_NO_BULLETTAB:0 "We claim direct, unblemished descent from the oldest and noblest lineages of ancient Andalos, tracing our blood back to King Hugor of the Hill himself. To ride beneath our falcon banner is to march under the absolute majesty of Andal law, prioritizing flawless justice and ancestral honor far above petty territorial gain.\n#weak We are the purest blood of the conquerors, our crowns blessed by the Seven. Members of the Arryn dynasty are frequently born [GetTrait('just').GetName( GetNullCharacter )]."

ARRYN_THE_FALCON_KNIGHT_NO_BULLETTAB:0 "We carry the lethal, legendary strength of Ser Artys Arryn, the Falcon Knight, who unified the Andal conquerors and slaughtered King Robar II Royce at the Battle of the Seven Stars to seize the mountains. We are a house born of elite chivalry and supreme martial merit, our knights trained to strike with the swift, terrifying precision of a falcon diving from the sky.\n#weak No First Men shieldwall could withstand our lances, and the mountains belong to us. Enables recruitment of [GetMaA('arryn_knights_of_the_lance').GetName] as [men_at_arms|E]."

ARRYN_HIGH_AS_HONOR_NO_BULLETTAB:0 "We rule from the breathtaking, pale stone spires of the Eyrie, perched thousands of feet above the clouds upon the jagged shoulder of the Giant's Lance. Considered entirely unassailable to ground hosts, we pass judgment from our high seats while the waterfall of Alyssa's Tears echoes through the valley below.\n#weak We do not cower before our enemies; we look down upon the realm, high as honor. Members of the Arryn dynasty are usually born [GetTrait('stubborn').GetName( GetNullCharacter )]."

ARRYN_WAR_ACROSS_THE_WATER_NO_BULLETTAB:0 "We remember the thousand-year War Across the Water, when our war-fleets relentlessly contested the Three Sisters against the northern wolves of Winterfell. From Osgood Arryn besieging the Wolf's Den to Oswin the Talon burning their river-mouths, our ancestral navy proved that a falcon can wait patiently for its prey before launching a devastating strike.\n#weak We have broken northern hosts across the Bite, and our coastal watch never sleeps."

ARRYN_ABOVE_THE_DRAGONS_NO_BULLETTAB:0 "Our house knows exactly how to preserve its sovereignty through calculation rather than suicidal pride. When Queen Regent Sharra found Visenya Targaryen in our courtyard, she chose to buy peace for the Vale with an exchange of dragon-rides for the boy-king, ensuring that our ancient spires never tasted the melting fire of Vhagar.\n#weak The falcon never fell from the sky; we sheathed our swords on our own terms."


arryn_knights_of_the_lance:0 "Knights of the Giant's Lance"
arryn_knights_of_the_lance_flavor:0 "Drawn exclusively from the wealthiest, most ancient Andal landholders of the Vale interior, these heavy shock cavalrymen are the elite vanguard of the Eyrie. Clad in magnificent, polished silver plate armor and bearing sky-blue tower shields, they are trained from youth to execute high-speed, synchronized heavy lance charges down mountain thoroughfares. They operate with a flawless, chivalric discipline, acting as an unstoppable avalanche of steel that can crush enemy infantry formations and secure the high passes from any foreign host."


#MARTELL

martell_legacy_track_name: "Nymeros Martell"
martell_legacy_track_desc: "Unbowed, Unbent, Unbroken"
martell_legacy_1_name: "Rhoynish Inheritance"
martell_legacy_2_name: "Sand and Spear"
martell_legacy_3_name: "The Spear Waits"
martell_legacy_4_name: "The Scorching Memory"
martell_legacy_5_name: "Unbowed, Unbent, Unbroken"


MARTELL_RHOYNISH_INHERITANCE_NO_BULLETTAB:0 "We are House Nymeros Martell, born from the historic union of an Andal adventurer and the legendary warrior-queen Nymeria. When her ten thousand ships were burned at the Planky Town, we cast aside our old customs to adopt the laws of the Rhoynar—ensuring our eldest daughters inherit the high seat of Sunspear by absolute right of birth.\n#weak What dragonfire could not destroy, the water carried forward. Members of the Martell dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

MARTELL_SAND_AND_SPEAR_NO_BULLETTAB:0 "We do not waste our strength fielding massive, slow-moving hosts against the dragons of our enemies. We use the blinding sandstorms, dried-up wells, and the blistering heat of the deep deserts as our primary tactical weapons, bleeding invading armies through grueling attrition before vanishing back into the dunes.\n#weak Our strategy is born of the scorching sun, striking like serpents from the waste. Enables recruitment of [GetMaA('martell_sunspear_spearmen').GetName] as [men_at_arms|E]."

MARTELL_THE_SPEAR_WAITS_NO_BULLETTAB:0 "Let the young dragon-kings boast of their brief battlefield victories; we outlast our conquerors through absolute, cold-blooded patience. We dragged down Daeron’s occupying hosts through a vicious, five-year insurgency, assassinating his Tyrell stewards in their beds and maintaining our independence through strategic calculation.\n#weak We watch from the shadow of the Spear Tower, waiting for the perfect moment to strike. Members of the Martell dynasty are frequently born [GetTrait('patient').GetName( GetNullCharacter )]."

MARTELL_THE_SCORCHING_MEMORY_NO_BULLETTAB:0 "Dorne records every border insult and scorched holdfast with a permanent, burning desire for retribution. From Princess Meria hurling Lord Rosby from the windows of the Old Palace to our scorpions piercing the eye of the dragon Meraxes over Hellholt, we pay our blood-debts by slaughtering the garrisons of our enemies.\n#weak The desert sands cool slowly, and our wrath outlasts the generations. Members of the Martell dynasty are frequently born [GetTrait('vengeful').GetName( GetNullCharacter )]."

MARTELL_UNBOWED_UNBENT_UNBROKEN_NO_BULLETTAB:0 "Our house is defined across the Seven Kingdoms by three legendary, unyielding words: *Unbowed, Unbent, Unbroken*. No dragonlord ever forced our princes to kneel, and no foreign army has ever successfully broken our pride—we stand as an independent principality, sovereign and entirely supreme under the sun.\n#weak You may burn our keeps, but you will never make us bow to a iron seat."


martell_sunspear_spearmen:0 "Sunspear Spear-Vanguard"
martell_sunspear_spearmen_flavor:0 "Drawn from the sun-hardened freeholders of the deep deserts and the rugged outposts of the broken arm, these elite infantrymen are the legendary shield of Dorne. Equipped with long, slender ash-spears and polished round shields designed to deflect desert heat, they are drilled to form impenetrable, flexible lines capable of bracing against heavy heavy cavalry charges. They excel at desert attrition warfare and sudden canyon ambushes, fighting with a loose, quick-footed discipline that has humbled conquerors since the Age of Heroes."


#TYRELL

tyrell_legacy_track_name: "Tyrell"
tyrell_legacy_track_desc: "Growing Strong"
tyrell_legacy_1_name: "Legacy of Garth the Greenhand"
tyrell_legacy_2_name: "Stewards of Highgarden"
tyrell_legacy_3_name: "Bounty of the Reach"
tyrell_legacy_4_name: "Petals and Poison"
tyrell_legacy_5_name: "Growing Strong"


TYRELL_LEGACY_OF_GARTH_NO_BULLETTAB:0 "We do not claim our high seat through ancient, bloody kingships; our lineage traces its legitimacy through the female line to Garth the Gardener, the mythical sovereign of the Age of Heroes. While other houses boast of iron conquests, we have spent generations binding our blood to the land itself, ruling the fertile valleys of the Mander through absolute cultivation.\n#weak Our dynastic roots run deep, and the harvest of the Reach is always ours to reap. Enables recruitment of [GetMaA('tyrell_highgarden_honor_guard').GetName] as [men_at_arms|E]."

TYRELL_STEWARDS_OF_HIGHGARDEN_NO_BULLETTAB:0 "We rose to prominence not by launching reckless rebellions, but by mastering the art of flawless, hereditary stewardship. From the bookish Gareth Tyrell to our grand administrators, we managed the wealth, custom-houses, and daily decrees of Highgarden so meticulously that we became entirely indispensable to the old crown.\n#weak We remember every command we once obeyed, and we know exactly how to wield them now in turn. Members of the Tyrell dynasty are born exceptionally [GetTrait('shrewd').GetName( GetNullCharacter )]."

TYRELL_BOUNTY_OF_THE_REACH_NO_BULLETTAB:0 "Our domain is the golden granary of the Seven Kingdoms, its rolling green hills and sun-drenched orchards feeding half the ports of Westeros. Because our lands overflow with grain, wine, and deep coffers, we can field a massive vanguard of heavy knights that dwarfs almost any other host in the realm.\n#weak We rule a kingdom of gold wrapped in green, and even war cannot starve our ambition."

TYRELL_PETALS_AND_POISON_NO_BULLETTAB:0 "We have perfected the courtly art of speaking softly while cutting our competitors to the absolute bone. Behind our lavish tourney pavilions and painted smiles lies a calculating, razor-sharp political pragmatism, utilizing silken blackmail and quiet poisons to liquidate rivals without ever spilling blood on our own hands.\n#weak The golden rose smiles in the daylight, but our hidden thorns strike deep in the dark. Members of the Tyrell dynasty are frequently born [GetTrait('calm').GetName( GetNullCharacter )]."

TYRELL_GROWING_STRONG_NO_BULLETTAB:0 "When the foolish Gardeners burned to ash at the Field of Fire, we quietly handed the keys of Highgarden to Aegon the Conqueror, leaping ahead of older, more arrogant houses to claim dominion over the Mander. Our house words are an absolute, living truth across the realm: *Growing Strong*.\n#weak Our power is an inescapable velvet trap, expanding with every passing season."


tyrell_highgarden_honor_guard:0 "Highgarden Honor Guard"
tyrell_highgarden_honor_guard_flavor:0 "Drawn exclusively from the wealthiest, most prestigious knightly houses of the Mander valley, these elite shock cavalrymen are the pride of Highgarden's vanguard. Clad in magnificent, mirror-polished plate armor inlaid with gold filigree and bearing heavy oak lances, they are drilled to execute devastating, synchronized heavy horse charges. They masterfully blend the flawless pageantry of southern tourneys with an unyielding, iron-clad battlefield discipline, effortlessly breaking enemy infantry lines beneath their hooves."


#TULLY

tully_legacy_track_name: "Tully"
tully_legacy_track_desc: "Family, Duty, Honor"
tully_legacy_1_name: "Lords by Right of Valor"
tully_legacy_2_name: "Family, Duty, Honor"
tully_legacy_3_name: "The Red Fork Way"
tully_legacy_4_name: "Riverlords"
tully_legacy_5_name: "The River Remembers"


TULLY_LORDS_BY_RIGHT_OF_VALOR_NO_BULLETTAB:0 "We trace our lineage to the first stone of Riverrun, built where the Red Fork meets the Tumblestone. When the monstrous Harren Hoare burned in his own tower at Harrenhal, we were the first to raise the dragon's banner, leading the rebel riverlords to throw off the ironborn yoke and earning our right to rule the Trident as Lords Paramount.\n#weak We rose by choosing wisely, and we hold the riverlands on our own terms. Members of the Tully dynasty are often born [GetTrait('loyal').GetName( GetNullCharacter )]."

TULLY_FAMILY_DUTY_HONOR_NO_BULLETTAB:0 "We were never ancient kings, but our house was chosen to hold a fractured realm together through the absolute weight of our words: *Family, Duty, Honor*. We carry the heavy burden of mediating bitter blood-feuds and stabilizing a war-torn region, prioritizing the lives of our vassals and kin far above hollow vanity.\n#weak Kin comes before crown, and our honor is as unyielding as our walls. Members of the Tully dynasty are frequently born [GetTrait('just').GetName( GetNullCharacter )] and [GetTrait('temperate').GetName( GetNullCharacter )]."

TULLY_RED_FORK_WAY_NO_BULLETTAB:0 "Planted in the open crossroads of Westeros, our fields have been the bloody mud-pit of the realm's wars for millennia. We do not fight with southern flash or empty pageantry; our vanguard is drilled to turn treacherous riverbends into tactical traps, holding muddy causeways and ferry ramps against impossible odds.\n#weak The fish survives the flood, and our shields do not buckle in the current. Enables recruitment of [GetMaA('tully_trident_guard').GetName] as [men_at_arms|E]."

TULLY_RIVERLORDS_NO_BULLETTAB:0 "We govern the most volatile, notoriously quarrelsome lords in the Seven Kingdoms, keeping our hands permanently on the hilts of our swords to suppress midnight raids and border skirmishes. We command the vast, wealthy networks of grain-barges and trade-skiffs that keep the markets of the Trident flowing with silver.\n#weak Fractured loyalties may pull the realm apart, but Riverrun anchors the forks together."

TULLY_THE_RIVER_REMEMBERS_NO_BULLETTAB:0 "Dynasties rise and turn to dust along our banks—the Mudds are gone, the Justmans are ash, and the ironborn tyrants are dead—yet the red trout swims steadily upstream. We record every ancient treaty signed in our halls and every blood-debt left unpaid, outlasting our conquerors through sheer, patient endurance.\n#weak Alliances shift like the tides, but the river always remembers its course."


tully_trident_guard:0 "The Trident Guard"
tully_trident_guard_flavor:0 "Drawn from the most resilient garrison families of the Tumblestone and the Red Fork, these elite heavy infantrymen are the iron wall of Riverrun. Equipped with heavy mail, long-axes, and massive rectangular shields designed to interlock along narrow causeways and ferry ramps, they are trained to hold river crossings against overwhelming odds. They excel at defensive bottleneck warfare, utilizing the treacherous mud and shifting currents of the Riverlands to systematically grind down any invading host or ironborn reiver vanguard."


#GREYJOY

greyjoy_legacy_track_name: "Greyjoy"
greyjoy_legacy_track_desc: "We Do Not Sow"
greyjoy_legacy_1_name: "The Kraken’s Reach"
greyjoy_legacy_2_name: "Voice of the Drowned"
greyjoy_legacy_3_name: "Born to Reave"
greyjoy_legacy_4_name: "Claws of the Kraken"
greyjoy_legacy_5_name: "The Seastone Chair"


GREYJOY_THE_KRAKENS_REACH_NO_BULLETTAB:0 "We claim direct, unyielding descent from the legendary Grey King, who wore a driftwood crown and slaughtered the great sea dragon Nagga to heat his hall with her living fire. Chosen by the ironborn captains to rule the islands after the Conqueror's arrival, our lineage commands the waves by right of ancient, primordial sovereignty.\n#weak The kingsmoot may crown our lords, but the Drowned God anoints our bloodline. Members of the Greyjoy dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

GREYJOY_VOICE_DROWNED_NO_BULLETTAB:0 "We were not made from the common clay of the earth; we crawled from the deep salt seas, spawned in the image of the Drowned God to reave, raid, and carve out our names in fire and blood. We spit upon the soft currency of the mainland, proudly matching our survival to the unyielding laws of the iron price.\n#weak What is dead may never die, but rises again, harder and stronger. Members of the Greyjoy dynasty are born exceptionally [GetTrait('stubborn').GetName( GetNullCharacter )] and [GetTrait('zealous').GetName( GetNullCharacter )]."

GREYJOY_BORN_TO_REAVE_NO_BULLETTAB:0 "Our rocky, wind-lashed islands offer nothing but a thin, stony soil that cannot feed our smallfolk. We do not plow fields or beg for southern gold; we mine the rich iron ore beneath the hills of Pyke and Great Wyk, hammering out the finest mail and broad-axes to violently take what is ours from the weak green landsmen.\n#weak We do not sow our crops; we harvest our wealth at the edge of an iron blade. Enables recruitment of [GetMaA('greyjoy_naggas_sons').GetName] as [men_at_arms|E]."

GREYJOY_CLAWS_KRAKEN_NO_BULLETTAB:0 "We command the Iron Fleet, a legendary grouping of one hundred colossal longships built three times larger than standard reiver vessels. Belonging directly to the Seastone Chair, our iron-capped hulls dominate the shipping lanes from Lannisport to the Arbor, turning the open seas into a thunderhead of fire and steel.\n#weak Where our krakens strike, the waters burn and kingdoms crumble beneath our oars."

GREYJOY_THE_SEASTONE_CHAIR_NO_BULLETTAB:0 "We rule from the Seastone Chair—the ancient, immense high seat of oily black stone found carved into the shape of a massive kraken upon the shores of Old Wyk. It is a throne that explicitly tolerates no soft, godless master, commanding our lords to enforce the ancient, bloody laws of the islands with absolute iron authority.\n#weak The Driftwood Chair does not comfort its master—it commands the submission of the world."


greyjoy_naggas_sons:0 "Nagga’s Sons"
greyjoy_naggas_sons_flavor:0 "Drawn from the most fanatical, brine-baptized reivers of the Iron Islands, these elite heavy infantrymen are the holy vanguard of Pyke. Clad in heavy, sea-worn iron scale mail and wearing barnacle-encrusted helms, they are trained to storm stone curtain walls and board merchant cogs knee-deep in fire and crashing surf. They have an absolute, ecstatic contempt for death, entering the scrum with a bloodthirsty aggression designed to break green landsmen shieldwalls through raw, crushing physical violence."


#TARGARYEN

targaryen_legacy_track_name: "Targaryen"
targaryen_legacy_track_desc: "Fire and Blood"
targaryen_legacy_1_name: "Last Dragonlords of Valyria"
targaryen_legacy_2_name: "Dreams of Fire"
targaryen_legacy_3_name: "Three Heads of the Dragon"
targaryen_legacy_4_name: "The Burning Crown"
targaryen_legacy_5_name: "House of the Dragon"


TARGARYEN_LAST_DRAGONLORDS_OF_VALYRIA_NO_BULLETTAB:0 "We are the blood of Old Valyria, the last surviving sorcerer-princes of the Freehold who command the sky through right of dragonflame and absolute sovereignty. To maintain our god-like physical majesty and keep our ancient magic pure, we wed brother to sister, refusing to let our silver-and-gold lineage mix with lesser men.\n#weak We are born of the Freehold, reborn in Westeros, and we answer to no gods but our own. Members of the Targaryen dynasty are inhumanly [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )], and fiercely [GetTrait('arrogant').GetName( GetNullCharacter )]."

TARGARYEN_DREAMS_OF_FIRE_NO_BULLETTAB:0 "We fled the cataclysm of the Fourteen Flames because our maiden Daenys the Dreamer foresaw the boiling glass and ash that swallowed our empire. While other dragonlords mocked our retreat to Dragonstone as cowardice, our prophetic bloodline outlasted the Doom, transforming us into the lone masters of the dragon's wrath.\n#weak We do not simply predict the future; we shape it through ink and fire. Members of the Targaryen dynasty are occasionally born with the gift of [GetTrait('dragon_dreams').GetName( GetNullCharacter )]."

TARGARYEN_THREE_HEADS_OF_THE_DRAGON_NO_BULLETTAB:0 "Our house is anchored by an absolute, multi-headed majesty: Aegon the Conqueror and his twin sister-wives, Visenya and Rhaenys. Together, riding Balerion, Vhagar, and Meraxes, they forged a single realm out of seven shattered kingdoms, blending Visenya's dark steel with Rhaenys's courtly grace to establish an unbreakable crown.\n#weak The dragon has three heads, and every crown bows before our shadow. Enables recruitment of [GetMaA('targaryen_blackshields').GetName] as [men_at_arms|E]."

TARGARYEN_BURNING_CROWN_NO_BULLETTAB:0 "We carved a united continent upon the borderless cedar of the Painted Table, and we enforced that kingly vision through the melting stone of Harrenhal and the ash of the Field of Fire. We do not negotiate our right to rule the Seven Kingdoms; our Iron Throne was forged from the twisted blades of every lord who dared defy our fire.\n#weak We anointed our dynasty in old blood, and Oldtown's High Septon crowned our conquest."

TARGARYEN_HOUSE_OF_THE_DRAGON_NO_BULLETTAB:0 "The dragon is not a simple heraldic crest upon our banners—it is our physical, volatile nature. We rule by presence alone, carrying a bloodline so pure and intense that the gods famously toss a coin at the birth of every Targaryen scion, forcing the entire civilized world to hold its breath in terror.\n#weak We are not common men; we are the blood of the dragon, dangerous in our greatness. Members of the Targaryen dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )] or carry the curse of being a [GetTrait('lunatic_1').GetName( GetNullCharacter )]."


targaryen_blackshields:0 "Dragonstone Blackshields"
targaryen_blackshields_flavor:0 "Drawn from the most fanatical, battle-hardened islanders of Dragonstone and the loyal vanguards of the Crownlands, these elite shock infantrymen are the living shield of the Iron Throne. Clad in heavy, midnight-black steel plate armor and wearing helmets crested with genuine dragon-scales, they form a silent, immovable wall between the royal bloodline and the world. They have an absolute, machine-like contempt for wounds or fear, executing their defensive duties with the cold, precise violence of professional executioners."


#BANEFORT

banefort_legacy_track_name: "Banefort"
banefort_legacy_track_desc: "More So to Dread"
banefort_legacy_1_name: "The Hooded Man"
banefort_legacy_2_name: "The Hooded Kings"
banefort_legacy_3_name: "The Curse of Morgon"
banefort_legacy_4_name: "Wards of the Western Dusk"
banefort_legacy_5_name: "The Hood Remains"

BANEFORT_THE_HOODED_MAN_NO_BULLETTAB:0 "The Hooded Man is one of the many shadowed figures of the Age of Heroes, from whose bloodline House Banefort claims descent. His true name has been lost to time. His face, it is said, was never seen—only the cowl, the silence, and the deeds that followed. Some say he was a wandering king who took no throne, ruling by oath and fear rather than castle and court. Others claim he was a sorcerer, cursed with a deathless life, who walked the coasts veiled in mist, delivering judgment to those who spilled blood unjustly. In some tales, he is the last survivor of a slaughtered line, hiding his face from the gods until vengeance was complete. What unites every telling is this: He came when the sun was low, and left no shadow behind. Some called him king, others death. The Baneforts call him forefather.\n#weak What began in shadow still shapes the dusk. Some Baneforts are known to be [GetTrait('deceitful').GetName( GetNullCharacter )]."

BANEFORT_THE_HOODED_KINGS_NO_BULLETTAB:0 "The Baneforts were petty First Men kings of the Age of Heroes, claiming descent from the Hooded Man. From his line came the Hooded Kings of Banefort, rulers of the western cliffs before the rise of House Lannister. Their heraldry—a black hood on a field of silver—echoes his silence. Their rulings were known for finality. Their halls were built with narrow windows and deep gates. They spoke little, and were obeyed without question. The last Hooded King was Morgon Banefort, whose thralls were defeated after twenty years of war by Loreon I Lannister, King of the Rock. The Hooded Kings ruled the cliffs in silence, their justice sharp, their words few. Their crowns were not gold, but fear.\n#weak Before the lion came, the hood ruled. Enables recruitment of [GetMaA('banefort_hooded_blades').GetName] as [men_at_arms|E].#!."

BANEFORT_CURSE_OF_MORGON_NO_BULLETTAB:0 "King Morgon was supposedly a necromancer of terrible power, and it is written that as he lay dying, he told the Lannisters who had slain him (amongst them three of Loreon’s own sons) that he would return from the grave to wreak vengeance upon them one and all. To prevent that, Loreon had Morgon’s body hacked into a hundred pieces and fed to his lions. In a grisly aftermath, however, those same lions broke loose two years later in the bowels of Casterly Rock, and slew the king’s sons, just as the Hooded King had promised.\n#weak Some vengeance takes time. Some curses chew slow. Baneforts tend to be [GetTrait('vengeful').GetName( GetNullCharacter )]."

BANEFORT_WARDS_OF_THE_WESTERN_DUSK_NO_BULLETTAB:0 "The Baneforts did not vanish. They receded—into stone, into name, into bloodlines that outlasted thrones. \n#weak The Baneforts do not parade their name—but it lingers in old debts not yet paid."

BANEFORT_THE_HOOD_REMAINS_NO_BULLETTAB:0 "Though the kings are gone, the hood remains—in every quiet glance, every unspoken oath, every knife drawn in silence. The hood endures in both blood and terror—passed not in parchment but in dread. Some whisper that the Hooded Man never died at all. That he waits in the Banefort crypts, silent, faceless… and listening.\n#weak The lion rules the day. The hood waits for night. Baneforts tend to be [GetTrait('patient').GetName( GetNullCharacter )]."

banefort_hooded_blades:0 "Hooded Blades"
banefort_hooded_blades_flavor:0 "Trained in silence and shaped by fear, the Hooded Blades are the black steel shadow of House Banefort. Clad in dark mail and veiled helms, they strike from the dusk like their forebear—the Hooded Man. They carry no banners, speak no vows, and leave no survivors. Justice, to them, is a blade in the ribs beneath a watchful moon."

#CONNINGTON

connington_legacy_track_name: "Connington"
connington_legacy_track_desc: "We Guard Our Treasure"
connington_legacy_1_name: "Stormbound"
connington_legacy_2_name: "Blood for Honor"
connington_legacy_3_name: "Griffin’s Roost"
connington_legacy_4_name: "Griffin’s Endurance"
connington_legacy_5_name: "Wings Unfurling"

CONNINGTON_STORMBOUND_NO_BULLETTAB:0 "The Conningtons have always served and bled for Storm Kings, Dragonlords, and their own sense of worth. During the First Dornish War, Lord Connington was killed by Dornish assassins while hunting. The fourth son of the ruling Lord Connington joined Prince Aegon the Uncrowned's forces in his campaign against his uncle King Maegor the Cruel and fought for him in the Battle Beneath the Gods Eye. Duty forged them. Pride sharpened them.\n#weak Loyalty in the Stormlands is earned in blood and as such Conningtons tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

CONNINGTON_BLOOD_FOR_HONOR_NO_BULLETTAB:0 "House Connington has known to spill blood when honor demands it. Alyn Connington, also known as the Pale Griffin, was a knight from House Connington, who eventually became Lord Commander of the Kingsguard. He was also one of the best war leaders in the history of the Kingsguard. House Connington has fought the Dornish many times when their raids reached the Stormlands, as well as in the Dornish Wars. Among the Stormlanders, Conningtons are known to fight duels with the same ease as raising banners. They are also known to participate in tourneys, not just for honor but to hone their skills. They are not famed for riches, nor for courtly grace. The red griffin gains renown by force of arms alone.\n#weak Few forget a red griffin’s challenge. Conningtons are typically [GetTrait('brave').GetName( GetNullCharacter )]."

CONNINGTON_GRIFFINS_ROOST_NO_BULLETTAB:0 "An old house, the Conningtons were a significantly wealthy house during the rule of House Targaryen. They keep their wealth guarded as you would expect griffins would. Small but strong, Griffin's Roost is located on a lofty crag jutting out from the shores of Cape Wrath. The castle lies surrounded by red stone cliffs on three sides, which descend into the stormy waters of Shipbreaker Bay. The land-facing approach is a long natural ridge called the griffin's throat. The entrance to the griffin's throat is guarded on one end by a gatehouse, and by the castle's main gate and two round towers on the other end. A well-provisioned garrison can hold the castle against twenty times as many men.\n#weak The talon does not lower its guard. Enables recruitment of [GetMaA('connington_griffin_guard').GetName] as [men_at_arms|E].#!."

CONNINGTON_GRIFFINS_ENDURANCE_NO_BULLETTAB:0 "Storm, siege, exile—none have broken the red griffin. The Conningtons wear hardship like old mail: dented, never pierced. When castles fell and names faded, the red griffin stood. The Conningtons endure not by favor—but by grit.\n#weak No storm lasts forever. The Roost still stands."

CONNINGTON_WINGS_UNFURLING_NO_BULLETTAB:0 "It is not an unknown fact for the Stormlander griffins to be covetous. House Connington has always desired land, with stories that the Lord of Griffin's Roost would climb the highest tower and show his heir all the lands that they own with pride and ambition for more. The Conningtons have long stood in shadow, but their ambition is stitched into every banner. Their rise is not a boast—it is a promise.\n#weak The talons are not always folded. Conningtons have aspirations for more and tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

connington_griffin_guard:0 "Griffin Guard"
connington_griffin_guard_flavor:0 "Chosen from the fiercest riders of Griffin’s Roost and its loyal bannermen, the Griffin Guard are heavy cavalry trained to shatter infantry lines and ride through the heart of battle. Clad in red-and-steel and bearing the roaring griffin standard, they fight with the pride of a house that never bent, never begged, and never broke."

#CRANE

crane_legacy_track_name: "Crane"
crane_legacy_track_desc: "Vigilance in Blood"
crane_legacy_1_name: "Rose of the Lake"
crane_legacy_2_name: "Red Lake Pact"
crane_legacy_3_name: "The Crane’s Secret"
crane_legacy_4_name: "Blood on the Water"
crane_legacy_5_name: "Claw and Grace"

CRANE_ROSE_OF_THE_LAKE_NO_BULLETTAB:0 "The Cranes trace their line to Rose of Red Lake, a daughter of Garth Greenhand, the great progenitor of the Reach. Through her, House Crane inherited not just bloodline but presence—beauty revered, courtesy remembered, and a deep connection to the land. Like the lake they guard, they reflect sunlight with poise and conceal their depths in quiet. Their legacy blooms in courts and councils alike, where lineage, charm, and serenity carry the weight of power.\n#weak Their beauty is not painted. It is grown. Cranes tend to be [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

CRANE_RED_LAKE_PACT_NO_BULLETTAB:0 "House Crane entered the Kingdom of the Reach not through conquest, but through oaths of peace and mutual defense, sworn in the time of King Garth III Gardener. While others claimed their place through blood and banners, the Cranes offered loyalty—and were answered with trust. Yet they were no idle wardens. Like the bird that graces their sigil, the Cranes have long held vigil over Red Lake, ever-watchful. In ancient heraldry, the crane is shown balancing on one foot, a stone clutched in the other—a sign of unbroken watchfulness, for should it sleep, the stone would fall and wake up the flock. So too have the Cranes endured: poised, loyal, and alert to every threat the Reach sees.\n#weak Where danger arises, the crane watches. Enables recruitment of [GetMaA('crane_whitefoot_guard').GetName] as [men_at_arms|E].#!."

CRANE_THE_CRANES_SECRET_NO_BULLETTAB:0 "The women of House Crane are said to hold a secret passed through quiet generations—a touch of the old magic, perhaps, or simply deeper sight. Some whisper of skinchanging, claiming that certain Crane daughters have taken wing under the moon. Others say the truth is simpler: the Cranes see more because they listen, and strike less because they plan. Their gift is not always spoken, but felt—in silence, in insight, in the calm before decision.\n#weak You do not need feathers to fly. Few Cranes may have the gift of [GetTrait('greensight').GetName( GetNullCharacter )]."

CRANE_BLOOD_ON_THE_WATER_NO_BULLETTAB:0 "Red Lake is known for its beauty—still waters, ancient oaks, and high windows that catch the last light of sunset. But its history is not so tranquil. During the age of the Gardener kings, when Lancel IV Lannister invaded the Reach, it was at Red Lake that he met his death, locked in single combat with Wilbert Osgrey. Since then, the lake has borne witness to blood and banners, yet never once has its castle fallen. The Cranes stood firm while kingdoms shifted, quiet and resilient. Beneath the calm surface lies a deep memory—and steel.\n#weak The castle stands still, serene and grim, unmoved by the blood that stains its shore."

CRANE_CLAW_AND_GRACE_NO_BULLETTAB:0 "House Crane has long been admired for its refinement—poets, healers, and courtiers have all passed through Red Lake’s halls. But behind their grace lies a dangerous pride. The same hand that composes a verse may sign a death writ. Though their banners carry elegance and civility, they do not forget insult, nor do they flinch from conflict. The Crane’s power lies in restraint, but when the time comes, they strike with precision—like the bird that gives them their name.\n#weak The wing is velvet. The claw beneath is not. Cranes tend to be [GetTrait('calm').GetName( GetNullCharacter )]."

crane_whitefoot_guard:0 "Whitefoot Guard"
crane_whitefoot_guard_flavor:0 "Named for the crane's ancient symbol of vigilance, the Whitefoot Guard are the sworn protectors of Red Lake. Cloaked in ivory and blue, they keep watch with one foot always lifted, like the bird of their banner. Trained for discipline and defense, they are a wall of spears and silence—elegant, alert, and unwavering in duty."

#MANWOODY

manwoody_legacy_track_name: "Manwoody"
manwoody_legacy_track_desc: "First to Rise, Last to Fall"
manwoody_legacy_1_name: "He Who Slew the King"
manwoody_legacy_2_name: "Redmount Raiders"
manwoody_legacy_3_name: "Marcher Blood Feud"
manwoody_legacy_4_name: "The Golden Fetters"
manwoody_legacy_5_name: "The King Beneath the Hill"

MANWOODY_HE_WHO_SLEW_THE_KING_NO_BULLETTAB:0 "The Manwoodys are at least as old as the Andal Invasion, and possibly older still: their sigil - an ominous crowned skull - and the name of their seat, Kingsgrave, recall the occasion when the Manwoodys slew a King of the Reach who attempted to invade Dorne. Manwoody blood is royal blood, born not of inheritance but of conquest.\n#weak Prowess and dread rise in honor of the king we felled."

MANWOODY_REDMOUNT_RAIDERS_NO_BULLETTAB:0 "The Manwoodys ruled vast stretches of the Red Mountains in eastern Dorne, a domain of perilous ridges, narrow passes, and sudden ambushes. Before the arrival of the Rhoynar, they were kings of this harsh terrain. Even afterward, they remained feared for their guerrilla tactics and constant skirmishes against Marcher Lords of the Reach and Stormlands. Their warriors know every pass and crag—and could bleed a host before it crossed a single ridge.\n#weak From the high passes, the spears of Kingsgrave strike swift and cruel. Enables recruitment of [GetMaA('manwoody_redmount_raiders').GetName] as [men_at_arms|E].#!."

MANWOODY_MARCHER_BLOOD_FEUD_NO_BULLETTAB:0 "Throughout history, House Manwoody clashed with the Marcher Lords—Stormlander and Reachman noble houses planted along the Dornish frontier to harass and restrain Dornish independence. The hills ran red with blood, and the feuds often grew personal. Though the kings are gone, the hate remains. Centuries of burning hatred and violent reprisal color Manwoody politics and memory.\n#weak The Marchers took our borders. We will take their sons. House Manwoody have become [GetTrait('vengeful').GetName( GetNullCharacter )] over the centuries."

MANWOODY_GOLDEN_FETTERS_NO_BULLETTAB:0 "During Nymeria’s War, King Albin Manwoody, said to be a “troublesome madman” who attempted to control the entirety of the Red Mountains, resisted Nymeria and Prince Mors Martell’s unification of Dorne. He was defeated and humiliated—sent to the Wall in golden fetters, a mockery of his status. That event left a lasting scar on the house’s collective memory. The chains may be gone, but the shame burns still, reforged into a cold cunning passed down through generations. The legacy is not just martial but manipulative—an undercurrent of bitterness, plotting, and control.\n#weak The fetters of our shame gleam like a promise yet unfulfilled."

MANWOODY_KING_BENEATH_HILL_NO_BULLETTAB:0 "Kingsgrave is both a tomb and a throne—its name speaks not only of the king that was slain, but of the kings who came after, and who were buried beneath the hills. Though the Manwoodys have not worn crowns in centuries, their pride endures, and they speak of the King Beneath the Hill, a ghost of sovereign right that lingers in stone and bone. Their blood remembers royalty. Their stronghold—still grim, still regal—endures as the final monument to what was, and what might be again.\n#weak Kingsgrave still stands, and from its crypts, we rise anew. Manwoodys can be [GetTrait('strong').GetName( GetNullCharacter )]."

manwoody_redmount_raiders:0 "Redmount Raiders"
manwoody_redmount_raiders_flavor:0 "Trained in the passes of the Red Mountains, these light-footed raiders strike from ambush and vanish into rock and shadow. The Redmount Raiders are the heirs of border feuds and hill wars—unseen, unyielding, and unmerciful."

building_type_agot_manwoody_kingsgrave_01:0 "Crypts of Kingsgrave"
building_agot_manwoody_kingsgrave_01:0 "Crypts of Kingsgrave"
building_agot_manwoody_kingsgrave_01_desc:0 "Set along the windswept cliffs of the deep Dornish pass, Kingsgrave earned its name from the legend of a slain king buried beneath its gates. Here the Manwoodys keep vigil with blade and bone — feared lords whose halls echo with the silence of old vengeance. The crypts beneath run deep, carved with forgotten kings and buried oaths."


#TOLAND

toland_legacy_track_name: "Toland"
toland_legacy_track_desc: "The Spirit is Stronger"
toland_legacy_1_name: "The Dragon's Fool"
toland_legacy_2_name: "Ghost Raids"
toland_legacy_3_name: "Phantoms of the Dunes"
toland_legacy_4_name: "Daughters of the Spear"
toland_legacy_5_name: "The Laughing Line"

TOLAND_THE_DRAGONS_FOOL_NO_BULLETTAB:0 "The Tolands successfully resisted the dragons of Aegon the Conqueror during the First Dornish War. Lord Toland sent out his champion to face Aegon. After Aegon slew the man, he learned that the man was the Tolands' mad fool, and that Lord Toland himself had escaped. In later days, the Tolands would take a new banner, showing a dragon biting its own tail, with the colors green in gold in memory of the motley of their brave fool. Prior to the dragon, the Toland banners displayed a ghost. The Dornishmen quickly recaptured Ghost Hill after Aegon left the castle. The Tolands have embraced the jester as their sigil ever since, a reminder that wit can slay dragons where steel cannot.\n#weak In war and in jest, pride can be taken away. Tolands tend to be [GetTrait('deceitful').GetName( GetNullCharacter )]."

TOLAND_GHOST_RAIDS_NO_BULLETTAB:0 "Situated along Dorne’s southern coast, Ghost Hill overlooks dry hills and coastal cliffs ripe for ambush and retreat. For centuries, the Tolands harassed foreign ships and marchers alike, using small fast-moving bands of skirmishers and reavers who could strike from dune, bluff, or surf and disappear into the horizon before retribution could follow.\n#weak The sands remember who dared strike first—and vanish with the tide. Enables recruitment of [GetMaA('toland_laughing_spears').GetName] as [men_at_arms|E].#!."

TOLAND_PHANTOMS_OF_THE_DUNES_NO_BULLETTAB:0 "Ghost Hill is so named for the way it glows pale under moonlight, but whispers claim the hill walks at night. House Toland has cultivated this mystique—not just as warriors, but as shadowy manipulators. Whether through illusion, misdirection, or sheer reputation, they’ve made their stronghold a place of unseen danger. And where the truth ends, rumor begins—and they know how to plant both. \n#weak They say Ghost Hill walks at night, and that its lords walk where they please."

TOLAND_DAUGHTERS_OF_THE_SPEAR_NO_BULLETTAB:0 "In Dornish custom, women fight, rule, and inherit as freely as men. But House Toland, with its fiery pride and bitter independence, has raised generations of daughters who were not only heirs, but warriors, captains, and champions. The tale of the jester is said to have been the idea of a Toland lady, and their women have since trained both with spear and wit.\n#weak We raise no meek girls. The women of Ghost Hill are taught to wound. Tolands tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

TOLAND_THE_LAUGHING_LINE_NO_BULLETTAB:0 "Others bowed to the Dragon. The Tolands laughed at it. Their bloodline remembers that they were not conquered by might, but amused by it—and outlived it. Their legacy is one of defiant resilience, where pride and laughter became armor. They remain a noble house with a trickster's soul, sharp-tongued, politically slippery, and deeply rooted in the idea that nothing terrifies a tyrant more than mockery.\n#weak Others built crowns of steel. We carved ours from jest—and never bent the knee."

toland_laughing_spears:0 "Laughing Spears"
toland_laughing_spears_flavor:0 "Bearing the jester’s defiance and the Salt Dornish gift for sudden violence, the Laughing Spears strike where coast meets chaos. Trained along the shores of Ghost Hill, they leave only bruised pride and bloodied sand in their wake. Ghost Hill’s spears are no mere soldiers—they are specters of the surf, butchers of border forts, and jesters whose laughter follows burning sails into the sea."

building_type_agot_toland_ghosthill_01:0 "Ghost Hill"
building_agot_toland_ghosthill_01:0 "Ghost Hill"
building_agot_toland_ghosthill_01_desc:0 "Ghost Hill is a place of legend — a bluff of pale stone rising over the Sea of Dorne, where House Toland once turned away a dragon not with spears, but with trickery. Behind its windswept ramparts lies a fortress famed for illusion, guile, and the shadow of defiance. Those who march on Ghost Hill rarely find what they expect."

#TEMPLETON

templeton_legacy_track_name: "Templeton"
templeton_legacy_track_desc: "The Ninth Star Does Not Fall"
templeton_legacy_1_name: "Knight of Nine Stars"
templeton_legacy_2_name: "Falcons and Fire"
templeton_legacy_3_name: "Stars at the Sevenfold War"
templeton_legacy_4_name: "Court and Crown"
templeton_legacy_5_name: "The Ninth Star Rises"

TEMPLETON_KNIGHT_OF_NINE_STARS_NO_BULLETTAB:0 "House Templeton has long held a paradoxical place in the Vale. Though sworn as landed knights, they are no minor retainers—the Knight of Ninestars commands more men than many barons and wields greater influence than petty lords. The nine stars on their banner speak to ancient honors earned in blood and oath. They fought for the Arryns not just as vassals, but as peers—brothers in arms. While others saw knightly duty as service, the Templetons used it to forge prestige, command armies, and wield real power, always walking the line between obedience and silent lordship.\n#weak They call us knights, but we stand among lords. Templetons tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

TEMPLETON_FALCONS_AND_FIRE_NO_BULLETTAB:0 "Templeton loyalty has never been blind—it is earned through strength and vision. When Lady Jeyne Arryn died, and a succession war split the Vale, the Templetons backed Ser Arnold Arryn, the Mad Heir, not the designated heir Ser Joffrey. It was not a mistake. It was a statement: strength matters more than politeness. At the Battle of the Redgrass Field, a Templeton fell in single combat against Daemon Blackfyre himself, dying in the service of Lord Donnel Arryn, the loyalist commander. Whether for Arryn or Targaryen, the stars of Templeton shine brightest when aligned with bold blood, even when it burns too hot.\n#weak We chose Arryn blood and fire over faltering names. Templetons are very [GetTrait('loyal').GetName( GetNullCharacter )]."

TEMPLETON_STARS_SEVENFOLD_WAR_NO_BULLETTAB:0 "The Templetons rose to lasting prominence during the Andal conquest of the Vale. Ser Luceon Templeton, the first known Knight of Ninestars, fought beneath the banner of Ser Artys Arryn at the Battle of the Seven Stars, where the Andals broke the last great resistance of the First Men. It is whispered that it was Luceon's spear that felled King Robar II Royce upon the slopes of the Giant’s Lance. That moment bound the Templeton name to the Arryn falcon in both glory and blood, and their star was etched into the story of the Vale's rebirth. Every blade raised by Ninestars since has done so in the shadow of giants slain.\n#weak At the Seven Stars, we carved our name into stone. Enables recruitment of [GetMaA('templeton_wardens_of_ninestars').GetName] as [men_at_arms|E].#!."

TEMPLETON_COURT_AND_CROWN_NO_BULLETTAB:0 "Though warriors by reputation, the Templetons are no strangers to courts and royal circles. Lady Jennis Templeton was companion to Queen Alysanne Targaryen, and her marriage into House Mullendore was arranged by the queen herself—proof of the family's soft power. Another Templeton, Gerold, served as squire at court and courted royal favor, even if it soured. Their daughters became confidantes, their sons walked the halls of Dragonstone and the Red Keep. While others looked only to battlefields, the Templetons made themselves known in whispers, alliances, and dances, climbing staircases as often as walls.\n#weak Our blades found kings, but our daughters found queens."

TEMPLETON_THE_NINTH_STAR_RISES_NO_BULLETTAB:0 "Though never granted lordship by name, the Templetons have outlived many who held crowns or coronets. Their banner has waved over battlefields, courts, and castles for centuries, each generation adding to the weight of their reputation. Their numbers, wealth, and martial discipline are the envy of houses far their senior. Some whisper that it is only a quirk of history—or politics—that keeps them knighted rather than ennobled. But the Templetons endure regardless, and each generation raises sons and daughters who ride like lords, speak like nobles, and fight like kings. The ninth star may yet outshine them all.\n#weak Lords rise. Kings fall. Our stars endure. Templetons are often seen as [GetTrait('diligent').GetName( GetNullCharacter )]."

templeton_wardens_of_ninestars:0 "Wardens of Ninestars"
templeton_wardens_of_ninestars_flavor:0 "Clad in blackened steel and gold inlays, the Wardens of Ninestars are the chosen heavy guard of House Templeton. Raised from the Vale’s ridges and trained in shield discipline, they are renowned for their ability to hold lines and honor alike. It is said they break only when their stars go dark."

building_type_agot_templeton_ninestars_01:0 "Ninestars"
building_agot_templeton_ninestars_01:0 "Hall of the Ninestars"
building_agot_templeton_ninestars_01_desc:0 "The seat of House Templeton rises from Vale stone, its walls engraved with nine stars — the sigil worn by the knight who slew King Robar Royce in the age of the Andal conquest. Though once a landed knight, his blood carved a house from battle. The men of Ninestars remember their forebear not with songs, but steel."

#SHETT

shett_legacy_track_name: "Shett"
shett_legacy_track_desc: "True Men Remember"
shett_legacy_1_name: "Kings of Gulltown"
shett_legacy_2_name: "The Grafton Bargain"
shett_legacy_3_name: "Oathbreaker’s Crown"
shett_legacy_4_name: "Seven Witness the Fall"
shett_legacy_5_name: "Sons of a Vanished King"

SHETT_KINGS_OF_GULLTOWN_NO_BULLETTAB:0 "Long before the Arryns ruled from the Eyrie and the Andals crossed the sea, the kings of House Shett wore their own crown—cut from stone, raised over salt, and sworn to no lord but the land beneath them. Osgood Shett, Third of His Name, called himself King of the True Men, and from Gulltown’s cliffs he defied the Bronze Kings of Runestone. Though time and tide would sweep that crown away, the memory clings to the rock, and the blood remembers.\n#weak Long before the falcon flew, the kings of Gulltown ruled salt and cliff. Enables recruitment of [GetMaA('shett_spears_of_the_true_men').GetName] as [men_at_arms|E].#!."

SHETT_THE_GRAFTON_BARGAIN_NO_BULLETTAB:0 "When the walls of Gulltown closed tight, and the Royce advance broke the Shett line, King Osgood looked not to gold or blades—but to blood. In a desperate bid for survival, he offered his daughter to an Andal knight, took the knight’s daughter to his own bed, and wed their heirs like rope in storm. Sealed by septon’s prayer and promise of septs to come, the bargain won the battle—but not the war. The tide that saved the Shetts would one day drown them.\n#weak The pact won him a battle—and cost him a kingdom. Though a double-edged sword sometimes, Shetts can be [GetTrait('ambitious').GetName( GetNullCharacter )]."

SHETT_OATHBREAKERS_CROWN_NO_BULLETTAB:0 "King Osgood won his battle—but never wore the fruits of it. Some say he was cut down by a Royce blade. Others whisper that his own son-in-law, Ser Gerold Grafton, ended him beneath a fallen banner. What cannot be denied is what came next: his rightful heir, imprisoned; his line, supplanted; his name, smeared with blood and silence. The Andals were invited in—but they brought knives to the feast. And the Shetts never forgot.\n#weak A king died in victory, and a guest took his crown. Shetts have not forgotten and tend to be [GetTrait('vengeful').GetName( GetNullCharacter )]."

SHETT_SEVEN_WITNESS_THE_FALL_NO_BULLETTAB:0 "Osgood Shett swore to build a great sept in Gulltown if the Seven would grant him victory. They did—and he died before stone was laid. The sept rose in time, but over the bones of the last Shett king and under the eyes of men who betrayed him. The family that once defied the gods bowed before them, and in so doing, lost everything. Yet still they kneel, not for forgiveness—but for clarity. In prayer, they seek meaning. In faith, vengeance.\n#weak He died before it rose—and the faithful buried him in silence."

SHETT_SONS_OF_A_VANISHED_KING_NO_BULLETTAB:0 "Osgood’s heir was locked away, bred like a mare, then erased. His name lost. His bloodline ghosted. Yet House Shett did not die. Though they wear no crown, and their line lies tangled in Andal claims, the children of salt and stone endure. Beneath every Shett helm lies the quiet fury of a broken legacy. They were kings. They were betrayed. And they will rise again—not for dominion, but for reckoning.\n#weak They wear no crown, but their vengeance is carved in bone."

shett_spears_of_the_true_men:0 "Spears of the True Men"
shett_spears_of_the_true_men_flavor:0 "Named for the title once claimed by King Osgood Shett, the Spears of the True Men march in solemn formation—unyielding defenders of blood, stone, and oath. Trained for narrow passes and high walls, they stand as the memory of a crown lost, and the will that endures."

building_type_agot_shett_gulltower_01:0 "Gulltower"
building_agot_shett_gulltower_01:0 "Gulltower"
building_agot_shett_gulltower_01_desc:0 "Perched on the cliffs above Gulltown’s harbor, the Gulltower watches the tides with steel and scorn. Long have the Shetts served the Vale, but their blades remember old crowns and older grudges. Here, gulls call and banners rise — a stone perch for knights, traders, and ambition alike."


#ROGERS

rogers_legacy_track_name: "Rogers"
rogers_legacy_track_desc: "Harder to Find"
rogers_legacy_1_name: "Lords of Amberly"
rogers_legacy_2_name: "Born to Break the Tide"
rogers_legacy_3_name: "Sworn to Storm and Stag"
rogers_legacy_4_name: "Salt-Steeped Honor"
rogers_legacy_5_name: "The Watch on Shipbreaker Bay"

ROGERS_LORDS_OF_AMBERLY_NO_BULLETTAB:0 "Built near the sea-scarred cliffs of Shipbreaker Bay and the Rainwood, Amberly has long been a stronghold of salt, wind, and stone. The castle might be named after the large deposits of amber found nearby and in the ancient forest of Rainwood of the stormlands. Along with amber, House Rogers is wealthy due to the abundance of fur and wood from the Rainwood. The Rogers have ruled Amberly since the early days of the Storm Kings from House Durrandon, anchoring the coast against raiders, storms and siege. Where others drowned, they stood. Where others faltered, they held. Though they claim no ancient crowns, their rule is one of immovable strength—of stone that will not crack beneath the tide.\n#weak Stone above the surf, unshaken beneath the Storm. Members of House Rogers tend to be [GetTrait('temperate').GetName( GetNullCharacter )]."

ROGERS_BORN_TO_BREAK_THE_TIDE_NO_BULLETTAB:0 "Though Amberly is hidden within the Rainwood, the sons of Amberly are forged in wind and water, hardened by the roar of Shipbreaker Bay and the bite of salt in the air. They do not ride with flourish nor charge with recklessness—they hold. They wait. And when the moment comes, their ranks close, and their spears meet the wave. Whether the tide is pirate, rebel, or knight, it crashes against a line of pikes and shield-walls too steady to fall.\n#weak The sea claws at our gates. We claw back. Enables recruitment of [GetMaA('rogers_amberly_seawatch').GetName] as [men_at_arms|E].#!."

ROGERS_SWORN_TO_STORM_AND_STAG_NO_BULLETTAB:0 "Some lords follow power. The Rogers follow blood. Through conquest and rebellion, from the last King of House Durrandon to Orys Baratheon’s rise, Amberly has stood beside Storm’s End. They are not loud in council or glorious in charge, but when the stag calls, their swords are already raised. In victory, they ask for nothing. In defeat, they do not blame. Their loyalty is not given—it is built, layered like the stone of their keep.\n#weak When the Stag calls, Amberly answers. Members of House Rogers are often seen as [GetTrait('loyal').GetName( GetNullCharacter )]."

ROGERS_SALT_STEEPED_HONOR_NO_BULLETTAB:0 "House Rogers has never craved greatness. Their name is not sung in feasts, but their name is whispered in war rooms. They do not hunger for crowns or crave the court. What they honor is order, strength, and the dignity of duty. Like the stone stairways of their keep, their legacy rises slowly, worn smooth by generations of quiet resolve. They do not boast. They do not kneel. They simply remain.\n#weak We do not chase greatness. We forge it."

ROGERS_THE_WATCH_ON_SHIPBREAKER_BAY_NO_BULLETTAB:0 "The storms roll in. The sea pounds the cliffs. Rain batters the forrest. But Amberly stands. It has always stood. And from its ramparts, the Rogers keep watch. They’ve faced dragons and drowned men, stormlords and usurpers—and still they endure. They are not conquerors, but they will not be conquered. As long as waves crash and winds howl, a Rogers will keep the watch. The sea may break ships, but it will not break them.\n#weak The sea remembers those who do not fall."

rogers_amberly_seawatch:0 "Amberly Seawatch"
rogers_amberly_seawatch_flavor:0 "Drawn from the tide-hardened men of Amberly’s coast, the Amberly Seawatch are drilled in wall-bound pike formations and trained to hold fast on cliff and causeway. They are not swift, but they do not move—only the foolish try to break a Seawatch line while the sea crashes behind it."

building_type_agot_rogers_amberly_01:0 "Amberly Watch"
building_agot_rogers_amberly_01:0 "Amberly Watch"
building_agot_rogers_amberly_01_desc:0 "Within the veil of the Rainwood and near the battered cliffs of the sea, the Watch of Amberly rises above the rain-soaked groves. Here, House Rogers keeps vigil over coastal trade and forest paths alike — merchants beneath, bows above. The amber fields enrich them; the marches define them."


#CODD

codd_legacy_track_name: "Codd"
codd_legacy_track_desc: "Though All Men Do Despise Us."
codd_legacy_1_name: "Filth of the Sea"
codd_legacy_2_name: "No Honor, Only Spoils"
codd_legacy_3_name: "Salt-Spat Bastards"
codd_legacy_4_name: "Tide-Crawlers"
codd_legacy_5_name: "Though All Men Despise Us"

CODD_FILTH_OF_THE_SEA_NO_BULLETTAB:0 "Where the noble drown with pride, the Codds float like scum on the tide. They do not ride the wave in glory, but cling to the slime beneath it, surfacing only to steal, kill, and vanish again. Though the highborn call them cowards and the ironborn call them vermin, none forget the smell of salt and blood when the Codds come ashore. They raid without song, without honor—and they always return.\n#weak Even the clean drown. Filth floats. Codds tend to be [GetTrait('callous').GetName( GetNullCharacter )]."

CODD_NO_HONOR_ONLY_SPOILS_NO_BULLETTAB:0 "In the longhouses of Old Wyk, reavers speak of the Codds with curled lips. Not for their blades, but for their betrayal. While the captains speak of the Old Way, the Codds take the quickest way—whether through a coin-purse, a lie, or a knife in the dark. They do not fight to earn glory. They fight because gold is heavy, and the dead do not carry it far. Among the Codds, loyalty is a tale you tell before you slit a throat.\n#weak Honor is for corpses. We keep what we steal. Codds tend to be [GetTrait('greedy').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('codd_gutcutters').GetName] as [men_at_arms|E].#!."

CODD_SALT_SPAT_BASTARDS_NO_BULLETTAB:0 "The Codds were never clean. Their bloodline flows with whispers—of bastards, of bedsharing kin, of shame without end. But where others hush their scandals, the Codds forge them into blades. Bastards rise freely among them, not in spite of their birth, but because the house itself was born wrong. They wear mockery like armor, and when others hide their unworthy sons, the Codds crown them. In filth, they flourish.\n#weak Our name is cursed. Our blood is not."

CODD_TIDE_CRAWLERS_NO_BULLETTAB:0 "The Codds do not stand against the wave—they slither beneath it. They do not die with banners raised. They wait. They listen. They strike after the battle ends, picking through corpses and claims. They are the crabs beneath the keel, the blood on the deck after the victor’s feast. Their strength is not in force, but in survival—slinking from siege to sack to scandal, taking only what others failed to guard.\n#weak The wave breaks. We crawl beneath it."

CODD_THOUGH_ALL_MEN_DESPISE_US_NO_BULLETTAB:0 "It is not a boast. It is a truth. All men despise the Codds—and still, the Codds live. Others perish in pursuit of honor, or die beneath the weight of shame. The Codds do neither. Their name is spat before it is feared, but fear comes all the same. No matter how often they are exiled or humiliated, they return. Filthy. Bloodied. Laughing. For the Codd legacy is not glory—it is survival by spite.\n#weak They laugh. Then they choke."

codd_gutcutters:0 "Gutcutters"
codd_gutcutters_flavor:0 "Feared even among reavers, the Gutcutters of House Codd fight dirty and finish fast. Trained in ambush, slaughter, and looting before the banners rise, they strike without warning or honor—cutting throats, chasing down the wounded, and leaving corpses gutted and goldless."


#WYLDE

wylde_legacy_track_name: "Wylde"
wylde_legacy_track_desc: "Rain Falls on All"
wylde_legacy_1_name: "Rainwood Lords"
wylde_legacy_2_name: "A Caution for Young Girls"
wylde_legacy_3_name: "Rainwood Traders"
wylde_legacy_4_name: "Sworn and Shadowed"
wylde_legacy_5_name: "Mist and Memory"

WYLDE_RAINWOOD_LORDS_NO_BULLETTAB:0 "Long before the coming of the dragons, House Wylde held dominion over the eastern Rainwood — a mist-choked wilderness older than steel or song. Their fortress, Rain House, rose not from cleared stone but grew with the woods, its towers draped in moss and ivy. The Wyldes were forest wardens, known to walk barefoot through the wet glades and return with amber, venison, or a rival’s head. Even Storm Kings once tread lightly in the Wyldes' domain. Rain House stands among the moss-thick roots of the stormlands, woven into the tangled wilds of the rainwood. The Wyldes know its beasts and herbs, its hidden trails and echoing caves.\n#weak They are forestborn — quiet, cunning, and hard to uproot. Enables recruitment of [GetMaA('wylde_rainwood_wardens').GetName] as [men_at_arms|E].#!."

WYLDE_CAUTION_FOR_YOUNG_GIRLS_NO_BULLETTAB:0 "Lady Coryanne Wylde served Queen Alysanne with grace and wit, but her disappearance from court was soon followed by the quiet circulation of a strange manuscript — A Caution for Young Girls. Whether real or embellished, it traced the handmaiden's journeys through desire, defiance, and damnation. Copies passed hand-to-hand in candlelit chambers, and Rain House gained a new shadow. Though the Wyldes denounce the tale, some say they’ve never lacked for charm or secrets since. Her tale walks the line between warning and inspiration, forever tying Wylde blood to fire and flesh.\n#weak Desire, too, is legacy. Wyldes can be [GetTrait('lustful').GetName( GetNullCharacter )]."

WYLDE_RAINWOOD_TRADERS_NO_BULLETTAB:0 "The rainwood feeds those who know its moods. House Wylde grew rich not from conquest, but from the furs of shadowcats, the glisten of raw amber, and the trade of herbs that eased pain or ended lives. Merchant galleys often called at Rain House, where wares were sold from damp halls shrouded in mist. It is said the Wyldes never taxed gold — only silence.\n#weak Gold flows from greenwood hands."

WYLDE_SWORN_AND_SHADOWED_NO_BULLETTAB:0 "Many Wyldes have served as royal retainers — never loud, but always watching. Some were sent to court as companions or cupbearers, others as readers or musicians. Courtiers joked that Wyldes could “vanish between pillars,” but kings and queens alike came to trust them for their discretion. Still, few forgot they hailed from the forest, not the halls of ornate courts — and all forest shadows carry a blade. Close to queens, favored by counselors — but never quite trusted.\n#weak Storms pass; whispers remain."

WYLDE_MIST_AND_MEMORY_NO_BULLETTAB:0 "Legends speak of limestone caves beneath the rainwood, where pale fish swim in still black waters and moss hangs like veils. The Wyldes have always known these places — their blood runs with the rain, their dreams echo in root and stone. Some say they descend from those who first hid in the woods when the First Men came. Some say they never stopped hiding. But the rainwood does not forget its own, and nor do the Wyldes.\n#weak The forest forgets no blood. Wyldes tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

wylde_rainwood_wardens:0 "Rainwood Wardens"
wylde_rainwood_wardens_flavor:0 "The Rainwood Wardens are drawn from the mist-cloaked glades and watchful hills around Rain House. Trained in stillness, patience, and ambush, they strike unseen — guardians of paths no map dares mark."

building_type_agot_wylde_rain_house_01:0 "Rain House"
building_agot_wylde_rain_house_01:0 "Chambers of Mist"
building_agot_wylde_rain_house_01_desc:0 "Low towers veiled in ivy, steaming baths beneath carved stone, and winding galleries that vanish into the fog — Rain House is as much myth as it is stronghold."

building_agot_wylde_rain_house_02:0 "Amber Vaults"
building_agot_wylde_rain_house_02_desc:0 "The wealth of Rain House flows not in coin, but in amber, herbs, and secrets. Beneath its moss-choked walls lie hidden vaults where profit and peril both take root."

building_agot_wylde_rain_house_03:0 "Seat of the Spiral Veil"
building_agot_wylde_rain_house_03_desc:0 "The Rain House is a fortress of memory, mist, and masks. Its lord rules not with iron or fire, but with whispers, veils, and vines — a throne wreathed in rain and rumor."

#PIPER

piper_legacy_track_name: "Piper"
piper_legacy_track_desc: "Brave and Beautiful"
piper_legacy_1_name: "Daughters of Pinkmaiden"
piper_legacy_2_name: "Border-Watch Boldness"
piper_legacy_3_name: "Hall of Song and Steel"
piper_legacy_4_name: "Red Fork Defiance"
piper_legacy_5_name: "Charm That Commands"


PIPER_DAUGHTERS_OF_PINKMAIDEN_NO_BULLETTAB:0 "Our maidens are celebrated across the Trident for their striking Valyrian-adjacent grace, sharp wit, and commanding presence in the high halls. We do not hide behind conservative northern veils; we use our courtly elegance to secure powerful dynastic marriages, weaving an intricate web of alliances that anchors our influence from Riverrun to the Vale.\n#weak A Piper smile can disarm a rival long before the vanguard even lowers its lances. Members of the Piper dynasty are frequently born [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

PIPER_BORDER_WATCH_BOLDNESS_NO_BULLETTAB:0 "Planted directly on the western frontier where the Riverlands meet the crags of the Westerlands, our keeps are the first to burn whenever the mountain lords march. Our knights learn the brutal reality of border warfare from boyhood, constantly patrolling the Red Fork to crush Lannister incursions with immediate, hot-blooded steel.\n#weak We are the iron gates of the west, and our boundaries are paid in blood. Enables recruitment of [GetMaA('piper_maidenguard').GetName] as [men_at_arms|E]."

PIPER_HALL_OF_SONG_AND_STEEL_NO_BULLETTAB:0 "Within the pink stone battlements of Pinkmaiden Castle, we blend the lavish pageantry of southern tourneys with the relentless drill of a front-line garrison. We host wandering bards and traveling knights to display our immense wealth, masking our paranoid military readiness behind a veneer of absolute courtly hospitality.\n#weak We feast in the daylight, but our scouts keep their hands on their swords."

PIPER_REDFORK_DEFIANCE_NO_BULLETTAB:0 "When the western lions launch their reivinghosts, the Piper lands are immediately baptized in fire and blood. We do not cower inside our walls or beg for royal arbitration; our hot-headed guerrilla vanguards launch relentless midnight ambushes against their supply lines, defending the forks with an absolute, unyielding defiance.\n#weak The Red Fork runs red with our blood, but our banners never fall to treason."

PIPER_CHARM_THAT_COMMANDS_NO_BULLETTAB:0 "We navigate the volatile politics of the Trident with a roguish, dangerous confidence and an unmatched silver-tongued diplomacy. Our lords are masterfully calculated orators, using charm to disarm suspicious neighbors and using courtly wit to turn a tense diplomatic duel entirely to our family's trajectory.\n#weak We rule through silver speech and absolute confidence, dominating the councils. Members of the Piper dynasty are frequently born [GetTrait('gregarious').GetName( GetNullCharacter )]."


piper_maidenguard:0 "Pinkmaiden Maidenguard"
piper_maidenguard_flavor:0 "Drawn from the most battle-hardened lesser landholders of the western marches, these elite heavy infantrymen are the iron shield of Pinkmaiden Castle. Wearing polished steel plate armor decorated with pink silk sashes and bearing heavy halberds, they are drilled to defend narrow riverbends and ford checkpoints with an absolute, unrelenting discipline. They have a total contempt for Lannister raiders, specializing in high-attrition bottleneck warfare and the brutal execution of border-trespassers."


building_type_agot_piper_pinkmaiden:0 "Piper Pinkmaiden Holding"
building_agot_piper_pinkmaiden_01:0 "Pinkmaiden Keep"
building_agot_piper_pinkmaiden_01_desc:0 "Rising sharply at the vital confluence of the western hills and the Red Fork, Pinkmaiden Castle stands as a magnificent, heavily fortified gatehouse against the Westerlands. Ringed by deep defensive earthworks and stone curtain walls, its graceful feasting halls echo with music and laughter—while behind the flowered courtyards, subterranean armories and hidden watchposts train a lethal vanguard designed to outlast the realm's wars."


#BUTTERWELL

butterwell_legacy_track_name: "Butterwell"
butterwell_legacy_track_desc: "Cream and Coin"
butterwell_legacy_1_name: "Cattle Lords"
butterwell_legacy_2_name: "Coin Over Crown"
butterwell_legacy_3_name: "The Fertile Match"
butterwell_legacy_4_name: "Polished and Proud"
butterwell_legacy_5_name: "Gilded Ascendance"


BUTTERWELL_CATTLE_LORDS_NO_BULLETTAB:0 "Our initial wealth was squeezed directly from the udders of our massive dairy herds, filling our private chests with gold born of butter and livestock trade. Though ancient, bankrupt houses mock us as upjumped cattle thieves, we answer their slights by buying up their mortgages and expanding our borders.\n#weak Silver spends the same, whether won by a blood-soaked sword or an audited milkpail. Enables recruitment of [GetMaA('butterwell_gilt_lancers').GetName] as [men_at_arms|E]."

BUTTERWELL_COIN_OVER_CROWN_NO_BULLETTAB:0 "Lord Alton Butterwell did not climb the ladder of power by risking his neck on a battlefield; he rose by managing the royal treasuries as Master of Coin under Aegon the Unworthy. He understood that a well-placed loan and an open purse could manipulate the laws of the realm far faster than a thousand lances.\n#weak We do not waste men in the vanguard when we can simply buy our survival. Members of the Butterwell dynasty are frequently born [GetTrait('shrewd').GetName( GetNullCharacter )]."

BUTTERWELL_THE_FERTILE_MATCH_NO_BULLETTAB:0 "We do not trade our daughters for hollow southern songs or fragile notions of romance. When the dragon king demanded heirs, we bypassed the beautiful high-born maidens of the court to pitch a stout, proven Butterwell womb that had already birthed seven healthy children—proving that practical fertility wins dynasties.\n#weak A calculated marriage alliance is an absolute economic investment, not a matter of love."

BUTTERWELL_POLISHED_AND_PROUD_NO_BULLETTAB:0 "We have poured our immense agrarian fortunes into building a spectacular stage of architectural splendor along the Gods Eye. Our ancestral keeps are scrubbed pristine, our courts are laced with lavish hospitality, and our halls flow with rare vintages to completely outshine the drab castles of our rivals.\n#weak We conquer our neighbors through absolute, gilded magnificence, ensuring they envy our seat."

BUTTERWELL_GILDED_ASCENDANCE_NO_BULLETTAB:0 "Our house secured its seat among the high nobility of the Trident through wealth, calculation, and a sharp-eyed political opportunism. We know exactly when to flatter a weak king, when to foreclose on a debtor lord, and when to advance our family's trajectory with silver in our hands.\n#weak Gold opens the gatehouse doors, and a calculating wit keeps the garrison paid. Members of the Butterwell dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."


butterwell_gilt_lancers:0 "Whitewalls Gilt-Lancers"
butterwell_gilt_lancers_flavor:0 "Drawn from the wealthiest landowners and elite tenant-captains of the Whitewalls domain, these heavy shock cavalrymen are the pristine vanguard of the Milkhouse. Clad in highly polished, gold-veined plate armor and riding massive, meticulously groomed destriers, they are drilled to protect the vital toll-roads and river-crossings of the lake. They operate with an ironclad mercenary discipline, paid in heavy silver to systematically flatten enemy lines with their lances."


building_type_agot_butterwell_whitewalls_castle:0 "Whitewalls Castle Reconstruction"
building_agot_butterwell_whitewalls_castle_01:0 "Foundations of the Milkhouse"
building_agot_butterwell_whitewalls_castle_01_desc:0 "The first monumental blocks of pale stone are laid upon the salted, ruined ground where Whitewalls once stood. Early walls and modest keeps mark a renewed, unyielding dynastic claim along the Gods Eye."
building_agot_butterwell_whitewalls_castle_02:0 "The Pale Stone Keep"
building_agot_butterwell_whitewalls_castle_02_desc:0 "The castle's curtain walls gleam once more, constructed from fine white stone quarried in the Vale and framed with heavy timber beams. Rebuilt barracks, posterns, and a sevenfold sept mark a proud return."
building_agot_butterwell_whitewalls_castle_03:0 "Whitewalls Restored"
building_agot_butterwell_whitewalls_castle_03_desc:0 "The restored Milkhouse echoes with the sounds of lavish feasting and tournament drills. Stables, secure vaults, and gilded altars line the inner bailey—a noble seat completely restored to regional dominance."


building_type_agot_butterwell_whitewalls_grand_castle:0 "Great Whitewalls Palace"
building_agot_butterwell_whitewalls_grand_castle_01:0 "Whitewalls Reimagined"
building_agot_butterwell_whitewalls_grand_castle_01_desc:0 "Constructed from massive blocks of white marble veined with gold, the new palace rises cleanly into the sky. Its grand rafters are carved from bone-pale weirwood timber, shaping a seat of absolute arrogance."
building_agot_butterwell_whitewalls_grand_castle_02:0 "The Gilded Milkhouse Palace"
building_agot_butterwell_whitewalls_grand_castle_02_desc:0 "Flowered courtyards bloom along the lake, deep cellars brim with expensive Arbor gold wine, and the towering white spires catch the morning light. The palace stands as a beacon of staggering prestige on the Trident."
building_agot_butterwell_whitewalls_grand_castle_03:0 "The Vaulted Pavilion of the Gods Eye"
building_agot_butterwell_whitewalls_grand_castle_03_desc:0 "Tournament fields, grand wine-tasting halls, and high chambers lined in Myrish velvet fill the upper bailey. This is no mere defensive holdfast—it is an architectural monument to unrivaled family luxury."
building_agot_butterwell_whitewalls_grand_castle_04:0 "Great Whitewalls"
building_agot_butterwell_whitewalls_grand_castle_04_desc:0 "A marvel of marble, silver, and immense ambition, Great Whitewalls stands as the most magnificent palace complex along the Trident, completely outshining the dark history of Bloodraven's wrath."


building_type_agot_harrenton:0 "Harrenton Urban Development"
building_agot_harrenton_01:0 "The Harrenhal Sprawl"
building_agot_harrenton_01_desc:0 "Established outside the colossal walls of Harrenhal to house thousands of stonemasons, laborers, and merchants, Harrenton endures as a vital hub. Its cobbled streets remain, waiting for fresh trade to return."
building_agot_harrenton_02:0 "The Rebuilt Crossroads Market"
building_agot_harrenton_02_desc:0 "The market squares are widened, the old guesthouses are repaired, and fresh trade caravans stop at your crossroads. The shadow of the melted towers no longer hides the town—it shelters its commercial growth."
building_agot_harrenton_03:0 "The Guild Tribunal of Harrenton"
building_agot_harrenton_03_desc:0 "The town welcomes noble retinues and wealthy envoys from across the Trident. Rebuilt legal courts, expanded messenger stations, and permanent guildhalls turn the settlement into a powerful center of regional administration."
building_agot_harrenton_04:0 "The Fourth City Reborn"
building_agot_harrenton_04_desc:0 "Harrenton rises to its true potential—a bustling, high-development city of proud merchant guilds and crowded merchant squares. It recalls the historic era when it rivaled the grandest urban centers of the realm."


#VYPREN

vypren_legacy_track_name: "Vypren"
vypren_legacy_track_desc: "Saving Our Own"
vypren_legacy_1_name: "Widow’s Stand"
vypren_legacy_2_name: "The Line Beyond Steel"
vypren_legacy_3_name: "Oaths on the Current"
vypren_legacy_4_name: "Keepers of the Crossing"
vypren_legacy_5_name: "Taking the Leap"


VYPREN_WIDOWS_STAND_NO_BULLETTAB:0 "Our house was born when the Andal warlord Vorian Vypren forced his heavy horsemen across the marshlands, matching swords against the three legendary sons of Lord Darry at the Widow's Ford. Though they held our vanguard at bay for a day and a night, we butchered them in the shallows—anchoring our dynastic right to rule these fens in blood.\n#weak The steel at the crossing won us our seat, and we have never looked back. Enables recruitment of [GetMaA('vypren_widows_sons').GetName] as [men_at_arms|E]."

VYPREN_THE_LINE_BEYOND_STEEL_NO_BULLETTAB:0 "We do not waste our coin on extravagant southern tourney grounds or grand marble septs; we build thick timber holdfasts and ditch-defenses to secure the swamp thoroughfares. Our stewards meticulously audit every land-grant and boundary charter, outlasting more arrogant houses through absolute administrative discipline.\n#weak Survival in the wetlands demands a sharp quill and an even sharper mind. Members of the Vypren dynasty are born exceptionally [GetTrait('diligent').GetName( GetNullCharacter )]."

VYPREN_OATHS_ON_THE_CURRENT_NO_BULLETTAB:0 "House Vypren has survived centuries of dynastic civil wars by mastering the cold mathematics of strategic submission. We bent our knees to the ironborn king Harwyn Hardhand when he smashed the old storm-kings, and we signed marriage contracts with the Twins to ensure our vaults remained fat while our neighbors burned.\n#weak Feudal vows shift like the marsh-tides; we always navigate our loyalty toward the winning host."

VYPREN_KEEPERS_OF_THE_CROSSING_NO_BULLETTAB:0 "We command the vital, mud-spattered checkpoints where the southern roads intersect the swamps of the Trident. We do not field flashy cavalry vanguards; we deploy heavy, iron-tipped pike-walls along the causeways to freeze the movement of foreign hosts and extract a heavy customs toll from every passing merchant cart.\n#weak To control the ford is to control the very throat of regional war, and we claim our due."

VYPREN_TAKING_THE_LEAP_NO_BULLETTAB:0 "We were once foreign invaders, then border stewards, and now our calculating schemers watch the shifting politics of Riverrun with a dangerous, sharp-eyed opportunism. We use backroom contracts, paid-off marsh-informants, and precisely timed betrayals to elevate our family's trajectory above our old borders.\n#weak We do not content ourselves with guarding a ditch; we strike to conquer. Members of the Vypren dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."


vypren_widows_sons:0 "Widow's Sons"
vypren_widows_sons_flavor:0 "Drawn from the veteran swamp-trackers and lesser landholders of the Vypren bogs, these elite light cavalrymen are the specialized vanguard of the crossing. Clad in heavy boiled leather, dark steel caps, and river-green cloaks designed to melt into the high reeds, they excel at high-speed tactical skirmishing, marsh-track ambushes, and hunting down routed outlaws. They have an absolute contempt for mainland green landsmen, utilizing their deep knowledge of the hidden causeways to trap and butcher enemy scouts in the shifting mires."


#FLINT

flint_legacy_track_name: "Flint"
flint_legacy_track_desc: "Unshaken"
flint_legacy_1_name: "First of the Clans"
flint_legacy_2_name: "Watchers Turned Wild"
flint_legacy_3_name: "Echoes of the Nightfort"
flint_legacy_4_name: "A Night's Crown"
flint_legacy_5_name: "Harder Than Stone"


FLINT_FIRST_OF_THE_CLANS_NO_BULLETTAB:0 "Our bloodline commands a royal antiquity that predates the first foundation stone of Winterfell, tracing back to the ancient First Flints who carved their holds into the high northern peaks. Though time has fractured us into separate branches—the mountain clans, the lords of Flint's Finger, and the wardens of Widow's Watch—we remember the dawn age when all Flints answered to one supreme voice.\n#weak The high crags remember their true kings, and our name outlasts the empires. Enables recruitment of [GetMaA('flint_stonebound').GetName] as [men_at_arms|E]."

FLINT_WATCHERS_TURNED_WILD_NO_BULLETTAB:0 "We walk the razor-thin edge between absolute, ironclad oaths and a terrifying, blood-soaked ambition. We remember the wildness of our ancestor, Lord Commander Rodrik Flint, who defied the Seven Kingdoms by crowning himself King-Beyond-the-Wall from the battlements of the Nightfort, proving that no cage of stone can contain our line.\n#weak The Night's Watch remembers the traitors in our ranks, and we strike when our blood demands it. Members of the Flint dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

FLINT_ECHOES_OF_THE_NIGHTFORT_NO_BULLETTAB:0 "We carry the bitter, unyielding memory of brave Danny Flint, the cross-dressed maiden of our house who was brutally murdered by mutinous crows in the dark cells of the Nightfort. We do not forgive the realm's failure to protect her courage, transforming her tragic ballad into a call for merciless northern execution against our foes.\n#weak We bear her sacrifice like a permanent scar, and our steel answers their cruelty. Members of the Flint dynasty are frequently born [GetTrait('brave').GetName( GetNullCharacter )]."

FLINT_A_NIGHTS_CROWN_NO_BULLETTAB:0 "The terrifying legend of the Night's King—the cursed commander who wed a corpse-queen of ice and offered human sacrifices to the dark—clings to our lineage like heavy frost on a barrow-stone. We do not hide from the horrific myths that haunt our name, weaponizing the ancient, forbidden magic of the far north to paralyze our rivals with dread.\n#weak The wind off the Wall whispers of our ancient, dangerous crowns, and our shadow stretches far."

FLINT_HARDER_THAN_STONE_NO_BULLETTAB:0 "We do not waste our coin on southern courtly pageantry; our strength lies entirely in the unyielding rock of the high peaks and the freezing waters of the western bays. Whether smashing wildling reivers from the mountain passes or hanging ironborn raiders from our coastal gallowposts, we are the hardest sons of the winter tundra.\n#weak Stubborn, scattered, and entirely unbending—the bedrock itself mimics our resolve."


flint_stonebound:0 "First Flint Stonebound"
flint_stonebound_flavor:0 "Drawn from the most colossal, battle-hardened mountain clansmen of the high northern ridges, these heavy shock infantrymen are the iron vanguard of the First Flint. Clad in thick shadow-cat pelts, heavy boiled leathers, and crude iron scale mail, they mask their faces behind bone visors and frosted oil-cloth. They advance through arctic blizzards with an absolute, machine-like campaign discipline, swinging massive two-handed flint-headed war-axes to shatter enemy infantry shieldwalls through raw physical mass and an absolute refusal to kneel."


#KARSTARK

karstark_legacy_track_name: "Karstark"
karstark_legacy_track_desc: "The Sun of Winter"
karstark_legacy_1_name: "Blood of Karlon"
karstark_legacy_2_name: "Iron in the Snow"
karstark_legacy_3_name: "Splinter of the Wolf"
karstark_legacy_4_name: "The Mourning Horn"
karstark_legacy_5_name: "Holdfast of the Frozen Sun"

KARSTARK_BLOOD_OF_KARLON_NO_BULLETTAB:0 "Karlon Stark was a younger son of Winterfell, but he carved a name into the North with sword and frost. For putting down rebellion, he earned a hall, a holdfast, and a future. From Karl's Hold came Karhold — and from Karhold came the Karstarks, wolves turned eastward, loyal but apart. Though the name has changed, the blood remains, colder now, but no less true.\n#weak The blood may split, but it does not forget. Karstarks tend to be [GetTrait('strong').GetName( GetNullCharacter )]."

KARSTARK_IRON_IN_THE_SNOW_NO_BULLETTAB:0 "A Karstark in battle wears furs thick as their silence. Their armor is black, their helms low, and their warhorns mournful. No trumpets herald them. No songs follow. They do not fight for glory — they fight because they must. And when the snow deepens and the sun fades, it is the iron in their hands that holds the line.\n#weak Iron does not warm in the cold. Enables recruitment of [GetMaA('karstark_winter_sun_ravagers').GetName] as [men_at_arms|E].#!."

KARSTARK_SPLINTER_OF_THE_WOLF_NO_BULLETTAB:0 "The Karstarks are not pretenders to the Stark name — they are what comes when a wolf chooses a different road. Harsh, proud, and less forgiving than their Winterfell kin, they serve the North in their own way. They may follow the direwolf, but the sunburst flies beside it, cold and defiant. They remember Winterfell, but kneel only to strength.\n#weak The sunburst is cousin to the wolf."

KARSTARK_MOURNING_HORN_NO_BULLETTAB:0 "The sound of a Karstark horn carries not triumph, but sorrow. Low and deep, it speaks of loss, and vengeance yet to be claimed. It is a sound that chills the heart — a dirge, not a summons. Their soldiers ride to avenge brothers, not to earn bard’s praise. They bury the dead with steel, not song.\n#weak The horn does not call. It mourns."

KARSTARK_HOLDFAST_OF_THE_FROZEN_SUN_NO_BULLETTAB:0 "Karhold is a place of ice-bright walls and quiet strength. Through rebellion, exile, and war, the Karstarks have held it with bloodied hands and boundless will. When others falter in the storm, the Karstarks lean into it — colder than their kin, harder than the hills, and too proud to yield. Even the fire burns cold in Karhold.\n#weak In frost and fire, the black sun endures."

karstark_winter_sun_ravagers:0 "Winter Sun Ravagers"
karstark_winter_sun_ravagers_flavor:0 "Clad in the pelts of great northern bears, these heavy horsemen thunder across the field like winter’s own wrath. Their long axes are hewn for crushing shields and splitting helms, swung from the saddle with crushing force. To face them is to feel the North itself descending—cold, savage, and unstoppable"

#GLOVER

glover_legacy_track_name: "Glover"
glover_legacy_track_desc: "Trust Us to Hold"
glover_legacy_1_name: "Kings of Deepwood"
glover_legacy_2_name: "Oaths to Winter"
glover_legacy_3_name: "Forestforged Valor"
glover_legacy_4_name: "Wardens of the Western Shore"
glover_legacy_5_name: "The Motte Endures"


GLOVER_KINGS_DEEPWOOD_NO_BULLETTAB:0 "Our lineage commands a royal antiquity that predates the first stone of Winterfell, tracing back to the ancient days when we ruled as Kings of the Wolfswood. From our sprawling timber fortress at Deepwood Motte, we have outlasted centuries of winter gales, keeping our ancient First Men bloodlines proud, pure, and unbroken.\n#weak The sap of the ancient pines runs thick and violent in our veins. Members of the Glover dynasty are often born [GetTrait('strong').GetName( GetNullCharacter )]."

GLOVER_OATHS_TO_WINTER_NO_BULLETTAB:0 "When the Stark Kings of Winter unified the North, we chose to bind our blood to the Direwolf through an ironclad, multi-generational fealty rather than a futile war. We have spent millennia serving as the most trusted advisors and vanguard commanders of Winterfell, keeping our blood-oaths with a permanent, un-Andal devotion.\n#weak Our word is forged in cold northern iron, and our loyalty outlasts the generations. Members of the Glover dynasty make for exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

GLOVER_FORESTFORGED_VALOR_NO_BULLETTAB:0 "We do not waste our coin on flashy southern pageantry or open-field tilts; we master the brutal reality of forest warfare deep within the sentinel pine groves. Our household warriors are expert trackers and heavy axe-bearers, using low forest-calls to coordinate devastating guerrilla ambushes that leave invading hosts blind and broken.\n#weak The dark canopy chokes out our tracks, making every thicket a grave for our enemies. Enables recruitment of [GetMaA('glover_deepwood_ironshields').GetName] as [men_at_arms|E]."

GLOVER_WARDENS_WESTERN_SHORE_NO_BULLETTAB:0 "Planted directly on the jagged cliffs overlooking the Sunset Sea, our earthen ramparts are the western shield protecting the North from the sea-scum of the world. We keep a permanent, paranoid watch over the freezing currents of the Bay of Ice, ready to launch our scouts to intercept wildling longships or ironborn marauders.\n#weak Let the krakens try our beaches—our wood-axes will split their skulls in the surf."

GLOVER_THE_MOTTE_ENDURES_NO_BULLETTAB:0 "Deepwood Motte has been pillaged, burned, and occupied by ironborn reivers across history, yet our spirit has never been broken. We always return from the deep woods to slaughter the occupiers, rebuilding our massive timber palisades and log towers wood by wood to reclaim our absolute regional dominance.\n#weak The frost freezes the bogs, but it only hardens our resolve to defend our groves."


glover_deepwood_ironshields:0 "Wolfswood Ironshields"
glover_deepwood_ironshields_flavor:0 "Drawn from the hardiest timber-cutters and veteran foresters of the Glover domain, these heavy infantrymen are the iron fist of Deepwood Motte. Clad in thick ring-mail beneath heavy red wool cloaks, they carry massive, iron-rimmed wooden round shields stamped with the mailed fist crest. Drilled to advance knee-to-knee down narrow, snow-choked forest trails, they form an impenetrable timber-and-iron wall that can break heavy cavalry charges and ruthlessly grind down ironborn reiver hosts."


building_type_agot_glover_deepwood_motte:0 "Glover Deepwood Motte"
building_agot_glover_deepwood_motte_01:0 "The Log Palisades"
building_agot_glover_deepwood_motte_01_desc:0 "Perched high upon a massive, ancient earthen mound deep within the dense sentinel forests of the Wolfswood, Deepwood Motte stands as a formidable First Men timber fortress. Enclosed by a double ring of colossal pine palisades and deep, water-filled ditches, its wooden watchtowers house heavy-draw longbowmen clad in iron mail—providing a vigilant, unyielding shield that guards the western approaches to the North."


#SELMY

selmy_legacy_track_name: "Selmy"
selmy_legacy_track_desc: "What Storms May Blow"
selmy_legacy_1_name: "Marcher Blood"
selmy_legacy_2_name: "Steel in Service"
selmy_legacy_3_name: "Lords of the Hall"
selmy_legacy_4_name: "By Word and Deed"
selmy_legacy_5_name: "Harvest of Honor"

SELMY_MARCHER_BLOOD_NO_BULLETTAB:0 "The Selmys carved their name in the red soil of the Dornish Marches. Harvest Hall stood firm through centuries of border war, raiding, and reprisal. Its lords were bred not for conquest, but for defiance — warriors who knew that loyalty held stronger than stone.\n#weak Honor rides harder in the marches. Selmys tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

SELMY_STEEL_IN_SERVICE_NO_BULLETTAB:0 "Some houses rise on treachery or titles. The Selmys rose through quiet service — blades offered without ambition, loyalty given without flattery. More than once, a son of Harvest Hall has worn white and stood for kings, not for gain, but for honor.\n#weak They serve, and are remembered for how they stood. Selmys tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

SELMY_LORDS_OF_THE_HALL_NO_BULLETTAB:0 "Though their swords are sharp, the Selmys have long ruled fertile lands that feed half the marches. Wheat, not gold, made them rich — and duty, not splendor, kept them noble. They are lords as much of harvest as of hall.\n#weak Every stalk reaped bears the weight of a shield raised. Enables recruitment of [GetMaA('selmy_harvest_knights').GetName] as [men_at_arms|E].#!."

SELMY_BY_WORD_AND_DEED_NO_BULLETTAB:0 "To a Selmy, an oath is not a formality — it is a foundation. Their house has endured by saying less, but doing more. In the courts of Storm’s End or the fields of the marches, their word is their name.\n#weak Justice is not what they preach — it is what they carry."

SELMY_HARVEST_OF_HONOR_NO_BULLETTAB:0 "The fields of Harvest Hall yield grain, but its name yields something greater. Each generation of Selmys tills not only land, but legacy — planting values in their blood and reaping renown in courts, wars, and memory.\n#weak Theirs is a harvest sown in honor, and reaped in time."

selmy_harvest_knights:0 "Harvest Knights"
selmy_harvest_knights_flavor:0 "Clad in storm-burnished plate and wheat-brown cloaks, the Harvest Knights ride for honor, not ambition. Drawn from the finest squires and sons of Harvest Hall, they fight in ordered ranks, break lines with discipline, and bear the weight of Selmy vows as surely as they carry their lances."

building_type_agot_selmy_harvest_hall_01:0 "Harvest Hall"
building_agot_selmy_harvest_hall_01:0 "Harvest Hall"
building_agot_selmy_harvest_hall_01_desc:0 "Seat of House Selmy, Harvest Hall is a Stormlander hold famed for its tilled fields, press-houses, and full granaries. The banners of the sheaf and sword hang above courtyards where squires are drilled and cider flows in autumn. The Selmys keep an orderly hall, stern in duty but generous in harvest, and levy stout men from villages bound to their plow and pride."


#MASSEY

massey_legacy_track_name: "Massey"
massey_legacy_track_desc: "Ever Moving"
massey_legacy_1_name: "Kings of the Hook"
massey_legacy_2_name: "The Broken Vow"
massey_legacy_3_name: "Fireborne Alliance"
massey_legacy_4_name: "Masters of the Chamber"
massey_legacy_5_name: "Crownsworn"

MASSEY_KINGS_OF_THE_HOOK_NO_BULLETTAB:0 "In the age of the Hundred Kingdoms, the Masseys ruled as petty kings from Stonedance, watching the Blackwater’s mouth and the wooded coasts of the Hook. Though the crown was broken, their pride was not.\n#weak They remember when others bent the knee to them. Masseys tend to be [GetTrait('authoritative').GetName( GetNullCharacter )]."

MASSEY_THE_BROKEN_VOW_NO_BULLETTAB:0 "King Durwald the Fat lost more than a war — he lost the Masseys. When others followed Storm’s End blindly, the Hook turned its back. House Massey paid for its defiance, but earned its reputation in fire and fortitude.\n#weak Sometimes loyalty must be broken to survive. Enables recruitment of [GetMaA('massey_stonedance_knights').GetName] as [men_at_arms|E].#!."

MASSEY_FIREBORNE_ALLIANCE_NO_BULLETTAB:0 "When Storm’s End took Stonedance, the Masseys married it back. When Aegon crossed the sea, they chose dragon over storm. Theirs is a house that does not rise by conquest — but by choosing the right conqueror.\n#weak One daughter saved a castle. One oath secured a future."

MASSEY_MASTERS_OF_THE_CHAMBER_NO_BULLETTAB:0 "Sword-won lands are lost in time, but words can shape empires. Triston Massey’s laws helped build the realm — and others of his house have ruled in silence behind doors others never reach.\n#weak Some thrones are made of stone. Others, of law and ink."

MASSEY_CROWNSWORN_NO_BULLETTAB:0 "They were Stormlanders once — but the Masseys bent to dragonfire before the storm could rise. Now they serve the realm itself, sworn not to a march or a coast, but to the crown above them all.\n#weak Their loyalty lies where the gold flows."

massey_stonedance_knights:0 "Stonedance Knights"
massey_stonedance_knights_flavor:0 "Formed in the shadow of the cliffs at Stonedance, the Knights of House Massey are drilled to charge fast and strike clean. Forged by rebellion and crowned by courtly service, they carry old loyalties in ordered ranks."

#LYDDEN

lydden_legacy_track_name: "Lydden"
lydden_legacy_track_desc: "We Dwell Below"
lydden_legacy_1_name: "Blades from the East"
lydden_legacy_2_name: "Shieldbreakers"
lydden_legacy_3_name: "Lion by Marriage"
lydden_legacy_4_name: "Stewards of the Lion"
lydden_legacy_5_name: "Crowned in Memory"

LYDDEN_BLADES_FROM_THE_EAST_NO_BULLETTAB:0 "The Lyddens were not born of court or crown — they were born of risk. Among the first Andals to set foot in the westerlands, they came with nothing but swords and fire-hardened conviction. Carving footholds into hill and vale, they earned what older houses inherited: land, name, and fear.\n#weak Their names were forged before they were spoken. Lyddens tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

LYDDEN_SHIELDBREAKERS_NO_BULLETTAB:0 "Fighting uphill, against shieldwalls and stone, the Lyddens built their strength not through sheer numbers, but through grim efficiency. On the broken passes of the west, they became known for shattering formations and flanking where others fell. Their sons still bear that instinct — to press the break, not hold the line.\n#weak You hear them before you see them — the sound of lines breaking. Enables recruitment of [GetMaA('lydden_crownridge_guard').GetName] as [men_at_arms|E].#!."

LYDDEN_LION_BY_MARRIAGE_NO_BULLETTAB:0 "Ser Joffrey Lydden wed into House Lannister and, for a time, wore the golden crown of the Rock. Though his descendants took the lion’s name, the Lydden bloodline flowed through every decree. It was a union of ambition and cunning — one that gave rise to kings and left a mark no regent could erase.\n#weak The lion roared, but the Lydden ruled."

LYDDEN_STEWARDS_OF_THE_LION_NO_BULLETTAB:0 "The crown passed from their line, but not the trust. In the generations that followed, House Lydden served the Lannisters with loyalty and tempered pride. They became generals, stewards, and tutors — the voice behind the throne rather than upon it. They did not reclaim the crown, but they earned something older: respect.\n#weak What they lost in power, they reclaimed in trust. Lyddens tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

LYDDEN_CROWNED_IN_MEMORY_NO_BULLETTAB:0 "The Rock has known many rulers, but few houses bear its weight in silence like the Lyddens. Though no longer kings, they rule their lands with a noble restraint born of remembered glory. Their banners no longer boast a crown, but their words carry the weight of one worn — and never quite put down.\n#weak A crown worn once is never forgotten. Lyddens are seen as [GetTrait('arrogant').GetName( GetNullCharacter )]."

lydden_crownridge_guard:0 "Crownridge Guard"
lydden_crownridge_guard_flavor:0 "Raised from the hill passes and granite footholds of Lydden land, the Crownridge Guard were once the vanguard of Andal ambition. Hardened by elevation and memory, they advance with shields high and discipline higher — bred to break lines, not bend to them."

#LEFFORD

lefford_legacy_track_name: "Lefford"
lefford_legacy_track_desc: "Gained Through Ascension"
lefford_legacy_1_name: "Iron in the Blood"
lefford_legacy_2_name: "Keepers of the Pass"
lefford_legacy_3_name: "Coin Through Stone"
lefford_legacy_4_name: "Voice of the Lion"
lefford_legacy_5_name: "Gold Never Yields"

LEFFORD_IRON_IN_THE_BLOOD_NO_BULLETTAB:0 "House Lefford began not as conquerors, but as a compromise — a sword-wielding Andal warlord joined to a First Men noblewoman, uniting mountain and steel. That bond carried through generations: they fight like Andals, rule like First Men, and forget neither. Their line remembers both the clash and the accord that forged their name.\n#weak Blood mixed in war is stronger in peace."

LEFFORD_KEEPERS_OF_THE_PASS_NO_BULLETTAB:0 "The Golden Tooth is not merely a castle — it is the gate through which the West breathes. Every army, merchant, and caravan bound for Lannisport passes beneath its walls. The Leffords have guarded that road for centuries, never flamboyant, never shaken, always present. They are the watchmen of the realm’s richest spine.\n#weak Nothing moves west without their eyes upon it. Enables recruitment of [GetMaA('lefford_goldenroad_pikes').GetName] as [men_at_arms|E].#!."

LEFFORD_COIN_THROUGH_STONE_NO_BULLETTAB:0 "Gold flows beneath the Golden Tooth, but it is House Lefford’s discipline that has made it enduring. They levy tolls, manage mines, and invest in infrastructure — not for grandeur, but for strength. Their fortune is not found in vaults, but in stone pathways, fortified halls, and the long-term trust of king and caravan alike.\n#weak The pass fills their coffers. The mines deepen their name."

LEFFORD_VOICE_OF_THE_LION_NO_BULLETTAB:0 "Though they do not rule the Rock, the Leffords rule its confidence. Time and again, Lannister kings and lords have turned to them — not for loud counsel, but for measured words, clean accounts, and loyal spears. They are the lion’s second voice — calm, clear, and never forgotten in times of war or succession.\n#weak The lion trusts the mountain that does not move. Leffords tend to be [GetTrait('calm').GetName( GetNullCharacter )]."

LEFFORD_GOLD_NEVER_YIELDS_NO_BULLETTAB:0 "Power fades, gold is spent, and crowns tumble — but the Golden Tooth holds. House Lefford is less concerned with fame than with permanence. They are not the loudest, nor the richest, but they outlast rivals through quiet endurance. In the end, stone and silence last longer than song.\n#weak They become more valuable as time goes on."

lefford_goldenroad_pikes:0 "Goldenroad Pikes"
lefford_goldenroad_pikes_flavor:0 "Raised and drilled at the mouth of the West, the Goldenroad Pikes are the spine of House Lefford’s defense. Long spears, locked shields, and unshaken ranks define this unit — trained not to charge, but to hold, grind, and break what charges them."

#MARBRAND

marbrand_legacy_track_name: "Marbrand"
marbrand_legacy_track_desc: "Burning Bright"
marbrand_legacy_1_name: "First-Born Flame"
marbrand_legacy_2_name: "Flamebound Loyalty"
marbrand_legacy_3_name: "Wardens of the Western Hills"
marbrand_legacy_4_name: "Ashmark Tempered"
marbrand_legacy_5_name: "The Fire That Follows"

MARBRAND_FIRST_BORN_FLAME_NO_BULLETTAB:0 "The hills of Ashemark burned long before the Marbrands raised stone upon them. These were no easy lands — forests smoldered, soil was charred, and early warbands struggled to endure. But the Marbrands were First Men who did not flee fire. They tamed it, took root in it, and taught their descendants to draw strength from smoke instead of fleeing it. That strength still runs in their blood — old, iron-bound, and steady.\n#weak They were strong before steel was forged. Marbrands can be [GetTrait('strong').GetName( GetNullCharacter )]."

MARBRAND_FLAMEBOUND_LOYALTY_NO_BULLETTAB:0 "While other Westerland lords have schemed, the Marbrands have remained steady. Through generations of lions — bold, reckless, cruel, or proud — they have marched when called and ruled with restraint when not. Their loyalty has made them a foundation of House Lannister's dominion: not its teeth, but its spine. Theirs is not the loyalty of fear, but of principle — the kind that holds fast in storm and smoke.\n#weak Fire burns, but loyalty holds. Marbrands tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

MARBRAND_WARDENS_OF_THE_WESTERN_HILLS_NO_BULLETTAB:0 "Tucked against the borders of the Reach and the Sunset Sea, Ashemark sits where patrols matter more than parades. The Marbrands know every ridge and ravine, and their riders strike fast where others would stall. Raiders and rebels alike learn that these hills are not lawless — they are watched, guarded, and answered by steel from shadow.\n#weak They are not conquerors — they are guardians. Enables recruitment of [GetMaA('marbrand_flameborn_guard').GetName] as [men_at_arms|E].#!."

MARBRAND_ASHMARK_TEMPERED_NO_BULLETTAB:0 "Ashemark has been sacked, burned, and rebuilt more times than most castles see peacetime. Yet each time, the Marbrands rebuilt — not with haste, but with resolve. Their people learned to recover quickly, manage scarcity, and build institutions that outlast war. Ashmark's stones do not shine like the Rock, but they are built to be warmed by fire and hardened by it. The house that rose there does the same.\n#weak Ashes do not mean the fire is gone."

MARBRAND_THE_FIRE_THAT_FOLLOWS_NO_BULLETTAB:0 "The Marbrands do not lead with pageantry. They are not the first name spoken in court, nor the loudest voice on the council. But when war comes to the West, it is their spears that steady the line. Their fire is not the blaze that begins a battle — it is the one that survives it. They follow lions into the fray not as servants, but as steel — the second wave, the fallback line, the fire that never goes out.\n#weak Every fire leaves a trail. Theirs marches with war. Marbrands tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

marbrand_flameborn_guard:0 "Flameborn Guard"
marbrand_flameborn_guard_flavor:0 "House Marbrand’s hearth burns with fire, and so too do their chosen warriors. Clad in pale golden plate that gleams like embers in sunlight, the Flameborn Guard march as both a symbol of their lord’s wealth and an instrument of war. To many they look near ceremonial, as if forged for a hall more than a battlefield—yet those who mistake them for mere show find themselves broken beneath disciplined ranks of steel. Their presence alone can steady allies. To see the sun-bright armor of the Flameborn is to remember that House Marbrand’s flame does not die."

#GOODBROTHER

goodbrother_legacy_track_name: "Goodbrother"
goodbrother_legacy_track_desc: "Answer the Call"
goodbrother_legacy_1_name: "Hardstone Lords"
goodbrother_legacy_2_name: "Sashes and Sons"
goodbrother_legacy_3_name: "Blood on the Hill"
goodbrother_legacy_4_name: "The Badbrother’s Crown"
goodbrother_legacy_5_name: "Brother to Kings"

GOODBROTHER_HARDSTONE_LORDS_NO_BULLETTAB:0 "While most Ironborn boast of salt and sail, the Goodbrothers carved their legacy from the Hardstone Hills of Great Wyk. Hammerhorn’s wealth comes not from reaving but from the bones of the earth — iron, stone, and blood. Their inland castle echoes with the sound of pickaxes, not crashing waves. They built not ships, but fortresses, and traded tides for tunnels. In the Iron Islands, that makes them unusual. In Great Wyk, it makes them rich.\n#weak They are lords of stone first, salt second."

GOODBROTHER_SASHES_AND_SONS_NO_BULLETTAB:0 "No house on the isles breeds more bloodlines than the Goodbrothers. Their name is carried by cadet branches across Great Wyk, Old Wyk, and even Orkmont. Each wears the goat-hair sash — bold, striped, and undeniable. In times of war, their kin rally by the hundreds. In times of kingsmoot, they raise more hands than any but the ancient Greyirons. Their numbers are not their strength alone — it is their sign of dominion over the inland ironborn.\n#weak The sash is not a symbol. It is a warning. Goodbrothers tend to be [GetTrait('fecund').GetName( GetNullCharacter )]."

GOODBROTHER_BLOOD_ON_THE_HILL_NO_BULLETTAB:0 "The Hardstone Hills are no place for sailing men. The warriors of Hammerhorn fight like the ground they live on — unbending, cold, and crushing. They know the passes, the high ridges, the ambush trails. They do not charge in formation; they descend in silence. Ironborn they are, but their true faith lies in axe, stone, and a good choke point.\n#weak The hills do not roar. They break what walks through them. Enables recruitment of [GetMaA('goodbrother_hammerhorn_stoneguard').GetName] as [men_at_arms|E].#!."

GOODBROTHER_THE_BADBROTHERS_CROWN_NO_BULLETTAB:0 "Urrathon IV Goodbrother, called “Badbrother,” ruled as high king in the Age of Heroes. His reign was fierce, short, and soaked in war — but it happened. Only the Greyirons have sat the Seastone Chair more often than House Goodbrother. Though centuries have passed, Hammerhorn remembers what it meant to wear the driftwood crown. They do not worship the sea. They worship power — and remember having it.\n#weak The blood of kings is not always golden."

GOODBROTHER_BROTHER_TO_KINGS_NO_BULLETTAB:0 "Others claim descent from the Grey King. The Goodbrothers claim the Grey King's elder brother — not the crown-bearer, but the loyal sword beside the throne. It is a story of power refused and loyalty remembered. Whether myth or truth, the Goodbrothers wear it like armor: they were never born to serve, only to rule by another name. They are not lesser ironborn. They are ironborn unshaped by salt.\n#weak Not all legends wear driftwood crowns. Goodbrothers tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

goodbrother_hammerhorn_stoneguard:0 "Hammerhorn Stoneguard"
goodbrother_hammerhorn_stoneguard_flavor:0 "Forged beneath the Hardstone Hills and armed from Hammerhorn’s mines, the Stoneguard are the heaviest foot the Goodbrothers field. They do not charge. They hold. They grind. They break. And when the dust clears, they are still standing."

#HARLAW

harlaw_legacy_track_name: "Harlaw"
harlaw_legacy_track_desc: "Conquest is Our Harvest"
harlaw_legacy_1_name: "Kings of Rock and Salt"
harlaw_legacy_2_name: "Reapers of Fair Isle"
harlaw_legacy_3_name: "Bitter Rivals, Broken Chains"
harlaw_legacy_4_name: "Kingsmoot-Crowned"
harlaw_legacy_5_name: "The Scythe Remembers"

HARLAW_KINGS_OF_ROCK_AND_SALT_NO_BULLETTAB:0 "Before Pyke ruled the Iron Isles, Harlaw did. The Harlaws were kings in their own right, lords of salt cliffs and hard soil, masters of Harlaw Isle when others still squabbled over driftwood. Their bloodline flows from those who wore the salt crown — not by election, but by fire, blade, and birth. Though the kingship was lost to the Greyirons, and later the Greyjoys, the Harlaws have never forgotten the weight of command or the pride of rule.\n#weak Not all kings are made by thrones. Harlaws tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

HARLAW_REAPERS_OF_FAIR_ISLE_NO_BULLETTAB:0 "When the Ironborn swept west, it was Erich V Harlaw who led the charge. Fair Isle fell to him, and for a time, it was ruled by scythe and salt. Though the sea eventually took it back, the tale became Ironborn legend — of a boy who conquered, of a house that reaps what it desires, and of a crown briefly earned through fire and force. The spirit of that conquest still burns in Harlaw blood.\n#weak The sea may retreat, but the memory stays sharp. Enables recruitment of [GetMaA('harlaw_reapers_of_harlaw').GetName] as [men_at_arms|E].#!."

HARLAW_BITTER_RIVALS_BROKEN_CHAINS_NO_BULLETTAB:0 "The Myres and the Kennings were once proud — rivals to the Harlaws for power, salt, and sovereignty. That pride died hard. The scythe is patient. The scythe remembers. House Harlaw crushed its rivals not only through blade, but through relentless persistence and generational vengeance. They wear the victories like old scars: visible, bitter, and undeniable. On Harlaw Isle, all now bow to the Ten Towers.\n#weak They carry grudges like other men carry blades. Harlaws tend to be [GetTrait('vengeful').GetName( GetNullCharacter )]."

HARLAW_KINGSMOOT_CROWNED_NO_BULLETTAB:0 "The kingsmoot was the old way, and House Harlaw knew it well. Their line claimed the Seastone Chair more than once — chosen by voice, backed by blade, and raised by salt. Their kings ruled from Old Wyk to Fair Isle. Even after the Greyirons seized power and ended the kingsmoot, the Harlaws carried the legacy like a quiet crown: proof that their worth once made the isles kneel without force.\n#weak The crown was taken — not forgotten."

HARLAW_THE_SCYTHE_REMEMBERS_NO_BULLETTAB:0 "Most Ironborn pride themselves on forgetting. The Harlaws pride themselves on remembering. From the Tower of Books to the tales of Harron Harlaw at Oldtown’s gates, they keep their lore deep and their grudges deeper. Their minds are as sharp as their scythes — wielding history as both weapon and warning. To be Harlaw is to fight, yes — but also to know exactly when, why, and how.\n#weak The scythe cuts clean, but it cuts last."

harlaw_reapers_of_harlaw:0 "Reapers of Harlaw"
harlaw_reapers_of_harlaw_flavor:0 "Carrying the legacy of Erich the Reaper and the scythe of Ten Towers, the Reapers of Harlaw strike with speed and precision. Raised in the hills of Great Wyk and sharpened on bitter raids, they fight not to conquer — but to cut down all who stand in the way. They are not raiders by chance — they are reapers by birthright."

#FOWLER

fowler_legacy_track_name: "Fowler"
fowler_legacy_track_desc: "Let Me Soar"
fowler_legacy_1_name: "Kings of Stone and Sky"
fowler_legacy_2_name: "Blood in the Wind"
fowler_legacy_3_name: "Lords of the Wide Way"
fowler_legacy_4_name: "Scars of Dragonfire"
fowler_legacy_5_name: "The Hawk Watches"

FOWLER_KINGS_OF_STONE_AND_SKY_NO_BULLETTAB:0 "Long before Nymeria or dragons, the Fowlers ruled the stony passes of western Dorne as trueborn kings. Their citadel, Skyreach, stood watch over windswept ridges, a symbol of First Men resilience and royal sovereignty. As Kings of Stone and Sky, they claimed dominion over the clouds above and the canyons below — not as usurpers, but as the blood of Dorne’s mountain heart. Though their crown has since fallen, Skyreach still casts its long shadow across the realm.\n#weak Their wings were broad before the dragons flew. Fowlers tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

FOWLER_BLOOD_IN_THE_WIND_NO_BULLETTAB:0 "King Ferris Fowler marched ten thousand Dornishmen into the Reach. His descendant, King Garrison, lost his throne and was exiled to the Wall. Between them and beyond them rode hawks — proud, grim, relentless. War shaped the Fowler name: not gentle war, but bloody, soaring, sudden war, sweeping down from hills into hearts. The hawks do not roost long. They fight, fall, and fly again.\n#weak The wind may change — the hawk returns. Enables recruitment of [GetMaA('fowler_highridge_riders').GetName] as [men_at_arms|E].#!."

FOWLER_LORDS_OF_THE_WIDE_WAY_NO_BULLETTAB:0 "The Wide Way is no mere road — it is the breath of Dorne, and the bloodline of war. From Skyreach, the Fowlers guarded this vital pass between Reach and desert, ambushing marcher hosts and retreating through winding heights known only to them. For centuries, they defended Dorne’s spine with mountain-born cunning and iron discipline. To hold the Wide Way was to hold back invasion. The hawk lords of Skyreach held it with talons.\n#weak The pass belongs to the hawk."

FOWLER_SCARS_OF_DRAGONFIRE_NO_BULLETTAB:0 "When Dorne defied the Iron Throne, the dragons came. Lord Fowler led the burning of Nightsong — and was slain in gold and vengeance. Skyreach itself burned in the Dragon’s Wroth, its towers scorched but unbroken. Yet the house endured. Stone was rebuilt, honor reclaimed, and the hawks rose again from the soot. Not all that burns dies — and Skyreach still soars.\n#weak What fire fails to kill, it tempers."

FOWLER_THE_HAWK_WATCHES_NO_BULLETTAB:0 "The Fowlers no longer wear crowns, but they wear vigilance. From the towers of Skyreach, they have watched lords rise and fall, allies become rivals, and dust become dynasty. They keep the north for Dorne — not in fanfare, but in presence. In their quiet, there is memory. In their perch, there is purpose. The hawk does not strike often. It only strikes when needed — and it never blinks.\n#weak From the cliffs, nothing goes unseen."

fowler_highridge_riders:0 "Highridge Riders"
fowler_highridge_riders_flavor:0 "Forged in the high passes of Dorne, the Highridge Riders of House Fowler are light cavalry trained to strike from altitude and vanish into the wind. They are swift, surefooted, and deadly — the hawk’s answer to the shieldwall."

#QORGYLE

qorgyle_legacy_track_name: "Qorgyle"
qorgyle_legacy_track_desc: "Who Strikes Shall Strike Again"
qorgyle_legacy_1_name: "Well of the Wastes"
qorgyle_legacy_2_name: "Scorpions of the Dunes"
qorgyle_legacy_3_name: "Banners Under Yronwood"
qorgyle_legacy_4_name: "Ash Beneath Dragons"
qorgyle_legacy_5_name: "Poison in the Blood"

QORGYLE_WELL_OF_THE_WASTES_NO_BULLETTAB:0 "House Qorgyle was not built on green land or fertile valleys — it was forged in sand. While others warred over rivers and holds, the Qorgyles went where no lords dared: into the endless dunes. There, they found water — a single well for fifty leagues — and raised Sandstone beside it. That fortress became a kingdom of heat, hunger, and harsh command. They did not inherit their land. They conquered thirst, and ruled from it.\n#weak Sandstone rises where the sand gives way. Qorgyles tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

QORGYLE_SCORPIONS_OF_THE_DUNES_NO_BULLETTAB:0 "Most desert lords favor swift riders. The Qorgyles favor silence — and then the strike. Trained in endurance and ambush, their skirmishers melt into the dunes and stone ridges, waiting for the unwary. They fight in close with spears and short blades, harrying columns and cutting down foragers before vanishing back into the sands. When Lord Harlan Tyrell’s men pressed too deep, it was Qorgyle Scorpions who found them — and none returned.\n#weak You never see the scorpion until it strikes. Enables recruitment of [GetMaA('qorgyle_scorpion_strikers').GetName] as [men_at_arms|E].#!."

QORGYLE_BANNERS_UNDER_YRONWOOD_NO_BULLETTAB:0 "In the wars of Nymeria, the Qorgyles followed the Yronwoods — out of pride, out of kinship, and out of defiance. They lost. But unlike others, they did not vanish. When they bowed to Sunspear, they did so without lowering their eyes. Though loyal now, their blood remembers. They wear the Martell sun — but the sand beneath it is theirs.\n#weak They serve. They do not forget."

QORGYLE_ASH_BENEATH_DRAGONS_NO_BULLETTAB:0 "When Aegon the Conqueror came to Dorne, the Qorgyles refused him. They did not kneel, and they did not survive untouched. The skies above Sandstone lit with dragonflame, and its towers burned in the Dragon’s path. But the Qorgyles endured. They killed foragers, outlasted fire, and kept their seat. The castle bears the scorch marks still — and so do they.\n#weak What does not submit cannot be ruled."

QORGYLE_POISON_IN_THE_BLOOD_NO_BULLETTAB:0 "The Qorgyles are patient. They do not forget. They do not forgive. Their words are quiet, their alliances careful, and their knives rarely clean. Their legacy is not of kingship, but of influence. Their sons serve. Their daughters wed. And their rivals bleed at times and places not easily traced. They are not the loudest voice in Dorne — only the one that lingers longest.\n#weak Some wounds were never meant to heal."

qorgyle_scorpion_strikers:0 "Scorpion Strikers"
qorgyle_scorpion_strikers_flavor:0 "Clad in layered armor and desert cloth, the Scorpion Strikers of House Qorgyle strike with sudden force from dune and ridge alike. Trained for ambush and endurance, they do not charge in lines — they coil, strike, and vanish, leaving the sand marked with blood only."

#WAYNWOOD

waynwood_legacy_track_name: "Waynwood"
waynwood_legacy_track_desc: "Always Upright"
waynwood_legacy_1_name: "Oaken Blood"
waynwood_legacy_2_name: "The Ironoath"
waynwood_legacy_3_name: "Horse and Honor"
waynwood_legacy_4_name: "Wild Wyl’s Charge"
waynwood_legacy_5_name: "Lords of the Ancient Way"

WAYNWOOD_OAKEN_BLOOD_NO_BULLETTAB:0 "The Waynwoods trace their line to the First Men of the Vale — not with loud boasts, but with unshakable certainty. They are proud of their past, and more proud of their conduct. Their traditions are older than crowns. Their oaths are carved in wood and stone, and their presence at court is felt through posture, not volume. In a world of soft courtiers and fresh blood, the Waynwoods stand like the trees they rule: firm, rooted, and enduring.\n#weak The blood is brown, old, and unshaken. Waynwoods tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

WAYNWOOD_THE_IRONOATH_NO_BULLETTAB:0 "Ceremony to a Waynwood is not pretense — it is law. Their words are spoken carefully, their honors recorded, their loyalties clearly and cleanly kept. They keep to old rituals in court and campaign alike. And when they swear, they do not swear with flourishes or flair. They swear with permanence. Their oaths are remembered not because they are rare — but because they are never broken.\n#weak They do not swear lightly. Nor forget. Waynwoods tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

WAYNWOOD_HORSE_AND_HONOR_NO_BULLETTAB:0 "It is said that the Waynwood face is long, and so is their pride. They are masters of the saddle and field, their horsemen trained not for pageantry but for pursuit. Their cavalry does not scatter — it flows. They fight with rigid discipline and structured fury, and when they gallop, it is like a closing gate. Theirs is a power not born of storm or flash, but of form.\n#weak Their horses are trained to bow. They are not. Enables recruitment of [GetMaA('waynwood_knights_of_ironoaks').GetName] as [men_at_arms|E].#!."

WAYNWOOD_WILD_WYLS_CHARGE_NO_BULLETTAB:0 "Wild Wyl Waynwood died on the Redgrass Field, cut down by Daemon Blackfyre after charging beneath the falcon banner. His name became a song in the Vale — not for glory, but for obedience. The Waynwoods do not question command. They ride when ordered, fight where placed, and die with their banners forward. They do not trade oaths for victory — they die with honor and call it enough.\n#weak They do not die for glory. They die correctly."

WAYNWOOD_LORDS_OF_THE_ANCIENT_WAY_NO_BULLETTAB:0 "The Waynwoods do not chase power — they embody it. Their strength lies in continuity: in the rituals they uphold, the lineages they recite, and the halls that echo with the memory of a thousand formal oaths. They are the noble ideal of the Vale — unshaken, unquestioned, and necessary. Lords may change. The Waynwoods remain.\n#weak Theirs is not the power of ambition — but of permanence."

waynwood_knights_of_ironoaks:0 "Knights of Ironoaks"
waynwood_knights_of_ironoaks_flavor:0 "Clad in gleaming plate and green cloaks, the Knights of Ironoaks ride not for ambition, but for oath. Chosen from Waynwood’s proudest sons, they charge with quiet fury, trained to strike as one and die with grace — like Wild Wyl before them."

#UPCLIFF

upcliff_legacy_track_name: "Upcliff"
upcliff_legacy_track_desc: "Who Tempts the Swell"
upcliff_legacy_1_name: " Before the Falcon"
upcliff_legacy_2_name: "Bride of the Merling King"
upcliff_legacy_3_name: "Fog and Blood"
upcliff_legacy_4_name: "The Drowned Court"
upcliff_legacy_5_name: "Whispers That Endure"

UPCLIFF_BEFORE_THE_FALCON_NO_BULLETTAB:0 "Long before the Arryns raised Eyrie stone or Andal longships cut the Bite, the Upcliffs ruled Witch Isle. They did not expand; they endured. Their power was not broadcast by banners but whispered through the sea-mist. No treaties marked their dominion — only salt, superstition, and the silence of waves around them. They are older than the Vale, and less interested in being remembered than in never being removed.\n#weak They ruled before the Vale was named."

UPCLIFF_BRIDE_OF_THE_MERLING_KING_NO_BULLETTAB:0 "Ursula Upcliff called herself the bride of a god, and rode to war like a herald of tide and blood. Ursula rode a blood-red horse in the Battle of the Seven Stars, during which she tried to curse Torgold Tollett. However, according to singers, Torgold leapt upon Ursula's horse, grasped her face, and tore her head from her shoulders as she screamed for succor. No one knows what oaths she swore or what truths swam beneath her titles — only that storms followed her, her horse ran red, and her death was as sudden and strange as her life. The Upcliffs remember her not as a myth, but as a matriarch. They keep her title alive in veiled tongues and tide-washed rituals.\n#weak Her veil never sank. Upcliffs can be [GetTrait('zealous').GetName( GetNullCharacter )]."

UPCLIFF_FOG_AND_BLOOD_NO_BULLETTAB:0 "The waters around Witch Isle are treacherous. So say the sailors who never return. Whether it is stone, current, or something older and crueler, no one can quite say. But those who try to take the isle rarely keep their ships. In the old days, it was said that Upcliff witches called wind and wave with whispered names. Even now, the fog hangs strangely thick — and it listens.\n#weak The fog obeys no crown. Enables recruitment of [GetMaA('upcliff_witch_isle_watchers').GetName] as [men_at_arms|E].#!."

UPCLIFF_THE_DROWNED_COURT_NO_BULLETTAB:0 "The Upcliffs do not keep a sept, and their godswood rotted long ago. In its place are statues without names, carved into cliffside and tidepools — some say they predate men. They speak to the sea and its silence. Their heralds wear no bright colors, only gray veils and driftwood charms. Those who visit their court leave uneasy, and those who stay too long hear things in the waves.\n#weak The sea has its own lords."

UPCLIFF_WHISPERS_THAT_ENDURE_NO_BULLETTAB:0 "History moves on. The Arryns rise. Houses war. Septons preach. And still, the Upcliffs hold their isle. They rarely make claims, but are named in more rumors than most kings. Their legacy is not power, but presence. Not noise, but nearness. Like fog, they never fill the space — but they’re always just behind it. You forget them, and then remember them at the wrong time.\n#weak Witch Isle has no need to shout."

upcliff_witch_isle_watchers:0 "Witch Isle Watchers"
upcliff_witch_isle_watchers_flavor:0 "Cloaked in sea-mist and silence, the Witch Isle Watchers do not patrol — they haunt. Born of old blood and older rumor, they move like fog across cliff and crag, answering only to the isle and the veiled lords who rule it. No horns mark their approach. No songs recall their deeds. They do not guard against invasion — they make you question if you ever landed at all."

#BRAX

brax_legacy_track_name: "Brax"
brax_legacy_track_desc: "Not Snared by Arms"
brax_legacy_1_name: "Hillblood and Heraldry"
brax_legacy_2_name: "Vassals of the Lion"
brax_legacy_3_name: "Unicorn’s Honor"
brax_legacy_4_name: "Vales and Vineyards"
brax_legacy_5_name: "Endurance, Not Echoes"

BRAX_HILLBLOOD_AND_HERALDRY_NO_BULLETTAB:0 "House Brax was born in compromise. An Andal noble wed into an old First Men line, binding ambition to land, sword to soil. Unlike many Westerlands houses who rose through conquest, Brax rose through patience and placement — and endured. Their heraldry reflects not aggression, but identity: a purple unicorn, proud, deliberate, and rare. In a world of lions and dragons, they claimed a different kind of power.\n#weak Their banners were woven, not painted."

BRAX_VASSALS_OF_THE_LION_NO_BULLETTAB:0 "Some rise through rebellion. House Brax rose through service. For a thousand years, they have stood behind House Lannister — not for want of pride, but from deep recognition of the value in lasting loyalties. Their sons serve as captains, castellans, and companions. Their daughters marry well. And when other houses fall from favor, the Brax is still there — unsworn to ambition, unshaken by courtly tides.\n#weak Lions roar. Unicorns remain. Members of House Brax tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

BRAX_UNICORNS_HONOR_NO_BULLETTAB:0 "Their sigil is not a predator, but it does not run. The unicorn is a symbol of grace, stubbornness, and control. So too are the knights of House Brax — well-trained, steady, and known for holding ground when others falter. They do not win glory in tourney nor inspire songs in siege — but they guard flanks, close gaps, and die without disorder. Their honor is not for show. It is for war.\n#weak Their honor is not loud. It is constant. Members of House Brax tend to be [GetTrait('brave').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('brax_silverhorn_knights').GetName] as [men_at_arms|E].#!."

BRAX_VALES_AND_VINEYARDS_NO_BULLETTAB:0 "The Brax lands lie in green valleys and golden slopes, where grapes grow sweeter than gold and herds move under quiet banners. While others dig deeper for coin or blood, the Braxes tend the surface — and prosper. Their strength is not martial, but cultivated. Their justice is quiet. And their gold flows not from mines, but from bottles, ledgers, and well-tended fields. A Brax lord does not conquer land. He keeps it alive.\n#weak The land remembers who tends it."

BRAX_ENDURANCE_NOT_ECHOES_NO_BULLETTAB:0 "Great names rise and fall in the Westerlands — but House Brax endures. They are not sung of in epics, but they appear in every roll, every muster, every peace treaty. They are the noble house that remains: not brightest, not boldest, but still standing. For every torch that burns out, Brax keeps a candle lit. And sometimes, that is the power that shapes history when the shouting is done.\n#weak To last is the loudest answer."

brax_silverhorn_knights:0 "Silverhorn Knights"
brax_silverhorn_knights_flavor:0 "Bearing lances beneath purple cloaks and crested with unicorns of pale steel, the Silverhorn Knights are House Brax’s silent answer to battlefield chaos. They do not boast. They ride in silence — and their line holds."

#PEAKE

peake_legacy_track_name: "Peake"
peake_legacy_track_desc: "Our Blood, Our Right, Our Strength"
peake_legacy_1_name: "Stone for a Throne"
peake_legacy_2_name: "The Manderly Exile"
peake_legacy_3_name: "Marches Held in Blood"
peake_legacy_4_name: "Crowns by Candlelight"
peake_legacy_5_name: "The Ember Throne"

PEAKE_STONE_FOR_A_THRONE_NO_BULLETTAB:0 "House Peake is older than the Highgarden walls. Born of the First Men and hardened in the Marches, their roots run deep into the rocky hills of the Reach. Before they held three castles, they held a name carved in stone — blunt, proud, and weathered. Their lands were not rich, but they were defensible. Their coffers rarely full, but their oaths rarely broken. They were not raised by fortune. They were built — slowly, and to last.\n#weak What stone remembers, fire cannot erase. Peakes tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

PEAKE_THE_MANDERLY_EXILE_NO_BULLETTAB:0 "When King Perceon Gardener grew wary of the Manderlys, it was House Peake he trusted. Lord Lorimar Peake did not confront his rivals — he outmaneuvered them. With royal backing, he cast down one of the Reach’s great houses and took Dunstonbury as his reward. The Peakes earned power not just with blade, but with quiet menace and proximity to kingship. They did not rise cleanly. They rose effectively.\n#weak They cast down a house and claimed its stones. Peakes tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

PEAKE_MARCHES_HELD_IN_BLOOD_NO_BULLETTAB:0 "Life on the Dornish border is not for the soft. The Peakes earned their strength fending off raiders and rivermen, holding steep passes and stony ground through centuries of attrition. As marcher lords, they rose by endurance and the spear. Their knights are bred for broken terrain, narrow trails, and flanking charges — not for pageantry, but for survival. Even their banners seem sharpened. When they ride, it is because they must.\n#weak No road in the March was not taken with blood. Enables recruitment of [GetMaA('peake_starpike_knights').GetName] as [men_at_arms|E].#!."

PEAKE_CROWNS_BY_CANDLELIGHT_NO_BULLETTAB:0 "If the sword was a Peake’s left hand, marriage was their right. Over generations, their daughters married into the noblest bloodlines of the Reach — Redwyne, Rowan, Hightower, Florent — even the royal Gardener line. Seven became queens. More bore lords and heirs. These unions were not mere alliance — they were inheritance, leveraged with purpose. The Peakes understood legacy not only as land, but as lineage.\n#weak Where swords could not reach, their daughters did."

PEAKE_THE_EMBER_THRONE_NO_BULLETTAB:0 "When Aegon’s dragons came, the Peakes rode beneath the banner of House Gardener — and died with them. The Field of Fire scorched their sons and severed their standing. The Tyrells, lowborn by comparison, had no cause to favor a house that once walked beside kings. The Peakes retreated to Starpike: one castle, one name, and a memory of what they had been. They do not rage. They wait.\n#weak They fell with kings — and have not forgotten why."

peake_starpike_knights:0 "Starpike Knights"
peake_starpike_knights_flavor:0 "Raised in the high halls of Starpike and trained along the broken passes of the Dornish Marches, the Starpike Knights are relentless, hard-mouthed riders bred for swift charges and disciplined retreat. They do not boast — they break formations and decide battles."

#STRONG

strong_legacy_track_name: "Strong"
strong_legacy_track_desc: "Strong Does It Run"
strong_legacy_1_name: "First in the Mud"
strong_legacy_2_name: "Breakers of Chains"
strong_legacy_3_name: "The Lusty Legacy"
strong_legacy_4_name: "Hands of Power"
strong_legacy_5_name: "Strength in Every Hall"


STRONG_FIRST_IN_THE_MUD_NO_BULLETTAB:0 "Our lineage was born from the black river mud and ancient clay of the Trident long before the dragon came. We do not rely on southern courtly vanities or flashy gold; we are a broad-shouldered, massive race of First Men warriors who rule through blunt physical mass and an absolute, unyielding defense of our soil.\n#weak Our name was carved into the earth before crowns were ever forged. Members of the Strong dynasty are frequently born [GetTrait('physique_good_1').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )], or [GetTrait('physique_good_3').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('strong_blackmud_guard').GetName] as [men_at_arms|E]."

STRONG_BREAKERS_OF_CHAINS_NO_BULLETTAB:0 "When Harren the Black burned within his own monument of arrogance, we did not hesitate. We raised our clubs and shields alongside House Tully, throwing off the ironborn yoke to back Aegon the Conqueror and earning the dragon's absolute trust while prouder, ancient houses faltered in their fear.\n#weak We knew when the old tyrants must fall, and we marched without fear. Members of the Strong dynasty are usually born [GetTrait('brave').GetName( GetNullCharacter )]."

STRONG_LEGACY_OF_THE_LUSTY_NO_BULLETTAB:0 "We remember the legendary, tragic excess of Ser Lucamore the Lusty, the champion of the grand melee who won a white cloak only to be exiled to the Wall for secretly fathering sixteen children. Though mocked by southern bards, his potent First Men seed scattered a vanguard of fierce bastards from the Crownlands to the Stormlands.\n#weak A warrior's legacy spreads wide across the realm, even when his name is silenced."

STRONG_HANDS_OF_POWER_NO_BULLETTAB:0 "Our strength is steady, practical, and engineered for permanence. From Ser Osmund Strong serving as Hand of the King to oversee the colossal masonry of King's Landing's outer walls, we have carved our reputation into foundation stones and civic duty, building monuments that outlast the fire of empires.\n#weak True sovereignty is measured not by empty courtly titles, but by the stone you leave behind."

STRONG_STRENGTH_IN_EVERY_HALL_NO_BULLETTAB:0 "Though scandal, dragonfire, and the dark curse of Harrenhal have repeatedly decimated our high seat, the blood of the club-wielders refuses to be erased from history. From courtly knights to Wall commanders, our distant kin and bastards maintain a silent, unyielding presence across every corner of the Seven Kingdoms.\n#weak We do not need a golden crown to dominate the realm; our name alone is an absolute bastion."


strong_blackmud_guard:0 "Black Mud Guard"
strong_blackmud_guard_flavor:0 "Drawn from the most colossal, broad-shouldered laborers and river-vassals of the Gods Eye region, these heavy shock infantrymen are the iron fist of House Strong. Clad in thick ring-mail, heavy iron caps, and mud-smeared leathers, they carry massive spiked clubs and broad-bladed axes. Drilled to advance knee-deep in the slick river-clay, they form an immovable wall of physical mass designed to shatter infantry shieldwalls and hold bottleneck crossings against impossible numbers."


building_type_agot_strong_keep:0 "Strong Ancestral Seat"
building_agot_strong_keep_01:0 "The Red Fork Stronghold"
building_agot_strong_keep_01_desc:0 "Built over a bedrock foundation along the banks of the Red Fork, the ancestral seat of House Strong is a formidable fortress of First Men masonry. Enclosed by massive, unpolished curtain walls and deep earthwork ditches, its inner yards train elite knights and heavy infantry to enforce the family's iron will over the plain—proving that their ancient power stands firm without the need for southern architecture."

building_type_agot_fairgate_tower:0 "Fairgate Tower Expansion"
building_agot_fairgate_tower_01:0 "The Red Fork Toll-Tower"
building_agot_fairgate_tower_01_desc:0 "Standing a vigilant watch over the strategic causeways of the Red Fork between Seagard and the capital, Fairgate Tower functions as a formidable checkpoint. Merchants and trade barges pass beneath its massive stone arches, paying heavy silver customs-dues directly into your treasury while your lancers drill upon the parapets."

building_type_agot_lord_harroways_town_01:0 "Lord Harroway’s Town Development"
building_agot_lord_harroways_town_01:0 "The Harroway Ferry Crossings"
building_agot_lord_harroways_town_01_desc:0 "Though ancient river kings historically refused to grant this town a city charter to limit its expansion, Lord Harroway's Town remains a vital, highly lucrative commercial nexus. Having weathered the terrifying, blood-soaked purges of Maegor the Cruel and the fires of succession wars, its market squares and ferry routes cling stubbornly to the river mud, drawing merchants and silver back to its scorched stones."


#MUDD

mudd_legacy_track_name: "Mudd"
mudd_legacy_track_desc: "The Old Blood Rules"
mudd_legacy_1_name: "Crowned by the Trident"
mudd_legacy_2_name: "Tristifer’s Might"
mudd_legacy_3_name: "Last Kings of the Trident"
mudd_legacy_4_name: "Broken Banners, Living Blood"
mudd_legacy_5_name: "The River Remembers"


MUDD_CROWNED_BY_THE_TRIDENT_NO_BULLETTAB:0 "Our lineage commands a royal antiquity that existed thousands of years before the first Andal crusader ever crossed the narrow sea. We ruled the Riverlands as Kings of the Rivers and the Hills from our high seat of Oldstones, our sovereign authority woven directly into the mud, roots, and fens of the Trident by right of primordial time.\n#weak We are the ancient blood of the first peaks, and we refuse to crawl before upstart lords. Members of the Mudd dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

MUDD_TRISTIFERS_WAR_NO_BULLETTAB:0 "We carry the lethal, legendary strength of King Tristifer IV, the Hammer of the Andals, who smashed the foreign invaders in ninety-nine consecutive, blood-soaked battles. He was an absolute warrior without peer, slaughtered only when seven Andal kings combined their hosts to overwhelm his vanguard through sheer, cowardly numbers.\n#weak Bronze shatters iron, and our ancestral fury flattens the enemy's shieldwalls. Members of the Mudd dynasty are usually born [GetTrait('brave').GetName( GetNullCharacter )]."

MUDD_STONE_WITHOUT_CROWN_NO_BULLETTAB:0 "Though our kingdom shattered and our ancient palace became a ruin known only as Oldstones, the sacred memory of our bronze crown was never truly erased from the Trident. New-money lords built their keeps on lower ground, completely unable to defile the high, silent sepulcher where our ancient kings lie entombed.\n#weak The river no longer kneels, but it still murmurs our true name through the halls. Enables recruitment of [GetMaA('mudd_rivercrown_sentinels').GetName] as [men_at_arms|E]."

MUDD_BLOOD_IN_THE_MUD_NO_BULLETTAB:0 "Though our name was systematically wiped from the scrolls of southern maesters, our First Men bloodline survived as landless hedge knights, grim-faced brawlers, and Wall commanders. We have spent centuries hiding our identity in the dirt, waiting with an absolute, freezing patience for the great thaw.\n#weak The realm thought our line extinct, but our heritage is preserved in bone and iron."

MUDD_THE_RIVERS_CLAIM_NO_BULLETTAB:0 "The Trident splits, floods, and dries, but its currents will always belong to the true masters of the plain. We look upon the stone castles of the Andal upstarts as temporary monuments destined to crumble into the mud, ready to reassert our ancient, kingly dominance over every ford and ferry crossing.\n#weak Our bronze crown sank into the current, but the name has risen harder and stronger."


mudd_rivercrown_sentinels:0 "Oldstones Sentinel Vanguard"
mudd_rivercrown_sentinels_flavor:0 "Drawn from the most colossal, traditionalist First Men loyalists of the upper Blue Fork, these heavy shock infantrymen are the resurrected shield of House Mudd. Clad in heavy, overlapping bronze scale mail and wearing ancient crested helms, they carry massive rectangular shields and broad-bladed bronze axes. Drilled to hold river fords and ruined gateways with an absolute, machine-like campaign discipline, they fight with a grim, silent fanaticism, ready to collapse enemy infantry lines through raw physical mass."


building_type_agot_mudd_sentinels_rest:0 "Mudd Sentinels Rest"
building_agot_mudd_sentinels_rest_01:0 "The Overgrown Foundations"
building_agot_mudd_sentinels_rest_01_desc:0 "Choked with ivy, grey moss, and ancient rubble, this high earthen rampart was once the military headquarters of the legendary Rivercrown Sentinels. Clearing away the mud marks the first, unyielding step toward resurrecting your family's ancient sovereignty along the Red Fork."
building_agot_mudd_sentinels_rest_02:0 "The Rebuilt Scriptorium Vaults"
building_agot_mudd_sentinels_rest_02_desc:0 "The outpost's masonry walls have been cleared and its foundations set deep into the bedrock. Ancient First Men glyph-carvings are excavated from the dirt, while a new generation of heavy-footed sentinels gathers in the courtyard to train with iron broad-axes."
building_agot_mudd_sentinels_rest_03:0 "The Sentinel High Keep"
building_agot_mudd_sentinels_rest_03_desc:0 "The mountain fortress rises cleanly into the sky, constructed stone-for-stone exactly where our ancestors stood against the Andal crusaders. Its towering parapets command the strategic river crossings, housing deep arsenals of weapons forged in the old style."
building_agot_mudd_sentinels_rest_04:0 "The Citadel of the Oldstones Vanguard"
building_agot_mudd_sentinels_rest_04_desc:0 "No longer a ruin, this breathtaking palace fortress stands as the ultimate, triumphant monument to the restoration of House Mudd. Packed with massive armories and vaulted feasting halls, the completed citadel ensures your house fields a vanguard capable of reclaiming the entire Trident."



#GARDENER

gardener_legacy_track_name: "Gardener"
gardener_legacy_track_desc: "Spring Forth"
gardener_legacy_1_name: "From Garth’s Hand"
gardener_legacy_2_name: "Lords of the Oakenseat"
gardener_legacy_3_name: "Crown of Thorns"
gardener_legacy_4_name: "The Sage Kings"
gardener_legacy_5_name: "Ashes of the Field"

GARDENER_FROM_GARTHS_HAND_NO_BULLETTAB:0 "All kings of the Reach once claimed descent from Garth Greenhand, but only the Gardeners seated themselves atop the hill where Garth first sowed grain and peace. Garth the Gardener, his firstborn, planted more than seeds — he laid the foundation of a thousand-year dynasty. From that root sprang harvests, halls, and high blood that would shape every noble house in the Reach. Where the Gardeners walked, flowers followed.\n#weak Where the Greenhand walked, kingdoms grew. Gardeners tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

GARDENER_LORDS_OF_THE_OAKENSEAT_NO_BULLETTAB:0 "The Oakenseat — grown, not carved — was more than a throne. It was the Gardener kings’ living symbol of unity, rooted as their kingdom expanded from Highgarden to the reaches of Red Lake, Old Oak, and the Arbor. They conquered less often than they absorbed, and ruled through marriage and mutual oath. Their power was not in banners raised, but in banners gathered.\n#weak Their crown was peace, and their scepter was time. Gardeners tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

GARDENER_CROWN_OF_THORNS_NO_BULLETTAB:0 "Though their hands planted, they could also bleed. Garth V drove the Dornish from the Marches. Garth VII broke the Storm Kings and Ironborn alike and fortified the Shield Islands with men from the Mander. When the Gardeners went to war, they traded their floral crowns for bronze and later iron thorns — a warning that even peace’s keepers can strike like briars when trampled.\n#weak Their mercy was green. Their wrath was iron. Enables recruitment of [GetMaA('gardener_goldenhand_companions').GetName] as [men_at_arms|E].#!."

GARDENER_THE_SAGE_KINGS_NO_BULLETTAB:0 "The three Sage Kings — Garth IX, Merle I, and Gwayne V — welcomed the Andal wave not as invaders, but as opportunity. They built septs, took Andal brides, knighted Andal warriors, and forged a Reach that grew stronger through accord than any conquest could offer. In their time, the Faith of the Seven blossomed across the Reach like spring wheat — tended not by fire, but by foresight.\n#weak They planted faith. What grew was power."

GARDENER_ASHES_OF_THE_FIELD_NO_BULLETTAB:0 "King Mern IX Gardener commanded the might of the Reach in its final hour — golden-armored knights, proud bannermen, a thousand years of rule behind him. But against three dragons, no number was enough. At the Field of Fire, the Gardener line was burned root and stem. Yet their name echoes in song and coin, and their blood flows through the veins of Reachmen still — in truth or in claim.\n#weak The fire ended the line. It did not end the legacy."

gardener_goldenhand_companions:0 "Goldenhand Companions"
gardener_goldenhand_companions_flavor:0 "The Goldenhand Companions are the pride of House Gardener, mailed in heavy plate and drilled to fight as one. Unlike other knights who lower lances, these horsemen wield great warhammers, their charges breaking not only lines but bones and armor alike. They ride at the heart of Highgarden’s hosts, the chosen guard of kings, and are famed for their ruthless discipline in battle. To stand against them is to feel the weight of the Reach’s strength come crashing down in steel and stone."


#DURRANDON

durrandon_legacy_track_name: "Durrandon"
durrandon_legacy_track_desc: "Ours is the Fury"
durrandon_legacy_1_name: "Defiance of the Gods"
durrandon_legacy_2_name: "Storm’s End"
durrandon_legacy_3_name: "Thunder on the Marches"
durrandon_legacy_4_name: "Stormcrowned Lineage"
durrandon_legacy_5_name: "The Last Storm"

DURRANDON_DEFIANCE_OF_THE_GODS_NO_BULLETTAB:0 "In the Age of Heroes, Durran Godsgrief stood not against men, but against gods — and survived. He defied the Sea and the Wind, married their daughter, and built six castles that the gods tore down in wrath. But the seventh stood. From Storm’s End, he ruled beneath thundercloud and legend, unbent by divine fury. Storm's End has been called Durran's Defiance. That same defiance would live in the blood of kings who bore his name for a thousand years.\n#weak The storm broke upon his walls, and he stood. Durrandons tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

DURRANDON_STORMS_END_NO_BULLETTAB:0 "The walls of Storm’s End are said to have been shaped by sorcery or the hands of Bran the Builder himself. But its strength lay not just in stone, but in the will of those who ruled it. The Durrandons weathered waves, invasions, and centuries of border war — and the castle remained unbreached. It became a symbol of the Storm Kings themselves: implacable, unyielding, and rooted against the world’s fury.\n#weak The walls stood, because the kings behind them would not fall. Durrandons tend to be [GetTrait('strong').GetName( GetNullCharacter )]."

DURRANDON_THUNDER_ON_THE_MARCHES_NO_BULLETTAB:0 "From the Dornish Marches to the banks of the Trident, the Storm Kings spread their banners far beyond Storm’s End. They warred against the Reach, the riverlands, and the ironborn — sometimes losing ground, sometimes gaining kingdoms. Their thunder was heard on distant hills, and even when their power waned, their reputation for ferocity remained. They ruled with war in their blood and lightning in their name.\n#weak They ruled where the storm could reach. Enables recruitment of [GetMaA('durrandon_godsgrief_champions').GetName] as [men_at_arms|E].#!."

DURRANDON_STORMCROWNED_LINEAGE_NO_BULLETTAB:0 "The name Durran passed from father to son like a birthright — a reminder of the storm that founded their line. Through marriage and war, they forged a dynasty that lasted for millennia. Their blood runs through many lines, even beyond the ruin of their house. The Storm Kings did not simply rule — they endured, stubborn and proud, with thunder etched into every crest and oath.\n#weak The crown fell, but the storm passed on."

DURRANDON_THE_LAST_STORM_NO_BULLETTAB:0 "Argilac the Arrogant, last of the Storm Kings, stood against Aegon Targaryen when others bent the knee. Grey-haired, sword in hand, he died in battle — defiant to the end. His fall ended a dynasty that had outlasted gods, storms, and centuries. But he died as a Storm King: in fury, on his feet, and unbroken. His line perished, but his legacy would pass to the man who slew him — and to the storm that never truly stopped.\n#weak Some kings yield. Storm Kings do not. Durrandons can be [GetTrait('wrathful').GetName( GetNullCharacter )]."

durrandon_godsgrief_champions:0 "Godsgrief Champions"
durrandon_godsgrief_champions_flavor:0 "Named for the first Storm King who defied the gods and built a fortress where the sea breaks and the wind howls, the Godsgrief Champions are heavy infantry born of fury and stone. Trained on cliff and causeway, they charge into the storm with no hesitation or regret for what is to come."

#JUSTMAN

justman_legacy_track_name: "Justman"
justman_legacy_track_desc: "Balance the Scales"
justman_legacy_1_name: "The Bastard-King"
justman_legacy_2_name: "Crown of the Trident"
justman_legacy_3_name: "Peace by Pact and Blade"
justman_legacy_4_name: "Rule of the Just"
justman_legacy_5_name: "The Bloody Keep"


JUSTMAN_THE_BASTARD_KING_NO_BULLETTAB:0 "Our dynasty began with nothing but a scorned name—born from a scandalous, forbidden union between House Blackwood and House Bracken. Benedict Rivers bypassed his bastard birthright through raw military genius, forcing the most volatile houses in the Trident to sheathe their swords and accept his supreme, merit-based sovereignty.\n#weak We do not need ancient silk charters when our crown was carved by our own hand. Members of the Justman dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

JUSTMAN_CROWN_OF_THE_TRIDENT_NO_BULLETTAB:0 "In a lawless valley fractured by multi-generational blood-debts, Benedict the Just achieved what no conqueror had managed since the Dawn Age—he bound the entire Trident under a single, unyielding rule. He forced the petty river kings to lower their banners, replacing their endless border-reiving with an absolute rule of law.\n#weak The forks of the river bent before our courts, anchoring the realm in peace. Members of the Justman dynasty are frequently born [GetTrait('just').GetName( GetNullCharacter )]."

JUSTMAN_PEACE_BY_PACT_AND_BLADE_NO_BULLETTAB:0 "We expanded our sovereign boundaries not through reckless field campaigns, but through ironclad dynastic alliances and strategic marriage contracts. From the marsh-gates of the Neck to the wealthy ports of Maidenpool and Duskendale, neighboring lords signed our accords because they respected our word and feared our vanguard.\n#weak Feudal loyalty is an asset we cultivate with absolute precision. Enables recruitment of [GetMaA('justman_swords_of_justman').GetName] as [men_at_arms|E]."

JUSTMAN_RULE_OF_THE_JUST_NO_BULLETTAB:0 "For three glorious generations, the Riverlands knew a golden era of stability completely unmarred by Andal crusaders or ironborn raids. Our kings governed with a razor-sharp administrative clarity, breaking the pride of corrupt local barons and ensuring that the law of Riverrun served as both a protective shield and a executing sword.\n#weak True power is measured by the blood we spared and the order we maintained across the forks."

JUSTMAN_THE_BLOODY_KEEP_NO_BULLETTAB:0 "Our golden lineage was shattered by the mindless, backbearing treachery of the ironborn reivers who slaughtered our hostage princes at Pyke. Though the salt-kings butchered our heirs and threw their hearts into the sea to plunge the Trident into anarchy, the memory of our legal majesty remains permanently etched into the bones of the Riverlands.\n#weak What was built in absolute justice will be avenged with unyielding, northern iron."

justman_swords_of_justman:0 "Justman Justiciars"
justman_swords_of_justman_flavor:0 "Formed during the bloody campaigns that elevated Benedict Rivers from a scorned bastard to the high seat of the Trident, these elite heavy infantrymen are the iron enforcement arm of the Justman kings. Equipped with heavy mail, long-swords, and polished steel targes, they are drilled to march in rigid, machine-knee formations to suppress peasant riots and crush the vanguard of lawless border-barons. They have an absolute contempt for ancient family titles, answering strictly to the codified laws of the realm."


#GREYIRON

greyiron_legacy_track_name: "Greyiron"
greyiron_legacy_track_desc: "Let Him Cast Down"
greyiron_legacy_1_name: "Salt and Stone Kings"
greyiron_legacy_2_name: "The Axe Decides"
greyiron_legacy_3_name: "Reavers of the Reach"
greyiron_legacy_4_name: "Iron Rules Eternal"
greyiron_legacy_5_name: "The Drowning of Kings"

GREYIRON_SALT_AND_STONE_KINGS_NO_BULLETTAB:0 "The Greyirons of antiquity were rock and salt kings from the cliffs of Orkmont — a line of ironborn not crowned by birthright, but by wave and war. Urras Ironfoot was chosen as the first High King of the Iron Islands since the Grey King. After the death of Urras, his son claimed the throne as Erich I Greyiron. He stepped down when the prophet Galon Whitestaff threatened him with death for not being chosen by a kingsmoot. For centuries after, the high kings were chosen between the lords and captains of the Iron Islands in kingsmoots. They were chosen more often than any house in Iron Islands history, lifted by kingsmoot again and again because of strength, not name. According to Archmaester Haereg, the Greyirons had thirty-eight high kings chosen, twice as many as any other house. In some historical accounts, Qhored I Hoare, one of the greatest High Kings, is said to have been a Greyiron.  While other houses fought over old salt privileges, the Greyirons ruled, shaping an age of stone-crowned reavers and trueborn sea kings.\n#weak Not born to rule — built to endure. Greyirons can be [GetTrait('strong').GetName( GetNullCharacter )]."

GREYIRON_THE_AXE_DECIDES_NO_BULLETTAB:0 "When King Urragon III Greyiron died, his eldest son Torgon had been away raiding along the Mander. His brothers sent him no word of the kingsmoot, hoping that one of them would be chosen. However, Urrathon IV Goodbrother was chosen instead and later had all of Torgon's brothers killed. When Torgon returned he denounced the kingsmoot as unlawful and revolted against Urrathon, with the aid of priests, lords and Urrathon's own captains. Torgon and his son, Urragon IV Greyiron, ruled as high kings without having been chosen in kingsmoots. Urragon IV wanted the crown to pass to his great-nephew, Urron Greyiron, but the priests forced a kingsmoot. Urron descended with his axemen among the ironborn assembled on Nagga's Bones, murdering all their opponents and proclaiming himself king. The Greyirons did not rise by speech. Their law was writ in cleaved skulls and sharpened blades — an age of kings who answered challenge with silence and an axe.\n#weak In their house, the crown followed the axe. Greyirons tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

GREYIRON_REAVERS_OF_THE_REACH_NO_BULLETTAB:0 "Greyiron longships blackened the rivers of the Reach. They claimed the Cape of Eagles, harried the Mander, and drowned coastlines in blood. They were not builders of temples or keepers of peace — they ruled through plunder and shattered ports. Their coin was salt, their faith the flame, and their law the prow. Where the Greyiron sails passed, only wreckage remained.\n#weak When their sails were seen, prayers began. Enables recruitment of [GetMaA('greyiron_black_crown_reavers').GetName] as [men_at_arms|E].#!."

GREYIRON_IRON_RULES_ETERNAL_NO_BULLETTAB:0 "With Urron Greyiron came an end to the driftwood crowns. He shattered the kingsmoot, burned the old ways, and raised a black iron crown that passed from father to son. Lords who refused were broken, their lines ended. Tyranny replaced tradition — but from that, the Iron Islands knew an age of unbroken rule. It was not fair. It was not free. But it endured.\n#weak Iron does not yield. It reigns. Greyirons have been known to be [GetTrait('authoritative').GetName( GetNullCharacter )]."

GREYIRON_DROWNING_OF_KINGS_NO_BULLETTAB:0 "The Greyirons ruled the Iron Islands longer than any line since the Grey King — through axe, flame, and unyielding decree. But power bred enemies, and the end came not in glory, but revolt. Allied with Andal pirates, the Orkwoods, Drumms, Hoares, and Greyjoys rose in bloody rebellion. On Orkmont, their final king fell, and the black iron crown was shattered. The driftwood throne returned, but none forgot the thousand years of Greyiron dominion — nor how it ended, drowned in betrayal and salt.\n#weak Even iron sinks, if you hammer it long enough."

greyiron_black_crown_reavers:0 "Black Crown Reavers"
greyiron_black_crown_reavers_flavor:0 "Feared across the Iron Islands and beyond, the Black Crown Reavers served as the mailed enforcers of a dynasty that ruled by axe and fire. Cloaked in sea-dark mail and wielding iron axes, they enforced the king’s law on rock, reef, and riverbank alike. Raised on Orkmont and hardened in conquest, they struck with discipline where others plundered with chaos. When these reavers landed, they did not take tribute — they took obedience." 

#LOTHSTON

lothston_legacy_track_name: "Lothston"
lothston_legacy_track_desc: "Keep To The Night"
lothston_legacy_1_name: "Hedge to Hall"
lothston_legacy_2_name: "Masks and Monsters"
lothston_legacy_3_name: "Crown and Cloak"
lothston_legacy_4_name: "The Night Tower"
lothston_legacy_5_name: "The House That Vanished"


LOTHSTON_HEDGE_TO_HALL_NO_BULLETTAB:0 "Our lineage was not born from ancient kings or high-born silk; we rose from landless hedge-knights who bled for the cruelest masters in the realm. From Ser Guy dying for Maegor in the Trial of Seven to our ascent as masters of Harrenhal, we climbed the feudal ladder through ruthless opportunism and dark royal favor.\n#weak We seized the grandest castle in the Seven Kingdoms, unbothered by its curses. Members of the Lothston dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

LOTHSTON_MASKS_AND_MONSTERS_NO_BULLETTAB:0 "We do not hide our monstrous, black-hearted pragmatism behind hollow southern chivalry. We remember Lucas 'the Pander' trading his own wife and daughter to Aegon the Unworthy for political leverage, and his brother Manfryd of the Black Hood executing the Crown's filthiest commands from the dungeons of the Red Keep.\n#weak We weaponize absolute dread, our name a useful terror to our allies and a grave to our foes. Enables recruitment of [GetMaA('lothston_blackwing_stalkers').GetName] as [men_at_arms|E]."

LOTHSTON_CROWN_AND_CLOAK_NO_BULLETTAB:0 "Our house has survived centuries of dynastic civil wars by mastering the cold, cynical art of total political duplicity. We served Aegon IV's debauchery with absolute discretion, and we signed contracts with Daemon Blackfyre only to switch sides and betray the rebels the moment the political winds favored the Iron Throne.\n#weak Feudal loyalty is an asset we trade for gold, our silence bought at a heavy price."

LOTHSTON_THE_NIGHT_TOWER_NO_BULLETTAB:0 "We carry the terrifying, blood-chilling legacy of Lady Danelle Lothston—the infamous Mad Danelle who rode to war in black plate mail. We embrace the dark whispers of her nocturnal blood-baths, her disappeared servants, and the swarms of giant bats that snatched smallfolk children from their beds to feed her madness.\n#weak We make the dark curses of Harrenhal sing, our lineage touched by the deep sorceries of the earth. Members of the Lothston dynasty are frequently born [GetTrait('eccentric').GetName( GetNullCharacter )], though many carry the secret mark of a [GetTrait('witch').GetName( GetNullCharacter )]."

LOTHSTON_THE_HOUSE_THAT_VANISHED_NO_BULLETTAB:0 "Though our house was systematically wiped from the face of Westeros by royal steel, our shadow has never lifted from the Trident. The smallfolk still avert their eyes when the bats fly lower at dusk, and our unyielding, dark footprints remain permanently etched into the melted, black stone of the Kingspyre Tower.\n#weak We vanished into the ash, but the Riverlands will never forget the screech of the bat."


lothston_blackwing_stalkers:0 "Blackwing Stalkers"
lothston_blackwing_stalkers_flavor:0 "Drawn from the most brutal poachers, marsh-thugs, and unprincipled outlaws of the Gods Eye fens, these elite marksmen are the hidden eyes of Harrenhal. Clad in soot-smeared, marsh-grey leathers and dark sashes designed to mimic the nocturnal bats of Mad Danelle's era, they move through the ruins and weeping stone in absolute silence. They utilize heavy yew longbows and black-shafted arrows dipped in nightshade, specializing in high-dread ambush tactics and the cold-blooded liquidation of enemy outriders before first light."


#CASTERLY

casterly_legacy_track_name: "Casterly"
casterly_legacy_track_desc: "Golden Roots"
casterly_legacy_1_name: "Golden-Favored"
casterly_legacy_2_name: "Carved from Stone"
casterly_legacy_3_name: "Sun-Shaft Gold"
casterly_legacy_4_name: "Ghosts in the Rock"
casterly_legacy_5_name: "The First Lions"

CASTERLY_GOLDEN_FAVORED_NO_BULLETTAB:0 "According to legend, the founder of House Casterly was the huntsman Corlos, son of Caster, who lived in a village near where Lannisport eventually sprang up. When a lion began preying upon the village's sheep, Corlos tracked him back to his den, a cave in the base of the nearby mountain. Armed only with a spear, Corlos slew the lion and his mate, but spared her newborn cubs. This act of mercy pleased the old gods, who took favor on Corlos and sent a shaft of sunlight deep into the cave, which revealed endless gold, and the Rock was shaped by hands made rich. In time, their coffers rivaled kings, yet their fortune never birthed a crown. The veins beneath the Rock still remember their chosen line.\n#weak The Rock gleams brightest for its first sons. Casterlys tend to be [GetTrait('greedy').GetName( GetNullCharacter )]."

CASTERLY_CARVED_FROM_STONE_NO_BULLETTAB:0 "To defend his treasure, Corlos moved inside the cave and fortified the entrance. As time passed, the Casterlys delved deeper into the earth, creating halls, galleries, stairways, and tunnels, into what became known as Casterly Rock. The Casterlys tunneled halls through mountain and bone in the belly of the world. Long before Lannisport’s walls rose, the Rock was a city of stone. Its passageways remain today, filled with dust—and secrets.\n#weak The mountain is their monument—and tomb. Enables recruitment of [GetMaA('casterly_goldcloaks').GetName] as [men_at_arms|E].#!."

CASTERLY_SUN_GOLD_NO_BULLETTAB:0 "The old tales speak of sunlight revealing gold, but it was vision, not luck, that built the Rock. With coin came roads, markets, and men bound in gold-threaded oaths. Their dominion was not declared—it was bought, mined, and made to last.\n#weak The Rock yields more than gold—it yields greatness. Casterlys tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

CASTERLY_GHOSTS_IN_THE_ROCK_NO_BULLETTAB:0 "Legends claim that the Andal adventurer Lann the Clever tricked Casterly Rock from the Casterlys, although his methods vary in different stories. The most common tale is that Lann coated himself with butter and squeezed into the Rock through a narrow gap. Once inside, he played tricks on the Casterlys to convince them their home was haunted so they would flee. Another story claims Lann filled the Rock with vermin to drive out the Casterlys. Some stories have Lann smuggling lions into the Rock to kill the male Casterlys, and the rogue then secretly impregnated the Casterly women. Lann the Clever’s tricks still echo in the tales. The truth? Lost to shadow. But the Rock remembers, and those who dwell within have learned to listen to the walls.\n#weak Only a fool forgets what lives in the walls."

CASTERLY_THE_FIRST_LIONS_NO_BULLETTAB:0 "Before the Lannisters wore golden cloaks, the Casterlys stood proud atop the Rock. They ruled not by crown but by wealth, not by war but by stone and strength. Though their name was lost, their blood carved the foundations of lion pride.\n#weak Lann may wear the mane—but the bones of the lion are Casterly. Casterlys tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

casterly_goldcloaks:0 "Goldcloaks of the Rock"
casterly_goldcloaks_flavor:0 "The Goldcloaks of the Rock are no mere city guards, but elite household warriors armored in richly-gilded plate and trained to defend the halls of Casterly Rock. Descended from the elite guard of House Casterly, their gleaming cloaks and lion-crested helms are a warning to all: the Rock stands watchful. Unflinching in shieldwall and swift in pursuit, they are discipline clad in gold."

#QOHERYS

qoherys_legacy_track_name: "Qoherys"
qoherys_legacy_track_desc: "Blood for Blood"
qoherys_legacy_1_name: "Scorched Throne"
qoherys_legacy_2_name: "Sword of the Conqueror"
qoherys_legacy_3_name: "Valyrian by Blood"
qoherys_legacy_4_name: "Echoes in the Vaults"
qoherys_legacy_5_name: "House of Curses"

QOHERYS_SCORCHED_THRONE_NO_BULLETTAB:0 "With Hoare’s fall came opportunity, and Ser Quenton Qoherys seized it. Granted the ashes of Harrenhal by Aegon the Conqueror, he became the first to rule the charred ruin — its blackened towers a symbol of fire’s triumph over iron.\n#weak The first lords of Harrenhal reborn, they sat a throne still warm from dragonflame. Enables recruitment of [GetMaA('qoherys_blackened_blades').GetName] as [men_at_arms|E].#!." 

QOHERYS_SWORD_OF_THE_CONQUEROR_NO_BULLETTAB:0 "Ser Quenton Qoherys was the first of his line to be raised by the Conqueror — knighted on Dragonstone, hardened by war, and given the black crown’s largest ruin to rule. From swordmaster to lord, the Qoherys name carried steel and loyalty alike.\n#weak Their rise was swift — as was their fall. Qoherys usually are [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]s."

QOHERYS_VALYRIAN_BY_BLOOD_NO_BULLETTAB:0 "The Qoherys claimed descent from the dragonlords, though they ruled no dragons of their own. House Qoherys bore the mark of Old Valyria — with silver hair in some branches, and ambition in all. Their heritage was quiet, but not forgotten. Where fire had once ruled, embers of legacy endured.\n#weak Bloodlines don’t need wings to fly — only time and memory. Qoherys tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]." 

QOHERYS_ECHOES_IN_THE_VAULTS_NO_BULLETTAB:0 "When his grandsire, Quenton Qoherys, received the lordship of Harrenhal in 2 AC from King Aegon I Targaryen, the succession of the newly-created House Qoherys was assured as Quenton had two strong sons and one plump grandson, Gargon. However, when Lord Quenton died from a fall from his horse in 9 AC, Gargon directly succeeded him. Gargon was fat and considered foolish. He had a lusty appetite and was known to attend each wedding in his domain to take advantage of the lord's right to the first night, giving him the nickname Gargon the Guest. During the rebellion of Harren the Red in 37 AC, the father of a maid deflowered by Gargon allowed Harren to enter Harrenhal. Harren and his outlaws dragged Gargon from his bed to the castle godswood, where he sliced off Gargon's genitals, and fed them to a dog while Gargon bled to death. Though Qoherys rule at Harrenhal was short, their mark was left in shadowed crypts and fire-blasted halls. Blackened vaults remember voices long vanished — and sometimes speak them back.\n#weak Harrenhal remembers all who dare to rule it. Qoherys can be [GetTrait('lustful').GetName( GetNullCharacter )]."

QOHERYS_HOUSE_OF_CURSES_NO_BULLETTAB:0 "Every House that rules Harrenhal earns a place in the book of ghosts — and Qoherys inked the first page. Their brief tenure ended in fire and rebellion, a harbinger of the doom that would follow every lord after. Their name lingers not in triumph, but in dread — as a warning to those who would rule the greatest ruin in the realm.\n#weak To rule Harrenhal is to dance with ruin."

qoherys_blackened_blades:0 "Blackened Blades"
qoherys_blackened_blades_flavor:0 "Riding from the blackened halls of Harrenhal, the Blacked Blades are cavalry without mercy. Clad in scorched plate and wielding cruel, darkened steel, they strike like fire and vanish like smoke. Survivors speak of the thunder of hooves and shadowed steel — and the silence that follows."

#BAR EMMON

bar_emmon_legacy_track_name: "Bar Emmon"
bar_emmon_legacy_track_desc: "Claim the Crest"
bar_emmon_legacy_1_name: "Kings of the Hook"
bar_emmon_legacy_2_name: "Edge of the Storm"
bar_emmon_legacy_3_name: "Favored of Dragonstone"
bar_emmon_legacy_4_name: "Touched by the Shivers"
bar_emmon_legacy_5_name: "Point of Blades and Blood"

BAR_EMMON_HOOK_KINGS_NO_BULLETTAB:0 "Before dragons came to Westeros, the Bar Emmons were kings in their own right, carving a petty realm on Massey’s Hook through marriage, conquest, and cunning. Togarion Bar Emmon was an Andal warlord who founded a small kingdom north of the Blackwater Rush during the Andal invasion, but he was opposed by the more powerful Darklyn kings of Duskendale. Sensing a weakness to the south, Togarion married the daughter of King Josua Massey of Stonedance, himself a rival to the Storm King Qarlton II Durrandon, and the Bar Emmons abandoned the Blackwater for Massey's Hook. Although Qarlton defeated Josua, Togarion drove the stormlanders from Stonedance, built Sharp Point as the new seat for House Bar Emmon, and established a kingdom on Massey's Hook with the son of Josua as a puppet. Though overshadowed by Duskendale and Storm's End, they ruled from the Blackwater to the cliffs of Sharp Point — defiant, independent, and proud. Their line remembers not servitude, but sovereignty.\n#weak The crown may be gone, but not the blood that bore it. Bar Emmons tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]." 

BAR_EMMON_EDGE_OF_THE_STORM_NO_BULLETTAB:0 "From the time of the Andals, House Bar Emmon stood between greater powers: the sea to the east, Storm’s End to the south, and Duskendale to the north. From Durrandon raids to the vengeful wrath of Argilac, House Bar Emmon held fast at the storm’s edge. Sharpened by centuries of border war, they have learned to weather every siege, and strike when winds turn.\n#weak The Hook is never truly held unless we yield it. Enables recruitment of [GetMaA('bar_emmon_hook_riders').GetName] as [men_at_arms|E].#!."

BAR_EMMON_FAVORED_OF_DRAGONSTONE_NO_BULLETTAB:0 "When Aegon the Conqueror set foot upon the mainland, the Bar Emmons chose dragonfire over drowned honor — turning against their Storm King to back the Targaryens. Their loyalty earned them the favor of Dragonstone and a place in the new Crownlands. Ever since, they have served the Iron Throne not as mere vassals, but as those who helped forge it.\n#weak First to kneel, first to rise. Bar Emmons tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]." 

BAR_EMMON_TOUCHED_BY_THE_SHIVERS_NO_BULLETTAB:0 "The Shivers came like a second Doom. Whole houses perished. Lords choked on their last breath. But at Sharp Point, they endured. Whether by luck, salt air, or iron will, the Bar Emmons survived what slew so many. Their halls are quieter now, their bloodline leaner — but those who remain carry plague-hardened blood and the memories of smoke and mourning pyres.\n#weak Death knocked. We answered defiantly."

BAR_EMMON_POINT_OF_BLADES_AND_BLOOD_NO_BULLETTAB:0 "Sharp Point was not built for ease — it was built to last. A fortress carved into the cliffs, it trains every heir in the cold wind and sharper discipline of Massey’s Hook. Here, knights are made not in tourneys, but in the spray of sea and battle. The Bar Emmons lead from the front — never far from a blade, never far from blood.\n#weak From spearpoint to shipboard, they do not flinch." 

bar_emmon_hook_riders:0 "Hook Riders"
bar_emmon_hook_riders_flavor:0 "Light and fast, the Hook  Riders of House Bar Emmon are trained for hit-and-run raids along the jagged coasts of Massey’s Hook. Clad in leather and storm-painted cloaks, they fight with curved sabers and throw-spears, using the terrain to their advantage. Descended from the swift raiders of the Blackwater, they are scouts, flankers, and harriers — masters of terrain, tempo, and the tides of battle."

#CRABB

crabb_legacy_track_name: "Crabb"
crabb_legacy_track_desc: "Strength in Whispers"
crabb_legacy_1_name: "Whispers of the Severed"
crabb_legacy_2_name: "Champions of the Crackclaw"
crabb_legacy_3_name: "The Whispers Remember"
crabb_legacy_4_name: "Kingsguard’s Honor"
crabb_legacy_5_name: "Legends Never Die"

CRABB_WHISPERS_OF_THE_SEVERED_NO_BULLETTAB:0 "At the ruined seat called the Whispers, Ser Clarence Crabb brought home the severed heads of pirates, knights, and lords. His wife, said to have the gift of necromancy, raised them to whisper counsel from beyond the grave. Whether truth or tale, the Crabbs grew amidst shadows of superstition and dread, earning a name half-feared and half-mocked.\n#weak Whispers and grim counsel shaped their line, giving them eyes for secrets and steel for survival. Crabbs can be [GetTrait('cynical').GetName( GetNullCharacter )]."

CRABB_CHAMPIONS_OF_THE_CRACKCLAW_NO_BULLETTAB:0 "Ser Clarence Crabb, giant of Crackclaw, strode in the age of heroes, slaying pirates and challengers alike. Centuries later, Crabbs like Ser Clement shattered lances in royal tourneys, while Ser Rupert and Ser Clarence the Short took the white cloak of the Kingsguard. From marsh to king’s hall, the Crabbs proved themselves champions.\n#weak Boldness and blade-skill are their inheritance, and their names are bound to tourney, trial, and tale. Crabbs tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

CRABB_THE_WHISPERS_REMEMBER_NO_BULLETTAB:0 "The ruined Whispers remains haunted in song and story. Travelers tell of voices drifting through the pines and caverns where Clarence once kept his trophies. Even ruined, the place lends the Crabbs an aura of menace, whispered of in the halls of greater lords. Friend and foe alike recall their ruin as both curse and warning.\n#weak Fear is its own fortress, and the Whispers cast a shadow longer than stone. Enables recruitment of [GetMaA('crabb_whispering_spears').GetName] as [men_at_arms|E].#!."

CRABB_KINGSGUARDS_HONOR_NO_BULLETTAB:0 "Few houses of Crackclaw could boast knights of the Kingsguard, yet the Crabbs did. Ser Clement Crabb broke thirty lances against Ryam Redwyne and was crowned co-champion by Jaehaerys himself. Others of the name, Ser Rupert and Clarence the Short, bore the white cloak in the service of king and realm. In their honor, the Crabbs claimed a nobility beyond their marshes.\n#weak The white cloak, once worn, lent their line an enduring sheen of valor and service."

CRABB_LEGENDS_NEVER_DIE_NO_BULLETTAB:0 "The songs of Crackclaw still whisper of Old Crackbones, Clarence the Short, and the giant Ser Clarence himself. Though their seat lies in ruins and their fortunes dim, the legends endure. Crackclaw folk remember their heroes, and foes remember their fears. To live in story is to live forever, and the Crabbs’ name lingers as long as songs are sung.\n#weak Ruined castles may fall, but legends outlive stone and steel alike. Crabbs can be [GetTrait('ambitious').GetName( GetNullCharacter )]."

crabb_whispering_spears:0 "Whispering Spears"
crabb_whispering_spears_flavor:0 "Marsh‑born and pine‑trained, the Whispering Spears lock shields where roads sink to mud and voices seem to ride the wind from the ruined Whispers. Crackclaw men swear the heads of pirates and lords still murmur counsel in those halls; the Crabbs learned to listen—and to hold. Against thundering horse and glittering charge, their answer is iron tips, rooted feet, and a wall that does not yield."

#BRUNE

brune_legacy_track_name: "Brune"
brune_legacy_track_desc: "Only Our Arms"
brune_legacy_1_name: "Half-Wild Blood"
brune_legacy_2_name: "Bernarr’s Valor"
brune_legacy_3_name: "Champions of Crackclaw"
brune_legacy_4_name: "Brothers Brune"
brune_legacy_5_name: "Crooked Towers Endure"

BRUNE_HALF_WILD_BLOOD_NO_BULLETTAB:0 "Archmaester Gyldayn called the Brunes of Crackclaw 'half-wild,' and so they remain—descendants of the First Men hardened in pine forest and limestone hill. Their blood is fierce, their ways untamed, their loyalty bitter as saltmarsh brine. That feral resilience yet lingers.\n#weak From forest and fen comes a savage strength. Brunes tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

BRUNE_BERNARRS_VALOR_NO_BULLETTAB:0 "Bernarr Brune, squire to Lord Alyn Stokeworth, earned knighthood in fire and blood—slaying Harren the Red in rebellion and later standing among the seven for Maegor Targaryen. His valor in trial and battle set his line apart as true champions of king and realm.\n#weak To fight in open honor is the Brune way. Brunes tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

BRUNE_CHAMPIONS_OF_CRACKCLAW_NO_BULLETTAB:0 "For centuries the Brunes have risen as champions—defending Crackclaw’s hills, caverns, and coasts against Andal, Darklyn, and Mooton alike. When outsiders came, the Brunes met them with iron in hand, their kin sworn to shield their own.\n#weak Champions, not chattel. Enables recruitment of [GetMaA('brune_crackclaw_champions').GetName] as [men_at_arms|E].#!."

BRUNE_BROTHERS_BRUNE_NO_BULLETTAB:0 "The Brothers Brune were Crackclaw’s champions of old, bringing brief peace to the quarrelsome lords of the Point. Their blades carved unity where words faltered, and their legacy of kinship and defense lingers in Brownhollow and Dyre Den alike.\n#weak To stand together is to live on in history."

BRUNE_CROOKED_TOWERS_ENDURE_NO_BULLETTAB:0 "Dyre Den’s crooked towers and its cliffs have have long weathered storm, sea, and siege. Though lords may scorn them as backwoodsmen, the Brunes endure where greater names fall—steadfast as their stone keeps upon the Crackclaw cliffs.\n#weak Crooked, scarred, and stubborn—yet unfallen."

brune_crackclaw_champions:0 "Crackclaw Champions"
brune_crackclaw_champions_flavor:0 "Sworn from Brownhollow’s crooked towers and the Dyre Den’s cliff‑hall, these shielded heavy infantry fight best where roads die: pine‑shadowed woods, limestone hills, and sucking bog. The Brunes learned long ago that Crackclaw is won not by pretty charges but by grit—shields locked, blades low, and no step yielded."

building_type_agot_brune_dyre_den_01:0 "The Dyre Den"
building_agot_brune_dyre_den_01:0 "The Dyre Den"
building_agot_brune_dyre_den_01_desc:0 "Perched on a cliffside above the sucking bogs and pine-shadowed trails of Crackclaw Point, the Dyre Den is more lair than keep — its crooked towers and narrow halls carved into the rock itself. From this ancient stronghold, the Brunes have watched the roads from Maidenpool since the days when Old Crackbones roamed. The Den is a fortress of stubborn stone, feared for its defenders and the treacherous terrain that swallows the unwise."

#ROSBY

rosby_legacy_track_name: "Rosby"
rosby_legacy_track_desc: "Soil Not Our Cloaks"
rosby_legacy_1_name: "Bend the Knee to Fire"
rosby_legacy_2_name: "Hemlock Cup"
rosby_legacy_3_name: "Wardens of the Sands"
rosby_legacy_4_name: "Trial by Seven"
rosby_legacy_5_name: "Crownlands Steadfast"

ROSBY_BEND_THE_KNEE_TO_FIRE_NO_BULLETTAB:0 "When Rhaenys Targaryen came on Meraxes, House Rosby chose prudence over pride and yielded their keys without a drop of blood. Thus were their fields spared the shadow of dragonflame, and their name stitched early into the royal standard as the Crownlands took shape about Aegon’s new city.\n#weak The first to bend often stand longest. Rosbys tend to be [GetTrait('content').GetName( GetNullCharacter )]."

ROSBY_HEMLOCK_CUP_NO_BULLETTAB:0 "When Maegor’s doom came, Lord Rosby did not flee the falling tower; he drank the hemlock and followed his king into the dark. Jaehaerys forgave the lord’s young son at Dragonstone, a mercy that bound Rosby tighter to the Iron Throne than any chain of gold.\n#weak Their loyalty is quiet, and it cuts both ways. Rosbys tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

ROSBY_WARDENS_OF_THE_SANDS_NO_BULLETTAB:0 "In the First Dornish War, Aegon I named Lord Jon Rosby Warden of the Sands, trusting a quiet Crownlands house with a hard country and a harder charge. Jon’s end—cast from the heights in the Defenestration of Sunspear—was as stark as the honor he bore, and the tale still travels farther than the dunes.\n#weak Command is a crown of thorns; Rosby wore it without complaint. Enables recruitment of [GetMaA('rosby_ermine_shields').GetName] as [men_at_arms|E].#!."

ROSBY_TRIAL_BY_SEVEN_NO_BULLETTAB:0 "Ser Rayford Rosby stood for Maegor at the Trial of Seven, steel drawn when most saw only doom. He fell in that brutal passage of arms, but his name passed into the short roll of those who held when giants shook. Rosby remembers its dead—soldier, champion, and loyalist alike.\n#weak Where duty calls, Rosby answers—even unto death."

ROSBY_CROWNLANDS_STEADFAST_NO_BULLETTAB:0 "Plague and purge, rebellion and regency—the Crownlands have known them all, and Rosby has kept the roads open to the Red Keep through each turn of fortune. From pale harvests during the Shivers of 59 AC to musters at King’s Landing’s gates, they endure as small lords with a great habit of service.\n#weak Between city and crown stands Rosby: plain, patient, and proven."

rosby_ermine_shields:0 "Ermine Shields"
rosby_ermine_shields_flavor:0 "Ermine tabards and red chevrons mark the tollhouse guards of Rosby, posted along the Crownlands roads toward King’s Landing. The Rosbys are not famed for robust stock, but their Ermine Shields are kept to steady duties—holding posts, keeping the books, and seeing coin and carts through without fuss."


#STOKEWORTH

stokeworth_legacy_track_name: "Stokeworth"
stokeworth_legacy_track_desc: "Proud to be Faithful"
stokeworth_legacy_1_name: "Ashes of Vhagar"
stokeworth_legacy_2_name: "Hand of the King's Duty"
stokeworth_legacy_3_name: "Against Harren the Red"
stokeworth_legacy_4_name: "Maegor’s Last Loyalists"
stokeworth_legacy_5_name: "Companions of Rhaena"

STOKEWORTH_ASHES_OF_VHAGAR_NO_BULLETTAB:0 "When Visenya Targaryen descended upon Stokeworth astride mighty Vhagar, fire consumed the castle’s roofs and smoke choked the air. Yet rather than perish in proud defiance, House Stokeworth yielded swiftly, preserving its bloodline and keep. From that day forward, the ash-scarred beams of their halls have stood as a reminder: wisdom often lies in bending when dragons rule the sky.\n#weak The memory of dragonflame bred a dynasty cautious but enduring, ever wary of the cost of pride. Stokeworths tend to be [GetTrait('humble').GetName( GetNullCharacter )]."

STOKEWORTH_HAND_OF_THE_KING_NO_BULLETTAB:0 "Lord Alyn Stokeworth rose to stand among the highest of the realm, serving as Hand to both Aegon the Conqueror and his son Aenys. Tasked with tearing down the wooden Aegonfort and raising the Red Keep in its place, he left his mark upon the very stone foundations of King’s Landing. Few lords of such modest standing have ever stood so close to the heart of rule, shaping both walls and policy at a king’s side.\n#weak Duty and stewardship raised House Stokeworth high. Stokeworths tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

STOKEWORTH_AGAINST_HARREN_RED_NO_BULLETTAB:0 "When rebellion rose in the riverlands, Lord Alyn Stokeworth led men into the mire in the king’s cause, hunting the outlaw Harren the Red. Though he met his death beneath rebel blades, his honor was avenged by his squire Bernarr Brune, who cut down the traitor. The tale of sacrifice and vengeance bound Stokeworth’s name with blood and loyalty, remembered in both sorrow and pride.\n#weak To stand when called, and to bleed if need be—that is the Stokeworth charge. Enables recruitment of [GetMaA('stokeworth_redwatch').GetName] as [men_at_arms|E].#!."

STOKEWORTH_MAEGORS_LOYALISTS_NO_BULLETTAB:0 "When the realm turned from Maegor the Cruel to Prince Jaehaerys, most banners fell away. Yet among the last to answer Maegor’s summons were the men of Stokeworth, who marched when others balked. Their loyalty was firm, though their flight after Maegor’s mysterious death upon the Iron Throne showed a house equally gifted in survival. Both their faithfulness and their caution entered Crownlands lore.\n#weak To serve faithfully, yet know when to step aside—such is the balance Stokeworth has walked for centuries."

STOKEWORTH_COMPANIONS_OF_RHAENA_NO_BULLETTAB:0 "Lady Samantha Stokeworth, daughter of Hand Alyn, was cherished companion to Princess Rhaena Targaryen. She shared in the princess’s triumphs and sorrows, from wedding feasts at Fair Isle to the poisoned cups of Dragonstone, where jealousy cut her life short. Her loyalty in life and the tragedy of her death forever entwined Stokeworth with the fate of the dragonlords. Their halls remember the laughter of queens, the whispers of courts, and the dangers of royal favor.\n#weak Tied by friendship, remembered by sorrow. Stokeworths tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

stokeworth_redwatch:0 "Stokeworth Redwatch"
stokeworth_redwatch_flavor:0 "Formed in memory of Lord Alyn’s fall at the hands of Harren the Red, the Redwatch are the pride of House Stokeworth. Armed with powerful crossbows and swords, they keep a tireless vigil from battlements and field lines alike, sworn to guard against traitors and outlaws who would repeat that treachery. To foes, the Redwatch are a warning; to Stokeworth, they are a living oath that no lord shall fall unavenged again."

building_type_agot_stokeworth_ledger_hall_01:0 "Stokeworth Hall"
building_agot_stokeworth_ledger_hall_01:0 "Stokeworth Ledger Hall"
building_agot_stokeworth_ledger_hall_01_desc:0 "A modest chamber of scribes and stewards, the Ledger Hall tracks harvests, taxes, and tithes throughout the local lands. In the shadow of King's Landing, Stokeworth thrives through diligence and discretion."

building_agot_stokeworth_ledger_hall_02:0 "Crown Tax Auditors' Court"
building_agot_stokeworth_ledger_hall_02_desc:0 "Now a formal court for tax review and grain inspection, this Stokeworth chamber hosts Crown officials who ensure that the gold of the realm flows true. With scrolls, seals, and quiet influence, the village grows in stature."

building_agot_stokeworth_ledger_hall_03:0 "Royal Assay Tower"
building_agot_stokeworth_ledger_hall_03_desc:0 "Crowned with an iron seal and banners of red and gold, the Royal Assay Tower oversees coin-weighing, gold purity, and tax quotas across the Crownlands. It is here that scribes, treasurers, and quiet power gather — all under the Iron Throne’s watchful eye."

#STAUNTON

staunton_legacy_track_name: "Staunton"
staunton_legacy_track_desc: "Heed Our Voice"
staunton_legacy_1_name: "Oaths to the Iron Throne"
staunton_legacy_2_name: "Maegor’s Men"
staunton_legacy_3_name: "The Yield at the Red Keep"
staunton_legacy_4_name: "Lands Surrendered, Name Preserved"
staunton_legacy_5_name: "Voices at Dragonstone"

STAUNTON_OATHS_TO_THE_IRON_THRONE_NO_BULLETTAB:0 "From Aegon’s Conquest onward, the Stauntons swore their oaths close to dragon thrones and city walls. Lesser in might than their neighbors, they learned early that nearness to power—kept with courtesy and service—was the surest shield a small house could raise.\n#weak Oath and obedience, paid promptly, kept them whole. Stauntons tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

STAUNTON_MAEGORS_MEN_NO_BULLETTAB:0 "When Maegor the Cruel called, Staunton men still came. It was not love of his rule but the old habit of duty: banners raised when a crowned head commands. In grim seasons a house is weighed by how it keeps its word; the Stauntons kept theirs, and were marked for it.\n#weak Loyalty has a cost; the Stauntons counted it and paid. Stauntons tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

STAUNTON_YIELD_AT_THE_RED_KEEP_NO_BULLETTAB:0 "With Lords Darklyn and Towers, Lord Staunton yielded the Red Keep itself to Jaehaerys, Rhaena, and Alysanne. Cast into the black cells and spared only by a new king’s mercy, they chose survival over vainglory and lived to see another dawn.\n#weak A wise yield today may guard a hundred tomorrows. Enables recruitment of [GetMaA('staunton_black_rook_archers').GetName] as [men_at_arms|E].#!."

STAUNTON_LANDS_SURRENDERED_NAME_PRESERVED_NO_BULLETTAB:0 "Pardoned by Jaehaerys after ceding part of their lands, the Stauntons learned the balance between soil and name. Castles can be rebuilt, fields resown—bloodlines once broken are not so mended. They let go of acres and held fast to lineage.\n#weak Give ground, keep the house."

STAUNTON_VOICES_AT_DRAGONSTONE_NO_BULLETTAB:0 "When the young Jaehaerys kept his court upon Dragonstone, Lord Staunton crossed the Narrow Sea’s winds to speak where few were bid. A small lord’s counsel at a dragon’s hearth—quiet words set close to the blaze—can warm a house for generations.\n#weak Proximity to power is a coin; Staunton learned how to spend it."

staunton_black_rook_archers:0 "Black Rook Archers"
staunton_black_rook_archers_flavor:0 "Under the black rook of Rook’s Rest, these bowmen watch the cliffs and road below. From palisade and wooded slope they loose in cold, ordered volleys—guides by day, warning by night—until the sky itself seems feathered."

#SUNGLASS

sunglass_legacy_track_name: "Sunglass"
sunglass_legacy_track_desc: "Follow their Light"
sunglass_legacy_1_name: "Sweetport Mariners"
sunglass_legacy_2_name: "Faithful of the Seven"
sunglass_legacy_3_name: "Dragonstone Bannermen"
sunglass_legacy_4_name: "Unbending in Faith"
sunglass_legacy_5_name: "Light of Sweetport"

SUNGLASS_SWEETPORT_MARINERS_NO_BULLETTAB:0 "Sweetport Sound fed House Sunglass with ships and tariffs, their quays thronged with galleys bound for Dragonstone. They learned the quiet strengths of tide and trade, and how to move men and messages where the Crown most needed them.\n#weak A steady harbor is a stronger wall than pride. House Sunglass members tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

SUNGLASS_FAITHFUL_OF_THE_SEVEN_NO_BULLETTAB:0 "From sept bells to silent prayer, the Sunglasses were known as devout Crownlanders whose piety lent them honor among Westerosi lords. Their faith would one day be tested by new flames, but their vows did not bend.\n#weak What is sworn before the Seven is kept in blood. House Sunglass members tend to be [GetTrait('zealous').GetName( GetNullCharacter )]."

SUNGLASS_DRAGONSTONE_BANNERMEN_NO_BULLETTAB:0 "For generations the Sunglasses bent the knee to Dragonstone, answering first when Targaryen banners rose above the sea. A small house, raised by long service, they stood close to princes whose words could set kingdoms alight.\n#weak Proximity to dragons made their voices carry farther than their levies. Enables recruitment of [GetMaA('sunglass_sweetport_oathmen').GetName] as [men_at_arms|E].#!."

SUNGLASS_UNBENDING_IN_FAITH_NO_BULLETTAB:0 "New gods came with new fires, yet Sweetport’s lords would not renounce the Seven. The price was dear—land, blood, and in time the line itself—but their creed did not crack for crown or coin.\n#weak Better to be broken faithful than live faithless. House Sunglass members tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

SUNGLASS_LIGHT_OF_SWEETPORT_NO_BULLETTAB:0 "Though a small house, the Sunglasses endured storms of crown and creed alike. Their steadfast faith, loyalty to Dragonstone, and the harbors of Sweetport kept their name alight when greater lords fell to shadow. Their legacy is not of grandeur, but of constancy.\n#weak A steady flame burns longest by the shore."

sunglass_sweetport_oathmen:0 "Sweetport Oathmen"
sunglass_sweetport_oathmen_flavor:0 "Drawn from the fishing villages and sea-roads of Sweetport Sound, the Oathmen of House Sunglass fight as sworn swords bound by faith and pledge. Lightly armored but fiercely loyal, they fight in close ranks with sword and shield, darting from formation to harry foes before fading back behind their lines. Known for raising their voices in prayer as steel is drawn, they carry both their lord’s honor and the memory of ancestors who defended the Sound from reavers and raiders."

#BEESBURY

beesbury_legacy_track_name: "Beesbury"
beesbury_legacy_track_desc: "Beware our Sting"
beesbury_legacy_1_name: "Pact with the Bees"
beesbury_legacy_2_name: "First Men’s Roots"
beesbury_legacy_3_name: "Swords of the Faith"
beesbury_legacy_4_name: "Peril at Court"
beesbury_legacy_5_name: "Ever Sweet, Ever Enduring"

BEESBURY_PACT_WITH_THE_BEES_NO_BULLETTAB:0 "Ellyn Ever Sweet, so the singers swear, climbed to a mountain hive and bargained with the King of the Bees: she would keep his children and his children’s children, and in return the hive would bless her line. From that pact came honey and husbandry, patient labor and careful stores—habits that built Honeyholt as surely as stone.\n#weak What the swarm teaches—industry, order, endurance—the Beesburys keep. Beesburys tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

BEESBURY_FIRST_MENS_ROOTS_NO_BULLETTAB:0 "Older than many Andal names in the Reach, the Beesburys claim descent from the First Men. Their roots run deep through meadow and grove; though seldom conquerors, they kept their oaths and fields alike, standing their ground when storm winds passed over greater lords.\n#weak Old blood, deep‑set—like roots that drink the river long after floods recede. Beesburys tend to be [GetTrait('patient').GetName( GetNullCharacter )]."

BEESBURY_SWORDS_OF_THE_FAITH_NO_BULLETTAB:0 "When the Faith Militant rose, the Beesbury name marched with the Swords. Ser Dickon Flowers, the Bastard of Beesbury, stood among seven against King Maegor himself. Zeal can cost dear, but it brands a name indelibly; the septs remember who bled on holy ground.\n#weak A sworn blade bears two edges: one for the foe, one for the soul. Enables recruitment of [GetMaA('beesbury_honeyholt_stingers').GetName] as [men_at_arms|E].#!."

BEESBURY_PERIL_AT_COURT_NO_BULLETTAB:0 "Ser Braxton Beesbury, dear to Princess Saera, learned how sweet favor can sour. Court has its own stings: whispers sharper than poniards, passions judged by kings. His tale, finished in duel and blood, taught Honeyholt that honey draws wasps as readily as friends.\n#weak Smile when you must, bow when you should—keep your sting sheathed until it saves you. Beesburys tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

BEESBURY_EVER_SWEET_EVER_ENDURING_NO_BULLETTAB:0 "Through zeal and scandal, harvest and hunger, the Beesburys endured—tending hive and hall with the same quiet care. Their power is patient, their memory long; in the Reach, a steady storehouse outlasts a hundred burning banners.\n#weak Honey keeps; so do the Beesburys."

beesbury_honeyholt_stingers:0 "Honeyholt Stingers"
beesbury_honeyholt_stingers_flavor:0 "Clad in bright mail and bee-marked pennons, the Honeyholt Stingers ride with the fury of a hive disturbed. Their lances strike like stings—swift, sharp, and often fatal—breaking lines across the farmlands and meadows of the Reach. Though weak in woods and marsh, in open fields they swarm as relentlessly as bees in summer."

building_type_agot_beesbury_honeyholt_01:0 "Honeyholt"
building_agot_beesbury_honeyholt_01:0 "Beekeeper’s Sanctuary"
building_agot_beesbury_honeyholt_01_desc:0 "Built where Ellyn Ever Sweet made her pact with the King of the Bees, this quiet grove hums with sacred honeybees. Their wax and honey enrich both table and tithe, tended by sworn keepers in House Beesbury’s service."

building_agot_beesbury_honeyholt_02:0 "Apiarist’s Guildhall"
building_agot_beesbury_honeyholt_02_desc:0 "Master keepers manage the hive-born bounty of Honeyholt with quiet precision. Beeswax, mead, and medicinal honey are exported to Oldtown and beyond. The guild’s records serve both trade and tradition."

building_agot_beesbury_honeyholt_03:0 "Ever Sweet Archives"
building_agot_beesbury_honeyholt_03_desc:0 "Scribes and septons here transcribe the lore of bees, trade, and stewardship, honoring Ellyn Ever Sweet and her sacred charge. The golden ink of Honeyholt signs contracts as readily as sept scrolls."

building_agot_beesbury_honeyholt_04:0 "Royal Apiary of the Reach"
building_agot_beesbury_honeyholt_04_desc:0 "The golden crown of Honeyholt, this hall of bees is whispered to hold the last queen of the Ever Sweet line. Her nectar fills the goblets of kings, and the gold of the Reach is richer for her wings."

#CASWELL

caswell_legacy_track_name: "Caswell"
caswell_legacy_track_desc: "Sure and Swift"
caswell_legacy_1_name: "Defender of the Fords"
caswell_legacy_2_name: "Bitterbridge Riders"
caswell_legacy_3_name: "Oath of the Wall"
caswell_legacy_4_name: "Scars of the Gods Eye"
caswell_legacy_5_name: "Bridge Endures"

CASWELL_DEFENDER_OF_THE_FORDS_NO_BULLETTAB:0 "From their seat at Bitterbridge, the Caswells made a calling of crossings. Toll-keepers and battle-keepers both, they turned fords into fortresses—staking the Mander with watchfires and shaping the river’s shallows into killing grounds when banners clashed.\n#weak Guard the ford and you guard the realm. Caswells tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

CASWELL_BITTERBRIDGE_RIDERS_NO_BULLETTAB:0 "Caswell horse answered kings’ summons and lieges’ calls alike, riding the Mander’s banks to wherever the ford was threatened. Hooves on hard ground, pennons bright above the reeds, they learned to strike at crossings and to chase a beaten foe until dusk.\n#weak Speed is a spear in open country. Enables recruitment of [GetMaA('caswell_bitterbridge_riders').GetName] as [men_at_arms|E].#!."

CASWELL_OATH_OF_THE_WALL_NO_BULLETTAB:0 "Orbert Caswell laid aside green fields for black, rising to Lord Commander of the Night’s Watch. His service lent the house a repute for vows kept to the last—honor carried from Bitterbridge to the end of the world where ice swallows sound.\n#weak A sworn oath binds longer than any bridge of stone. Caswells tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

CASWELL_SCARS_OF_THE_GODS_EYE_NO_BULLETTAB:0 "In 43 AC beneath the Gods Eye, Caswell banners marched beside Merryweathers and Peakes to swell King Maegor’s host. The day turned to rout when a nephew fell to an uncle, and the Reachmen learned how swiftly fortune drowns. The scar taught caution and the bitter price of civil war.\n#weak Remember the rout—and how not to be caught in one."

CASWELL_BRIDGE_ENDURES_NO_BULLETTAB:0 "Kings rise and fall, yet the Mander still must be crossed. The Caswells endure by holding what all must pass: bridges, roads, ferries, and faith with their neighbors. Their strength is vigilance and steadiness, a quiet rule of stone and water.\n#weak Keep the bridge, keep the peace."

caswell_bitterbridge_riders:0 "Bitterbridge Riders"
caswell_bitterbridge_riders_flavor:0 "In polished plate and saffron caparisons, the Riders of Bitterbridge keep the spans where the Roseroad crosses the Mander. Under the centaur banner they form in tight files along causeways and river-meadows, lances level for the first shock and swords ready for the press. Swift as couriers, hard as wardens, they hold the crossings and carry the charge where the river meets the green."

#WEBBER

webber_legacy_track_name: "Webber"
webber_legacy_track_desc: "Patience Conquers All"
webber_legacy_1_name: "Fields of Barley and Bloom"
webber_legacy_2_name: "Herds and Horses"
webber_legacy_3_name: "Riders of Webber"
webber_legacy_4_name: "The Red Widow"
webber_legacy_5_name: "Web of Power"

WEBBER_FIELDS_OF_BARLEY_AND_BLOOM_NO_BULLETTAB:0 "The barley, wheat, and cornfields of the Webbers were said to ripple like golden seas. Generations of careful stewards turned the soil into the breadbasket of their hills, binding their fortunes to fertile earth.\n#weak Grain and governance, the roots of their strength. Webbers tend to be [GetTrait('diligent').GetName( GetNullCharacter )]." 

WEBBER_HERDS_AND_HORSES_NO_BULLETTAB:0 "Black‑nosed sheep and sleek cattle fill their pastures, but it is the horses that win the loudest praise. From foal to courser, the stables turn good grass into war and wealth—hoofbeats that carry the webbed banner far beyond its hedgerows.\n#weak Flocks feed, herds enrich, steeds empower." 

WEBBER_RIDERS_OF_WEBBER_NO_BULLETTAB:0 "From chequered paddocks came great war‑coursers: broad‑chested, iron‑minded, and trained to break lines beneath leveled lances. Webber knights drilled their chargers to hold formation through the crush, to wheel and strike again, and to ride down any who turned. In open country their banners meant thunder first—and silence after.\n#weak Heavy hooves decide light quarrels. Enables recruitment of [GetMaA('webber_black_coursers').GetName] as [men_at_arms|E].#!."

WEBBER_THE_RED_WIDOW_NO_BULLETTAB:0 "Whispers named her witch and poisoner; courtiers called her the Red Widow. Lady Rohanne Webber turned rumor into armor, meeting rivals with a level gaze, a keen tongue, and a will to match any lord’s. Four husbands, countless suitors, rivals in court and field—all outlasted by her will. Her name, like her web, ensnared lords and legends alike. Whatever truths and tales entwined her, power bowed more than once.\n#weak The widow’s shadow stretches long, and her web never truly unravels."

WEBBER_WEB_OF_POWER_NO_BULLETTAB:0 "Land and livestock, oath and marriage—thread by thread a house may weave itself into place. Webbers learned to bargain and to bide, to ride hard when needed and to hold when wisdom said so. Their pattern endures in orchard and stable, in charter and vow.\n#weak A web well‑made holds fast against rough hands."

webber_black_coursers:0 "Webber Black Coursers"
webber_black_coursers_flavor:0 "Sired from Webber stock and broken on the chequy meadows, these heavy coursers take the field in tight wedges, lances leveled. On open country they ride like a storm—swift to shatter, quicker to pursue—leaving only hoofprints where the banner passed."


#OAKHEART

oakheart_legacy_track_name: "Oakheart"
oakheart_legacy_track_desc: "Our Roots Go Deep"
oakheart_legacy_1_name: "Blood of John the Oak"
oakheart_legacy_2_name: "The Infamy of Old Oak"
oakheart_legacy_3_name: "Old Oak Guard"
oakheart_legacy_4_name: "Thorn and Branch"
oakheart_legacy_5_name: "Legacy of Old Oak"

OAKHEART_BLOOD_OF_JOHN_NO_BULLETTAB:0 "The Oakhearts trace their line to John the Oak, born of Garth Greenhand and a giantess, whose mighty frame was said to root him in the earth like a living tree. Their blood is of the First Men, older than Oldtown’s stones, and their pride in this descent is carved into every banner and boast. When they stand, they stand as sons and daughters of a lineage too deep to be swayed by storm or fire.\n#weak Blood from the first roots, strength from the oak. Oakhearts can be [GetTrait('strong').GetName( GetNullCharacter )]."

OAKHEART_THE_INFAMY_OF_OLD_OAK_NO_BULLETTAB:0 "The memory of Lady Alys Oakheart’s wedding turned massacre haunts Old Oak. In 12 AC during the First Dornish War, the Wyl of Wyl infiltrated the wedding of Ser Jon Cafferen and Alys Oakheart. After gelding Jon and killing Alys's father, Lord Oakheart, and most of the wedding guests, the Wyls raped the bride and her handmaids and sold the women to slavers from Myr. The tale is told in hushed tones by hearthfire, a reminder of Dornish cruelty and the bitter price of honor. Yet in its retelling, Oakhearts harden their pride, for though kin were lost, their house endured—and the wound keeps their memory of Dorne forever sharp.\n#weak From blood and shame, the oak learned to stand harder still."

OAKHEART_OLD_OAK_GUARD_NO_BULLETTAB:0 "The Oakhearts became renowned for their war prowess, knights and soldiers born from John the Oak’s line. There are tapestries at Old Oak that show historical conflicts between the Oakhearts and Dornishmen. Their heavy guard marching across the Reach, famed for breaking Dornish lines in the Prince’s Pass and sounding warhorns until their last breath. When kings of Gardener and Targaryen alike called, Oakheart knights bore the chequy oak in proud formation, and their charge became a symbol of Reach chivalry.\n#weak Oakheart foot march lockstep and strike true. Enables recruitment of [GetMaA('oakheart_old_oak_guard').GetName] as [men_at_arms|E].#!."

OAKHEART_THORN_AND_BRANCH_NO_BULLETTAB:0 "Like the oak itself, the family is both thorn and branch—hard and sheltering, fruitful and fierce. Their lands are orchards and barley-fields, worked by sworn folk who trust the oak to guard them. Yet with prosperity comes rivalry: Peakes and other Reach lords courted Oakheart daughters to root their lines in stronger soil. To rule Old Oak was to be both steward and sentinel of plenty.\n#weak Branches shade, thorns warn. Oakhearts can be [GetTrait('shrewd').GetName( GetNullCharacter )]."

OAKHEART_LEGACY_OF_OLD_OAK_NO_BULLETTAB:0 "The Oakhearts endured when kings burned at the Field of Fire, when lords of Gardener fell, and when Tyrell upstarts rose to claim the crown of the Reach. They hosted Aegon the Conqueror in his progresses, bowed only when wisdom demanded, and kept their pride in blood older and nobler than the castle they held. Their name remains bound to honor, to defiance, and to the great oak that will not fall.\n#weak Oaks outlast fire, storm, and crown alike."

oakheart_old_oak_guard:0 "Old Oak Guard"
oakheart_old_oak_guard_flavor:0 "Heavy foot of House Oakheart drilled beneath the boughs of Old Oak. Green-and-gold shields lock like rings in a trunk while short swords and hammers worry gaps. Along hedgerow and orchard furrow they keep the cadence by drum, pressing until the field steadies—roots deep, oath unbroken."

building_type_agot_oakheart_old_oak_01:0 "Old Oak"
building_agot_oakheart_old_oak_01:0 "Oaken Hall of the First Men"
building_agot_oakheart_old_oak_01_desc:0 "Carved from the same earth their First Men ancestors once trod, the hall of Old Oak is steeped in age and tradition. Beneath the oaken beams, lineages are remembered, oaths renewed, and strength fostered."

building_agot_oakheart_old_oak_02:0 "Oakheart Barracks"
building_agot_oakheart_old_oak_02_desc:0 "Where bough and blade meet, Greenwood Barracks trains the noble and the bold. Here, Oakheart squires are shaped into knights beneath the shadow of towering oaks and Reach honor."

building_agot_oakheart_old_oak_03:0 "Hall of the Green Shields"
building_agot_oakheart_old_oak_03_desc:0 "Within Old Oak’s stone ring lies the hall of the Green Shields. Tales of Oakheart champions are carved into the wood of the Verdant Hall — jousters, kingsguard, and bannermen who have stood fast for Highgarden and crown. To train here is to be tested by both steel and story."

building_agot_oakheart_old_oak_04:0 "The Great Oak Throne"
building_agot_oakheart_old_oak_04_desc:0 "Carved from the heartwood of an ancient tree said to have stood before the Andals came, the Great Oak Throne is the seat of Oakheart lords — knightly paragons, stewards of the Reach, and voices of ancient strength. Beneath its boughs, kings have been received and banners raised."


#HEWETT

hewett_legacy_track_name: "Hewett"
hewett_legacy_track_desc: "No Wave Can Bend"
hewett_legacy_1_name: "Gates of Oak"
hewett_legacy_2_name: "Harbor Lords"
hewett_legacy_3_name: "Shields of the Mander"
hewett_legacy_4_name: "Watchers of the Sea"
hewett_legacy_5_name: "Oaken Shields of the Reach"

HEWETT_GATES_OF_OAK_NO_BULLETTAB:0 "Thick walls crown Lord Hewett’s isle fastness, and studded oaken gates bar the sea wind. The old arms of the house are not just heraldry but habit—hard wood and harder will, weathered by salt and storm yet standing still.\n#weak Oak holds where iron bites. Hewetts tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

HEWETT_HARBOR_LORDS_NO_BULLETTAB:0 "Below the castle sprawls Lord Hewett’s Town, a busy port where shipwrights sing and mast-forests crowd the quays. Coin comes in on every tide—tariffs from the wharves, grain from the hinterlands, and sailors’ gold from wakes that cross half the world.\n#weak A good harbor is a lord’s second keep. Hewetts tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

HEWETT_SHIELDS_OF_THE_MANDER_NO_BULLETTAB:0 "The Shield Islands were forged to turn back longships before they could claw their way up the Mander. Hewett galleys and garrisons met the ironborn at the waterline—oars biting, horns sounding, shieldwalls forming on slick stone until the reavers broke and fled.\n#weak Hold the islands and you hold the river’s wealth. Enables recruitment of [GetMaA('hewett_oakenshields').GetName] as [men_at_arms|E].#!."

HEWETT_WATCHERS_OF_THE_SEA_NO_BULLETTAB:0 "From beacon-towers and battlements the Hewetts watch the western horizon. Smoke by day, flame by night—signals leap from isle to isle, and messengers ride inland with the news. Storm or calm, their calling is vigilance; the Reach sleeps safer for their lights.\n#weak Better a hundred false alarms than one true surprise."

HEWETT_OAKEN_SHIELDS_OF_THE_REACH_NO_BULLETTAB:0 "Pirates, tempests, and the covetous hands of great lords have tested the Shield Islands. Yet oaken gates still bar and oaken hearts still beat. Trade fattens the coffers, fleets guard the Mander’s mouth, and the name Hewett stands for both harbor and bulwark.\n#weak Where oak and ocean meet, the Reach endures."

hewett_oakenshields:0 "Hewett Oakenshields"
hewett_oakenshields_flavor:0 "Raised from harborwardens and island garrisons, the Oakenshields drill to hold quays, jetties, and sea-walls. With oaken shields locked and spears braced, they make landings costly and drive reavers back into the surf."

building_type_agot_hewitt_oakenshield_castle_01:0 "Oakenshield Castle"
building_agot_hewitt_oakenshield_castle_01:0 "Oakenshield Castle"
building_agot_hewitt_oakenshield_castle_01_desc:0 "Overlooking the misty waters of the Shield Islands, Oakenshield Castle, sometimes referred to as Lord Hewett's Castle, defends the seas among the Reach's western coast. Sitting above the harbor of Lord Hewett's Town, the castle is small but strong. Its thick walls and studded oaken gates are reminiscent of the iron-and-oak sigil of House Hewett. The castle has green-roofed towers. Here, House Hewett has long stood loyal to Highgarden — shielding Reachmen shores from pirates and would-be kings alike."

building_type_agot_hewett_lord_hewetts_town_01:0 "Lord Hewett's Town"
building_agot_hewett_lord_hewetts_town_01:0 "Hewett’s Market Quay"
building_agot_hewett_lord_hewetts_town_01_desc:0 "The harbor of Lord Hewett’s Town bustles with activity, its wooden piers and stone warehouses hosting a steady stream of merchant cogs and fishing boats. The early roots of Oakenshield’s prosperity are firmly planted in these salt-swept shores."

building_agot_hewett_lord_hewetts_town_02:0 "Lord Hewett's Merchant Harbor"
building_agot_hewett_lord_hewetts_town_02_desc:0 "Expanded docks, better storage vaults, and the founding of a portwarden’s guild have transformed the harbor into a trade beacon for the Reach. Ships from Oldtown and the Arbor now regularly call here, their holds laden with silver and spice."

building_agot_hewett_lord_hewetts_town_03:0 "Shield Islands Tradeport"
building_agot_hewett_lord_hewetts_town_03_desc:0 "A full-fledged tradeport, Lord Hewett’s harbor boasts stone piers, dedicated drydocks, bonded warehouses, and market squares that attract merchants from across Westeros. It is the commercial jewel of the Shield Islands, protected by its castle’s oaken gaze."

#ASHFORD

ashford_legacy_track_name: "Ashford"
ashford_legacy_track_desc: "Our Sun Shines Bright"
ashford_legacy_1_name: "First of the Fords"
ashford_legacy_2_name: "Oaths of the Reach"
ashford_legacy_3_name: "Ashford Tourney Tradition"
ashford_legacy_4_name: "Guardians of the Mander"
ashford_legacy_5_name: "Crown’s Steadfast Bannermen"

ASHFORD_FIRST_OF_THE_FORDS_NO_BULLETTAB:0 "The Ashfords rose where the Mander’s waters cross fertile plains, their castle and fields among the oldest fortified seats of the Reach. Their holdfast guarded the ford where kings and traders alike once passed, and their prosperity flowed with the river. From these crossings their bannermen first bent the knee to Highgarden, their strength drawn from water, harvest, and hearth.\n#weak Where the river runs, Ashfords are there. Enables recruitment of [GetMaA('ashford_saffron_cloaks').GetName] as [men_at_arms|E].#!."

ASHFORD_OATHS_OF_THE_REACH_NO_BULLETTAB:0 "Sworn in friendship to Garth Gardener’s line and later bound as true men to the Tyrells, the Ashfords became a byword for loyalty. They kept their oaths when storms broke the realm and honored their pledges even when others faltered. In halls and camps both, the sun-orange banners of Ashford flew close to their liege lord’s own.\n#weak Oath and fealty are the sun and stars of their power. Ashfords tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

ASHFORD_TOURNEY_TRADITION_NO_BULLETTAB:0 "The tourneys at Ashford were famed long before dragonlords ever flew over Westeros. Knights from across the Reach sought glory on its greensward, tilting in lists set beneath the shadow of Ashford’s towers. There, prowess was proven not only for honor but for alliances, marriages, and fame that carried beyond the Mander’s banks.\n#weak In the lists of Ashford, the strength of the Reach was shown in lance and shield."

ASHFORD_GUARDIANS_OF_THE_MANDER_NO_BULLETTAB:0 "For centuries Ashford men have stood where the river is most vulnerable, raising their spears against raiders from without and rivals from within. They held the crossings of the Mander so caravans and levies might pass safely, making their watch a keystone of the Reach’s defense. To seize the ford was to seize fortune; to hold it was to prove true to Ashford’s name.\n#weak Guardians of river and road, they are shields of the heartlands."

ASHFORD_CROWNS_STEADFAST_BANNERMEN_NO_BULLETTAB:0 "When dragons came to Westeros, Ashfords bent the knee swiftly, trading defiance for survival and service. Their loyalty was rewarded with honor in crown progresses and trust in royal councils. Kings knew that in Ashford they would find no rebellion but steadfast support, rooted in centuries of obedience to liege and lord.\n#weak A bannerman’s duty carried without falter, their honor inked in the realm’s history."

ashford_saffron_cloaks:0 "Saffron Cloaks"
ashford_saffron_cloaks_flavor:0 "Saffron-cloaked light-foot raised on the tourney fields of Ashford and the green banks of the Mander. Quick-footed castle wardens in peace, screening light-foot in war—they hold gates, patrol the lands, and move first when the banners rise."

#MERRYWEATHER

merryweather_legacy_track_name: "Merryweather"
merryweather_legacy_track_desc: "Behold our Bounty"
merryweather_legacy_1_name: "Lords of Longtable"
merryweather_legacy_2_name: "Banners for the Crown"
merryweather_legacy_3_name: "The Rout at the Gods Eye"
merryweather_legacy_4_name: "Death by the Sword of Faith"
merryweather_legacy_5_name: "Honeyed Hosts of the Reach"

MERRYWEATHER_LORDS_OF_LONGTABLE_NO_BULLETTAB:0 "Longtable looks over river-misted fields where the Mander fattens the soil and barns groan on good years. From granaries and presses—grain, oil, and amber wine—the Merryweathers learned to turn harvest into hegemony, hosting market fairs beneath their hall and seating half the Reach at trestles that seemed to run the length of a lord’s road. Their riders know the byways between ferries and mills; their stewards can tell a season’s fate from the color of the stalk.\n#weak Plenty well-kept is power well-spent. Merryweathers tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]." 

MERRYWEATHER_BANNERS_FOR_THE_CROWN_NO_BULLETTAB:0 "Gardener before Tyrell, and dragon after both, the Merryweathers made a practice of quick obedience and steady service. Longtable’s envoys traveled with royal progresses, its cellars opened to high guests, and its counsel weighed for the temper that makes a realm run smooth. Such faithfulness brought them seats near the high table and the habit of being heard when oaths were counted and levies called.\n#weak A banner raised promptly is a voice heard plainly. Merryweathers tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

MERRYWEATHER_ROUT_AT_THE_GODS_EYE_NO_BULLETTAB:0 "When Longtable’s levies marched east beside Caswell and Peake, they rode in the surety that loyal service would be honored. Instead they found kin against kin and the sky black with ash, a field turned to shambles beside a lake that remembers every scream. Men of Merryweather blood went down in the rout, and those who returned learned the oldest soldier’s lesson: choose your ground, and never mistake a crown for a shield.\n#weak Scars teach where heraldry does not. Enables recruitment of [GetMaA('merryweather_longtable_longspears').GetName] as [men_at_arms|E].#!."

MERRYWEATHER_DEATH_BY_THE_SWORD_OF_FAITH_NO_BULLETTAB:0 "Long after hosts had melted and banners were furled, the mailed star still walked the roads. Old Lord Merryweather met his end beneath the blows of zealous brothers from the Warrior's Sons who judged him by the side he took when throne and sept stood opposed. In hall and sept alike the tale is told in different keys—piety to some, murder to others—but at Longtable it is remembered as the price a small lord pays when great powers quarrel.\n#weak When sword meets star, be wary."

MERRYWEATHER_HONEYED_HOSTS_OF_THE_REACH_NO_BULLETTAB:0 "Yet seasons turn, fields return, and Longtable’s renown returns with them. Fattened herds crowd the meadows by harvest; wines from riverbank vines run sweet; and the hall’s broad boards groan again with gilded loaves and spiced meats. Kings and lordlings alike have bargained beneath its rafters, for a full table loosens tongues and smooths sharp edges. In the Reach, folk say, few wars start after a Merryweather feast—and fewer last long when Longtable chooses a side.\n#weak Bread, wine, and welcome: the quiet engines of power. Merryweathers tend to be [GetTrait('generous').GetName( GetNullCharacter )]."

merryweather_longtable_longspears:0 "Longtable Longspears"
merryweather_longtable_longspears_flavor:0 "Drawn from the ferries and market towns along the Mander, these pikemen set their butts in the mud and make the riverbank a wall of ash wood and iron. Trained to hold fords and quays against thundering hooves, they advance in close order—drilled, unyielding, and lethal to any rider who dares the shallows."

building_type_agot_merryweather_longtable_court_01:0 "Hall of Longtable"
building_agot_merryweather_longtable_court_01:0 "Hall of Longtable"
building_agot_merryweather_longtable_court_01_desc:0 "Renowned for its hospitality and cunning courtiers, the great hall of Longtable is a place where charm and ambition walk hand in hand. From the days of Lord Orton Merryweather to the honeyed counsel of Taena of Myr, Longtable has cultivated whispers, favors, and fine wine in equal measure."

#MULLENDORE

mullendore_legacy_track_name: "Mullendore"
mullendore_legacy_track_desc: "Bear All Things Lightly"
mullendore_legacy_1_name: "Wings of Orange"
mullendore_legacy_2_name: "Lords of Uplands"
mullendore_legacy_3_name: "Matches of Distinction"
mullendore_legacy_4_name: "Queen’s Favor"
mullendore_legacy_5_name: "Prestige of the Butterfly"

MULLENDORE_WINGS_OF_ORANGE_NO_BULLETTAB:0 "The orange butterfly of House Mullendore, delicate yet striking, has long adorned banners fluttering above Uplands. Where others boast of iron or oak, the Mullendores made their name in courtesy and pageantry, earning favor in courts where beauty and grace wielded their own kind of power. Their sigil came to symbolize not frailty but refinement—an elegance that distinguished them in the Reach’s crowded nobility.\n#weak Not all strength lies in steel; some is carried on painted wings. Mullendores tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

MULLENDORE_LORDS_OF_UPLANDS_NO_BULLETTAB:0 "The lands of Uplands are gentle but fruitful, of orchards and rolling fields that grant steady plenty. From these hills the Mullendores built not armies but courts, where abundance could be shown in feasts and in generosity to neighbors. Though others rode to war, the lords of Uplands tended to husbandry and household, their strength found in wealth well-spent and in bonds well-kept.\n#weak A rich table may keep peace where a sword cannot. Mullendores tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

MULLENDORE_MATCHES_OF_DISTINCTION_NO_BULLETTAB:0 "From the hills of the Reach, the Mullendores secured bonds of marriage that far outstripped their station, tying their blood to lines of greater lords. Such unions were not chance, but careful pursuit, weaving Uplands into the noblest webs of the realm. Each prestigious match lent their hall more luster, until their name became synonymous with distinguished alliances that elevated their house above the rank of their spears.\n#weak A well-wrought marriage may guard a keep better than a garrison. Enables recruitment of [GetMaA('mullendore_butterfly_guard').GetName] as [men_at_arms|E].#!."

MULLENDORE_QUEENS_FAVOR_NO_BULLETTAB:0 "The Mullendores rose in stature not by conquest but by royal notice. Matches that drew the eye of queens and princesses brought renown to Uplands, whispered of as triumphs in every hall of the Reach. The favor of Alysanne Targaryen herself shone upon their house, setting them apart among their peers. To be spoken of in the same breath as a queen’s design was to stand beneath a canopy of glory no lance could win.\n#weak A queen’s smile may weigh more than a king’s decree."

MULLENDORE_PRESTIGE_OF_THE_BUTTERFLY_NO_BULLETTAB:0 "In time, House Mullendore’s distinction grew less from arms than from splendor. Their butterfly flew in pageants and on tournament greens, known more for finery than ferocity. Yet such reputation carried weight of its own—courts welcomed their presence, queens recalled their loyalty, and noble kindreds sought their daughters in marriage. Thus the butterfly became a sign not only of beauty, but of the prestige that lingers when grace is remembered longer than steel.\n#weak Splendor can endure where swords rust."

mullendore_butterfly_guard:0 "Butterfly Guard"
mullendore_butterfly_guard_flavor:0 "The Butterfly Guard of Uplands stand resplendent in orange and silver, their shields painted with the Mullendore butterfly. What began as a ceremonial retinue grew into a true fighting force — drilled to hold the line at feasts or fords alike. Their presence on the field is as much pageant as pike wall, but when spears lower and shields lock, they prove that elegance need not lack for iron."

#FOOTLY

footly_legacy_track_name: "Footly"
footly_legacy_track_desc: "Tread Lightly Here"
footly_legacy_1_name: "Field of Caltrops"
footly_legacy_2_name: "Keepers of Tumbleton"
footly_legacy_3_name: "Oaths to Highgarden"
footly_legacy_4_name: "Humor and Humility"
footly_legacy_5_name: "Tread Lightly Here"

FOOTLY_FIELD_OF_CALTROPS_NO_BULLETTAB:0 "On black they bear the silver caltrop, a humble device of war: small, sharp, and cruel to horse and man alike. Where others flaunt lions or towers, the Footlys embraced the symbol of caution and impediment, a warning that rash advance may find bloody footing. Their arms remind both bannermen and foes that even the smallest obstacle may turn the tide of battle.\n#weak A field of caltrops needs no boast—only patience. Footlys tend to be [GetTrait('patient').GetName( GetNullCharacter )]."

FOOTLY_KEEPERS_OF_TUMBLETON_NO_BULLETTAB:0 "Tumbleton, at the forks of road and river, became a hall of markets and marches. Here the Footlys built slow wealth—not in golden splendor, but in sturdy bridges, river tolls, and barnyards full at harvest. Their banners drew not for conquest but for keeping the fair, the ford, and the ferry safe. Their steadiness fed not only their smallfolk but their reputation across the Reach.\n#weak A careful ledger steadies a lord’s hand."

FOOTLY_OATHS_TO_HIGHGARDEN_NO_BULLETTAB:0 "From the age of the Gardener kings to the days of the Tyrells, the Footlys kept their oaths to Highgarden. Their levies answered the call of the Oakenseat without fail, their banners flying green among the hosts of the Reach. Though seldom in the van, their constancy made them valued bannermen, for a Footly’s loyalty was as steady as their cautious step.\n#weak A steady oath outlasts a shifting wind. Enables recruitment of [GetMaA('footly_bloody_caltrops').GetName] as [men_at_arms|E].#!."

FOOTLY_HUMOR_AND_HUMILITY_NO_BULLETTAB:0 "When knights mocked their sigil, the Footlys laughed with them, and so turned scorn into friendship. By making themselves the jest, they blunted sharper tongues, and their table became one where high lord and hedge knight alike might sit. This gift for turning insult to jest and shame to humility gave them peace in courts where sharper houses made foes.\n#weak A bowed head slips past many blades."

FOOTLY_TREAD_LIGHTLY_NO_BULLETTAB:0 "Step lightly in council, stand firm in oath—so the Footlys endured. They seldom reached for crowns, yet seldom lost their place; seldom won great glory, yet seldom drew great wrath. In the Reach, where harvest and heraldry sway the fate of small lords, such patience is a fortress all its own. In the tumult of the Reach—of marches, wars, and rivalries—they endured, remembered less for shining glory than for survival itself. And in survival lies its own kind of triumph.\n#weak A sure footing outlasts a reckless stride. Footlys tend to be [GetTrait('just').GetName( GetNullCharacter )]." 

footly_bloody_caltrops:0 "Bloody Caltrops"
footly_bloody_caltrops_flavor:0 "Bearing the black and silver arms of House Footly on their banners, the Bloody Caltrops march as living emblems of their sigil. With pikes braced, they scatter the ground with death, grinding horse and rider alike upon unseen steel. What began as a symbol of caution became a terror on the battlefield—each advance across their line ending in blood and broken steps."


#MEADOWS

meadows_legacy_track_name: "Meadows"
meadows_legacy_track_desc: "We Bloom in Adversity"
meadows_legacy_1_name: "Grassfield Husbandry"
meadows_legacy_2_name: "Greenfield Tiltyards"
meadows_legacy_3_name: "Stonebridge Thunder"
meadows_legacy_4_name: "Oath and Scythe"
meadows_legacy_5_name: "Meadowlord’s Bounty"

MEADOWS_GRASSFIELD_HUSBANDRY_NO_BULLETTAB:0 "From the days of the Gardeners, Grassfield was known as one of the fattest fields of the Mander, its meadows rolling green to every horizon. Fat herds cropped the banks, orchards bent with fruit, and wagons of grain rode steady roads to market and muster. The Meadows lords came to see harvest not only as sustenance, but as levy and strength—barns filled meant knights well-fed, horses sleek, and banners ready to rise at a king’s call.\n#weak The green field yields both bread and battle. Meadows tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

MEADOWS_GREENFIELD_TILTYARDS_NO_BULLETTAB:0 "Long before swords rang in war, they rang in sport beneath the pennons of Grassfield. In tiltyards bright with banners, the Meadows trained sons and sworn alike, honing lance, seat, and shieldwork until their house became famed for clean charges and steady hands. To break a lance at Grassfield was to prove oneself before the Reach, for the green-and-gold lists were spoken of from Oldtown to Highgarden.\n#weak The tilt-yard is the forge where knighthood is tempered. Meadows tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

MEADOWS_STONEBRIDGE_THUNDER_NO_BULLETTAB:0 "When the Poor Fellows sought to force the Mander at Stonebridge, it was Lord Meadows who brought six hosts to bar the way. His knights thundered across the bridge, hooves shattering the fanatics’ ranks, drowning zealotry in the river’s shallows. Songs recall the rout, but also the valor of Wat the Hewer, who struck down Lord Meadows and six other knights before he fell. Meadows blood stained the ford that day, and with it was written the house’s name in both glory and grief.\n#weak Victory may be won, yet sacrifice remembers its cost. Enables recruitment of [GetMaA('meadows_golden_spur_knights').GetName] as [men_at_arms|E].#!."

MEADOWS_OATH_AND_SCYTHE_NO_BULLETTAB:0 "After Stonebridge, Grassfield’s furrows were plowed with both grain and memory. Meadows lords swore anew their service to Highgarden, binding oaths in the sept as firmly as their serfs bound sheaves in the fields. As seasons turned, levies were rebuilt as surely as harvests, the scythe and sword kept in tandem. In peace, the green-and-gold stood for plenty; in war, for steady hosts whose captains were as reliable as their crops.\n#weak The oath and the harvest return with each season."

MEADOWS_MEADOWLORDS_BOUNTY_NO_BULLETTAB:0 "Through war’s desolation and rebellion’s ash, the lords of Grassfield restored their name with bounty. They opened their barns to vassals, poured wine at their feasts, and judged fairly in their halls. Kings and liege lords found in Meadows a banner to trust, for a house that feeds its people, honors its vows, and rides when summoned becomes a keystone of the Reach. The golden meadow endures, season after season, a living testament to duty and abundance.\n#weak Bread, honor, and remembrance—the Meadowlord’s true inheritance."

meadows_golden_spur_knights:0 "Golden Spur Knights"
meadows_golden_spur_knights_flavor:0 "Bearing the green and gold of Grassfield, the Golden Spur Knights ride as the pride of House Meadows. Their gilded spurs mark both wealth and valor, earned in tilt-yard and on battlefield alike. From Stonebridge to tourney green, their lances gleam as symbols of Reach chivalry—swift, resplendent, and deadly in the charge."

#VARNER

varner_legacy_track_name: "Varner"
varner_legacy_track_desc: "Forward, Never Back"
varner_legacy_1_name: "Andal Blood"
varner_legacy_2_name: "Gift of the Sage Kings"
varner_legacy_3_name: "Knights of Varner Hall"
varner_legacy_4_name: "Stewards of the Greenlands"
varner_legacy_5_name: "Faith and Fealty"

VARNER_ANDAL_BLOOD_NO_BULLETTAB:0 "From steel and septons they came—the Andal adventurers who sought fortune in the south. Granted lands and noble wives by the Gardener kings, the first Varners bound foreign blood to Reach soil, planting roots as deep as the rivers of their new hall.\n#weak A house is not born, but forged from blood and earth. Enables recruitment of [GetMaA('varner_hall_riders').GetName] as [men_at_arms|E].#!."  

VARNER_GIFT_OF_THE_SAGE_KINGS_NO_BULLETTAB:0 "In the days of strife, the Three Sage Kings of House Gardener rewarded the Varners’ valor with fertile fields, strong halls, and brides of old blood. Thus their name became tied to Highgarden’s glory, their fortunes flourishing in the shade of Gardener crowns and later Tyrell roses.\n#weak A gift of kings is also a bond of fealty. Varners tend to be [GetTrait('temperate').GetName( GetNullCharacter )]."  

VARNER_KNIGHTS_OF_VARNER_HALL_NO_BULLETTAB:0 "From the first tiltyards to the march of hosts, the Varners made their name in lance and saddle. Sons and squires became knights beneath banners of green and silver, and Varner steeds carried them to renown across the Reach, their valor praised in both song and summons.\n#weak A hall of knights is a fortress of honor. Varners tend to be [GetTrait('brave').GetName( GetNullCharacter )]."  

VARNER_STEWARDS_OF_THE_GREENLANDS_NO_BULLETTAB:0 "With gift came duty: to guard the harvests, tend the villages, and keep the peace along the Mander’s tributaries. Varner lords became stewards as much as swords, ensuring their barns stood full and their people steady, so that when war horns blew, both coin and levy answered.\n#weak Good governance is a harvest that returns each year. Varners tend to be [GetTrait('just').GetName( GetNullCharacter )]."  

VARNER_FAITH_AND_FEALTY_NO_BULLETTAB:0 "The Seven’s light shone bright in Varner halls, where sept and service were ever twined with loyalty to liege. Their piety and their prudence gave them longevity—surviving strife, rebellion, and change while mightier houses fell, enduring through quiet honor and steadfast fealty.\n#weak The sword may win a hall, but faith and loyalty keep it."  

varner_hall_riders:0 "Varner Hall Riders"
varner_hall_riders_flavor:0 "Descended from Andal adventurers and blessed by septons before the charge, the Riders of Varner Hall sweep the open country in tight wedges. They ride with light kit and long lances, harrying foes where fields run broad and roads run straight, and carrying the old Andal pride upon their pennons."

#AMBROSE

ambrose_legacy_track_name: "Ambrose"
ambrose_legacy_track_desc: "Never Resting"
ambrose_legacy_1_name: "Children of the Ant"
ambrose_legacy_2_name: "Never Resting"
ambrose_legacy_3_name: "The Antsworn"
ambrose_legacy_4_name: "Sevenfold Sacrifice"
ambrose_legacy_5_name: "The Enduring Colony"

AMBROSE_CHILDREN_OF_THE_ANT_NO_BULLETTAB:0 "Upon a yellow field march the red ants of Ambrose—tiny, tireless, and unyielding. Though mocked as small, the Ambroses turned their sigil into a creed: many steps, unceasing, make great works. Each generation sought to climb higher than the last, not through sudden leaps but through restless striving. In their labor lay ambition, and in ambition, strength.\n#weak One ant builds little, but many ants build greatness. Ambroses tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

AMBROSE_NEVER_RESTING_MOTTO_NO_BULLETTAB:0 "Their words, "Never Resting", are more than a boast. From dawn until dusk, Ambrose men ride patrols and Ambrose women tally storehouses; squires drill in the yard while peasants till the fields without pause. Tirelessness became their weapon, their armies wearing down stronger foes by sheer resolve as much as by sword.\n#weak To labor without cease is to outlast the idle. Ambroses tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."  

AMBROSE_THE_ANTSWORN_NO_BULLETTAB:0 "Under banners strewn with red ants, the Antsworn march not in glittering mail but in countless ranks of tireless fighters. Like a colony spilling from its mound, they dart through fields and forests, stinging and harrying their foes with sudden volleys and sharp steel. One ant is little threat; a thousand strike as one, and even giants bleed.\n#weak Many small bites humble a giant. Enables recruitment of [GetMaA('ambrose_red_ants').GetName] as [men_at_arms|E].#!."  

AMBROSE_SEVENFOLD_SACRIFICE_NO_BULLETTAB:0 "Ser Aegon Ambrose bore the ant into legend when he donned the Warrior’s Sons’ mail and stood among the seven who faced King Maegor’s champions. Though he fell, his valor was told from sept to smallhold, and his sacrifice became woven into Ambrose memory: proof that even the humblest knight may win renown through courage and faith.\n#weak Blood given in faith is never forgotten. Ambroses can be [GetTrait('zealous').GetName( GetNullCharacter )]."  

AMBROSE_THE_ENDURING_COLONY_NO_BULLETTAB:0 "Like ants whose strength lies in number and order, the Ambroses endured when storms shook the Reach. They bent when greater branches snapped, rebuilt when fire swept fields, and clung to their oaths when others wavered. Lords come and go, but Ambrose banners yet fly, a colony unbroken in its loyalty to crown and Faith alike.\n#weak Alone, fragile; together, unbreakable."  

ambrose_red_ants:0 "Red Ants"
ambrose_red_ants_flavor:0 "Swarming beneath banners strewn with ants, these skirmishers strike like their emblem: small impact while alone, but devastating in number. Quick-footed and tireless, they harry from hedgerow and wood, leaving stronger foes bleeding and wearied by a thousand small wounds."

#NORCROSS

norcross_legacy_track_name: "Norcross"
norcross_legacy_track_desc: "Virtue Fears No Slander"
norcross_legacy_1_name: "Brave of Heart"
norcross_legacy_2_name: "Stubborn as Stone"
norcross_legacy_3_name: "Neveryield"
norcross_legacy_4_name: "Watchers on the Wall"
norcross_legacy_5_name: "The House That Yields Not"

NORCROSS_BRAVE_OF_HEART_NO_BULLETTAB:0 "Valor was the first lesson in Norcross halls. From border quarrels to the white cloaks of kings, their name became a byword for men who met steel with steadier steel. Fear might visit—yet it never stayed long where the cross flew.\n#weak Courage is the first armor and the last. Norcrosses tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

NORCROSS_STUBBORN_AS_STONE_NO_BULLETTAB:0 "To call a man Norcross was to call him unbending. In council, in harvest, and on the field, their habit was to stand fast—enduring the lean years, withstanding the hard blows, and outlasting louder names. Their strength lay not in splendor, but in refusal.\n#weak What will not bend is hard to break. Norcrosses tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

NORCROSS_NEVERYIELD_NO_BULLETTAB:0 "Ser Jeffory Norcross, remembered as Neveryield, took the white and proved his house’s creed with every oath kept and every stand held. His name became a measure for the sons who followed: to bear the cross is to carry the weight of vows that do not bend, even unto death.\n#weak A vow kept is a lineage honored. Enables recruitment of [GetMaA('norcross_neveryield_guard').GetName] as [men_at_arms|E].#!."

NORCROSS_WATCHERS_ON_THE_WALL_NO_BULLETTAB:0 "Many Norcross men lived their lives in quiet mail—door-wards, sworn shields, and sentries who kept the peace of halls and marches. Their vigilance bred trust, and their discipline held lines that might have buckled under lesser eyes.\n#weak The night is shorter where faithful watch is kept."

NORCROSS_THE_HOUSE_THAT_YIELDS_NOT_NO_BULLETTAB:0 "Small in lands, mighty in resolve, the Norcrosses set their fame not on conquest but constancy. From Jeffory’s white cloak to the cross upon their banners, their story is of faith kept and oaths fulfilled. Others may falter; the Norcross do not.\n#weak Yield not—in counsel, in battle, in faith."

norcross_neveryield_guard:0 "Neveryield Guard"
norcross_neveryield_guard_flavor:0 "Named for Ser Jeffory Norcross of the Kingsguard, the Neveryield Guard lock shields and plant their feet where the line must hold. Cloaks may not be white, but their oath is no less stern: yield not, break not, stand until the horn sounds victory."

#WILLUM

willum_legacy_track_name: "Willum"
willum_legacy_track_desc: "Sharp Bones, Cursed Will"
willum_legacy_1_name: "Black Swords at the Wall"
willum_legacy_2_name: "Silvered Ambition"
willum_legacy_3_name: "Silverbane"
willum_legacy_4_name: "Steadfast Wardens"
willum_legacy_5_name: "Songs of Silver"

WILLUM_BLACK_SWORDS_NO_BULLETTAB:0 "On the walls of Castle Black’s Shieldhall hang the arms of Willum—longswords crossed below a dragon—reminders that sons of their house once took the black. Whether drawn by faith, punishment, or duty, their service was remembered in the Watch’s annals. To bear the sword at the Wall was to bind their name to the long vigil, and in that cold brotherhood their house found honor that outlived harvest and hall alike.\n#weak Where others turned from the Wall, Willums turned toward it. Willums tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

WILLUM_SILVERED_AMBITION_NO_BULLETTAB:0 "Though not among the mightiest houses of the Reach, the Willums bore a restless desire to climb higher than their station. Their lords sought command in war, voice in council, and honor at tourney, striving for every foothold that might lift their banner above the press of lesser names. This hunger made them wary allies yet formidable rivals, a house whose ambition outpaced the bounds of its land.\n#weak Small fields may grow great dreams. Willums tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

WILLUM_SILVERBANE_NO_BULLETTAB:0 "In whispered tales it is said that a Willum once slew a silver dragon, a deed sung of in mead halls though doubted by maesters. Some call it myth, others boast it truth, but the legend took root regardless. The Willums embraced the story, seeing in it a mirror of their courage—men unafraid to stand against fire and wing, armed only with faith, steel, and defiance. Whether dragon fell or not, the tale made their name a byword for audacity in the Reach.\n#weak Even wings of silver may be torn down by resolve. Enables recruitment of [GetMaA('willum_silverbane_bowmen').GetName] as [men_at_arms|E].#!."

WILLUM_STEADFAST_WARDENS_NO_BULLETTAB:0 "The Willums built their repute not on splendor but on stone. Their castles rose plain yet strong, warding the fertile valleys and guarding the coastlines of the Reach. In storm or raid, their halls stood as refuge, their levies drilled to hold walls against greater foes. Neighbors came to see Willum gates as barriers of safety, and their lords as wardens whose duty was not conquest but vigilance. In peace they kept order, in war they made their walls an anchor for all who rallied there.\n#weak To hold fast is greater than to ride far."

WILLUM_SONGS_OF_SILVER_NO_BULLETTAB:0 "The silver dragon may be tale or truth, but the song is certain. Minstrels carry Willum renown from feast to fair; yellow banners and bright steel draw eyes wherever lists are raised. In time the legend mattered more than the ledger—glory stitched into memory, retold until it felt as real as scars.\n#weak When stories ride ahead, doors open. Willums tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

willum_silverbane_bowmen:0 "Silverbane Bowmen"
willum_silverbane_bowmen_flavor:0 "Bearing the name of the old Willum legend, the Silverbane Bowmen loose their arrows with the same bold defiance their forebears showed in facing down mightier foes. Trained to fight as one, their volleys fall like silver rain, tearing through mailed ranks and humbling even the proudest enemies."

#VYRWEL

vyrwel_legacy_track_name: "Vyrwel"
vyrwel_legacy_track_desc: "The Darkness Calls"
vyrwel_legacy_1_name: "Darkdell Lords"
vyrwel_legacy_2_name: "Ominous Heraldry"
vyrwel_legacy_3_name: "Shadow-Wing Knights"
vyrwel_legacy_4_name: "Whispered Alliances"
vyrwel_legacy_5_name: "The Wyvern's Echo"

VYRWEL_DARKDELL_LORDS_NO_BULLETTAB:0 "At Darkdell the Vyrwels ruled among storm-swept coasts and shadowed fields, lords of a land both fertile and foreboding. Their halls rang not with song but with the howl of the wind, and so their strength was not in gaiety but endurance. Even Tyrell liege and Gardener king knew the house that stood firm in darkness as in light.\n#weak Rooted deep in the earth, they prosper where others falter. Vyrwels tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

VYRWEL_OMINOUS_HERALDRY_NO_BULLETTAB:0 "Silver wyvern and black field: a banner that raised whispers throughout the Reach. It is rumored that the sigil comes from the shadow-wing wyvern, a nocturnal reptile with black scales and wings that make it invisible in the dark, and therefore is the most feared. Some muttered of forgotten ties to Sothoryos, others of bargains struck in shadow. Whether truth or calumny, the arms of Vyrwel carried fear enough that foes sometimes yielded at their sight alone.\n#weak A house’s herald is more than colors— it is reputation made as a weapon. Vyrwels tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

VYRWEL_SHADOWWING_KNIGHTS_NO_BULLETTAB:0 "Vyrwel knights thundered beneath banners of wyvern and darkness, earning the name of Shadow-Wing Knights when their charges seemed to suddenly appear right before an unsuspecting host. Songs recall them tilting in tourney lists, but their fiercest fame came in war, when audacity and dread turned horsemen into legend.\n#weak Terror in the lists, terror on the field. Enables recruitment of [GetMaA('vyrwel_shadow_wing_knights').GetName] as [men_at_arms|E].#!."

VYRWEL_WHISPERED_ALLIANCES_NO_BULLETTAB:0 "When stronger lords contended, the Vyrwels endured, weaving promises in quiet chambers and forging bonds unspoken. They served loyally at Highgarden’s call, but rivals claimed their smiles hid knives and their toasts were bargains writ in shadow. What cannot be won by sword may yet be taken by word whispered well.\n#weak In Reach politics, survival is its own victory."

VYRWEL_WYVERNS_ECHO_NO_BULLETTAB:0 "Legends cling to House Vyrwel as ivy clings to stone. Some swore their bloodline bore the echo of wyverns, others that sorcery slept in Darkdell’s halls. None could prove the tales, yet none could wholly dismiss them. Fear and fascination both walk with the name Vyrwel, as though their banner’s darkness still claims the night.\n#weak Rumor is a legacy no less potent than blood. Vyrwels tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

vyrwel_shadow_wing_knights:0 "Shadow-Wing Knights"
vyrwel_shadow_wing_knights_flavor:0 "Clad in blackened mail beneath banners of wyvern and darkness, the Shadow-Wing Knights thunder across the field like living omens. Their lances strike with the weight of rumor and dread, for foes see in them not just men, but the echo of wyverns long fallen. To face their charge is to feel fear before the spearhead ever strikes."

building_type_agot_vyrwel_wyverns_rest_01:0 "Wyvern’s Rest"
building_agot_vyrwel_wyverns_rest_01:0 "Wyvern’s Rest"
building_agot_vyrwel_wyverns_rest_01_desc:0 "Seat of House Vyrwel, Wyvern’s Rest rises from the fertile heart of the Reach. Though the beasts that gave it its name are long vanished, their shadow lingers in heraldry and hall alike. Its walls command the surrounding fields and roads, and its lords have long been counted among the Tyrells’ most ominous bannermen. Tales speak of dark banners and whispered bloodlines, but the castle itself endures as a symbol of strength and suspicion alike."

#SERRETT

serrett_legacy_track_name: "Serrett"
serrett_legacy_track_desc: "I Have No Rival"
serrett_legacy_1_name: "Silverhill Union"
serrett_legacy_2_name: "Ambition of the Andals"
serrett_legacy_3_name: "Knights of Silverhill"
serrett_legacy_4_name: "Guardians of the Pass"
serrett_legacy_5_name: "Legacy of Silverhill"

SERRETT_SILVERHILL_UNION_NO_BULLETTAB:0 "In the storm of the Andal invasion, where steel met stone, House Serrett was born. The First Men lords of the high hills struck pact with Andal newcomers, sealing union through marriage and blood. Silverhill’s name recalls that bargain: a hill that gleams not with ore, but with the mingling of two peoples. To this day, the Serretts carry both legacies in their veins, First Men rooted and Andal striving.\n#weak A house built on union is not soon divided."

SERRETT_AMBITION_OF_THE_ANDALS_NO_BULLETTAB:0 "The Andals came to Westeros with faith in their gods and hunger in their hearts. From that fire the Serretts drew their restless will to rise above their station. At Silverhill, ambition was not shame but duty: to claim knighthood early, to win seats at councils, to press ever upward through service and renown. Each lord carried the weight of those forebears who crossed seas to climb new hills, never content with what had already been won.\n#weak Restless blood does not sleep, nor settle. Serretts tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

SERRETT_KNIGHTS_OF_SILVERHILL_NO_BULLETTAB:0 "From Silverhill ride knights famed for their high saddles, bright lances, and shining discipline. Songs tell of Serrett horsemen who broke raiders in narrow passes and who shone in the lists of Oldtown and Highgarden. Their lords poured treasure into stables and tiltyards, knowing their banners flew higher when carried by gallant riders. Few houses of their station have knightly traditions so celebrated across both Vale and Reach.\n#weak Where the hill shines, the lance lowers. Enables recruitment of [GetMaA('serrett_silverhill_knights').GetName] as [men_at_arms|E].#!."

SERRETT_GUARDIANS_OF_THE_PASS_NO_BULLETTAB:0 "Silverhill lies where mountain paths meet green valleys, a place both perilous and prized. Long have the Serretts guarded those ways, building keeps of grey stone to watch the roads and valleys beneath. Their vigilance turned aside more than one host, and gave liege lords confidence in their loyalty. Lords of Silverhill became known not only for their horse and their heraldry, but for their quiet service as wardens of the marches.\n#weak A guarded pass is the gate of a kingdom."

SERRETT_LEGACY_OF_SILVERHILL_NO_BULLETTAB:0 "The Serretts are not counted among the mighty lords of Westeros, yet they endure where greater names falter. From the day their ancestors forged a pact at Silverhill, they have survived by service, honor, and constancy. Songs of their riders and tales of their loyalty ensure that their hill still gleams bright in memory. Theirs is a legacy not of conquest but of endurance, a silver thread woven into the long tapestry of the realm.\n#weak Some legacies are writ not in conquest, but in constancy."

serrett_silverhill_knights:0 "Silverhill Knights"
serrett_silverhill_knights_flavor:0 "The famed Silverhill Knights ride in polished mail that gleams like the stones of their ancestral seat. Descended from the mingling of Andal and First Men blood, they are bred to charge where the slope is steep and the foe unsteady. Tales in the Westerlands speak of their lances catching the morning sun like argent fire, and of their discipline holding firm even as greater hosts broke. To ride beneath the banner of the Serrett peacock is to carry the pride of both hills and heritage."

#PRESTER

prester_legacy_track_name: "Prester"
prester_legacy_track_desc: "Tireless"
prester_legacy_1_name: "Feastfires Coast"
prester_legacy_2_name: "Blood and Betrayal"
prester_legacy_3_name: "Golden Pact"
prester_legacy_4_name: "Masters of Feastfires"
prester_legacy_5_name: "Heads Sent Home"

PRESTER_FEASTFIRES_COAST_NO_BULLETTAB:0 "From Feastfires the banners rise, sworn to guard the western coast and the passes that lead raiders into Lannister lands. For centuries the Prestors carried fire and steel in service to the Rock, their duty born from hills haunted by wolves and ironborn alike.\n#weak To stand on the coast is to be first in peril, first in renown. Enables recruitment of [GetMaA('prester_feastfire_watch').GetName] as [men_at_arms|E].#!."

PRESTER_BLOOD_AND_BETRAYAL_NO_BULLETTAB:0 "A fleet cobbled from fishing boats, a host of knights and men-at-arms, and the promise of Fair Isle’s rescue—all undone by treachery. The Prestors remember the night their lord fell beneath the Red Kraken’s sails, and how his severed head was sent back to Casterly Rock. Such wounds do not close; they teach watchfulness and vengeance.\n#weak The sea is faithless, but memory is everlasting. Presters tend to be [GetTrait('vengeful').GetName( GetNullCharacter )]."

PRESTER_GOLDEN_PACT_NO_BULLETTAB:0 "From the days when the Kings of the Rock called for levy and coin, House Prester was known to answer with both. Their oaths bound in gold and marriage, their fortunes tied to lions, their word became a thing trusted in hall and holdfast alike. To deal with a Prester was to strike a bargain meant to last generations.\n#weak Loyalty sealed in coin rings longest. Presters tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

PRESTER_MASTERS_OF_FEASTFIRES_NO_BULLETTAB:0 "The lands around Feastfires are rich with herds and hearths, a gift that lets House Prester maintain retainers enough to guard the western coast. Their keeps stand over rivers and roads where levy can be gathered in days. Even ironborn raids broke against that resilience, for the Prestors knew the land, and the land repaid their care.\n#weak Strong roots beneath rolling hills feed stronger hosts."

PRESTER_HEADS_SENT_HOME_NO_BULLETTAB:0 "Few tales are darker in the Westerlands than the one of the three lords—Prester, Tarbeck, and Lannister kin—whose heads were sent back from Fair Isle by Dalton Greyjoy, the Red Kraken. Yet such shame bred iron in their line. The Prestors of later years swore never again to be caught unready, shaping a legacy of discipline, watch, and wariness.\n#weak Defeat is bitter, but it steels the next sword-arm."

prester_feastfire_watch:0 "Feastfire Watch"
prester_feastfire_watch_flavor:0 "Forged in the memory of betrayal upon the waves, the Feastfire Watch stands guard along coast and hearth alike. Drilled in hedgerows and shorefields, they ambush foes with discipline and vigilance, embodying House Prester’s vow that never again will raiders or traitors find them unready."

#PLUMM

plumm_legacy_track_name: "Plumm"
plumm_legacy_track_desc: "Come Try Me"
plumm_legacy_1_name: "Roots of Stone"
plumm_legacy_2_name: "A Fortunate Match"
plumm_legacy_3_name: "Long-Lived Lords"
plumm_legacy_4_name: "The Six-Foot Tale"
plumm_legacy_5_name: "The Purple Line"

PLUMM_ROOTS_OF_STONE_NO_BULLETTAB:0 "The Plumms trace their blood back to the First Men, claiming that their line held halls in the west before lions prowled the Rock. Modest in land but proud in blood, they made their strength not in stone walls alone, but in the memory of an ancestry as old as Westeros itself.\n#weak Roots deep in ancient soil seldom wither. Enables recruitment of [GetMaA('plumm_purple_mantles').GetName] as [men_at_arms|E].#!."

PLUMM_A_FORTUNATE_MATCH_NO_BULLETTAB:0 "When their banners were joined in marriage with a dragon princess, the Plumms stepped into the pages of royal history. Though the lord who wed her met a comic end by dying during the bedding after seeing his wife naked for the first time, his house gained ties to fire and throne that even their great rivals could not mock away. Their fortune lay not in spears but in vows.\n#weak A lucky match can echo for centuries. Plumms tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

PLUMM_LONG_LIVED_LORDS_NO_BULLETTAB:0 "Where other houses burned out or fell, the Plumms survived. Lords with long reigns and longer lives held their purple fruits through reign after reign, outlasting storms of rebellion and plague alike. To neighbors, they seemed blessed, cursed, or simply too stubborn to be forgotten.\n#weak Vines that cling still bear fruit. Plumms tend to be [GetTrait('temperate').GetName( GetNullCharacter )]."

PLUMM_THE_SIX_FOOT_TALE_NO_BULLETTAB:0 "In feasts and markets, one tale rings louder than all others—that of Lord Ossifer’s impossible end and his six-foot manhood. Was the birth of a Plumm from the dragon princess, truly a Plumm or sired by another dragon? Some call it jest, some call it slander, but all remember the name Plumm when the tale is told. In scandal, the house found strange strength, their infamy turned into renown.\n#weak A rumor never dies if it makes men laugh."

PLUMM_THE_PURPLE_LINE_NO_BULLETTAB:0 "From purple fruits on yellow fields to jests in every hall, House Plumm forged a peculiar fame. They may not field the largest hosts nor rule from the tallest keeps, but their name survives—carried by rumor, humor, and the simple will to endure. A line mocked, remembered, and still standing.\n#weak Mockery fades, memory does not."

plumm_purple_mantles:0 "Purple Mantles"
plumm_purple_mantles_flavor:0 "Old retainers in armor with a plum hue, the Mantles are not famed for brilliance but for simply never yielding. Drawn from First Men stock and seasoned across long reigns, they lock shields on broken ground and hold until the herald calls the day. Mock the fruit if you like—these men stand like stone."

#GREENFIELD

greenfield_legacy_track_name: "Greenfield"
greenfield_legacy_track_desc: "A Place to Rest"
greenfield_legacy_1_name: "Roots of the Bower"
greenfield_legacy_2_name: "Timber Lords"
greenfield_legacy_3_name: "Knights of the Bower"
greenfield_legacy_4_name: "Guardians of Vale and Field"
greenfield_legacy_5_name: "Deep Roots"

GREENFIELD_ROOTS_OF_THE_BOWER_NO_BULLETTAB:0 "The Bower was a wonder of the Dawn Age, a vast castle built entirely of weirwood. Its pale bark glimmered in moonlight, and its red leaves whispered overhead even as they roofed the lords within. In later ages men called it Greenfield, but to the house it was always the Bower—the place where their First Men ancestors bound hearth to holy wood. In their veins flows the claim of the First Men, and in their songs linger the shadows of the old gods.\n#weak Stone crumbles, but memory clings like moss to roots. Greenfields tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

GREENFIELD_TIMBER_LORDS_NO_BULLETTAB:0 "The Greenfields built their strength on wood and earth, harvesting the dark forests and sowing their fields to sustain hearth and host alike. In the days when castles rose in timber before they rose in stone, the Greenfields were famed for their carpenters and their steady harvests. Their halls smelled of resin and smoke, their barns groaned with grain, and their wealth was measured not in gold, but in what kept men fed and walls mended.\n#weak A timber hall may burn, but the forest grows again. Greenfields tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

GREENFIELD_KNIGHTS_OF_THE_BOWER_NO_BULLETTAB:0 "When war came, the Greenfields called forth their sworn retainers, men trained to defend both field and hall. These warriors took pride in standing fast where others bent, their shields said to recall the pale bark and red crown of the Bower. Knights of Greenfield bore green and white lances in tourneys and battle alike, their loyalty as unyielding as the beams of weirwood that crowned their hall.\n#weak The hall stands still, and so do its knights. Enables recruitment of [GetMaA('greenfield_bower_knights').GetName] as [men_at_arms|E].#!."

GREENFIELD_GUARDIANS_OF_VALE_AND_FIELD_NO_BULLETTAB:0 "At the meeting of fertile valleys and rolling fields, the Greenfields served as wardens of road and river. Their men kept watch for reavers from the coast and raiders from the hills, turning back foes in a dozen small wars that history barely remembers. Yet in such small victories lay their strength—quiet guardianship that made their lands secure, and their name trusted by greater lords.\n#weak A steady hand upon the gate saves more lives than a banner in a crown’s hall. Greenfields tend to be [GetTrait('just').GetName( GetNullCharacter )]."

GREENFIELD_DEEP_ROOTS_NO_BULLETTAB:0 "The Greenfields may lack the gold of Casterly Rock or the vast hosts of greater lords, yet their survival tells its own tale. From the Dawn Age to the days of dragons, their line endured: First Men turned feudal lords, keepers of both old gods and new. Theirs is a legacy not of conquest, but of constancy—of roots sunk deep enough that no storm could tear them free.\n#weak Old roots drink deep, and the tree lives on."

greenfield_bower_knights:0 "Bower Knights"
greenfield_bower_knights_flavor:0 "Raised in the shadow of the ancient weirwood hall once called the Bower, these mailed riders embody the endurance of House Greenfield. Their swords used in calm precision, their destriers trained upon the open field, the Bower Knights are famed for breaking ranks with unyielding strength. To see them ride is to glimpse the old virtues: patience, resolve, and the memory of roots that never fell."

building_type_agot_greenfield_the_bower_01:0 "The Bower"
building_agot_greenfield_the_bower_01:0 "The Bower"
building_agot_greenfield_the_bower_01_desc:0 "Raised in the Dawn Age, the Bower is said to be a hall of pure weirwood: pale walls, red-leafed rafters, and whispers of the old gods lingering in its beams. Though later renamed Greenfield, the memory of the Bower endures as a seat of First Men heritage and quiet strength, its lords rooted in both faith and field."

#FELL

fell_legacy_track_name: "Fell"
fell_legacy_track_desc: "Seen and Unseen"
fell_legacy_1_name: "Lords of the Wendwater"
fell_legacy_2_name: "Oaths Beyond Death"
fell_legacy_3_name: "Felwood Retainers"
fell_legacy_4_name: "The Assassin’s Shadow"
fell_legacy_5_name: "Fires of the Kingswood"

FELL_LORDS_OF_THE_WENDWATER_NO_BULLETTAB:0 "For generations the Fells held the Wendwater crossings and the shadowed paths of Felwood. Their lands could be shield or snare as they willed, and their fame grew from both ambush and stewardship. In those green marches, a wise lord learned the lay of root and road—and how to make the forest itself a weapon.\n#weak To rule the wood, one must first listen to it. Fells tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

FELL_OATHS_BEYOND_DEATH_NO_BULLETTAB:0 "A Lady of House Fell was executed rather than forswear the vows she had sworn to the crown. So their singers say, and so their children learn: oaths are roots that hold when storms pull at every branch. In Felwood, loyalty is not a word for the feast, but a reckoning one keeps to the end.\n#weak An oath kept is a house kept. Fells tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

FELL_FELWOOD_RETAINERS_NO_BULLETTAB:0 "Felwood breeds hunters who move like shade and loose arrows between heartbeats. The Fells drilled them as retainers—archers for the thicket, skirmishers for the hollow, men who could harry a column to tatters before noon and vanish by dusk. Such service made the green their banner as much as their field.\n#weak A silent bow can break a loud army. Enables recruitment of [GetMaA('fell_felwood_huntsmen').GetName] as [men_at_arms|E].#!."

FELL_THE_ASSASSINS_SHADOW_NO_BULLETTAB:0 "Lord Fell was cut down not in battle, but smothered in the shadows of a brothel by Dornish assassins. Betrayal has ever stalked the family, yet the tale became a grim lesson passed from lord to heir: honor demands vigilance, and a Fell must be ready to meet death with sword in hand no matter the place.\n#weak Even a kiss may hide a blade."

FELL_FIRES_OF_THE_KINGSWOOD_NO_BULLETTAB:0 "The Fells once hid their banners beneath the Kingswood boughs, only to see the trees lit by dragonflame. Ash fell like snow and men learned how quickly a refuge becomes a pyre. Their line took hard lessons from that storm of fire: endure the heat, steady the heart, and fight on when the air itself seems to burn.\n#weak What survives the blaze returns tempered."

fell_felwood_huntsmen:0 "Felwood Huntsmen"
fell_felwood_huntsmen_flavor:0 "Trained hunters raised from the forest hamlets of Felwood, the Huntsmen fight by shadow and silence. They harry heavy foot from cover, screen their lords’ advance, and know a dozen ways to lose a pursuer among roots and ravines."

#PENROSE

penrose_legacy_track_name: "Penrose"
penrose_legacy_track_desc: "Set Down Our Deeds"
penrose_legacy_1_name: "Stewards of Coin"
penrose_legacy_2_name: "Bonds of Blood and Crown"
penrose_legacy_3_name: "Loyal at the Crossing"
penrose_legacy_4_name: "Quiet Strength"
penrose_legacy_5_name: "House of Parchments"

PENROSE_STEWARDS_OF_COIN_NO_BULLETTAB:0 "From their seat at Parchments, the Penroses were long known for ledgers as much as lances. Crown and liege alike turned to them when the coffers grew strained, trusting their steady hands to balance harvest and levy with the needs of war. Tales whisper that though others held the office, it was often a Penrose who truly kept the realm solvent.\n#weak A coin well counted is a kingdom well kept. Penroses tend to be [GetTrait('shrewd').GetName( GetNullCharacter )]."

PENROSE_BONDS_OF_BLOOD_AND_CROWN_NO_BULLETTAB:0 "Through careful marriages and dutiful daughters, the Penroses wove their blood into the fabric of dragon royalty itself. Their halls became a stepping stone into higher courts, a place where loyalty was rewarded not just with favor but with ties of kinship. To be wed into power was as lasting a conquest as any battle won with steel.\n#weak Blood and bond secure the future as much as blade. Penroses tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

PENROSE_LOYAL_AT_THE_CROSSING_NO_BULLETTAB:0 "When rebellion rose and the great river ran red, the Penrose banners stood fast. They held the crossing while others faltered, their knights remembered for loyalty unto death. Though the cost was near all their sons, their survival became a byword for faithfulness even in ruin. The story endures, a grim reminder that service may demand all but the last.\n#weak To yield the field may spare lives, but to hold it wins honor. Enables recruitment of [GetMaA('penrose_riverwards').GetName] as [men_at_arms|E].#!."

PENROSE_QUIET_STRENGTH_NO_BULLETTAB:0 "The Penroses are not famed for thunderous victories nor sweeping conquests, but for their quiet endurance. Lords and ladies of this line endured grief, widowhood, and siege, yet their house did not falter. In faith, in stewardship, and in the governance of their modest lands, they showed that constancy can be as mighty a weapon as conquest.\n#weak Silent strength outlasts clamor. Penroses tend to be [GetTrait('calm').GetName( GetNullCharacter )]."

PENROSE_HOUSE_OF_PARCHMENTS_NO_BULLETTAB:0 "Though their lands were never vast, the Penroses made themselves indispensable. Their name endures in ledgers, in alliances, and in chronicles of crown service. To realm and faith they bent but did not break, turning survival into renown. Few houses of their size have been called upon so often—and remembered so well for keeping faith.\n#weak A small hearth, yet a steady flame."

penrose_riverwards:0 "Penrose Riverwards"
penrose_riverwards_flavor:0 "Sworn to stand where water meets steel, the Riverwards form a bristling wall of ash and oak along fords and bridges. Trained to lock ranks, lower spears, and let the current be their ally, they are famed for turning back horse and holding ground until duty is done. Their tale is one of loyalty kept at the crossing, whatever the cost."

building_type_agot_penrose_parchments_01:0 "Scribes of Parchments"
building_agot_penrose_parchments_01:0 "Scribes of Parchments"
building_agot_penrose_parchments_01_desc:0 "Within the halls of Parchments, quills scratch by torchlight. Ledgers, scrolls, and contracts are the lifeblood of Penrose rule, giving order to land and levy alike."

building_agot_penrose_parchments_02:0 "Scriptorium of Penrose"
building_agot_penrose_parchments_02_desc:0 "The Penroses expanded their scriptorium, gathering learned men to copy tomes of faith and record oaths of vassals. Wisdom and writs alike travel from Parchments across the Stormlands."

building_agot_penrose_parchments_03:0 "Great Archive of Parchments"
building_agot_penrose_parchments_03_desc:0 "The Great Archive rises above Parchments as a monument to quill and parchment. Within its vaults lie centuries of chronicles, charters, and teachings. Few lords in the Stormlands wield such command of memory and record."

#BUCKLER

buckler_legacy_track_name: "Buckler"
buckler_legacy_track_desc: "Ours to Secure"
buckler_legacy_1_name: "Keepers of the Kingswood"
buckler_legacy_2_name: "Faith in the Gallows"
buckler_legacy_3_name: "Shields in the Wood"
buckler_legacy_4_name: "Scorched by Dragonflame"
buckler_legacy_5_name: "The Storm's Defiance"

BUCKLER_KEEPERS_OF_THE_KINGSWOOD_NO_BULLETTAB:0 "The Bucklers long held lands on the stormward edge of the Kingswood, their keeps surrounded by dark trees and storm-tossed skies. From their marches they learned to fight in thickets and gullies, ambushing travelers or shielding roads as duty demanded. Their name became bound to the forest’s strength and peril alike.\n#weak A wise lord listens to the wood before he marches through it. Bucklers tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

BUCKLER_FAITH_IN_GALLOWS_NO_BULLETTAB:0 "When pressed to forswear their vows, the Bucklers chose death over dishonor. A lord of the house was executed in the capital rather than break faith, remembered in song as a storm lord who would not bow. This legacy made the Bucklers a symbol of fidelity to oath and cause, no matter the price.\n#weak An oath kept is a shield that does not crack. Bucklers tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

BUCKLER_SHIELDS_IN_WOOD_NO_BULLETTAB:0 "Buckler levies were famed as sturdy men of the marches, woodsmen and retainers drilled to fight in cover. In raids and rebellions alike, their companies served as trusted bowmen and light foot, skilled at skirmish and sudden charge. They carried the storm on their shields, and the Kingswood in their craft.\n#weak In the green, a quiet company is a sharp blade. Enables recruitment of [GetMaA('buckler_kingswood_harriers').GetName] as [men_at_arms|E].#!."

BUCKLER_SCORCHED_BY_DRAGONFLAME_NO_BULLETTAB:0 "When fire fell from Meraxes, the Bucklers’ woodland redoubts burned with the rest. The memory of ash and loss tempered their line: a house that knew ruin firsthand yet endured. From that day, they were marked as storm lords who did not bend easily, even when fire itself was loosed against them.\n#weak The flame became a scar and a promise not to bend."

BUCKLER_THE_STORMS_DEFIANCE_NO_BULLETTAB:0 "From the burning Kingswood to the block in the capital, the Bucklers wrote their name in defiance. Their strength lay not in vast wealth or hosts, but in their refusal to yield when storms broke upon them. They became known as a house of iron loyalty, storm-forged and flame-tested, remembered long after greater lords were dust.\n#weak Defiance is the storm within the shield."

buckler_kingswood_harriers:0 "Kingswood Harriers"
buckler_kingswood_harriers_flavor:0 "Swift-footed retainers of the stormward Kingswood, the Harriers fight by ambush and retreat. They strike at the flanks of heavy infantry, harry bowmen from cover, and vanish into fen and forest before reprisal can come. Light of banner yet fierce of repute, they are the storm’s bite in the greenwood."

#GRANDISON

grandison_legacy_track_name: "Grandison"
grandison_legacy_track_desc: "Rouse Me Not"
grandison_legacy_1_name: "Wardens of the Storm March"
grandison_legacy_2_name: "The Sleeping Lion"
grandison_legacy_3_name: "Oath of the White Cloak"
grandison_legacy_4_name: "Rouse Me Not"
grandison_legacy_5_name: "The Lion Awakes"

GRANDISON_WARDENS_OF_THE_STORM_MARCH_NO_BULLETTAB:0 "The Grandisons long held the stormward marches, where raiders and border wars tested every oath. Their levies drilled to hold lines in forest and field alike, earning a name as stalwart defenders of Storm’s End and its lords.\n#weak Hold the line when tempests of war comes across your borders. Enables recruitment of [GetMaA('grandison_storm_lions').GetName] as [men_at_arms|E].#!."

GRANDISON_THE_SLEEPING_LION_NO_BULLETTAB:0 "Their sigil of a lion at rest embodies the Grandisons’ nature: quiet, patient, and unshaken until roused. For generations they endured storms and wars with measured strength, teaching their sons that true power lies in knowing when to lie still—and when to strike.\n#weak Rest is not weakness; it is readiness. Grandisons tend to be [GetTrait('temperate').GetName( GetNullCharacter )]."

GRANDISON_OATH_OF_THE_WHITE_CLOAK_NO_BULLETTAB:0 "The house reached its height of honor when Ser Harlan Grandison swore the vows of the Kingsguard. His service beneath the white cloak became proof that the Grandisons produced knights not only for Storm’s End, but for the Iron Throne itself. A boast few houses can claim.\n#weak A blade drawn only when duty left no other road. Grandisons tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

GRANDISON_ROUSE_ME_NOT_NO_BULLETTAB:0 "Their words warn both friend and foe: the lion may slumber, but it wakes with claws bared. Grandisons were remembered as loyal and steady bannermen, yet those who pressed them too hard found that patience turned quickly into wrath. In council they are calm; in crisis they are sudden and sure.\n#weak Still water holds a hidden current."

GRANDISON_THE_LION_AWAKES_NO_BULLETTAB:0 "When roused, the Grandisons fought with sudden ferocity, storming forth in golden banners. Though never the largest of the Stormland houses, their endurance and their oaths kept them strong across centuries, remembered as lions who could sleep through tempests—and rise when needed.\n#weak Wake the lion, and learn why it slept. Grandisons can be [GetTrait('ambitious').GetName( GetNullCharacter )]."

grandison_storm_lions:0 "Storm Lions"
grandison_storm_lions_flavor:0 "Plate and heavy axe under golden pennons: the Storm Lions form when the sleeping house rises. Drilled for precise, tight formations; they are famed for their crushing charges across open ground, breaking bowlines and screens with a fury honed by long restraint—the lion’s sudden wakefulness turned deadly."

building_type_agot_grandison_grandview_01:0 "Grandview"
building_agot_grandison_grandview_01:0 "Grandview"
building_agot_grandison_grandview_01_desc:0 "Atop a rise where stormland roads converge, Grandview is both a stronghold and a seat of parley. Beneath the black lion of House Grandison, lords and envoys find guarded halls yet open discourse. The house words, 'Rouse Me Not,' remind guests that peace here is born of restraint—but when the lion wakes, he wakes in full. Courtly gatherings, oaths, and alliances sealed in Grandview have carried its name well beyond the stormlands."

#LONMOUTH

lonmouth_legacy_track_name: "Lonmouth"
lonmouth_legacy_track_desc: "The Choice Is Yours"
lonmouth_legacy_1_name: "Lips and Skulls"
lonmouth_legacy_2_name: "The Choice Is Yours"
lonmouth_legacy_3_name: "Skulls on Black"
lonmouth_legacy_4_name: "Stormland Service"
lonmouth_legacy_5_name: "Wine and Mourning"

LONMOUTH_LIPS_AND_SKULLS_NO_BULLETTAB:0 "The Lonmouth arms are infamous: red lips scattered on yellow, skulls strewn across black. To some, it is a jest; to others, a warning that beauty and death walk hand in hand. In hall and camp their banners whisper of charm and menace alike.\n#weak Charm and dread are two sides of one coin. Lonmouths tend to be [GetTrait('vengeful').GetName( GetNullCharacter )]."

LONMOUTH_THE_CHOICE_IS_YOURS_NO_BULLETTAB:0 "Their words capture their nature: choice is power. The Lonmouths made their mark in knowing when to bend, when to woo, when to strike, and when to endure. Ambition shaped their house, and every crossroads became a chance to rise.\n#weak To choose is to rule. Lonmouths tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

LONMOUTH_SKULLS_ON_BLACK_NO_BULLETTAB:0 "The skull quarter of their arms was no idle boast. In marches and woodlands, Lonmouth retainers fought as light troops—harriers and hunters who left fields strewn with bones. Enemies who vanished into the Kingswood often returned as skulls for their banner.\n#weak Fear is the harvest of swift steel. Enables recruitment of [GetMaA('lonmouth_reapers').GetName] as [men_at_arms|E].#!."

LONMOUTH_STORMLAND_SERVICE_NO_BULLETTAB:0 "Though grim of arms, the Lonmouths proved loyal to Storm’s End. They marched when Baratheons called, from Dornish Marches to crown’s wars, earning repute as unsettling yet faithful bannermen. Allies could trust their service, even while wary of their ambition.\n#weak Duty gives strength when storms gather."

LONMOUTH_WINE_AND_MOURNING_NO_BULLETTAB:0 "Stormlords remember a Lonmouth who drank deep with a Baratheon, their games of wine and wit binding them as tightly as blood. In their halls, laughter and fellowship were weapons as keen as swords. Yet when that friend fell, their grief was plain for all to see. The Lonmouths became known as companions as well as warriors, a house of revels and remembrance.\n#weak Cups may empty, but friendship leaves its mark. Lonmouths tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

lonmouth_reapers:0 "Lonmouth Reapers"
lonmouth_reapers_flavor:0 "Named for their grim sigil of lips and skulls, the Lonmouth Reapers are deadly swordsmen, advancing with grim purpose, cutting down foes as though harvesting a field. Their blades fall swift, their silence broken only by the hiss of steel and the thud of bodies. A kiss of death given at every engagement."

#COLE

cole_legacy_track_name: "Cole"
cole_legacy_track_desc: "Fortune Grants Revenge"
cole_legacy_1_name: "Black Pellets of Blackhaven"
cole_legacy_2_name: "Steward’s Lineage"
cole_legacy_3_name: "The Kingmaker’s Choice"
cole_legacy_4_name: "White Cloak, Iron Will"
cole_legacy_5_name: "Butcher’s Ballad"

COLE_BLACK_PELLETS_BLACKHAVEN_NO_BULLETTAB:0 "Their arms bear black pellets said to be lumps of coal, a plain device for a plain truth: the Coles were forged as vassals of Blackhaven, hardened on the Dornish marches where raids and border wars never truly end. There they learned that fealty is kept with sharp eyes, tighter lines, and steel ready at first light.\n#weak A marcher’s oath is tested at the border. Enables recruitment of [GetMaA('cole_crossbowmen').GetName] as [men_at_arms|E].#!."

COLE_STEWARDS_LINEAGE_NO_BULLETTAB:0 "The house remembers that greatness may spring from humble halls. From a steward’s desk to sworn shield, service and discipline lifted Cole blood into courts where few expected them. The lesson endured: coal under pressure does not crumble—it burns brighter.\n#weak Duty opens doors that birth never knew. Coles tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

COLE_THE_KINGMAKERS_CHOICE_NO_BULLETTAB:0 "A son of Cole once set aside sentiment for the harder road: he chose crown over kin, and with a word turned whisper into war. In that choice their line learned the weight of a nod, the burden of an oath, and how a single judgment can tilt the realm.\n#weak To choose is to change the world. Coles tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

COLE_WHITE_CLOAK_IRON_WILL_NO_BULLETTAB:0 "In white cloak and in high command, a Cole bore the trust of the throne and the sharpening of the sword. He traded parley for pursuit, drove the war forward, and made obedience his banner. From him the house took its creed: when duty calls, the hand must not shake.\n#weak Command is a blade that cuts both ways. Coles tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

COLE_BUTCHERS_BALLAD_NO_BULLETTAB:0 "Leading a host through river and field, a Cole met betrayal and slaughter, remembered in song as both warning and witness. His end sealed the house’s place in the chronicles: not a name of shadows, but of crowns, wars, and choices that echo after the steel grows cold.\n#weak History does not remember blood, it remembers name."

cole_crossbowmen:0 "Cole Crossbowmen"
cole_crossbowmen_flavor:0 "Drawn from marcher villages where bow and pickaxe alike shaped the arms of men, the Cole Crossbowmen keep faith with steady bolts at the ready. Hardened in forests and fords, their arrows thin the foe before steel is ever crossed."

#TRANT

trant_legacy_track_name: "Trant"
trant_legacy_track_desc: "So End Our Foes"
trant_legacy_1_name: "Lords of Gallowsgrey"
trant_legacy_2_name: "The Hanged Man"
trant_legacy_3_name: "Gallows Knights"
trant_legacy_4_name: "So End Our Foes"
trant_legacy_5_name: "Gallows Made Eternal"

TRANT_LORDS_OF_GALLOWSGREY_NO_BULLETTAB:0 "From their grim seat of Gallowsgrey, the Trants ruled the marches with a steady hand and a hard edge. Roads kept quiet, gallows kept ready, and captains learned to make fear serve order as surely as spear and shield.\n#weak Where law is iron, peace remembers. Trants tend to be [GetTrait('callous').GetName( GetNullCharacter )]."

TRANT_THE_HANGED_MAN_NO_BULLETTAB:0 "A hanged man sways upon their azure field—warning and witness both. Enemies saw the banner and felt their courage drain; allies read in it a promise that treachery would meet its noose. The Trants made dread a herald to their justice.\n#weak A shadow on a banner lengthens on a battlefield. Trants tend to be [GetTrait('sadistic').GetName( GetNullCharacter )]."

TRANT_GALLOWS_KNIGHTS_NO_BULLETTAB:0 "Their knights bore the gallows into tourney and war alike—grim to behold, unwavering in the press. Behind the stark device lay seasoned riders and iron-nerved champions, more concerned with the end of a fight than with the flourish of it.\n#weak A steady hand outlasts a bright flourish. Enables recruitment of [GetMaA('trant_gallows_men').GetName] as [men_at_arms|E].#!."

TRANT_SO_END_OUR_FOES_NO_BULLETTAB:0 "Their words are not boast but method. When a Trant rides to war, it is to finish what had begun: pursuit without pause, sentence without softness, and an end that leaves no foe to rise again.\n#weak Mercy ends quarrels for a season; finality ends them for good."

TRANT_GALLOWS_MADE_ETERNAL_NO_BULLETTAB:0 "In songs and chronicles, the Trant gallows became more than wood and rope—it became certainty. To follow their banner was to believe an ending could be made; to face it was to feel that the end is drawing near.\n#weak Some houses promise victory; others promise conclusion."

trant_gallows_men:0 "Gallows Men"
trant_gallows_men_flavor:0 "Sworn from the shadow of Gallowsgrey, these grim footmen march as iron executioners upon the battlefield. Clad in heavy mail and carrying cruel polearms and axes, the Gallows Men embody their house’s words: foes are not merely beaten, but ended. Slow and unyielding, they hold the line until the noose is ready."

#MORRIGEN

morrigen_legacy_track_name: "Morrigen"
morrigen_legacy_track_desc: "No Dread of Death"
morrigen_legacy_1_name: "Last of the Storm's Fallen"
morrigen_legacy_2_name: "Devout Blades"
morrigen_legacy_3_name: "White Cloak’s Honor"
morrigen_legacy_4_name: "Ashford Lists"
morrigen_legacy_5_name: "Faith and Storm"

MORRIGEN_LAST_STORMFALLEN_NO_BULLETTAB:0 "The Morrigens were forged in storm and sorrow, their banners carried beneath thunderclouds beside the Storm Kings. When dragons came, Morrigen steel broke upon them, and their dead lay thick upon the field. Yet their name endured, spoken with respect even by conquerors.\n#weak Blood spilled with the storm is blood remembered in song. Enables recruitment of [GetMaA('morrigen_thundershields').GetName] as [men_at_arms|E].#!."

MORRIGEN_DEVOUT_BLADES_NO_BULLETTAB:0 "One of their kin led the Warrior’s Sons with unbending piety, falling in trial of seven with sword in hand. His death sealed their fame as warriors of faith, remembered by sept and soldier alike as men who bore both sword and scripture into battle.\n#weak The Seven bless the blade wielded with devotion. Morrigens tend to be [GetTrait('zealous').GetName( GetNullCharacter )]."

MORRIGEN_WHITE_CLOAKS_HONOR_NO_BULLETTAB:0 "From their house rose a knight so steadfast that he donned the white cloak and commanded the Kingsguard. His life was marked by honor unbroken, his service by discipline so stern that it became the standard by which others were judged.\n#weak The white cloak does not forget those who wear it with pride. Morrigens tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

MORRIGEN_ASHFORD_LISTS_NO_BULLETTAB:0 "At Ashford Meadow, their banners flew among the greatest in the realm. Morrigen knights broke lances with princes and lords, their valor in the lists carrying their name beyond the stormlands. For them, tourney field and battlefield were both arenas of honor.\n#weak Glory won beneath pennons is glory carried home."

MORRIGEN_FAITH_AND_STORM_NO_BULLETTAB:0 "Through storm and steel, sept and hall, the Morrigens remain. Loyal to kings, zealous in the Faith, and proud in arms, their legacy is one of unbroken endurance. Where storms howl and prayers are spoken, their memory takes root, eternal as the thunder’s roll.\n#weak So their name endures, winged by faith and weathered by wind."

morrigen_thundershields:0 "Thunder Shields"
morrigen_thundershields_flavor:0 "Bearing green armor, the Thunder Shields stand like lightning-rods on the field. Storm-forged and faith-driven, they charge against the mightiest armies, their lines breaking pike and sword alike. In their steadfast ranks, the Morrigens’ creed is absolute: stand fast, strike, and let the storm pass only when the foe has fallen."

building_type_agot_morrigen_crows_nest_01:0 "Crow’s Nest"
building_agot_morrigen_crows_nest_01:0 "Crow’s Nest"
building_agot_morrigen_crows_nest_01_desc:0 "Set high upon the storm-wracked hills of the Stormlands, Crow’s Nest has long been a bastion of House Morrigen. Its towers rise above wind-bent trees and sodden fields, keeping watch over the roads and forests that cut through the Kingswood. The walls are narrow and steep, built to resist both siege and storm, with watchfires ready to flare at the first sign of danger. Archery butts and mustering yards within ensure the Morrigens remain ever prepared, while their septs and shrines echo with vows to the Seven."


#STAEDMON

staedmon_legacy_track_name: "Staedmon"
staedmon_legacy_track_desc: "Blood Before Betrayal"
staedmon_legacy_1_name: "Broad Arch"
staedmon_legacy_2_name: "Blood Oath"
staedmon_legacy_3_name: "Dagger’s Edge"
staedmon_legacy_4_name: "Crimson Border"
staedmon_legacy_5_name: "Heartpierced Yet Unbroken"

STAEDMON_BROAD_ARCH_NO_BULLETTAB:0 "At Broad Arch, the Staedmons guarded the crossings where river and road converged. Raiders and marchers found them unyielding—spears braced, eyes sharp, their vigilance a legacy as enduring as the arch itself. A Staedmon’s hall was not merely home but outpost, and the family became known as keepers of ford and frontier.\n#weak Ever-watchful, they miss little and yield less. Staedmons tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

STAEDMON_BLOOD_OATH_NO_BULLETTAB:0 "The Staedmons swore fealty not with words alone but with blood. Their dagger and heart sigil told of bonds sealed by sacrifice, a reminder that loyalty cost dearly. Lords and lieges alike valued their devotion, for it was not given lightly—and once given, seldom betrayed.\n#weak The surest oath is the one signed in blood. Staedmons tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

STAEDMON_DAGGERS_EDGE_NO_BULLETTAB:0 "A dagger may guard the heart, or strike for it. The Staedmons carried both meanings in their name and deed. Feuds in the marches taught them subtler war: ambush, vendetta, and a knife beneath the cloak. Their enemies learned that affronts were answered swiftly, and often unseen until too late.\n#weak To cross them was to risk a hidden blade. Enables recruitment of [GetMaA('staedmon_crimson_daggers').GetName] as [men_at_arms|E].#!."

STAEDMON_CRIMSON_BORDER_NO_BULLETTAB:0 "The crimson border of their arms was no flourish, but a warning. Bloodshed marked their quarrels, vengeance their reputation. When wronged, Staedmons answered in kind, and their foes found disputes ended not at council tables but in fields and chambers stained red.\n#weak A line drawn in blood is seldom crossed again. Staedmons tend to be [GetTrait('vengeful').GetName( GetNullCharacter )]."

STAEDMON_HEARTPIERCED_YET_UNBROKEN_NO_BULLETTAB:0 "Daggers break hearts; Staedmons do not. Loss and feud marked their centuries, yet the banner returned to the wind each spring. A small house, perhaps—but one that endures by grit, by memory, and by the will to rise after every piercing.\n#weak Steel may pierce the heart; will keeps it beating."

staedmon_crimson_daggers:0 "Crimson Daggers"
staedmon_crimson_daggers_flavor:0 "Sworn in the shadow of Broad Arch, the Crimson Daggers fight with the speed and ruthlessness of their namesake. Cloaked and armed with short blades and bows, they thrive in woods and broken ground, where a sudden strike leaves foes bleeding before they can answer. Their crimson sigil is more than heraldry—it is a warning that Staedmon quarrels are ended in blood, not words."

#ERROL

errol_legacy_track_name: "Errol"
errol_legacy_track_desc: "All Have Their Seasons"
errol_legacy_1_name: "Lords of Haystack Hall"
errol_legacy_2_name: "Ashes of the Kingswood"
errol_legacy_3_name: "Wendwater Riders"
errol_legacy_4_name: "Storm’s Oath"
errol_legacy_5_name: "Haystack’s Endurance"

ERROL_LORDS_OF_HAYSTACK_HALL_NO_BULLETTAB:0 "From Haystack Hall, the Errols ruled fertile lands of grain and pasture, their strength drawn as much from harvests as from hosts. Their lordship was known for stout halls, well-fed levies, and bannermen who stood firm when called by Storm’s End.\n#weak A strong barn keeps a strong banner. Errols tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

ERROL_ASHES_OF_THE_KINGSWOOD_NO_BULLETTAB:0 "Dragonfire once ran the Kingswood to cinder, and Errol fortunes burned with it. They rebuilt from ash, taking the lesson as law: store through spring, drill through summer, and stand together when smoke darkens the sky.\n#weak What fire destroys, patience restores. Errols tend to be [GetTrait('patient').GetName( GetNullCharacter )]."

ERROL_WENDWATER_RIDERS_NO_BULLETTAB:0 "When war came to the Wendwater, Errol riders proved swift as the current. Their light horse swept along the riverbanks and marches, harrying larger hosts and vanishing into the Kingswood paths. Though dragonfire scorched the forest, the memory endured: to strike fast, strike where least expected, and live to strike again.\n#weak The ground you know is the ally you keep. Enables recruitment of [GetMaA('errol_wendwater_riders').GetName] as [men_at_arms|E].#!."

ERROL_STORMS_OATH_NO_BULLETTAB:0 "Long loyal to Storm’s End, the Errols held that their honor lay in service to the storm kings and their Baratheon heirs. Fealty became their armor, remembered as an oath repeated through rebellion, feud, and conquest.\n#weak Oaths bind houses better than mortar binds stone."

ERROL_HAYSTACKS_ENDURANCE_NO_BULLETTAB:0 "Years turn; the hay is cut; the host is raised. Through loss and harvest both, the Errols endured, their name tied to fields that recover and men who return. A modest house, perhaps—but stubborn in season and in siege alike.\n#weak Grain grows back. So do the Errols."

errol_wendwater_riders:0 "Wendwater Riders"
errol_wendwater_riders_flavor:0 "Raised along banks and byways from Haystack Hall to the Kingswood’s edge, the Wendwater Riders fight as the river flows—swift and relentless. They harass supply trains, snap at flanks, and disappear down half-seen paths before the foe can rally. Stormborn to the bone, they ride light and strike where the ground remembers their hooves."

#BLACKMONT

blackmont_legacy_track_name: "Blackmont"
blackmont_legacy_track_desc: "Nourished By Battle"
blackmont_legacy_1_name: "The Vulture’s Claim"
blackmont_legacy_2_name: "Riders of the Red Mountains"
blackmont_legacy_3_name: "Bane of the Marches"
blackmont_legacy_4_name: "Talons and Shadows"
blackmont_legacy_5_name: "Fortress of the Torentine"

BLACKMONT_VULTURES_CLAIM_NO_BULLETTAB:0 "From King Benedict to the outlaw Vulture Kings, the Blackmont name has often stood for rebellion and defiance. Even when crowns were shattered, the sight of their banner set hearts to caution, for vultures come when the strong have grown weak.\n#weak A vulture waits long—but never forgets its feast. Blackmonts tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

BLACKMONT_RIDERS_RED_MOUNTAINS_NO_BULLETTAB:0 "Lean horsemen bred in the stony passes made Blackmont raiders swift and merciless. They struck at caravans and patrols alike, vanishing into gullies where few dared follow. Stone keeps their secrets; dust hides their tracks.\n#weak The mountain gives no safe road to strangers. Enables recruitment of [GetMaA('blackmont_vultures').GetName] as [men_at_arms|E].#!."

BLACKMONT_BANE_MARCHES_NO_BULLETTAB:0 "For generations, marcher lords cursed the vulture. The Blackmonts raided keeps and hamlets, burning fields and stealing captives. Their very name became a hated omen across the Dornish Marches. The Blackmonts learned to make fear their herald and siege their final word.\n#weak A reputation can break a gate before a ram does. Blackmonts tend to be [GetTrait('sadistic').GetName( GetNullCharacter )]."

BLACKMONT_TALONS_SHADOWS_NO_BULLETTAB:0 "The Blackmonts relied as much on outlaws as bannermen. Barren soil breeds hard men, and shadows breed sharper ones. Outlaw bands, hill fighters, and grim levies answered Blackmont calls—some for coin, some for kin-feud, all for blood. Talons clutch tight, whether in daylight or dark.\n#weak What law cannot hold, fear can."

BLACKMONT_FORTRESS_TORENTINE_NO_BULLETTAB:0 "Blackmont itself clings to the Red Mountains like a vulture’s perch, watching the Torentine below. Many have tried to starve it; few have pried it loose. Stone, secrecy, and stubborn hearts make siege a season, not a sentence.\n#weak Their walls and hills remain a symbol of Dornish resilience."

blackmont_vultures:0 "Blackmont Vultures"
blackmont_vultures_flavor:0 "Named for the carrion-birds that haunt their banners, the Blackmont Vultures ride lean horses through the gullies of the Red Mountains. They strike swiftly at baggage and fleeing men, harrying the Marches and vanishing into stony passes where few dare follow. To their foes, the cry of the vulture is omen enough. They never come back empty-handed."

building_type_agot_blackmont_castle_01:0 "Blackmont"
building_agot_blackmont_castle_01:0 "Fortress of the Vultures"
building_agot_blackmont_castle_01_desc:0 "Where two mountain streams join to birth the Torentine, Blackmont crouches high on red stone. Its vulture-banners snap above narrow switchbacks, and its towers command the fords and goat-paths that thread the western Red Mountains. From these eyries, riders learn to move as the desert wind—swift down the gullies, gone before horns can sound—while hardened garrisons keep watch on every pass. Raids launched from Blackmont break like talons from the crags, and the climb back home is as sure as the sun at dusk."

#ALLYRION
allyrion_legacy_track_name: "Allyrion"
allyrion_legacy_track_desc: "No Foe May Pass"
allyrion_legacy_1_name: "Andal Adventurers"
allyrion_legacy_2_name: "Keepers of Godsgrace"
allyrion_legacy_3_name: "Lords Over Martells"
allyrion_legacy_4_name: "Defiant in Flame"
allyrion_legacy_5_name: "No Foe May Pass"

ALLYRION_ANDAL_ADVENTURERS_NO_BULLETTAB:0 "Godsgrace was carved from the marches of Dorne by Andal adventurers, who raised sword and sept in the shadow of the Greenblood. The Allyrions trace their pride to those first conquerors, men and women who crossed seas with faith, ambition, and the will to endure. Their blood binds to many houses still.\n#weak New oaths on old stone hold fast. Allyrions tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

ALLYRION_KEEPERS_OF_GODSGRACE_NO_BULLETTAB:0 "Where Scourge and Vaith run to the Greenblood, the walls of Godsgrace command the crossings. Sunk deep on sun-baked foundations, their towers watch boats and caravans alike. Raiders have tried the ford and found it wanting; rebels have tested the gate and found the river’s wardens waiting.\n#weak Hold the water, hold the road. Enables recruitment of [GetMaA('allyrion_golden_hand_wardens').GetName] as [men_at_arms|E].#!."

ALLYRION_LORDS_OVER_MARTELLS_NO_BULLETTAB:0 "Once, even the Martells bent knee to Allyrion. Though pride turned to prudence and fortunes changed, the memory abides: the golden hand once closed over the sun and spear. Those old bonds of rivalry and kinship still shape how oaths are given and kept across Dorne.\n#weak A high seat remembered lends weight to every word. Allyrions tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

ALLYRION_DEFIANT_IN_FLAME_NO_BULLETTAB:0 "When fire and shadow darkened the sky, the Allyrions chose to deny their enemies a prize rather than become one. Stones can be rebuilt; bloodlines endure. From that lesson came a harder creed—the wisdom to bend, the strength to rise, and the patience to outlast those who would burn what they cannot hold.\n#weak Survival is the sternest courage."

ALLYRION_NO_FOE_MAY_PASS_NO_BULLETTAB:0 "The words of Allyrion are both oath and warning. Their captains drill on the riverbanks, their sentries count the oars at dusk, and their banners of red and black gyronny stand bright above the golden hand. From ford to ferry, from levee to gate, they bar the way with steel and certainty.\n#weak No foe may pass. Allyrions tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

allyrion_golden_hand_wardens:0 "Golden Hand Wardens"
allyrion_golden_hand_wardens_flavor:0 "Bearing the golden hand of Allyrion upon their chests, the Wardens of Godsgrace are chosen from the finest heavy infantry in Dorne. Their duty is not to chase nor to raid, but to stand—unyielding at river crossings, roads, and gates. In plate and shieldwall they embody their house words, holding fast where others falter. To face them is to meet the golden hand itself, closing iron-tight on all who dare defy it."

building_type_agot_dalt_lemonwood_01:0 "Lemonwood"
building_agot_dalt_lemonwood_01:0 "Lemonwood"
building_agot_dalt_lemonwood_01_desc:0 "On the southern shores of the Greenblood lies Lemonwood, the seat of House Dalt. Its castle stands amid irrigated orchards of lemons and fruits, whose ditches and water channels turn the fertile soil into gold. With Planky Town just beyond the groves, Lemonwood serves both as its guardian and its gate—where knights keep watch and merchants fill the air with the scents of citrus and spice."


#JORDAYNE

jordayne_legacy_track_name: "Jordayne"
jordayne_legacy_track_desc: "Let It Be Written"
jordayne_legacy_1_name: "The Andal Quill"
jordayne_legacy_2_name: "Lords of the Tor"
jordayne_legacy_3_name: "Quill Before the Sun"
jordayne_legacy_4_name: "Burnt and Retaken"
jordayne_legacy_5_name: "Let It Be Written"

JORDAYNE_ANDAL_QUILL_NO_BULLETTAB:0 "The Jordaynes came not only with sword but with script. Andal septons and scribes set their roots at the Tor, writing laws, recording grants, and binding alliances in ink that endured when iron rusted. This blending of Andals with the local Dornish lords gave the house a reputation for governance as much as for arms, their very blazon a reminder that ink rules as surely as spear.\n#weak Founders wrote; the Tor prospered. Jordaynes tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

JORDAYNE_LORDS_OF_THE_TOR_NO_BULLETTAB:0 "Rising above the Sea of Dorne, the Tor guarded not only the coasts but the caravans that threaded the desert tracks beyond. Its harbor welcomed traders under the shadow of checkered banners, while its walls braced against sails and sand alike. Those who held the Tor held the trade lanes that stitched salt shore to desert heart.\n#weak Hold the Tor, and tide and trade obey. Enables recruitment of [GetMaA('jordayne_tor_sentinels').GetName] as [men_at_arms|E].#!."

JORDAYNE_QUILL_BEFORE_THE_SUN_NO_BULLETTAB:0 "In ages when Martells bowed to the Jordaynes, it was their word that weighed heavier than spears. Treaties bore their seal, marriages their witness, and disputes their judgment. Though time brought reversals, the Jordaynes remember when their writ carried more weight than the rising sun of Sunspear—and they have never ceased reminding neighbors that old precedence is not easily erased.\n#weak Authority written once is seldom wholly erased. Jordaynes tend to be [GetTrait('authoritative').GetName( GetNullCharacter )]."

JORDAYNE_BURNT_AND_RETAKEN_NO_BULLETTAB:0 "The Tor has been abandoned, captured, and even set aflame, but each time it rose again from smoke and sand. Jordayne blood proved stubborn as their stone, their halls repopulated, their banners unfurled anew. This resilience became a symbol throughout Dorne: the Tor may bend, but it does not break, and ashes are but the herald of return.\n#weak Better ash today than chains tomorrow."

JORDAYNE_LET_IT_BE_WRITTEN_NO_BULLETTAB:0 "To the Jordaynes, power lies in the written word: charters copied and sealed, tallies of spears, levies, and ships, chronicles of grants and grievances. While others rely on memory or rumor, the Tor records—and in recording, commands. Lords come and go, but parchments in Jordayne vaults make their claims endure long after voices fall silent.\n#weak Words fade; writs remain."

jordayne_tor_sentinels:0 "Tor Sentinels"
jordayne_tor_sentinels_flavor:0 "Clad in green and gold, the Sentinels of the Tor embody both blade and quill. Their cloaks mark them as wardens of Jordayne law, their steel as defenders of its halls and markets. Where the banners of the quill fly, these mailed guardians stand—disciplined, hooded, and resolute, holding the roads of the south as surely as ink holds parchment."

building_type_agot_jordayne_tor_library_01:0 "The Tor"
building_agot_jordayne_tor_library_01:0 "The Tor – Library of Writs"
building_agot_jordayne_tor_library_01_desc:0 "Beneath green-and-checkered banners, the Jordaynes keep a library where the sea’s salt gives way to the scent of vellum and ink. Charters, ship tallies, river tolls, and land claims rest in cedar-lined vaults; scribes copy decrees in the cool hours while clerks weigh seals and witnesses. Once a king’s court in elder days, the Tor endures now as a court of record: a place where ledgers outlast boasts and writs bind men firmer than chains."


#VAITH

vaith_legacy_track_name: "Vaith"
vaith_legacy_track_desc: "To Destroy Is To Control"
vaith_legacy_1_name: "Keepers of the River"
vaith_legacy_2_name: "Lords of the Red Dunes"
vaith_legacy_3_name: "Vanish in the Sands"
vaith_legacy_4_name: "Ransoms and Betrayals"
vaith_legacy_5_name: "Submission and Survival"

VAITH_KEEPERS_OF_THE_RIVER_NO_BULLETTAB:0 "The Vaith flows through wastes that swallow caravans whole. Yet the house that bears its name has long drawn life from its waters, building granaries, gardens, and towns along its banks. To hold Vaith is to hold one of the few green threads in the red sands.\n#weak Where the river runs, life endures. Vaiths tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

VAITH_LORDS_OF_THE_RED_DUNES_NO_BULLETTAB:0 "The lords of Vaith are not only river-wardens but dune-lords. Their riders and infantry fight as the desert itself does—grinding, blinding, exhausting. In the deep sands, the Vaith banners have always risen where lesser hosts falter.\n#weak The dunes bow to no one. Enables recruitment of [GetMaA('vaith_red_dune_wardens').GetName] as [men_at_arms|E].#!."

VAITH_VANISH_IN_THE_SANDS_NO_BULLETTAB:0 "It is said that whole hosts have marched toward Vaith and never returned. Sun, heat, thirst, and sandstorms claimed them as surely as swords. The Vaith learned long ago that in their lands, the desert is their greatest ally.\n#weak The sands hide their own. Vaiths tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

VAITH_RANSOMS_AND_BETRAYALS_NO_BULLETTAB:0 "The desert teaches harsh lessons in survival. In ransom and betrayal, the Vaith have known both sides of the bargain. To deal in oaths and coin is no shame when life and lordship hang in the balance.\n#weak Gold buys breath when steel cannot."

VAITH_SUBMISSION_AND_SURVIVAL_NO_BULLETTAB:0 "In the end, even Vaith bent the knee. Yet survival was its own victory. When dragons burned the sky and kings fell to ash, Vaith endured still—river, dune, and keep rebuilt in the red sand. Endurance, not defiance, is the dune’s true strength.\n#weak Bend, endure, and rise again. Vaiths tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

vaith_red_dune_wardens:0 "Red Dune Wardens"
vaith_red_dune_wardens_flavor:0 "Veiled in desert cloth, the Red Dune Wardens stand unbending where sand meets sky. Their yellow and orange garb marks the colors of Vaith, while their mail and curved blades carry the weight of discipline. Trained to patrol the burning dunes and riverbanks alike, they are both guardians of the Red Dunes and relentless warriors—hardened by sun, sand, and endless vigilance."

building_type_agot_vaith_red_dunes_01:0 "The Red Dunes"
building_agot_vaith_red_dunes_01:0 "The Red Dunes"
building_agot_vaith_red_dunes_01_desc:0 "West of the riverlands of Vaith the land heaves into a sea of scarlet sand—dunes that wander with the wind, burying roads, wells, and the bones of the unwary. Guides swear the dunes whisper at night and shift by day to swallow tracks whole; there are tales of a great host that marched into this waste and was never seen again. Towers and cairns dot the ridgelines, but only those who know the sands dare trust them. Here, the sun is a blade, the wind a veil, and the desert itself a patient hunter."

#GARGALEN

gargalen_legacy_track_name: "Gargalen"
gargalen_legacy_track_desc: "Salt Is Our Enemies’ Tears"
gargalen_legacy_1_name: "Blood of the Rhoyne"
gargalen_legacy_2_name: "Nymeria’s Companions"
gargalen_legacy_3_name: "Golden Cockatrice"
gargalen_legacy_4_name: "Defiance of Vaith"
gargalen_legacy_5_name: "Gateway of Southern Dorne"

GARGALEN_BLOOD_OF_THE_RHOYNE_NO_BULLETTAB:0 "The Gargalens claim their descent from the proud Rhoynar who fled Valyria’s fires and followed Queen Nymeria across the seas. That blood still burns within them, a heritage of river-kings who would rather die than bend. Their words, ‘Salt is our enemies’ tears’, are more than a boast—they are the memory of a thousand drowned foes. Gargalens tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

GARGALEN_NYMERIAS_COMPANIONS_NO_BULLETTAB:0 "When Nymeria’s thousand ships landed upon Dornish sands, the Gargalens stood among her closest companions. They bent their pride only to her, and later to House Martell, weaving loyalty and memory into the very fabric of their line. Theirs is a voice often heeded in Sunspear, for their fealty has been written in centuries of service. Gargalens tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

GARGALEN_GOLDEN_COCKATRICE_NO_BULLETTAB:0 "Salt Shore’s banners bear the golden field and red cockatrice. From the crowded docks to the sun-scorched alleys, House Gargalen’s guards embody this emblem. The Golden Cockatrice stands for their vigilance, their discipline, and their readiness to strike down reavers, rivals, and smugglers alike. Enables recruitment of [GetMaA('gargalen_cockatrice_guard').GetName] as [men_at_arms|E].#!."

GARGALEN_DEFIANCE_OF_VAITH_NO_BULLETTAB:0 "Though the lords of Vaith claim Salt Shore as their due, the Gargalens have long resisted such pretensions. Their defiance is as steady as the tides, their rivalry an old wound that refuses to heal. Pride, stubbornness, and salt-stung defiance have marked every lord of Salt Shore, and those who march against them soon learn why their words cut as sharp as their steel. Gargalens tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

GARGALEN_GATEWAY_OF_SOUTHERN_DORNE_NO_BULLETTAB:0 "Salt Shore is no mere coastal town—it is the only true port in the south of Dorne, where spice-ships and war-galleys may anchor safely. Through its wharves flow coin, trade, and power, and through its gates House Gargalen holds the keys to the sea. Whoever commands Salt Shore commands the southern tides, and the Gargalens have never forgotten it."

gargalen_cockatrice_guard:0 "Cockatrice Guard"
gargalen_cockatrice_guard_flavor:0 "Clad in weathered mail and deep crimson cloaks, they stand watch over Salt Shore’s docks and walls as both soldiers and stewards. Their swords are kept sharp not only for battle but for the quiet work of keeping the harbor secure. Hardened by the Dornish sun and tempered by the Rhoynar blood in their veins, they are the watchful eyes of House Gargalen—ever ready to strike like the cockatrice on their banners."

#HORNWOOD

hornwood_legacy_track_name: "Hornwood"
hornwood_legacy_track_desc: "Righteous In Wrath"
hornwood_legacy_1_name: "Lords of the Forest"
hornwood_legacy_2_name: "Wrathful Vigilance"
hornwood_legacy_3_name: "Axe-Brothers of the Hornwood"
hornwood_legacy_4_name: "White Knife Wardens"
hornwood_legacy_5_name: "Righteous in Wrath"


HORNWOOD_LORDS_OF_THE_FOREST_NO_BULLETTAB:0 "Our lineage has ruled the dense, ancient timberlands of the northeastern North since the dawn age, harvesting the massive sentinel pines and soldier oaks that frame our keep. We do not gamble our security on soft southern court-intrigues; we are the iron wardens of the wood, tracking poachers and clearing mountain outlaws with an absolute, grueling patience.\n#weak The forest canopy hides our tracks, and our arrows strike unseen from the treeline. Members of the Hornwood dynasty make for exceptionally skilled [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]."

HORNWOOD_WRATHFUL_VIGILANCE_NO_BULLETTAB:0 "We have spent thousands of years trapped in a dangerous, suffocating vise between hungry neighbors—the skin-peeling monsters of the Dreadfort to our east and the wealthy, calculating silver-lords of White Harbor to our west. Absolute vigilance is our primary shield, and a sudden, terrifying execution is our weapon.\n#weak To insult the moose banner is to wake a measured and merciless retribution. Members of the Hornwood dynasty are frequently born [GetTrait('wrathful').GetName( GetNullCharacter )]."

HORNWOOD_AXE_BROTHERS_NO_BULLETTAB:0 "We do not field flashy cavalry vanguards or gallant tournament knights who babble about chivalry. Our household vanguard is a brutal infantry phalanx of heavy axe-bearers who march knee-deep in the snow, swinging double-bitted logging axes to systematically chop down enemy infantry ranks like rotted timber.\n#weak Our line does not break, and our broad-axes cleave through shields. Enables recruitment of [GetMaA('hornwood_axe_brothers').GetName] as [men_at_arms|E]."

HORNWOOD_WHITE_KNIFE_WARDENS_NO_BULLETTAB:0 "We command the vital lumber thoroughfares and guard the crossings of the Broken Branch river, the commercial throat feeding our interior valleys. Our border outriders meticulously audit the logging camps and ferry stations, ensuring no rival house poaches our ironwood or passes our customs checkpoints without paying our tax.\n#weak Timber, river-tolls, and absolute frontier vigilance turn our hall into a permanent watchpost."

HORNWOOD_RIGHTEOUS_IN_WRATH_NO_BULLETTAB:0 "Our official house words are an unyielding, bloody promise to our allies and a warning to our detractors: *Righteous in Wrath*. We do not accept southern compromises or forget ancient slights; we march our hosts to exact an absolute, mathematical blood-debt from any traitor who dares compromise our kin.\n#weak The snows freeze our pastures, but the horn of the bull moose never bends to fear."

hornwood_axe_brothers:0 "Hornwood Wood-Axes"
hornwood_axe_brothers_flavor:0 "Drawn from the most broad-shouldered timber-cutters and veteran forest-garrisons of the Broken Branch valleys, these heavy infantrymen are the iron fist of House Hornwood. Clad in thick shadow-cat pelts and heavy iron ring-mail, they carry massive, double-bitted logging axes engineered to shear through heavy plate and split oak shields. Drilled to march knee-to-knee down narrow, snow-choked forest trails, they form an immovable wall of physical mass that can break heavy cavalry charges through raw, crushing northern violence."

building_type_agot_hornwood_forest:0 "Hornwood Timber Estate"
building_agot_hornwood_forest_01:0 "The Great Sentinel Yards"
building_agot_hornwood_forest_01_desc:0 "Planted at the strategic junction where the dense pine forests intersect the banks of the Broken Branch river, this unique timber complex serves as the economic engine of your domain. Enclosed by massive log palisades and deep earthwork ditches, its sawpits and custom-houses manage the lucrative harvest of soldier oaks and sentinel pines—proving that while the forest shields you from the Boltons, it is this logging trade that fills your vaults with silver."


#WULL

wull_legacy_track_name: "Wull"
wull_legacy_track_desc: "Strength Carried, Not Claimed"
wull_legacy_1_name: "Stoneborn Might"
wull_legacy_2_name: "Oath of the Mountain Clans"
wull_legacy_3_name: "Mountain’s Shadow"
wull_legacy_4_name: "Buckets Against the Iron Tide"
wull_legacy_5_name: "The Wull"


WULL_BUCKETS_OF_STONE_AND_ICE_NO_BULLETTAB:0 "Our sigil of three wooden buckets on a grey-and-white checkered field is no simple farmer's mark; it represents a hard-bitten people who haul what a merciless country demands. Living in high cliff-vales where the wind cuts like a flint axe, our clansmen grow broad-shouldered, short of word, and physically massive from a lifetime of manual toil.\n#weak The mountains harden our backs long before they teach our tongues to speak. Members of the Wull dynasty are usually born [GetTrait('strong').GetName( GetNullCharacter )]."

WULL_OATH_OF_THE_MOUNTAIN_CLANS_NO_BULLETTAB:0 "Mainland lords call us 'House Wull,' but in the high country, our chieftain is known simply by an absolute title: *The Wull*. We do not care for southern parchment laws, holding a fanatical, multi-generational fidelity to 'The Ned' of Winterfell and marching our axes down the switchbacks the moment the direwolf calls.\n#weak Our blood-oaths are frozen into the frost—impossible for foreign kings to pry loose. Members of the Wull dynasty make for exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

WULL_MOUNTAINS_SHADOW_NO_BULLETTAB:0 "We navigate the vertical goat-tracks, treacherous scree slopes, and vertical knife-edge passes of the far north with an instinctive, lethal precision. We read the approaching winter storms off the teeth of the crags, transforming the vertical mountain geography into a deadly tactical weapon to trap invading hosts.\n#weak We march where roads are nothing but a rumor, using the stone as our vanguard. Enables recruitment of [GetMaA('wull_shieldbearers').GetName] as [men_at_arms|E]."

WULL_BUCKETS_AGAINST_THE_IRON_TIDE_NO_BULLETTAB:0 "Our ancient songs are thick with the blood of ironborn reivers who sailed their longships into our coves to burn our timber longhalls. We have spent thousands of years listening for the sound of oars in the coastal fog, using heavy boulders and wood-axes to crush the krakens in the breaking surf.\n#weak We hold an ancient, burning grudge against the sea-scum, paying our salt-debts in blood."

WULL_THE_WULL_NO_BULLETTAB:0 "When the deep winter threatens our holds, our old men do not sit by the hearth to starve their kin; they pack their weapons and march south to die in battle, eager to bathe their axes in Bolton blood before the snows claim their bones. We do not fear the frost—we crave a glorious, red death beneath the banners of Winterfell.\n#weak We do not plan to survive the winter; we plan to die with steel in our hands, shouting for the Ned."

wull_shieldbearers:0 "Wull Mountain-Shields"
wull_shieldbearers_flavor:0 "Drawn from the most colossal, battle-hungry clansmen of the crags overlooking the Bay of Ice, these heavy infantrymen are the iron fist of The Wull. Cloaked in thick shadow-cat pelts and heavy boiled leathers, they lock their circular wooden shields—painted with the three buckets—edge-to-edge along frozen ridges. Drilled to march down loose gravel slopes with an absolute, unrelenting mass, they use heavy wood-axes to shatter enemy infantry formations through raw physical violence."


building_type_agot_breakstone_cave:0 "Northern Mountains"
building_agot_breakstone_cave_01:0 "The Breakstone Caverns"
building_agot_breakstone_cave_01_desc:0 "High within the jagged stone of the northern peaks, a massive, black-mouthed cavern opens into the bedrock. Warmed by subterranean volcanic vents and accessed only by vertical goat-tracks, Breakstone Cave serves as an un-seizable warren for your clan—allowing your smallfolk to weather the deepest winters while your axemen watch the passes to slaughter any climbing foe."


#CERWYN

cerwyn_legacy_track_name: "Cerwyn"
cerwyn_legacy_track_desc: "Honed and Ready"
cerwyn_legacy_1_name: "Honed and Ready"
cerwyn_legacy_2_name: "Nearest to the Wolf"
cerwyn_legacy_3_name: "Kingsroad Musters"
cerwyn_legacy_4_name: "Stewards of the Kingsroad"
cerwyn_legacy_5_name: "The Axe at Hand"


CERWYN_HONED_AND_READY_NO_BULLETTAB:0 "Our lineage commands the closest keeps to the high seat of the North, our practice yards permanently ringing to the scrape of the whetstone. The black battle-axe on our silver banner is a code of absolute readiness—levies drilled until the ash haft feels like an extension of the arm, ensuring our weapons are immaculate when the King calls.\n#weak We do not waste time with southern court pageantry; we sharpen our steel for war. Members of the Cerwyn dynasty are frequently born [GetTrait('brave').GetName( GetNullCharacter )]."

CERWYN_NEAREST_THE_WOLF_NO_BULLETTAB:0 "Our watchfires can be seen directly from the battlements of Winterfell, and our outriders water their destriers at the very same wells as the Starks. This extreme proximity has forged an ironclad, multi-generational trust—when the direwolf horn sounds, our household vanguard is already in the saddle before the echoes fade across the tundra.\n#weak A faithful neighbor to the Wolf, and an unyielding executioner to his enemies. Members of the Cerwyn dynasty are usually born [GetTrait('loyal').GetName( GetNullCharacter )]."

CERWYN_KINGSROAD_MUSTERS_NO_BULLETTAB:0 "We dominate the heavily traveled thoroughfares of the Kingsroad just south of the capital, auditing every merchant caravan and keeping a sharp-eyed watch for southern infiltrators. Our marestars execute a disciplined, rapid muster that can deploy hundreds of heavy axemen to the highway checkpoints long before trouble can breach the interior.\n#weak We command the vital veins of the North, our vanguard moving with unmatched speed. Enables recruitment of [GetMaA('cerwyn_winterwardens').GetName] as [men_at_arms|E]."

CERWYN_STEWARDS_OF_THE_KINGSROAD_NO_BULLETTAB:0 "We have paid a catastrophic blood-price for our geographical proximity to the seat of power, watching our castle get burned to ash and our heirs butchered by Bolton traitors outside Winterfell's gates. We bear these ancestral scars with a cold, silent resilience, hoarding our grain and re-forging our weapons in our hidden cellars.\n#weak Let the flayed men celebrate their treasons; the axe remembers where it was sharpened."

CERWYN_THE_AXE_AT_HAND_NO_BULLETTAB:0 "We do not rely on distant mountain passes or complex courtly ceremonies to secure our borders; we trust to absolute, immediate preparation and the heavy iron weapon kept close at hand. Our rule across the central plains is firm, pragmatic, and un-Andal, ensuring Castle Cerwyn stands as an unbreakable gatehouse for our liege.\n#weak We do not shout on the battlefield; our black broad-axes speak for our lineage."


cerwyn_winterwardens:0 "Cerwyn Winterwardens"
cerwyn_winterwardens_flavor:0 "Drawn from the veteran highway guards and hardened frontier-vassals of Castle Cerwyn, these elite light infantrymen are the specialized outriders of our keep. Cloaked in thick wolf-furs, black wool tabards, and mud-smeared leathers, they are drilled to navigate deep arctic snowdrifts and thick pine forests without leaving a track. Wielding short, broad-bladed battle-axes and weighted throwing spikes, they specialize in high-speed tactical ambushes along the Kingsroad, ruthlessly liquidating enemy scouts before melting back into the white silence."


#WHITEHILL

whitehill_legacy_track_name: "Whitehill"
whitehill_legacy_track_desc: "Ever Higher"
whitehill_legacy_1_name: "Ever Higher"
whitehill_legacy_2_name: "Strength in Unity"
whitehill_legacy_3_name: "Ironwood Feud"
whitehill_legacy_4_name: "Watchfires of Highpoint"
whitehill_legacy_5_name: "Rise Without End"

WHITEHILL_EVER_HIGHER_NO_BULLETTAB:0 "Our lineage commands the jagged, wind-scoured ridges of Highpoint, our eyes permanently fixed on the next summit. We do not hide in the damp bogs; our house words are an absolute, aggressive lifestyle decree: *Ever Higher*, driving our heirs to ruthlessly scale the ladder of northern power and outshine our rivals through raw, calculating tenacity.\n#weak The rocky slopes breed an unyielding ambition, and we carve our path to the top. Members of the Whitehill dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

WHITEHILL_STRENGTH_IN_UNITY_NO_BULLETTAB:0 "Living on a rugged frontier surrounded by hostile, insular tree-worshipers, we have learned that a scattered vanguard is a dead one. Our household captains enforce a rigid, synchronized battlefield order—locking our iron-rimmed shields edge-to-edge to form an impenetrable wall that can absorb any wild forest charge.\n#weak Ranks closed and shoulders locked; our discipline flattens their wild fury. Enables recruitment of [GetMaA('whitehill_highpoint_watch').GetName] as [men_at_arms|E]."

WHITEHILL_IRONWOOD_FEUD_NO_BULLETTAB:0 "We have thinned our own pine slopes to fuel our booming economy, leaving nothing but stumps in the frost while our eyes covet the pristine ironwood groves of Ironrath. Our master woodsmen keep ledgers as sharp as any logging axe, utilizing border-extortion, forced timber-tolls, and legal claims to systematically choke out House Forrester.\n#weak We audit every cord of wood, and we will bleed their groves dry of silver. Members of the Whitehill dynasty are frequently born [GetTrait('greedy').GetName( GetNullCharacter )]."

WHITEHILL_WATCHFIRES_OF_HIGHPOINT_NO_BULLETTAB:0 "The high crown of Highpoint bristles with iron beacon-baskets, ready to signal our mountain vassals at the first column of smoke. As one of the lone northern houses to proudly keep the Faith of the Seven, our watchposts never sleep, keeping a paranoid vigilance over the treelines to crush outlaw raids or neighbor incursions.\n#weak Our sentries are absolute, our night-fires sharp, and our vanguard is armed before the horns fade."

WHITEHILL_RISE_WITHOUT_END_NO_BULLETTAB:0 "Let the bards sing their flowery, useless verses for dead heroes; our house survives through a cold, transactional political pragmatism. We wrap our lineage in the iron favor of the Dreadfort, watching our neighbors falter with a calculating, sharp-eyed opportunism, ready to seize their lands the moment they drop their guard.\n#weak Hard rules and stone-founded keeps ensure our dynasty outlasts their empty honor. Members of the Whitehill dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

whitehill_highpoint_watch:0 "Highpoint Watch"
whitehill_highpoint_watch_flavor:0 "Drawn from the most brutal mountain-vassals and veteran border-collectors of the Highpoint ridges, these heavy infantrymen are the iron fist of House Whitehill. Clad in heavy iron scale mail, thick fur cloaks, and frost-rimmed helms, they are drilled to form impenetrable shieldwalls along steep scree slopes and narrow mountain paths. They possess a fierce, aggressive combat discipline, engineered entirely to suppress the guerrilla longbow tactics of their forest rivals and hold the high ground at any cost."


#LOCKE

locke_legacy_track_name: "Locke"
locke_legacy_track_desc: "Ever Secure"
locke_legacy_1_name: "Keys After the Night"
locke_legacy_2_name: "Oathkeepers of Oldcastle"
locke_legacy_3_name: "Wardens of the Wolf’s Den"
locke_legacy_4_name: "Waymasters of the White Knife"
locke_legacy_5_name: "Keymasters of the North"

LOCKE_KEYS_AFTER_THE_NIGHT_NO_BULLETTAB:0 "Our lineage commands a royal antiquity that predates the first stone of Winterfell, tracing back to the ancient bronze-crown kings who ruled the eastern coast from Oldcastle. We do not gamble our security on soft southern pageantry; we use our keys to lock away our winter grain and secure our borders against raiders with absolute, grueling patience.\n#weak We command the cold coast, our lines as unyielding as iron locks. Members of the Locke dynasty are born exceptionally [GetTrait('stubborn').GetName( GetNullCharacter )]."

LOCKE_OATHKEEPERS_OF_OLDCASTLE_NO_BULLETTAB:0 "When the Stark Kings of Winter broke our ancient crown, we chose to bind our blood to the Direwolf through an ironclad, multi-generational fealty. We manage our coastal keeps with a key-holder's meticulous precision, ensuring messages fly between our solar and Winterfell long before our neighbors even dream of treason.\n#weak We bolt our gates against rebels and open our halls strictly to duty. Members of the Locke dynasty are frequently born [GetTrait('honest').GetName( GetNullCharacter )]."

LOCKE_WARDENS_OF_THE_WOLFS_DEN_NO_BULLETTAB:0 "For nearly two centuries, our house served as the absolute wardens of the Wolf's Den—the grim, stone-walled prison-fortress commanding the mouth of the White Knife. We mastered the brutal reality of dungeon-keeping, learning that absolute justice requires heavy iron bars, deep subterranean cells, and watchful sentries.\n#weak We hold the keys to the dark, and we watch the riverways by night. Enables recruitment of [GetMaA('locke_oldcastle_keywardens').GetName] as [men_at_arms|E]."

LOCKE_WAYMASTERS_OF_THE_WHITE_KNIFE_NO_BULLETTAB:0 "We dominate the complex thoroughfares, river-roads, and hidden ford networks of the upper White Knife. Our outriders and marsh-scouts meticulously audit the river-traffic, establishing night-beacons through the thick coastal fens to ensure no merchant cog or foreign spy passes our customs checkpoints without paying our tax.\n#weak We control the trading arteries of the North, our wealth guarded by absolute frontier vigilance."

LOCKE_KEYMASTERS_OF_THE_NORTH_NO_BULLETTAB:0 "The crossed keys on our purple banners represent our absolute authority over the vital gateway channels of the eastern fens. From locking the harbor chains against ironborn longships to bolting our gaol doors against outlaws, the quiet click of a Locke lock determines the strategic safety of the entire realm.\n#weak We do not shout on the battlefield; we quietly secure what must be kept hidden from the dark."


locke_oldcastle_keywardens:0 "Oldcastle Gate-Wardens"
locke_oldcastle_keywardens_flavor:0 "Drawn from the most broad-shouldered prison-sentries and veteran river-vassals of the Oldcastle domain, these heavy infantrymen are the iron fist of our keep. Wearing heavy steel plate armor, iron-capped helms, and fur cowls, they carry massive rectangular tower-shields painted with the crossed keys crest and heavy iron-spiked maces. Drilled to form impenetrable bottleneck phalanxes along narrow castle steps and causeway checkpoints, they excel at closing the line and ruthlessly crushing any routed foe."


building_type_agot_locke_oldcastle:0 "Locke Oldcastle Fortress"
building_agot_locke_oldcastle_01:0 "The Keyhouse Gates"
building_agot_locke_oldcastle_01_desc:0 "Built sharply at the strategic intersection where the eastern sea-wind roads meet the channels of the White Knife, Oldcastle stands as a formidable monument to ancient First Men architecture. Ringed by deep earthworks and unpolished stone curtain walls, its massive oak-and-iron gates bear the crossed keys of your lineage—serving as a secure, un-seizable bastion designed to lock out the frost and bar the paths against any invading host."


#TALLHART

tallhart_legacy_track_name: "Tallhart"
tallhart_legacy_track_desc: "Proud and Free"
tallhart_legacy_1_name: "Oath on the Square"
tallhart_legacy_2_name: "Charge of the Three Sentinels"
tallhart_legacy_3_name: "Drill of the Square"
tallhart_legacy_4_name: "Earthwrights of Cailin"
tallhart_legacy_5_name: "Proud and Free"

TALLHART_OATH_ON_THE_SQUARE_NO_BULLETTAB:0 "Our lineage commands the massive, squared-stone ramparts of Torrhen's Square, positioned where the vast western fields meet the dark edge of the Wolfswood. We do not gamble our security on soft courtly pageantry; our bells and stable-yards operate in absolute, constant readiness to launch our riders the moment a threat breaches our borders.\n#weak Our word is a hard, physical promise, and we do not tolerate delay. Members of the Tallhart dynasty are often born [GetTrait('calm').GetName( GetNullCharacter )]."

TALLHART_CHARGE_OF_THE_THREE_SENTINELS_NO_BULLETTAB:0 "The three green sentinel trees on our brown banners represent our absolute duty as master-wardens of the interior thoroughfares. Our forest-guards scour the logging routes and game lines with heavy axes, maintaining the massive earthen ramparts of our castle to ensure our smallfolk can weather the longest, most brutal winters.\n#weak We cultivate our power directly from the timber, our administration meticulous and firm. Members of the Tallhart dynasty are frequently born [GetTrait('diligent').GetName( GetNullCharacter )]."

TALLHART_DRILL_OF_THE_SQUARE_NO_BULLETTAB:0 "At our lakeside stronghold, our vanguard is drilled to the relentless thud of galloping hooves and tactical horn-calls. We maintain massive remount strings and elite outriders to scour the western fens, utilizing extreme speed and devastating hit-and-run maneuvers to shatter enemy scouts long before they can report our numbers.\n#weak We strike like a winter blizzard, outflanking our enemies before they can lower their lances. Enables recruitment of [GetMaA('tallhart_wild_hares').GetName] as [men_at_arms|E]."

TALLHART_EARTHWRIGHTS_OF_CAILIN_NO_BULLETTAB:0 "Living in a state of permanent territorial vulnerability along the western coast, our engineers have perfected the art of defensive earthworks and timber blockades. We fortify every strategic crossroads and stream-crossing, using massive pine-tar spikes and hidden traps to break the momentum of ironborn longship raiders.\n#weak We do not cower behind our walls; we turn the rough terrain into an absolute graveyard for invaders."

TALLHART_PROUD_AND_FREE_NO_BULLETTAB:0 "We do not trade our ancient, un-Andal honor for southern gold or empty royal promises, maintaining an ironclad fidelity to Winterfell that has stood unbroken since the Dawn Age. We rule our free smallfolk through mutual respect and fair laws, ensuring our vassals answer the King's war-horns with an absolute, voluntary ferocity.\n#weak The three sentinels do not bow to tyranny; our pride is carved into the northern bedrock."


tallhart_wild_hares:0 "Torrhen's Square Wild Hares"
tallhart_wild_hares_flavor:0 "Drawn from the most agile horse-breeders and veteran frontier-riders of the Torrhen's Square lake-marches, these elite light cavalrymen are the specialized outriders of our vanguard. Cloaked in thick wolf-furs and carrying short spears and balanced iron broadswords, they excel at high-speed tactical harrying, running down enemy scouts, and launching lightning-fast ambushes from pine-shadows. They navigate deep snowdrifts and frozen hedgerows with an instinctive precision, ensuring no raider escapes their pursuit."


building_type_agot_tallhart_torrhens_square:0 "Tallhart Torrhens Square Holding"
building_agot_tallhart_torrhens_square_01:0 "The Square Bastions"
building_agot_tallhart_torrhens_square_01_desc:0 "Built sharply as a formidable First Men stronghold of massive squared masonry, Torrhen's Square dominates the strategic thoroughfares south of the Wolfswood. Ringed by towering thirty-foot curtain walls and heavy square corner towers, its massive courtyards and active garrison barracks stand ready to launch a devastating light cavalry counter-stroke the moment the war-horns sound from Winterfell."


#MAGNAR

magnar_legacy_track_name: "Magnar"
magnar_legacy_track_desc: "Old Blood, Ready Blade"
magnar_legacy_1_name: "Stoneborn of Kingshouse"
magnar_legacy_2_name: "Harpoon-Law"
magnar_legacy_3_name: "False Lights and Safe Landings"
magnar_legacy_4_name: "Obsidian Factors"
magnar_legacy_5_name: "The Last Magnar"


MAGNAR_STONEBORN_OF_KINGSHOUSE_NO_BULLETTAB:0 "Our lineage commands the colossal, wave-smashed cliffs of Kingshouse, our ancestral halls carved directly into the living basalt since the Dawn Age. We do not copy the soft castle masonry of the southrons; we are the true Stone-Born of Skagos, our minds as rigid and entirely unyielding as the reef-stairs we rule.\n#weak The frozen sea-gales do not bend the rock, and neither do we. Members of the Magnar dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

MAGNAR_HARPOON_LAW_NO_BULLETTAB:0 "We enforce the absolute, bloody majesty of the harpoon-law across our crags, ruling our clans with a closed fist and a complete lack of mercy. We have never truly forgiven Winterfell for slaughtering our kin during our century-old rebellion, and our transactional loyalty to the Starks sleeps with one hand on our obsidian axes.\n#weak We do not trade vows for southern promises; what our lines hook, we hold. Members of the Magnar dynasty are born exceptionally [GetTrait('callous').GetName( GetNullCharacter )]."

MAGNAR_FALSE_LIGHTS_AND_SAFE_LANDINGS_NO_BULLETTAB:0 "We do not wait for the gods to bless our tables; we harvest the wealth of the Shivering Sea by luring wealthy White Harbor cogs onto our hidden reefs with false night-beacons. When the gales break their hulls, our warriors strip the floating corpses bare of their cargo, executing any survivor who crawls ashore.\n#weak We shipwreck our wealth, turning the jagged shoals into our private treasury. Enables recruitment of [GetMaA('magnar_kingshouse_stoneguard').GetName] as [men_at_arms|E]."

MAGNAR_OBSIDIAN_FACTORS_NO_BULLETTAB:0 "Our workshops produce the most lethal dragonglass arrowheads, heavy shadow-cat pelts, and rare unicorn horns in the north, trading our wares to the mainland for heavy silver. We reckon our profits with a calculating, sharp-eyed merchant precision while maintaining the pure Old Tongue of the First Men within our gates.\n#weak Commerce does not soften our edge; it simply funds our next war."

MAGNAR_THE_LAST_MAGNAR_NO_BULLETTAB:0 "We remember the ancient dawn age when the Magnar ruled as supreme King over the entirety of Skagos. Though the island is now fractured by petty clan grudges and rival holdings, the royal ambition of Kingshouse has never faded, and our warriors stand ready to wake the mountains when the war-horns blow.\n#weak Our blood runs back to the first masters of the high caves, unbent and unbroken."

magnar_kingshouse_stoneguard:0 "Kingshouse Stoneguard"
magnar_kingshouse_stoneguard_flavor:0 "Drawn from the most colossal, battle-hardened clansmen of the Kingshouse crags, these heavy infantrymen are the iron vanguard of the Magnar. Clad in thick seal-furs, green-and-white wool cloaks, and dark steel scale mail hammered out in our cavern smithies, they are sworn under the blood-oaths of the harpoon-law. Drilled to lock their heavy circular shields together on slippery reef-stairs and narrow cliff checkpoints, they swing heavy obsidian-edged war-axes with a savage, unrelenting violence."

building_type_agot_kingshouse_stone_and_sea:0 "Magnar Kingshouse Holding"
building_agot_kingshouse_stone_and_sea_01:0 "The Basalt Gatehouse"
building_agot_kingshouse_stone_and_sea_01_desc:0 "Rising sharply where the colossal mountain cliffs intersect the churning surf of the Shivering Sea, Kingshouse stands as a formidable monument to First Men architecture. Sunk deep into volcanic caverns carved out during the Long Night, its massive living-rock halls house heavy beacon-baskets—designed to flash signal-fires that guide your long-galleys and lure unwary mainland merchant cogs onto the reefs to be plundered."


#EGEN

egen_legacy_track_name: "Egen"
egen_legacy_track_desc: "By Day Or Night"
egen_legacy_1_name: "Sun Oath"
egen_legacy_2_name: "Moonwatch Vigil"
egen_legacy_3_name: "Wardens of the High Road"
egen_legacy_4_name: "Ring of Stone and Fire"
egen_legacy_5_name: "By Day or Night"

EGEN_SUN_OATH_NO_BULLETTAB:0 "Blue chief, sun, moon, and star: the Egens wear their charge on their banners and in their habits. Oaths are spoken with the sun as witness and written as carefully as a steward’s ledger, then carried by trusted riders to falcon lords and mountain keeps alike. They mind the crossings by daylight—tallies kept honest, escorts set in order—and see that the Arryn’s word runs clean from village green to high hall.\n#weak Speak it bright at noon, keep it still at dusk. Egens tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

EGEN_MOONWATCH_VIGIL_NO_BULLETTAB:0 "When the wind comes down from the Giant’s Lance and the valleys go black, Egen shutters stay open and their lamps stay high. Gatewards learn faces by stride and shadow; patrols count heartbeats as they listen for iron on stone; stewards note which latch lies and why. In the small hours where plots fatten, the moon finds them already walking the walls.\n#weak By night the quiet house hears first and answers fastest. Egens tend to be [GetTrait('calm').GetName( GetNullCharacter )]."

EGEN_WARDENS_OF_THE_HIGH_ROAD_NO_BULLETTAB:0 "Cloud-roads twist from the Bloody Gate toward the vale towns, and Egen men know each shelf and switchback by old names. They raise cairns where fog lies thick, string ropes where the wind bullies, and deal hard or fair with clan-bands so caravans pass with coin unspilled. Mule bells follow their markers; pilgrims and princes alike trust their hands.\n#weak Hold the shelf, mind the clans, and bring travelers home. Enables recruitment of [GetMaA('egen_high_road_lancers').GetName] as [men_at_arms|E].#!."

EGEN_RING_OF_STONE_AND_FIRE_NO_BULLETTAB:0 "From the Bloody Gate to the bays of Gulltown, Egen beacons crown the heights and bell-towers stud the valleys. By day, threads of smoke knit ridge to ridge; by night, one spark runs the Vale like a bright stitch. Watchmen trade horn-codes and brass keys, reeves keep rosters for who lights which hill—and raiders learn how quickly a quiet valley wakes.\n#weak Kindle the heights and watch the Vale rouse to shut the road."

EGEN_BY_DAY_OR_NIGHT_NO_BULLETTAB:0 "Some houses seek renown; Egen keeps regularity. Sun on helm or moon on water, they open what should be opened and close what must be closed, holding to steady custom when storms test lesser names. Travelers in the Vale swear by their lamps; lords trust their ledgers; the Arryns sleep more easily for their watch.\n#weak By day or night—seen, steady, and obeyed. Egens tend to be [GetTrait('just').GetName( GetNullCharacter )]."

egen_high_road_lancers:0 "High Road Lancers"
egen_high_road_lancers_flavor:0 "Mail-clad riders under blue pennons of sun, moon, and star, they keep the Vale’s paths and stone causeways. By day they scout and escort; by night they answer beacon and bell—swift to the pass and hard on the retreat, as their word runs: by day or night."

#TOLLETT

tollett_legacy_track_name: "Tollett"
tollett_legacy_track_desc: "When All Is Darkest"
tollett_legacy_1_name: "When All Is Darkest"
tollett_legacy_2_name: "The Grim’s Laughter"
tollett_legacy_3_name: "Seven-Star Zeal"
tollett_legacy_4_name: "Red Dawn at Seven Stars"
tollett_legacy_5_name: "Last Laugh of Grey Glen"

TOLLETT_WHEN_ALL_IS_DARKEST_NO_BULLETTAB:0 "Grey Glen lies in a fold of the Vale where dusk comes early and the pines drink sound. There the Tolletts keep the night-watch as craft: lamps trimmed, shutters checked twice, gate-rotas learned by heart and patrols changing without a clatter. In storm or siege, when ravens will not fly and rumor runs ahead of riders, the Glen stands ready for the hours others fear.\n#weak When all is darkest, a Tollett is already at the Wall. Enables recruitment of [GetMaA('tollett_grim_guard').GetName] as [men_at_arms|E].#!."

TOLLETT_THE_GRIMS_LAUGHTER_NO_BULLETTAB:0 "Torgold—called the Grim for laughing in battle—rode bare to the waist with a star carved on his breast and an axe in each hand. Songs claim he fought through Lord Redfort’s strongest warriors before taking the lord's arm with a single cut and tore Ursula Upcliff's head from her shoulders as she tried to curse him. Whether the verses speak true or not, the lesson remains: mock pain, mock death, and send dread fleeing before you. In Tollett halls the tale is told not to boast, but to teach a recruit what courage sounds like.\n#weak Laugh where fear expects you to flinch. Tollets tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

TOLLETT_SEVEN_STAR_ZEAL_NO_BULLETTAB:0 "An Andal host gathered to Ser Artys Arryn, and a Tollett answered. He bled for his oath at Seven Stars, and his line learned that vows are better carved in the heart than shouted in the yard. The Tolletts light their septs and keep their ledgers fair; they bend neither knee nor law to whim, and they do not wear piety like a plume. Faith is kept in the doing.\n#weak The star shines brightest in work, not words. Tollets tend to be [GetTrait('zealous').GetName( GetNullCharacter )]."

TOLLETT_RED_DAWN_AT_SEVEN_STARS_NO_BULLETTAB:0 "Dawn came red over rune-etched bronze and grit-black shields when the falcon banners met the First Men hosts. Tolletts learned to climb into slaughter one step at a time—axes low, teeth set—breaking a hill-guard not with rush but with pressure, until the crest belonged to them and the sun to their backs. That march lives still in their drill: measure before fury, and let the ground be your ally.\n#weak Take the height in steps; hold it in silence. Tollets tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

TOLLETT_LAST_LAUGH_OF_GREY_GLEN_NO_BULLETTAB:0 "King Robar Royce slashed with Lady Forlorn; Torgold the Grim grabbed for the blade, laughing, but the steel sliced through his hands and buried itself into his skull. So the song says he died choking on his last laugh—and Tollets kept the memory as a spur. Lamps are trimmed at midnight, captains speak calm before the gate, and men learn to smile at the worst of it, not from folly but from defiance. If an end must come, let it come standing.\n#weak Keep the light and your feet, save the last laugh for yourself."

tollett_grim_guard:0 "The Grim Guard"
tollett_grim_guard_flavor:0 "Black mail and weathered cloaks, faces set like stone. The Grim Guard take the first shock without hurry, then grind forward behind broad shields—short blades and hatchets working in tight rhythm. No boasts, no banners in the wind; just hard men doing the slow work of winning ground."

building_type_agot_paps_seakings_keep_01:0 "Sea-Kings’ Keep of the Paps"
building_agot_paps_seakings_keep_01:0 "Sea-Kings’ Keep of the Paps"
building_agot_paps_seakings_keep_01_desc:0 "Twin chalk domes rise from the Bite, crowned by wind-bitten towers where House Elesham holds the strait. In elder days the Eleshams ruled here as petty kings, taking dues in coin and oar from ships that dared the tide-rips; Hugo the Hopeful, King of Mountain and Vale broke that pride, but the stones endured. Boom-chains and beacon ledges still mark the channels, conch-horns answer bells from Breakwater to the Fingers, and rookeries keep the ravens fat. The Paps watch is narrow and hard—part lighthouse, part sea-fort—and the old sea-kings’ habit remains: count every keel, judge every sail, and let wreckers and raiders learn the reefs by feel."


#HARDYNG

hardyng_legacy_track_name: "Hardyng"
hardyng_legacy_track_desc: "Only Virtue Succeeds"
hardyng_legacy_1_name: "Heir in the Falcon’s Shadow"
hardyng_legacy_2_name: "Lances at Ironoaks"
hardyng_legacy_3_name: "Wardens of the High Pastures"
hardyng_legacy_4_name: "Feather and Chain"
hardyng_legacy_5_name: "The Falcon’s Claim"

HARDYNG_HEIR_IN_THE_FALCONS_SHADOW_NO_BULLETTAB:0 "The Eyrie casts a long shadow over the Vale, and the Hardyngs have often stood within it—kinsmen to falcons, near to succession by marriage and mischance. Proximity teaches posture: speak plain in the high hall, keep friends on the roads, and be ready when the wind shifts at the Eyrie.\n#weak Close to the perch, careful with every step. Hardyng tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

HARDYNG_LANCES_AT_IRONOAKS_NO_BULLETTAB:0 "Pages and squires of Hardyng blood learn their seats on the downs and along the lanes to Ironoaks, where tilts are straight and captains sterner still. The house’s name is called often in the lists and not seldom in the melee, where a man’s balance counts more than his boasts.\n#weak Firm in the saddle, firm in the crush. Hardyng tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

HARDYNG_WARDENS_OF_THE_HIGH_PASTURES_NO_BULLETTAB:0 "Above the Vale towns the pasture-roads climb into clean wind and thin stone. Hardyng men measure the day by cairn and path, set markers where fog gathers, and see caravans safely from shelf to shelf. Clan smoke is read like weather; avalanches are treated like ambushes.\n#weak Mind the path and see fortune reach its height. Enables recruitment of [GetMaA('hardyng_scarlet_pass_lancers').GetName] as [men_at_arms|E].#!."

HARDYNG_FEATHER_AND_CHAIN_NO_BULLETTAB:0 "Feather for the falcon; chain for the ledgers. Hardyng rule is orderly without fuss—rents taken fair, musters kept current, roads mended before they fail. A lord who means to stand near the Eyrie must first stand well at home.\n#weak Quiet law, quick musters, coffers that ring true."

HARDYNG_THE_FALCONS_CLAIM_NO_BULLETTAB:0 "Blood remembers. The Vale has seen Hardyng hands near the falcon’s seat more than once, and the house keeps itself ready for the hour when a name must weigh as much as a sword. Their captains speak softly, their walls are sound, and their kinships run like mountain streams—twisted, cold, and enduring.\n#weak Title or no, the wing still casts its shade. Hardyng tend to be [GetTrait('authoritative').GetName( GetNullCharacter )]."

hardyng_scarlet_pass_lancers:0 "Scarlet Pass Lancers"
hardyng_scarlet_pass_lancers_flavor:0 "Scarlet and white barded, these lancers rule the wind-cut passes and stone roads. Many hone their craft on the Vale’s tourney circuit—tilts at Ironoaks and Redfort, the lists at Gulltown—learning the couch and break, the wheel for a second thunder, and how to keep a seat in the crush. In war the pageant falls away, but the drill remains: shock on the first pass, steel and weight on the second."


#REDFORT

redfort_legacy_track_name: "Redfort"
redfort_legacy_track_desc: "As Strong As Stone"
redfort_legacy_1_name: "Walls of the First Men"
redfort_legacy_2_name: "Blood and Stone at Seven Stars"
redfort_legacy_3_name: "Under the Falcon’s Peace"
redfort_legacy_4_name: "Keystone Keepers"
redfort_legacy_5_name: "As Strong as Stone"

REDFORT_WALLS_OF_THE_FIRST_MEN_NO_BULLETTAB:0 "The Redfort’s walls run older than many names in the Vale, laid by hands that spoke the tongue before sept bells. From those stones the Redforts take their manner: slow to bend, slower to break, and proud to stand where the escarpment meets the high road.\n#weak Stone remembers who set it. Redforts tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

REDFORT_BLOOD_AND_STONE_AT_SEVEN_STARS_NO_BULLETTAB:0 "At Seven Stars they took the field with Robar Royce and learned how dear old crowns can cost. A Tollett ax sheared Lord Redfort’s arm; the house bound the stump and the lesson both—meet steel with steel, bear losses without whining, and hold your line until the day turns.\n#weak Blood pays, stone endures."

REDFORT_UNDER_THE_FALCONS_PEACE_NO_BULLETTAB:0 "When the Andals won the Vale beneath Ser Artys Arryn, the Redforts set their pride aside and their oaths in order. Since then they have kept the falcon’s peace on the hill roads: tithes tallied straight, watchfires tended, quarrels ended before the mountain folk smell them.\n#weak Bend the knee once; keep it bent to law, not fear. Enables recruitment of [GetMaA('redfort_stonefoot').GetName] as [men_at_arms|E].#!."

REDFORT_KEYSTONE_KEEPERS_NO_BULLETTAB:0 "A gate holds because its keystone holds. Redfort masons tend walls and stairs as if they were kin, and their marshals staff posterns and towers with the same care. When horns sound in the valleys, the keep does not rattle; it settles its weight and waits.\n#weak Good stone, good garrison, quiet nights. Redforts tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

REDFORT_AS_STRONG_AS_STONE_NO_BULLETTAB:0 "Their words are not for song, but for seasons. Stonework rises under their hands, hall and village both; neighbors trust their ledgers, and the Vale’s builders mark their measures. A Redfort keeps what is raised and raises what should be kept.\n#weak As strong as stone—seen in every wall they leave behind."

redfort_stonefoot:0 "Redfort Stonefoot"
redfort_stonefoot_flavor:0 "Light-foot sergeants of House Redfort who range the moors and hill-roads below the red walls. With short swords, cudgels, and javelins they harry on broken ground, cut at columns, and melt back to stone and scrub. As their words run—#italic As Strong as Stone#!—they hold the pass long enough for heavier boots to arrive."

building_type_agot_wickenden_waxworks_01:0 "Wickenden Wax Works"
building_agot_wickenden_waxworks_01:0 "Wickenden Wax Works"
building_agot_wickenden_waxworks_01_desc:0 "In Wickenden the air is sweet with honey and clean with tallow. Renderers, beemasters, and chandlers turn hive and harbor into light—boat-lamps for coastal traders, candles for septs and homes, and sealing-wax for a thousand ravens. Guild tallies keep the fire hot and the lanes bright."
building_agot_wickenden_waxworks_02:0 "Wickenden Wax Guild"
building_agot_wickenden_waxworks_02_desc:0 "Wax houses multiply along quay and lane, guild marks stamped on every taper and seal. Night-watchmen trim lamps by rota, warehouses keep stock dry against sea-fog, and caravans leave with crates of wick and wax bound for Gulltown and the Sisters. Coin comes with the light, and order follows coin."
building_agot_wickenden_waxworks_03:0 "Great Waxhouse of Wickenden"
building_agot_wickenden_waxworks_03_desc:0 "Master chandlers oversee halls of copper vats and oak racks where the Vale’s light is cast by the thousand. Royal writs are sealed with Wickenden colors; harbors shine by their lamps; septs and courts alike measure their evenings by the steady burn of Wickenden flame. A city held in order shines longest—and profits most."


#BELMORE

belmore_legacy_track_name: "Belmore"
belmore_legacy_track_desc: "From Every Peak"
belmore_legacy_1_name: "Red Manes of Strongsong"
belmore_legacy_2_name: "Moot of Strongsong"
belmore_legacy_3_name: "After Seven Stars"
belmore_legacy_4_name: "Bellwrights of Strongsong"
belmore_legacy_5_name: "The Song That Carries"

BELMORE_RED_MANES_OF_STRONGSONG_NO_BULLETTAB:0 "Strongsong’s halls are old stone, and the Belmores who keep them are old stock—First Men grit whose red hair shows bright as banked embers in torchlight. Their tales begin before sept-bells, when barrow-mounds and standing stones marked the valleys, and their hunts still range into snows where goat-paths fade to wind. They prize the stubborn crafts that outlast winters—sound walls, keen axes, and oaths that hold when banners do not.\n#weak Old blood; new snows; steady hands on the ridge. Belmores tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

BELMORE_MOOT_OF_STRONGSONG_NO_BULLETTAB:0 "Two slow rings bring Strongsong to the green. Red-haired elders take the stone bench; disputants stand facing hall and hill while stewards read accounts and witnesses speak their piece. Oaths are taken plain, lies fined dear, and old cuts measured in coin and pasture instead of fresh blood. Terms are carved into the book and carried valley to valley until the bell’s judgment is common law.\n#weak The bell rather summon voices then steel. Belmores tend to be [GetTrait('just').GetName( GetNullCharacter )]."

BELMORE_AFTER_SEVEN_STARS_NO_BULLETTAB:0 "They rode with Robar Royce when runes met septons in the dawn at Seven Stars, and learned how dearly the old crowns could cost. When Ser Artys Arryn took the Vale beneath the falcon, the Belmores laid grief aside without forgetting it—knelt, set their ledgers straight, and made their word a clean road between hill steads and high halls. Since then, their name has meant service without flattery and counsel without fear.\n#weak Bend once to law, then stand tall beneath it. Enables recruitment of [GetMaA('belmore_bellguard').GetName] as [men_at_arms|E].#!."

BELMORE_BELLWRIGHTS_OF_STRONGSONG_NO_BULLETTAB:0 "Strongsong’s foundries set bronze to a true note, and the Belmores set their hall to that same measure. Bell-casters and quartermasters keep time together—peals for watch and muster, ledgers for grain and gear—so that a village can ready carts as a captain readies files. When war comes, the foundry fires burn night-long and the levy forms to the beat that every valley knows.\n#weak Bronze set true to the Vale's very heartbeat."

BELMORE_THE_SONG_THAT_CARRIES_NO_BULLETTAB:0 "A Strongsong bell heard at dawn means work; at dusk, safety; at storm, resolve. The rhythm of those notes has become custom—the kind smallfolk trust and lords rely upon. Funerals march to it, harvest feasts begin with it, and levies form at its call without confusion. A house that can be heard without shouting need not boast: its sound already lives in the valleys it keeps.\n#weak Let the bell speak and the Vale will answer."

belmore_bellguard:0 "Strongsong Bellguard"
belmore_bellguard_flavor:0 "Steel-helmed heavy foot from Strongsong—many with the red manes of Belmore blood—who march to the bell’s cadence. Shields lock and swords work by the count, holding hill-roads and pass approaches until the next ring moves the line. When the bronze calls, the Bellguard sets and does not give ground."


#HUNTER

hunter_legacy_track_name: "Hunter"
hunter_legacy_track_desc: "Sought and Attained"
hunter_legacy_1_name: "String of the Longbow"
hunter_legacy_2_name: "Arrow Before the Crown"
hunter_legacy_3_name: "Teora’s Sky-Vision"
hunter_legacy_4_name: "Fosters and Bound Oaths"
hunter_legacy_5_name: "Feather-Law and Field Rights"

HUNTER_STRING_OF_THE_LONGBOW_NO_BULLETTAB:0 "Longbow Hall seasons its yew in the rafters until the sap sleeps and the wood sings to the draw. Children learn the mark by candlemarks and wind, shooting from bale and boulder in rain that would rot a lesser string. Hunts teach silence, patrols teach patience; fathers pass bows to daughters with the old cautions—unstring in storm, never loose blind, and let the breath go before the shaft. By the time war calls, the lesson is only being proved.\n#weak String true, breathe steady, loose clean. Hunters tend to be [GetTrait('brave').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('hunter_high_road_yewmen').GetName] as [men_at_arms|E].#!."

HUNTER_THE_ARROW_BEFORE_THE_CROWN_NO_BULLETTAB:0 "On the green before a thousand eyes, Robar Royce outshot Lord Hunter—so the tale runs—and won their pledge with a shaft laid truer than pride. Whisperers say the bronze king cheated; singers swear the split was clean. The Hunters kept both story and temper: take measure at the butts before the hall, keep courtesy as sharp as a broadhead, and win allies in sport so they stand in need. An arrow before a crown is a lesson for both.\n#weak Win friends in sport, allies in need. Hunters tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

HUNTER_TEORAS_SKY_VISION_NO_BULLETTAB:0 "Teora of Longbow Hall climbed a hawk’s eyrie and brought a notion down: a castle that breathed light and air above winter’s reach. She set chalk to slate for Roland Arryn and the Eyrie rose—terraces like steps in the sky, courts cool in summer wind, walls that throw storms aside. Masons who had built bowyers’ sheds learned to weigh a mountain like a target—balance, line, and an archer’s eye for what the wind will do.\n#weak See the shape whole; raise it as clean as a perfect shot."

HUNTER_FOSTERS_AND_BOUND_OATHS_NO_BULLETTAB:0 "After Seven Stars, the Hunters bent the knee to the falcon and paid in gold, land, and hostages. Those hostages grew into fosterlings; quarrels cooled at strange hearths; letters rode the High Road between houses once sworn to break each other. Oaths were kept like bows—well-oiled, watched often, and drawn only as far as needed. Thus the old pride learned new custom without losing its spine.\n#weak Bind wrath to law; make tomorrow with the children you send. Hunters tend to be [GetTrait('patient').GetName( GetNullCharacter )]."

HUNTER_FEATHER_LAW_AND_FIELD_RIGHTS_NO_BULLETTAB:0 "Not all Hunter craft is string and shaft. At Longbow Hall they keep the feather-law: seasons set by moon and cairn, commons grazed without stripping, butts kept for levy drill, and tolls laid so bridges stand. Disputes over pasture and poaching are heard on the green, writs sealed with a fletch-cut and carried valley to valley. Thus roads stay open, barns stay honest, and men answer the horn because the law feeds them first.\n#weak Law straight as an arrow; fields kept and folk willing."

hunter_high_road_yewmen:0 "High Road Yewmen"
hunter_high_road_yewmen_flavor:0 "Yew-bowed archers of Longbow Hall, widely reckoned as the finest marksmen in the Vale. They keep the High Road’s shelves and paths—reading wind off the cliffs, loosing at long measure in clean volleys, then shifting perches before steel can climb to meet them."

building_type_agot_longbow_hall_trophy_room_01:0 "Longbow Hall"
building_agot_longbow_hall_trophy_room_01:0 "The Trophy Room"
building_agot_longbow_hall_trophy_room_01_desc:0 "South of the Fingers and north of Old Anchor, Longbow Hall keeps a chamber where string and sight are honored in oak and horn. Antlers from winter stags, boar tusks, eagle hoods, and yew-bow racks line the walls; plaques mark shots loosed on the cloud-roads and beasts brought down in the eastern foothills. Stewards say King Jaehaerys I stepped through here on his royal progression, admiring the order of the hall as much as its trophies. Here boasts are measured, distances remembered, and every trophy is a lesson to the next pair of steady hands."

#BORRELL

borrell_legacy_track_BLA_name: "Borrell"
borrell_legacy_track_BLA_desc: "Old as the Sea"
borrell_legacy_1_BLA_name: "The Mark of the Sisters"
borrell_legacy_2_BLA_name: "Web of the Spider Crab"
borrell_legacy_3_BLA_name: "Masters of Breakwater"
borrell_legacy_4_BLA_name: "Keepers of the Night Lamp"
borrell_legacy_5_BLA_name: "The Tide's Whim"

BORRELL_THE_MARK_OF_THE_SISTERS_NO_BULLETTAB:0 "For five thousand years the Borrells have borne the mark—webbing between the three middle fingers, a Sisterman’s gift from the Lady of the Waves. They swim reefs where mainlanders founder, dive for moorings in winter chop, and read the sea’s temper by touch. What the spider crab grips, it keeps; what the Sisters choose to hold, they hold against storm and steel.\n#weak Born to the tide, clever in the chop. Borrells are gifted with [GetTrait('the_mark').GetName( GetNullCharacter )]."

BORRELL_WEB_OF_THE_SPIDER_CRAB_NO_BULLETTAB:0 "Quayside favors are a web, and the Borrells have long fingers. Tides bring fishers, oarsmen, smugglers, and sworn men to the same steps; coin and secrets change hands under the same gulls. Sisterton’s ledgers run on truth enough to keep peace and lies enough to keep profit, and the web holds because every strand is tied twice.\n#weak Grip tight, deal shrewd, let nothing slip. Borrells tend to be [GetTrait('arbitrary').GetName( GetNullCharacter )]."

BORRELL_MASTERS_OF_BREAKWATER_NO_BULLETTAB:0 "Swell breaks on ancient stone and iron chain; behind it, Breakwater Castle holds. Borrell masons mend the teeth that bite the tide, marshals man the towers that watch the roads of water, and storms spend themselves on walls that remember worse. When raiders test the channel, the current takes their nerve first and the saltcutters the rest.\n#weak Harbor made stone; stone made law. Enables recruitment of [GetMaA('borrell_saltcutters').GetName] as [men_at_arms|E].#!."

BORRELL_KEEPERS_OF_THE_NIGHT_LAMP_NO_BULLETTAB:0 "Night Lamp is their charge—banked by day, hooded by fog, and raised when the night goes blind. Sailors swear it guides the worthy; rivals whisper it chooses which keels should live. Either tale serves Sisterton. Watchmen count the beats of beacon and bell, pilots know the teeth of every bar, and the harbor sleeps because the heights do not.\n#weak Light the way, judge the water."

BORRELL_THE_TIDES_WHIM_NO_BULLETTAB:0 "Before the Kings of Winter came with fire and sword, the Borrells were pirate kings ruling reef and shoal. The memory burns and their tongues are bitter toward Northmen still. Yet Sisterton keeps stories that run cross-current: a Stark lord taken in their nets and loosed again without ransom, sent home on a borrowed wind. Ask why and you’ll get three answers by sundown—piety, pride, or profit. The spider crab grips when it chooses and lets go when it pleases; Borrell justice turns with tide and temper, and all the Sisters know to watch the water.\n#weak Mercy on one tide, malice on the next. Borrells tend to be [GetTrait('fickle').GetName( GetNullCharacter )]."

borrell_saltcutters:0 "Sisterton Saltcutters"
borrell_saltcutters_flavor:0 "Picked from pilots, wreckers, and harbor guards, the Saltcutters are Borrell’s elite light-foot. Trained for black-water work and quay fights, they move in tight packs along shingle and pier—hooking shields aside, cutting ranks loose at the knees, then vanishing into spray and alley before heavy boots can follow. Many bear the old Sisters’ mark—webbed fingers; short sea-swords and crabhooks do the rest. Few, fast, and merciless on the coast—they break a landing before it finds a footing."

#PAEGE

paege_legacy_track_name: "Paege"
paege_legacy_track_desc: "Thus Are We Bound"
paege_legacy_1_name: "Twin Serpents on Black"
paege_legacy_2_name: "Hardhand’s Pact"
paege_legacy_3_name: "Against the Storm King"
paege_legacy_4_name: "Quay-Ledgers and River Oaths"
paege_legacy_5_name: "Serpents Endure"

PAEGE_TWIN_SERPENTS_ON_BLACK_NO_BULLETTAB:0 "Our shields bear the twining red and white snakes twisting on a field of deep black, a permanent testament to our dynastic strategy: to coil in the reeds, watch our neighbors falter, and strike with absolute lethality when the perfect opening presents itself.\n#weak Serpents do not waste their breath on loud boasts; we show our fangs on our own terms. Members of the Paege dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

PAEGE_HARDHANDS_PACT_NO_BULLETTAB:0 "When the ironborn king Harwyn Hardhand invaded the Trident and the old storm-kings were smashed into the mud, our house masterfully chose to side with the iron hand. We ran supply barges at night, guided their vanguard through the hidden fens, and secured our dominion while prouder houses burned.\n#weak We navigate the strongest currents of the realm, turning the shifting tides into our wealth. Enables recruitment of [GetMaA('paege_river_serpents').GetName] as [men_at_arms|E]."

PAEGE_AGAINST_THE_STORM_KING_NO_BULLETTAB:0 "The arrogant lords of the south break like waves upon our riverbanks simply because we know how to hold the soil. We do not gamble our security on open fields; we bar the vital crossings, choke off ferry ramps, and let hunger, disease, and the sucking quagmires butcher our enemies for us.\n#weak We freeze the choke points of the Trident, forcing the enemy to guess where we strike. Members of the Paege dynasty are usually born [GetTrait('stubborn').GetName( GetNullCharacter )]."

PAEGE_QUAY_LEDGERS_AND_RIVER_OATHS_NO_BULLETTAB:0 "The wealth of our house is anchored directly to the busy quays and shipping channels of our domain. Our master reeves and port pilots audit every trading flatboat and grain barge with a calculating precision, ensuring that the continuous flow of river-tolls fills our private vaults with silver stags.\n#weak We seal our contracts with ink and wet boots, making the current work for our treasury."

PAEGE_SERPENTS_ENDURE_NO_BULLETTAB:0 "Crowns turn to ash and regional lieges shatter across history, but the red and white serpents always remain standing in the rushes. We have outlasted ancient kings and ironborn tyrants alike by knowing precisely when to bow, when to bargain, and when to slide a dagger into a rival's ribs.\n#weak Pragmatism is our truest fortress, and we outlast the pride of empires."


paege_river_serpents:0 "Red Fork Serpents"
paege_river_serpents_flavor:0 "Drawn from the most eagle-eyed marsh-hunters and veteran reed-wardens of the Paege domains, these elite marksmen are the lethal vanguard of the crossings. Wearing blackened steel visors and dark sashes matching their heraldry, they form up behind heavy sharpened stakes embedded in the river-mud. They loose their yard-long arrows in devastating, low-friction arcs to rake incoming ferry cogs and ford checkpoints, before stepping forward with heavy boar-spears to slaughter any enemy scout who touches the bank."


building_type_agot_saltpans_saltquays:0 "Saltpans Custom Infrastructure"
building_agot_saltpans_saltquays_01:0 "The Saltpans Salt Quays"
building_agot_saltpans_saltquays_01_desc:0 "Planted cleanly on the strategic shores of the Bay of Crab lanes where the Blue Fork empties into rills, Saltpans handles its quiet, lucrative trade beneath the squat stone holdfast of House Cox. Denied city charters by ancient river kings to limit its expansion, the port grew low, muddy, and practical—enclosing rows of saltwater evaporation pans, fish-granaries, and heavy salt-sheds to maximize regional commerce [1]."
building_agot_saltpans_saltquays_02:0 "Saltpans Harbor Guilds"
building_agot_saltpans_saltquays_02_desc:0 "Fortified timber plankways line the waterfront, connecting expanded quays to merchant storage vaults. Master net-menders, salt factors, and port pilots organize under strict guild marks, ensuring every flatboat is audited while guards patrol the piers to enforce order [1]."
building_agot_saltpans_saltquays_03:0 "The Quiet-Bay Marketplace"
building_agot_saltpans_saltquays_03_desc:0 "Bypassing the constraints of old restrictions, the city marketplace operates on commercial schedules paced directly to the tides. While the tiny keep of House Cox remains unchanged, the surrounding streets thrive on trade—handling pansalt, flatboat river catches, and peat, while the beacons of the Quiet Isle gleam across the bay as a symbol of steady, enduring wealth [1]."

#CHARLTON

charlton_legacy_track_name: "Charlton"
charlton_legacy_track_desc: "Judge By Our Deeds"
charlton_legacy_1_name: "After Justman's Fall"
charlton_legacy_2_name: "Oaths at Fairmarket"
charlton_legacy_3_name: "Under the Twins' Toll"
charlton_legacy_4_name: "River Palisades and Dikework"
charlton_legacy_5_name: "Keep the Small Peace"


CHARLTON_AFTER_JUSTMANS_FALL_NO_BULLETTAB:0 "Our lineage survived the century of absolute anarchy following the collapse of House Justman by keeping our weapons sharp and mastering the fluid politics of the forks. We do not gamble our security on hollow southern ideals; we turn our farm palisades into heavily fortified mustering yards, ready to bleed our rivals over every minor causeway.\n#weak In times of river lawlessness, absolute readiness is the only rule. Members of the Charlton dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

CHARLTON_OATHS_AT_FAIRMARKET_NO_BULLETTAB:0 "We remember the bold, calculating strategy of Lord Theo Charlton, who rode alongside the ironborn king Harwyn Hardhand when the old storm-kings were smashed into the mud at Fairmarket. We took our stand where the floodplain turned to blood-soaked mire, learning that a contract signed at dawn must be enforced at the edge of a sword.\n#weak We align our banners with the strongest current, and we sheathe our daggers on our own terms. Members of the Charlton dynasty are usually born [GetTrait('brave').GetName( GetNullCharacter )]."

CHARLTON_UNDER_THE_TWINS_TOLL_NO_BULLETTAB:0 "As direct, iron-clad vassals to the Twins, we manage the vital thoroughfares that feed the Crossing with a meticulous, sharp-eyed precision. We keep our tithes tallied, our levy musters punctual, and our local disputes entirely suppressed under the watchful eye of our Frey liege lords to secure our family's regional passage.\n#weak We serve our masters with a calculated efficiency, ensuring our coin buys us leverage. Enables recruitment of [GetMaA('charlton_crossing_wardens').GetName] as [men_at_arms|E]."

CHARLTON_RIVER_PALISADES_AND_DIKEWORK_NO_BULLETTAB:0 "Our lands stand firm against invaders because we have spent generations driving heavy oak stakes into the riverbanks. Our fens are heavily engineered with interconnected ditch-and-dyke barriers and rapid stockades, transforming the treacherous mud of the Blue Fork into a lethal tactical weapon to choke off enemy vanguards.\n#weak We brace the riverbanks with cold iron, forcing the quagmire to drown our enemies."

CHARLTON_KEEP_THE_SMALL_PEACE_NO_BULLETTAB:0 "While the great lords ruin the realm with their glorious rebellions, our reeves maintain absolute order across the commons, auditing fines long before they can erupt into blood-feuds. We keep our road-tolls honest and our winter storehouses heavily guarded, making our house an indispensable anchor of regional trade.\n#weak We stand midstream, extracting our wealth from both banks while bending to no man's empty pride."

charlton_crossing_wardens:0 "Sevenstreams Crossing Wardens"
charlton_crossing_wardens_flavor:0 "Drawn from the most battle-hardened marsh-vassals and veteran toll-collectors of the Blue Fork, these heavy infantrymen are the iron shield of the thoroughfares. Equipped with heavy gambesons, iron-rimmed wicker pavises, and long, heavy ash-spears, they are drilled to form impenetrable blocks knee-deep in the Trident muck. Operating with a rigid, machine-knee discipline under the banner of their Frey liege, they excel at closing off narrow causeways and choking ferry ramps until their captains command the line to advance."

building_type_agot_sevenstreams_waymarket:0 "Sevenstreams Waymarket Development"
building_agot_sevenstreams_waymarket_01:0 "The Sevenstreams Toll-Booths"
building_agot_sevenstreams_waymarket_01_desc:0 "Positioned under the jurisdiction of the Twins where the Blue Fork frays into a chaotic web of rills and brooks, Sevenstreams stands as an absolute bottleneck crossroads of northern trade. Travelers attempting to bypass the main bridges must navigate the treacherous, mud-choked tracks of Hag's Mire to reach this outpost—transforming a bleak marshway into a highly lucrative commercial market where reeds, eels, peat, and barge-space are meticulously audited by your collectors."


#SMALLWOOD

smallwood_legacy_track_name: "Smallwood"
smallwood_legacy_track_desc: "From These Beginnings"
smallwood_legacy_1_name: "From These Beginnings"
smallwood_legacy_2_name: "Clearing Claimed by Oak"
smallwood_legacy_3_name: "Lesson of the Six Kings"
smallwood_legacy_4_name: "Writ on the Planks"
smallwood_legacy_5_name: "Riders Against the Red"


SMALLWOOD_FROM_THESE_BEGINNINGS_NO_BULLETTAB:0 "Our lineage commands the ancient oakwoods and timber fields where our frontiers press against the Vance marches. We do not gamble our security on soft courtly pageantry; we manage our forest holdings with a meticulous, sharp-eyed precision, hoarding seasoned timber to construct formidable ramparts long before our neighbors even dream of war.\n#weak Small seeds grow into the hardest timber, unyielding to the axe. Enables recruitment of [GetMaA('smallwood_river_oak_knights').GetName] as [men_at_arms|E]."

SMALLWOOD_CLEARING_CLAIMED_BY_OAK_NO_BULLETTAB:0 "Trapped between the powerful Vance overlords of Atranta and the aggressive borders of House Goodbrook, Acorn Hall has mastered the quiet administrative crafts that keep a domain from fraying. We audit our timber rights, enforce strict local land-charters, and resolve border disputes through calculating diplomacy to anchor our regional power.\n#weak Steady, patient custom holds the ground when the swords are sheathed. Members of the Smallwood dynasty are frequently born [GetTrait('patient').GetName( GetNullCharacter )]."

SMALLWOOD_LESSON_OF_THE_SIX_KINGS_NO_BULLETTAB:0 "We remember the blood-soaked lesson of the Battle of Six Kings, when King Arlan III Durrandon smashed the Teague kings and our own lord was brought home dead across his saddle. From that sodden slaughter, we learned never to risk our vanguard on open mud, drilling our infantry to aggressively stake the shallows and hold the high, firm ridges.\n#weak We do not rush blindly into the vanguard; we choose our ground with absolute grit. Members of the Vance dynasty are usually born [GetTrait('brave').GetName( GetNullCharacter )]."

SMALLWOOD_WRIT_ON_THE_PLANKS_NO_BULLETTAB:0 "During the chaotic uprisings of the Faith Militant, our household knights held Stonebridge against Wat the Hewer, enforcing the law of the Trident upon planks slick with river-spray. We understand that bridges answer first to strict legal treaties and military control, using our crossroad checkposts to systematically audit passing hosts.\n#weak Oaths and charters must be held firm before the fury of the smallfolk. Members of the Smallwood dynasty are frequently born [GetTrait('just').GetName( GetNullCharacter )]."

SMALLWOOD_RIDERS_AGAINST_THE_RED_NO_BULLETTAB:0 "We have spent centuries hunting outlaws and rebels through the willow-choked paths and hidden bogs of Blackbottom Bend. From riding alongside the Crown against Harren the Red to maintaining a network of fortified wayhouses, our household outriders ensure that no raider group breaches our interior valleys undetected.\n#weak We read the smoke on the horizon early, our scouts permanently in the saddle."


smallwood_river_oak_knights:0 "Acorn Hall Oak-Shields"
smallwood_river_oak_knights_flavor:0 "Drawn from the veteran foresters and heavy ditch-vassals of the Smallwood wood-marches, these elite heavy infantrymen are the iron vanguards of our hall. Wearing thick gambesons, iron rings, and carrying massive oak shields painted with the six acorns, they are drilled to form an impenetrable wall along narrow causeways and wet ferry ramps. Tempered by the historic slaughters of the Stonebridge and Six Kings campaigns, they excel at defensive bottleneck warfare, using raw physical mass to break cavalry charges."


building_type_agot_smallwood_acorn_hall:0 "Smallwood Acorn Hall Holding"
building_agot_smallwood_acorn_hall_01:0 "The Great Oak Keep"
building_agot_smallwood_acorn_hall_01_desc:0 "Planted strategically southeast of Riverrun and north of the volatile markets of Stoney Sept, Acorn Hall stands as a formidable monument to First Men timber-and-stone architecture. Positioned within sight of High Heart's ancient red hill, its massive oaken keep is enclosed by thick stone curtain walls and deep defensive ditches—housing extensive arsenals and audited grain storehouses designed to launch a rapid, ironclad muster the moment the war-horns sound."


#WHENT

whent_legacy_track_name: "Whent"
whent_legacy_track_desc: "Our Hour Will Come"
whent_legacy_1_name: "Bats on Gold"
whent_legacy_2_name: "Forged Under Lothston"
whent_legacy_3_name: "The Great Tourney Remembered"
whent_legacy_4_name: "Lower Thirds Kept"
whent_legacy_5_name: "Harrenhal’s Price"


WHENT_BATS_ON_GOLD_NO_BULLETTAB:0 "Our shields bear nine black bats spreading their wings on a field of deep yellow, a bright heraldic defiance raised against a monstrous keep that has swallowed centuries of echoes. We took the high seats where the dust of Hoare, Harroway, and Lothston had barely settled, training our courts to speak in muted whispers so guests see our immense grace rather than the weeping stone.\n#weak We mask the horrific grief of Harrenhal behind an absolute, gilded pride. Members of the Whent dynasty are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

WHENT_FORGED_UNDER_LOTHSTON_NO_BULLETTAB:0 "Before we ever claimed a lordly seat, our ancestors served as the primary martial enforcement arm of the sinister Lothstons, our mail and destrier-shoes hammered out by Ben Blackthumb's legendary smithy. When Mad Danelle’s blood-sorcery plunged the fens into madness, we masterfully chose to turn our steel against our unhinged masters to secure royal Targaryen favor.\n#weak Iron remembers its forging, and our transactional service is an absolute, unyielding habit. Members of the Whent dynasty are born exceptionally [GetTrait('diligent').GetName( GetNullCharacter )]."

WHENT_THE_GREAT_TOURNEY_REMEMBERED_NO_BULLETTAB:0 "We flooded the wide meadows of the Gods Eye with pavilions bright as summer fruit, hosting the most legendary, politically charged tourney of a generation to showcase our staggering dynastic wealth. Though the feast is long done and a crown of winter roses found the wrong brow, our halls still hoard that bright week like a coal beneath the ash.\n#weak Our immense hospitality outlives their courtly rumors, warming our legacy. Enables recruitment of [GetMaA('whent_nightwings').GetName] as [men_at_arms|E]."

WHENT_LOWER_THIRDS_KEPT_NO_BULLETTAB:0 "We handle the staggering, parasitic maintenance of our monstrous castle with an absolute, sharp-eyed administrative caution. Following Lady Shella's pragmatic doctrine, we bolt the iron doors of the upper storeys and let the empty miles of hall go dark, confining our household strictly to the swept, candle-lit lower thirds of the towers.\n#weak We prioritize defensive care over hollow grandeur, keeping our ruins from devouring our treasury. Members of the Whent dynasty are frequently born [GetTrait('content').GetName( GetNullCharacter )]."

WHENT_HARRENHALS_PRICE_NO_BULLETTAB:0 "Harrenhal was raised to mock the gods and melted to teach kings, offering an absolute, blood-soaked bargain of greatness on the road in and horrific grief on the road out. We walk our black towers with a steward's lamp and a soldier's step, fully aware that the curse of the Kingspyre thins our years while outlasting every feudal vow.\n#weak We stand firm through the melting stone, our resolve hardened by the night."


whent_nightwings:0 "Harrenhal Nightwings"
whent_nightwings_flavor:0 "Drawn from the most battle-hardened lesser landholders and veteran lake-garrisons of the Gods Eye, these heavy shock cavalrymen are the iron fist of Harrenhal. Clad in heavy, mirror-polished black steel plate armor under yellow plumage and bearing heavy shields painted with the nine bats, they are drilled to form a devastating closing crescent known as 'The Wing.' Moving knee-to-knee with low pennons and a single, thundering war-horn, their mass charge deals massive dread damage, utilizing the echoing terror of their castle to break enemy infantry shieldwalls."


#TEAGUE

teague_legacy_track_name: "Teague"
teague_legacy_track_desc: "Fortune And Firm Hand"
teague_legacy_1_name: "Gold from the West"
teague_legacy_2_name: "Hostages in the Hall"
teague_legacy_3_name: "Theo Saddle-sore"
teague_legacy_4_name: "Wars of the River Crowns"
teague_legacy_5_name: "Six Kings' Doom"


TEAGUE_GOLD_FROM_THE_WEST_NO_BULLETTAB:0 "Our lineage was not born from ancient silk charters or high-born bloodlines; we rose from ruthless highway ambushes, striking at Lannister gold-trains west of the Red Fork. We ferried our massive plundered fortunes straight to Essos to buy the absolute allegiance of Free Companies, returning to force the crown of Maidenpool onto our own heads.\n#weak Silver minted our dominion, and our sellsword gold purchased our right to rule. Enables recruitment of [GetMaA('teague_golden_tridents').GetName] as [men_at_arms|E]. Members of the Teague dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

TEAGUE_HOSTAGES_IN_THE_HALL_NO_BULLETTAB:0 "Knowing the great houses of the Trident kept their daggers in their sleeves, we transformed our courts into a paranoid prison-web of forced fosterage. We forced the heirs of House Vance, Blackwood, and Tully to play cyvasse under our watchful eyes, anchoring our political safety entirely to the leverage of our hostage ledgers.\n#weak We maintain our peace with a cold, unyielding leash over their children. Members of the Teague dynasty are born exceptionally [GetTrait('callous').GetName( GetNullCharacter )]."

TEAGUE_THEO_SADDLESORE_NO_BULLETTAB:0 "We carry the hyper-aggressive campaign legacy of King Theo Saddle-sore, who wore the gloss off destriers and the names off maps to suppress the riverlords. We are a house of frontline pragmatists who log our levy musters directly from the saddle, striking rebel vanguards at dawn before they can even cross our checkpoints.\n#weak We rule from the stirrup, our broad-axes cutting down any whisper of dissent. Members of the Teague dynasty are often born [GetTrait('brave').GetName( GetNullCharacter )]."

TEAGUE_WARS_OF_THE_RIVER_CROWNS_NO_BULLETTAB:0 "Our sovereign authority over the Trident has been forged through a permanent state of low-intensity civil war against ancient, resentful bloodlines. We use predatory marriage alliances and paid-off mercenary captains to systematically liquidate rivals, tracking the shifting currents of power to ensure our private vaults never stop growing.\n#weak We do not rely on traditional right; our dominion keeps only while our grip remains iron."

TEAGUE_SIX_KINGS_DOOM_NO_BULLETTAB:0 "Our golden empire was violently extinguished on the blood-soaked floodplain of the Battle of Six Kings, when we yoked our crown to the fanatical swords of the Faith Militant. Cornered by the combined hosts of the Tullys, Vances, and the unstoppable Storm King Arlan III, our entire lineage was butchered under a relentless rain.\n#weak Zealous conviction without tactical prudence turns the battlefield into a mass grave. Members of the Teague dynasty are frequently born [GetTrait('zealous').GetName( GetNullCharacter )]."


teague_golden_tridents:0 "Golden Tridents"
teague_golden_tridents_flavor:0 "Drawn from the most brutal Essosi sellswords and veteran harbor-guards of the Bay of Crabs, these heavy shock infantrymen are the iron backbone of the Teague crown. Clad in heavy steel plate armor lacquered in white and gold, they are meticulously drilled to execute the 'Trident Push'—forming three rigid ranks that advance to the strict count of their captains. Wielding heavy iron war-swords and short, skull-cracking war-hammers, they excel at holding muddy riverbeds and crushing the shieldwalls of rebellious border-barons."


#GRACEFORD

graceford_legacy_track_name: "Graceford"
graceford_legacy_track_desc: "Work Her Will"
graceford_legacy_1_name: "Sworn Under the Mother"
graceford_legacy_2_name: "Bread, Board, and Blessing"
graceford_legacy_3_name: "Hall of Holy Oaths"
graceford_legacy_4_name: "Tithes and Tend"
graceford_legacy_5_name: "Work Her Will"

GRACEFORD_SWORN_UNDER_MOTHER_NO_BULLETTAB:0 "The tale at Holyhall begins on a Gardener throne where Andal riders took oaths before the Seven and were given First Men brides with good acres. A sept rose beside their timber hall, its nave painted with the Mother’s calm face over a bright white ribbon like water crossing brown tilth. From those days the house held fast to the Reach’s softer law—hospitality kept, fasts observed, feast-days supplied—and earned its place by service made steady rather than loud.\n#weak Piety made into work. Enables recruitment of [GetMaA('graceford_mothers_marksmen').GetName] as [men_at_arms|E].#!."

GRACEFORD_BREAD_BOARD_AND_BLESSING_NO_BULLETTAB:0 "Granaries at Holyhall are marked with the Mother’s knot and opened by writ when the roads wash out. Pilgrims find a bench and a trencher at holy days; poorhouses take in the lame at harvest; midwives carry the house colors when they ride the parish lanes. The kitchens know how to stretch a lean winter, and the reeves keep tithe-bins honest so the blessing lands where it should.\n#weak Mercy with measure. Gracefords tend to be [GetTrait('temperate').GetName( GetNullCharacter )]."

GRACEFORD_HALL_OF_HOLY_OATHS_NO_BULLETTAB:0 "Disputes in the parish are heard beneath a painted icon, the audience bench smoothed by elbows from millers and small lords alike. A calfskin oathbook lists wardships, fines, and settlements set down where all can hear, and the steward hangs broken tally-sticks to show judgment given and taken. Travelers say even proud men lower their voices in that chamber, for the Mother’s eyes are on the throne and the doors stand open to the yard.\n#weak Justice in the open. Gracefords tend to be [GetTrait('just').GetName( GetNullCharacter )]."

GRACEFORD_TITHES_AND_TEND_NO_BULLETTAB:0 "Fields about Holyhall show the patient hand: wash-ditches cleared at first thaw, hedges laid on the turn, orchards set in neat espaliers along warm walls. Bee skeps line the leeward banks, staddle stones lift grain from damp, and tally-men walk with straight rods so a bushel weighs as a bushel. Roads get straw where the clay cheats carts, and bridges earn their tithes in sound footings rather than carved saints.\n#weak Order breeds plenty."

GRACEFORD_WORK_HER_WILL_NO_BULLETTAB:0 "To speak the words is to choose the harder task. Gracefords endow bridges where fords drown travelers and keep hospice beds for nights when frost bites the open hand. They kneel at Highgarden on great occasions yet return to their parish with new alms to lay out and old pledges to keep. In years when banners call, Holyhall still posts the roster for gleaning and the ledger for bread so the Mother’s peace does not fail behind the host.\n#weak Duty without trumpet. Gracefords tend to be [GetTrait('zealous').GetName( GetNullCharacter )]."

graceford_mothers_marksmen:0 "Mother's Marksmen"
graceford_mothers_marksmen_flavor:0 "Holyhall archers sworn under the Mother’s face, their quivers stitched with the white pale wavy. They drill along hedgerows and shrine-roads, reading wind off wheat and loosing in clean measure to keep parish and bridge in good order."

#BULWER

bulwer_legacy_track_name: "Bulwer"
bulwer_legacy_track_desc: "Death Before Disgrace"
bulwer_legacy_1_name: "Bors's Black Horns"
bulwer_legacy_2_name: "Death Before Disgrace"
bulwer_legacy_3_name: "Blackcrown Watch"
bulwer_legacy_4_name: "Bone Over Blood"
bulwer_legacy_5_name: "Buford’s Redgrass Boast"

BULWER_BORSS_BLACK_HORNS_NO_BULLETTAB:0 "At Blackcrown the tale of Bors the Breaker is taught before a child learns his letters. Some say he drank only the blood of bulls and found the strength of twenty men; some sing that black horns burst from his brow when he roared at the Red Mountains. The yardmasters keep that legend close to the dust—rings are marked for trial by push, boys brace to a boar-hide shield until the line holds, and young knights learn to lift a man with the flat rather than spend him with the edge. The skull on red reminds them that courage must be carried into craft or it dries to brag.\n#weak Strength given shape. Bulwers tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

BULWER_DEATH_BEFORE_DISGRACE_NO_BULLETTAB:0 "'Death Before Disgrace' is carved over Blackcrown’s gate and read aloud when squires take up their first true harness. The words bind more than battle—debts are settled square, guest-right kept under storm, and the poorest retainer knows where he stands in a muster. Old stewards tell how Bulwer ancestors took the saying from a priest on the Whispering Sound’s shore and made it the hall's words. A lord may lose field or fortune; he does not forfeit his honor if his oath outlasts his luck.\n#weak Honor kept without doubt. Bulwers tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

BULWER_BLACKCROWN_WATCH_NO_BULLETTAB:0 "Blackcrown looks north on the Whispering Sound, where the wind talks in a thousand small voices before sails show on the rim. Beacon stacks squat on the headlands and a watchtower counts the tides by notch and pebble. In elder days, ironborn longships tested these waters; in calmer years smugglers try the slack behind the islets. The Hightower’s great fire can be seen in fair weather and Bulwer riders answer its summons with salt in their hair and reports written in a sea hand the Oldtown clerks can read at a glance.\n#weak Eyes on the tide. Enables recruitment of [GetMaA('bulwer_blackcrown_knights').GetName] as [men_at_arms|E].#!."

BULWER_BONE_OVER_BLOOD_NO_BULLETTAB:0 "A bull’s skull on a field of red is a grim device, but Blackcrown takes its lesson to heart. The house keeps wills in order and weapons in quiet repair; funeral cloaks are folded where the feast banners hang so grief does not find them gaping. In the chapel a white bone token is set for each captain dead in service and the chaplain’s homily is the same: flesh fails, bone endures, memory outlives both if the living do their duty.\n#weak Endure and remember."

BULWER_BUFORDS_REDGRASS_BOAST_NO_BULLETTAB:0 "Ser Buford Bulwer swore he slew forty men at the Redgrass Field, then fifty the next year when the cups were kind, and singers made sure the count climbed with the seasons. Ser Maynard Plumm laughed at the tally, yet Blackcrown found a use for the boast. The yard keeps a Redgrass prize for the cleanest stroke, a cup for the longest seat in the saddle, and a place at table for any minstrel who can keep steel bright in song without turning truth to mud. Men ride harder when names are kept bright and lies kept in harness.\n#weak Renown with reins. Bulwers can be great [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]s."

bulwer_blackcrown_knights:0 "Blackcrown Knights"
bulwer_blackcrown_knights_flavor:0 "Household knights of Blackcrown, their helms crowned with bull horns and their armor gleaming in the day's sun. At the breaker’s call the line folds into a killing crescent; the first shock breaks will, the second breaks bone. They keep the windy headlands of Whispering Sound and ride by the words that forged them—Death Before Disgrace."

#BAELISH

baelish_legacy_track_name: "Baelish"
baelish_legacy_track_desc: "Seek Our Opportunities"
baelish_legacy_1_name: "The Smallest of Lords"
baelish_legacy_2_name: "Under the Titan’s Head"
baelish_legacy_3_name: "Fostered at Riverrun"
baelish_legacy_4_name: "Letters and Ledgers"
baelish_legacy_5_name: "Mockingbird Ascendant"

BAELISH_THE_SMALLEST_OF_LORDS_NO_BULLETTAB:0 "On the least of the Fingers, a small flint tower faces grey surf and peat smoke. The first Baelish lord counted a dozen stone huts, a strip of sour pasture, and rights to cut bog for fuel. Winters taught thrift; storms taught patience; the peat levy kept the door barred against hunger when the high road forgot them. A house so small learned early that a careful ledger wins where a loud banner cannot.\n#weak Little ground, long reach. Baelishes tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

BAELISH_UNDER_THE_TITANS_HEAD_NO_BULLETTAB:0 "Before mockingbirds there was the Titan. A great-grandfather out of Braavos took service with House Corbray, earned his spurs, and chose the Titan’s stone head for his shield. From him came sea-tricks and counting-house habits: learn a contract’s silence, weigh coin before courtesy, keep a galley’s schedule in your head. His hedge-knight son made lord by inches and kept the Braavosi lesson close—debt is a door if you hold the key.\n#weak Braavos left its mark. Baelishes can be [GetTrait('shrewd').GetName( GetNullCharacter )]."

BAELISH_FOSTERED_AT_RIVERRUN_NO_BULLETTAB:0 "A friendship from the Ninepenny Kings’ war won a Baelish boy a place beneath Hoster Tully’s roof. Riverrun taught more than grace: servants who know which letters matter, stewards who balance feasts against levies, lords who test each other with smiles. Love and pride cut their own paths there—duels answered affronts, secrets set roots, and a fosterling learned how great houses bruise without breaking.\n#weak Courtesy with edges. Enables recruitment of [GetMaA('baelish_mockingbird_skirmishers').GetName] as [men_at_arms|E].#!."

BAELISH_LETTERS_AND_LEDGERS_NO_BULLETTAB:0 "From peat tallies in a bog village to pursers’ rolls in city vaults, the craft did not change: write it, bind it, balance it, and keep a copy none suspect. Harbor dues, loans at quiet interest, favors recorded in a neat small hand—each line another rung. When doors opened, new books followed, and the man who kept them learned to move a realm by nudging its sums.\n#weak Paper makes passage."

BAELISH_MOCKINGBIRD_ASCENDANT_NO_BULLETTAB:0 "When silver mockingbirds took the field in place of the Titan, the device matched the method. A mockingbird hears, remembers, and gives back a sweeter tune; so did the house that wore it. Gifts placed with care, secrets cached for lean seasons, titles gathered like stepping-stones over cold water. From a stony acre on the Fingers the song carried farther than any thought to listen.\n#weak Voice before banner. Baelishes tend to be [GetTrait('deceitful').GetName( GetNullCharacter )]."

baelish_mockingbird_skirmishers:0 "Mockingbird Skirmishers"
baelish_mockingbird_skirmishers_flavor:0 "Light-foot from the Fingers—peat-cutters turned runners—drilled beneath a flint tower and sworn to silver mockingbirds on green. They screen the line with javelins and short spears, strike from bog and shingle, then vanish along goat-tracks where heavy boots sink."

#MANDRAKE

mandrake_legacy_track_name: "Mandrake"
mandrake_legacy_track_desc: "We Are the Root"
mandrake_legacy_1_name: "Kings of the Blue Fork"
mandrake_legacy_2_name: "Rollo’s Sevenfold Oath"
mandrake_legacy_3_name: "River Throne in Rival Hands"
mandrake_legacy_4_name: "Redgrass Remnant"
mandrake_legacy_5_name: "Exiles’ Gold, Company’s Bread"


MANDRAKE_KINGS_OF_THE_BLUE_FORK_NO_BULLETTAB:0 "Our lineage commands an ancient, royal antiquity that dates back to the First Men, when we ruled the splintering shallows where the Blue Fork braids into the northern fogs. We wore crowns of river-gold long before the modern great houses were ever granted their castles, training our heirs to rule the Trident by right of the current.\n#weak We are the ancient blood of the braided rivers, our ambition born of the soil. Members of the Mandrake dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

MANDRAKE_ROLLOS_SEVENFOLD_OATH_NO_BULLETTAB:0 "We remember the calculated righteousness of King Rollo Mandrake, who brought the Faith of the Seven to our domains and made the sept-bells ring out across the northern bogs. By binding our crown to written charters and holy, witnessed vows, he established a centralized legal stability that outlasted our rivals.\n#weak Our ancient piety was forged into a weapon of statecraft, anchoring our laws. Members of the Mandrake dynasty are frequently born [GetTrait('zealous').GetName( GetNullCharacter )]."

MANDRAKE_RIVER_THRONE_IN_RIVAL_HANDS_NO_BULLETTAB:0 "Our ancestral banks have weathered centuries of brutal border-reiving against the Blackwood ravens and Bracken stallions who coveted our waterways. We mastered the cutthroat politics of the crossings—negotiating ferry monopolies, keeping precise tallies of multi-generational blood-feuds, and outlasting upstart river dynasties through calculating diplomacy.\n#weak We learned the laws of survival at the edge of the sword. Enables recruitment of [GetMaA('mandrake_blue_fork_rangers').GetName] as [men_at_arms|E]."

MANDRAKE_REDGRASS_REMNANT_NO_BULLETTAB:0 "We paid a catastrophic price for our unyielding, fanatical devotion to the Black Dragon, watching our vanguard get slaughtered beneath the arrows of Brynden Rivers at Redgrass Field. We brought home nothing but shattered helms and a bitter, burning hatred for the Usurper, recording the name of Lord Omar as an absolute blood-debt.\n#weak The memory of our fallen champions serves as a permanent spur to our vanguard."

MANDRAKE_EXILES_GOLD_COMPANYS_BREAD_NO_BULLETTAB:0 "Stripped of our ancestral seats and driven across the narrow sea for our loyalty to the true king, we learned the cold reality of survival in the Free Cities. From Ser Marq bearing chains to our captains signing the ledger-books of the Golden Company, we transformed our bitter disgrace into an absolute, machine-like military discipline.\n#weak We have seasoned our steel in foreign wars, waiting with an ice-cold patience to reclaim our home. Members of the Mandrake dynasty are frequently born [GetTrait('patient').GetName( GetNullCharacter )]."


mandrake_blue_fork_rangers:0 "Blue Fork Privateers"
mandrake_blue_fork_rangers_flavor:0 "Drawn from the most agile, water-wise exiles of the Blue Fork marshes who fled to the Free Cities, these elite light skirmishers are the specialized vanguard of House Mandrake. Wearing flexible scale mail and camouflaged river-green cloaks, they are meticulously trained in the rigid battlefield drill of the Golden Company. Wielding short iron broadswords, nets, and heavy barbed javelins, they excel at screening heavy troop movements along tidal flats, disrupting enemy formations, and securing bottleneck river crossings with a cold, professional efficiency."


#RYGER

ryger_legacy_track_name: "Ryger"
ryger_legacy_track_desc: "Better Bent Than Broken"
ryger_legacy_1_name: "Willow on White"
ryger_legacy_2_name: "Crown Before Current"
ryger_legacy_3_name: "Willow's Wardens"
ryger_legacy_4_name: "Law of the Low Banks"
ryger_legacy_5_name: "Bend, Do Not Break"


RYGER_WILLOW_ON_WHITE_NO_BULLETTAB:0 "Our lineage commands the vast, thick willow beds and twisting backwaters of the upper Trident, where our ancestral fields meet the fens of the interior. We do not gamble our security on flashy southern tourneys; we manage our river holdings with a meticulous, slow-breathing precision, drilling our levies until our defensive habits outlast our louder, more reckless neighbors.\n#weak We extract our endurance directly from the slow rivers, our minds unyielding to fear. Members of the Ryger dynasty are frequently born [GetTrait('patient').GetName( GetNullCharacter )]."

RYGER_CROWN_BEFORE_CURRENT_NO_BULLETTAB:0 "When the rebel Lord Hoster Tully raised his banners to unseat the dragon kings, we refused to march to Riverrun. We answered the royal command instead, aggressively closing our vital ferries against rebel musters and sending our hosts to bleed for the Iron Throne—bearing the bitter post-war fines as a proud badge of unbroken honor.\n#weak We do not trade an oath once given for easier weather or cheaper victories. Members of the Ryger dynasty make for exceptionally [GetTrait('loyal').GetName( GetNullCharacter )]."

RYGER_WILLOWS_WARDENS_NO_BULLETTAB:0 "We have transformed our treacherous, reed-choked shallows into a lethal tactical trap for invading vanguards. Our outriders constantly patrol the hidden back-channels, mapping every underwater shoal and staking the ferry crossings so our archers can butcher enemy scouts the moment they try to breach the mud-banks.\n#weak We hold the low banks by right of ancient river-craft and cold steel. Enables recruitment of [GetMaA('ryger_weeping_willow_bowmen').GetName] as [men_at_arms|E]."

RYGER_LAW_OF_THE_LOW_BANKS_NO_BULLETTAB:0 "At the busy markets of Willow Wood, we enforce a strict, ironclad legal order over the trading cogs and flatboat operators of the Trident. Every ferry-toll manifest is meticulously audited with our willow-seal, turning our strategic riverways into a continuous, highly disciplined machine of regional customs revenue.\n#weak The law of Riverrun may falter, but our custom-houses stand firm where the water runs deep."

RYGER_BEND_DO_NOT_BREAK_NO_BULLETTAB:0 "The catastrophic civil wars of the Riverlands have repeatedly scorched our holdings, yet our house words dictate our survival: *Bend, Do Not Break*. We know precisely when to bow our branches to an invading host, when to leverage an opportunistic marriage alliance, and when to snap back with absolute, devastating force.\n#weak We yield just enough to outlast the storms, our dynastic roots anchored too deep to be uprooted."

ryger_weeping_willow_bowmen:0 "Willow Wood Longbowmen"
ryger_weeping_willow_bowmen_flavor:0 "Drawn from the most eagle-eyed marsh-hunters and eel-weir wardens of the Ryger domains, these elite marksmen are the lethal vanguard of Willow Wood. Clad in heavy riveted mail over willow-green surcoats, they carry heavy yew longbows and stand behind thick, mobile wicker pavises planted deep in the river-mud. Trained beneath the echoing walls of our keep to ignore return shot, they loose devastating, synchronized sheets of yard-long arrows to systematically freeze enemy vanguard movements across the fords."


#SEAWORTH

seaworth_legacy_track_name: "Seaworth"
seaworth_legacy_track_desc: "Whether High or Low"
seaworth_legacy_1_name: "Onion On the Sail"
seaworth_legacy_2_name: "Smuggler's Craft"
seaworth_legacy_3_name: "Fealty of Dragonstone"
seaworth_legacy_4_name: "Left-Hand Reckoning"
seaworth_legacy_5_name: "Cape Wrath Searoads"

SEAWORTH_ONION_ON_THE_SAIL_NO_BULLETTAB:0 "When Storm’s End starved behind stone and pride, a low hull slid past the Redwyne cordon with holds of onions and salted fish. The gate opened to bread and a knighthood; a pale field gained a black ship with an onion to mark it. The house keeps that night as its founding charter: find the dangerous lane, carry what men need, and let deeds write the arms. The story is told at Cape Wrath whenever the beacons flare and smallfolk line the pier with empty baskets.\n#weak Service proved in hunger. Enables recruitment of [GetMaA('seaworth_onion_runners').GetName] as [men_at_arms|E].#!."

SEAWORTH_SMUGGLER_CRAFT_NO_BULLETTAB:0 "Before banners, there were tricks learned under other men’s lamps: oarlocks wrapped in cloth, coal-smeared hulls that show no moon-glint, lanterns hooded to a pinprick, and the sound of tide rips read like letters. Cape Wrath taught lee-shores and knife reefs; the Gullet taught current and patrol. The house still trains pilots to “walk the wake,” hugging shoals where fat galleys fear to follow. The old smuggler’s craft did not die—it put on livery.\n#weak Seamanship kept silent. Seaworths can be [GetTrait('shrewd').GetName( GetNullCharacter )]."

SEAWORTH_FEALTY_OF_DRAGONSTONE_NO_BULLETTAB:0 "Their keep stands on Cape Wrath, yet their oath runs over the Gullet to Dragonstone. Stannis Baratheon raised them from a smuggler’s skiff and bound their service to the black basalt seat. Ravens from the Stone Drum call their musters; their prows turn east before south; petitions are pled in a hard court that grants little and forgets less. Among stormlords they stand apart, and in the Crownlands they are counted as one of them.\n#weak Fealty by choice holds. Seaworths tend to be [GetTrait('honest').GetName( GetNullCharacter )]."

SEAWORTH_LEFT_HAND_RECKONING_NO_BULLETTAB:0 "Knighthood bought with bread carried a price counted in joints. Stannis took the left-hand’s finger-bones for old crimes, and Davos bowed to the blade he could not refuse. From that day the Seaworths kept law like a ledger: debts named and paid, favors written with a date, judgments given as if they might one day be measured against a maimed hand. Captains wear a knucklebone charm not for luck, but to remember what duty costs when it is real.\n#weak Justice worn plain. Seaworths tend to be [GetTrait('just').GetName( GetNullCharacter )]."

SEAWORTH_CAPE_WRATH_SEAROADS_NO_BULLETTAB:0 "Cape Wrath lies where storms break and trade persists. The Seaworths stake piers in deep sand, post pilots to every lee cove from Rain House to the Gullet, and keep beacon heaps dry for nights when the sea turns mean. Wreck and salvage are ruled in fair shares, forest rights kept for spars and rib-timbers, and ferries run when the roads wash out. A small keep with good charts can govern a long shore.\n#weak Good order in rough water."

seaworth_onion_runners:0 "Onion Runners"
seaworth_onion_runners_flavor:0 "Light-foot skirmishers of Cape Wrath under the black ship on grey. They fight as the night-runs taught—lanterns hooded, steps quick over shingle and pier—closing with short swords while boarding axes beat aside shields and straps."

#TOYNE

toyne_legacy_track_name: "Toyne"
toyne_legacy_track_desc: "Fly High, Fly Far"
toyne_legacy_1_name: "Winged Heart Unbroken"
toyne_legacy_2_name: "Love to Death"
toyne_legacy_3_name: "Kingswood Brotherhood"
toyne_legacy_4_name: "Golden Company Elite"
toyne_legacy_5_name: "Fly High, Fly Far"

TOYNE_WINGED_HEART_UNBROKEN_NO_BULLETTAB:0 "A winged heart within a black embattled bordure on gold once stood bright in the king’s own sight. In the bright years, they served at court and in the lists, and singers place a Toyne as a masked rider at Storm’s End, unhorsed by Prince Rhaegar whose name still stirs the harp. The device promised reach as well as ardor—valor offered with polish enough to win rooms where steel alone is turned away.\n#weak Pride carried with poise. Toynes tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

TOYNE_LOVE_TO_DEATH_NO_BULLETTAB:0 "Ser Terrence Toyne loved Bethany Bracken and Aegon the Unworthy found them abed. The king made a lesson of it—Terrence dismembered part by part before Bethany’s eyes, Bethany executed after—and the two Toyne brothers who struck for vengeance met Aemon the Dragonknight in a death that took them all. Favor curdled to exile, and the name that had flown high learned that a heartbeat can unmake a house faster than any siege.\n#weak Caution learned in grief. Toynes tend to be [GetTrait('cynical').GetName( GetNullCharacter )]."

TOYNE_KINGSWOOD_BROTHERHOOD_NO_BULLETTAB:0 "Simon Toyne turned the winged heart to the green shadows, making the Kingswood Brotherhood a tale that frightened lordlings and tired the king’s riders. They knew the dry fords, the false beacons, the oaks that swallow patrols, until white cloaks came with steel and writ and Barristan Selmy’s charge that ended Simon while Lady Jeyne Swann was won back to her kin. The band broke, but its craft endured: read the wood first, the road after, and leave three ways out for every stroke.\n#weak Woods wise before war wise. Enables recruitment of [GetMaA('toyne_black_bordure_line').GetName] as [men_at_arms|E].#!."

TOYNE_GOLDEN_COMPANY_ELITE_NO_BULLETTAB:0 "Exile sent the last of the line east, where Myles Toyne wrote his name among the captain-generals beneath Bittersteel’s skull and circle. The Golden Company taught a sterner gospel than courts—pay clean, march straight, keep books that square even when princes do not. A house that lost its halls found stature in discipline, and letters sealed with a winged heart crossed half a world to hire friends when kin were few.\n#weak Bread kept by order."

TOYNE_FLY_HIGH_FLY_FAR_NO_BULLETTAB:0 "The words survived every forfeiture. Winged-heart signets opened doors in the Free Cities, at sellsword camps and counting houses, in tilt-yards where a good seat still buys a hearing. Toynes learned to let distance do their work—carry news faster than rivals, turn strangers into sponsors, make a road of exile until the road returns to home.\n#weak Range turned to power."

toyne_black_bordure_line:0 "Black Bordure Line"
toyne_black_bordure_line_flavor:0 "Plate bright as wet bark and quilted skirts for the brambles—Toyne heavy foot drilled to fight knee-to-knee beneath the trees. The winged heart rides on gold tabs at their belts; longswords and short axes do the rest. Born of Kingswood habits, they move quiet on leaf-mould, seize trailheads in a rush, then grind forward by the captain’s count until the path is theirs."

#FARRING

farring_legacy_track_name: "Farring"
farring_legacy_track_desc: "Where the Sword Falls"
farring_legacy_1_name: "Counter-Charged Steel"
farring_legacy_2_name: "Purple-and-White Fealty"
farring_legacy_3_name: "Blackwater Wardens"
farring_legacy_4_name: "Twin Squires’ Rite"
farring_legacy_5_name: "Crownway Custodians"

FARRING_COUNTER_CHARGED_STEEL_NO_BULLETTAB:0 "Their sigil shows two knights afoot, counter-changed across purple and white, and the house keeps the device as drill. Farrings prize swordwork on the ground: helms off in the yard, blunted blades, and paired matches until the weaker man learns to hold and the stronger to measure his stroke. The habit stays when the visors drop.\n#weak Valor trained on foot. Farrings can be great [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]s."

FARRING_PURPLE_AND_WHITE_FEALTY_NO_BULLETTAB:0 "Crownlands blood runs nearest the Iron Throne. Farring lords keep their hall ready for summons, their levies counted for garrison and gate, and their petitions written for the King’s Hand more often than their neighbors’ favor. The purple and white bow first to the Crown and expect the Crown to remember it.\n#weak Oath kept straight. Farrings tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

FARRING_BLACKWATER_WARDENS_NO_BULLETTAB:0 "From ferry-stairs below King’s Landing to the slow bends up the Blackwater, Farring soldiers mark depths and watch the reeds. They know which fords hold after spring melt, where mud swallows a cart, and how to close a bank before raiders find a landing. River work taught them to move quick and make ground count.\n#weak Banks read like books. Enables recruitment of [GetMaA('farring_blackwater_wardens').GetName] as [men_at_arms|E].#!."

FARRING_TWIN_SQUIRES_RITE_NO_BULLETTAB:0 "Two figures on the arms beget two at the butts: Farring heirs are raised in pairs or matched to rival pupils, learning each other’s faults until none remain. Masters teach bill and sword, press and release, charge and counter—every lesson doubled so either hand can finish the bout.\n#weak Edge honed by rivalry."

FARRING_CROWNWAY_CUSTODIANS_NO_BULLETTAB:0 "The purple-and-white are often found where the Roseroad meets the Crownway and the King’s Road runs to the city: posting tolls, mending ditches, and holding small forts that bite at brigands. A quiet house by the records, yet their steadiness is felt in safer travel and villages that keep their markets open.\n#weak Order kept on the road. Farrings tend to be [GetTrait('just').GetName( GetNullCharacter )]."

farring_blackwater_wardens:0 "Blackwater Wardens"
farring_blackwater_wardens_flavor:0 "Purple-and-white surcoats over mail, kept for the ferries, stairs, and bank-forts of the Blackwater. Yardmasters school them in paired counters—long sword to bind, short blade to finish—until footwork holds as tight as a palisade. On wood-roads and market lanes they claim ground by precision rather than weight, answering each stroke with the right reply and pressing when the captain calls."

#FARWYND

farwynd_legacy_track_name: "Farwynd"
farwynd_legacy_track_desc: "See Beyond"
farwynd_legacy_1_name: "Beacon of the Lonely Light"
farwynd_legacy_2_name: "Skins of the Sea"
farwynd_legacy_3_name: "Sealskin Point Sea-Watch"
farwynd_legacy_4_name: "Outer-Isles Ways"
farwynd_legacy_5_name: "Far Sails, Far Kin"

FARWYND_BEACON_OF_THE_LONELY_LIGHT_NO_BULLETTAB:0 "Eight days beyond Great Wyk the last stones rise from a black sea. In elder days a storm-cast captain stacked them into a tower, lit a fire, and named himself Farwynd. The beacon still burns over thirteen islets, a red eye at dusk and a white star at fog’s heart. Children there learn the bell-notes of swells and the shapes of reefs long before letters. Kin steer by whale-breath and tide-rake where charts end, and the light they keep is both signal and sermon.\n#weak Where the fire holds, the way endures. Farwynds tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

FARWYND_SKINS_OF_THE_SEA_NO_BULLETTAB:0 "Greenlanders call them queer and whisper of men lying with seals to bring forth half-human children and others who skinchange as walruses, sea lions, and spotted whales. The Lonely Light shrugs and knots rawhide to keep out the wind. Bone charms thump against oilskin coats. Priests of the Drowned God bless harpoons with salt water and quiet words. Hunts go long in a world of grey horizons where patience is meat and warmth. Whether the tales are true matters less than the craft they teach.\n#weak Sea-sense deeper than rumor. Farwynds tend to be [GetTrait('temperate').GetName( GetNullCharacter )]."

FARWYND_SEALSKIN_POINT_SEA_WATCH_NO_BULLETTAB:0 "On the far lip of Great Wyk the surf chews black shelves and fog walks in noon light. Sealskin Point keeps horn and beacon ready in whale-oil lamps, sheds caulked tight, and smokehouses that never quite go cold. The skerries have names older than maesters, and sentries know which gullies drown a landing party. Wreckers fear the watch, reavers respect it, and neighbors sleep because a Farwynd heard the change in the wind before it showed its teeth.\n#weak Stones held by listening men. Enables recruitment of [GetMaA('farwynd_lonely_light_marauders').GetName] as [men_at_arms|E].#!."

FARWYND_OUTER_ISLES_WAYS_NO_BULLETTAB:0 "The outer isles keep their own ordering. Guest-right is lean but kept. Bride-goods are traded for seasons as much as silver. Judgments are given on benches made of whale bones, and the tide decides when the court breaks. Tales of the Children carry salt and smoke, and men who have never seen a sept grow old without wanting one. To those who live by rivers this all sounds mad. To those who live by swells it sounds like common sense.\n#weak Strange law, steady hands."

FARWYND_FAR_SAILS_FAR_KIN_NO_BULLETTAB:0 "Farwynd names are scattered from seal-rookeries to lee coves that never see a banner. A man may winter on Great Wyk, summer beyond the cape, and still be home when the Lonely Light’s flame pricks the horizon. Charts pass from palm to palm, inked with currents no pilot elsewhere writes. In storms they guide strangers to shelter; in lean years they take their due at sea. Distance is not a border to them. It is blood with tide in it.\n#weak The far road is kin-road."

farwynd_lonely_light_marauders:0 "Lonely Light Marauders"
farwynd_lonely_light_marauders_flavor:0 "Axe-and-shield heavy foot from the outermost isles, salt-stiff mail under the black sea and red sun. Whale-hide grips and round boards turn a surf’s shove into a wall; boatman swings break helms in tight ground. Drilled beneath the beacon that crowns thirteen skerries, they seize landings, bite to the foreshore, and hold knee-deep until the tide and their captain say move."

#VOLMARK

volmark_legacy_track_name: "Volmark"
volmark_legacy_track_desc: "Rising From the Waves"
volmark_legacy_1_name: "Leviathan's Own"
volmark_legacy_2_name: "Qhorin’s Black Crown"
volmark_legacy_3_name: "Harlaw Sea-Claims"
volmark_legacy_4_name: "Hooks in the Reef"
volmark_legacy_5_name: "Salt and Stone Endure"

VOLMARK_LEVIATHANS_OWN_NO_BULLETTAB:0 "Harlaw’s coasts are iron and kelp, with rips that eat green captains whole. Volmark longships keep seamarks of their own—stacked stones on black ledges, whale-bone poles set where fog sits low—and the oarmasters teach positioning for each reef so a crew can steer blind. Priests pour salt water on the prow and name the Drowned God before a raiding tide; carpenters plane ribs in winter sheds where tar-smoke never leaves the timbers. Under the black leviathan on grey, they run in water other lords call the end of charts.\n#weak The deep knows its own. Volmarks tend to be [GetTrait('brave').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('volmark_leviathan_cutters').GetName] as [men_at_arms|E].#!."

VOLMARK_QHORINS_BLACK_CROWN_NO_BULLETTAB:0 "When Harren the Black burned within his monstrous walls, Lord Qhorin Volmark named his blood from Harwyn Hardhand’s sister and reached for the salt-stone crown. Aegon came in the second year after his Landing and cut Qhorin down, and in the thirty-third Goren Greyjoy choked a later plot that would have raised Qhorin’s son. The tale is told in Volmark halls without apology: the sea will lend a crown to bold hands and snatch it again for bolder. Ambition left scars on Volmark, but it also left a house that does not whisper when kings are named.\n#weak Pride remembered, price accepted. Volmarks tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

VOLMARK_HARLAW_SEACLAIMS_NO_BULLETTAB:0 "Volmark holdings spread like nets across Harlaw—weed-hushed boatyards in coves no map admits, quarries that feed sea-walls and towers, eel-weirs leased by old custom, and mills that grind when the moon is right. Stewards keep dues in fish, iron, and thralls; shipwrights set keels on staddle-stones through the winter blow and launch at the first fair weather. The isle answers to work as much as to war, and Volmark parchment is salted enough to last.\n#weak Craft makes claims endure. Volmarks tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

VOLMARK_HOOKS_IN_THE_REEF_NO_BULLETTAB:0 "After dragonfire and Greyjoy suspicion, Volmark learned to set watch where trouble breaks first. Dockmasters count crews at dusk and dawn; sentries answer to their names in gale and calm; reeves keep quiet books of oaths sworn in alehouses and on tides both. Rivals find their spies stranded on skerries and their schemes hauled up like drowned nets. A lord of Volmark prefers a reef’s hook to a harbor’s chain—what you do not see is what holds you fast.\n#weak Vigilance laid where eyes slip."

VOLMARK_SALT_AND_STONE_ENDURE_NO_BULLETTAB:0 "Storms lift roofs, feuds spill blood, kings change their styles, and still the sea returns. Volmark halls are thick-walled against the westerly, their dead given to the god on plank and stone, while the living set new beams in the old sockets. Boys learn to splice before they read; girls read the weather before they wed. When thin years come, they fish deeper; when hard lords come, they bow until the wind changes. Salt eats iron, but rock keeps the taste of every wave.\n#weak Break and build, as the tide does."

volmark_leviathan_cutters:0 "Leviathan Cutters"
volmark_leviathan_cutters_flavor:0 "Volmark skirmishers in salt-stiff cloaks who run the black reefs by feel. Hook-knives and throwing axes flash, lines snag shields, and then they are gone—sprinting from skerry to skerry while the leviathan banners close from the surf."


#DALT

dalt_legacy_track_name: "Dalt"
dalt_legacy_track_desc: "Sweeter Our Fidelity"
dalt_legacy_1_name: "Lords of Lemonwood"
dalt_legacy_2_name: "Greenblood Gate"
dalt_legacy_3_name: "Citrus and Court"
dalt_legacy_4_name: "Sun and Salt"
dalt_legacy_5_name: "Knight of Lemonwood’s Charge"

DALT_LORDS_OF_LEMONWOOD_NO_BULLETTAB:0 "Lemonwood’s terraces climb in pale-green steps above the shore, each held by stone and fed by cisterns older than most charters. The Dalts prune by moon and heat, keep presses cool under reed mats, and cure peel for caravans bound to the shadow city. Bees drift in the groves and the ledgers smell of resin and rind; when rain fails, stored water and careful hands keep the trees from sorrow.\n#weak Husbandry turned habit. Dalts tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

DALT_GREENBLOOD_GATE_NO_BULLETTAB:0 "South of the Greenblood’s mouth, Orphans pole their slim boats to Lemonwood’s quays beside boats from Planky Town and Sunspear. Pilots learn the river’s skin by color and ripple, and steersmen mark the shifting bars with stakes that move as the sands move. The Knight of Lemonwood keeps toll fair and lanterns trimmed so dusk landings find a safe berth and a straight road to market.\n#weak River sense, sea sense. Dalts tend to be [GetTrait('just').GetName( GetNullCharacter )]." 

DALT_CITRUS_AND_COURT_NO_BULLETTAB:0 "A purple field strewn with lemons catches every eye in Sunspear’s shaded courts. Lemonwood squires carry sweetwater and candied peel to feasts, learn to place gifts with a light hand, and step the dances that please princes and their kin. Songs in the shadow city still recall Deziel and Andrey Dalt, whose hopes for Arianne taught how gallantry may shine even when it is not crowned.\n#weak Courtesy with color. Dalts are seen as [GetTrait('knight_errant').GetName( GetNullCharacter )]s. Enables recruitment of [GetMaA('dalt_lemonwood_knights').GetName] as [men_at_arms|E].#!."

DALT_SUN_AND_SALT_NO_BULLETTAB:0 "Between drylands and Summer Sea the wind burns by noon and cools by night. Lemonwood men march at dawn and dusk, veil their faces against glare, and top skins at every cistern the groves provide. Leathers are oiled, sandals bound tight, and watchfires keep a slow breath through the hottest hours. Heat makes a patient soldier and a wary captain.\n#weak Hard weather made habit."

DALT_KNIGHT_OF_LEMONWOODS_CHARGE_NO_BULLETTAB:0 "The Knight of Lemonwood holds a modest seat near great powers and keeps it in good order. A quay and a gatehouse watch the river-road; a little tower calls the levy from groves and yards when banners musters near Sunspear. Ferries pass under writ and guest-right is offered plain on the steps. The keep is small, the duty is not.\n#weak A small keep, well kept."

dalt_lemonwood_knights:0 "Lemonwood Knights"
dalt_lemonwood_knights_flavor:0 "Foot-knights of Lemonwood: layered plate and light veils for the glare, long swords for the press, curved knives to finish. Drilled on the Greenblood road and under the palms, they hold hot ground and march steady until the oasis and the way to Sunspear are safe."


#SANTAGAR

santagar_legacy_track_name: "Santagar"
santagar_legacy_track_desc: "Woe Who Touches It"
santagar_legacy_1_name: "Leopard and Axe"
santagar_legacy_2_name: "Leopard-Maidens of Spottswood"
santagar_legacy_3_name: "Oath to Sunspear"
santagar_legacy_4_name: "Spottswood Timber"
santagar_legacy_5_name: "Hall of the Spotted Kings"

SANTAGAR_LEOPARD_AND_AXE_NO_BULLETTAB:0 "Per sinister blue and white, a spotted leopard bearing a golden axe—arms that remember the Andal spring when Santagar warriors carved a brief crown in the stony woods above the Greenblood. The title is now dust, yet chronicles keep their style: a lord who dined with princes at Sunspear in the evening and waged border war at dawn. The leopard’s spots are said to mark each hill they took and each hill they yielded with their heads held high. Their warriors to this day hold this pride and history close to their chests. \n#weak Pride carried with measure. Santagars tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

SANTAGAR_LEOPARD_MAIDENS_OF_SPOTTSWOOD_NO_BULLETTAB:0 "Spottswood keeps women at the lord’s side as sworn shields—kin and fosterlings drilled in the hall where Daeron once joked the sand-steeds slept. Benches are stacked, straw swept, and chalk lines laid; dawn after dawn the Leopard-Maidens grind the same steps until palms harden and breath comes even. They stand watch at door and saddle, march on the Greenblood road, and take pride not in pageantry but in work done without fail.\n#weak Service proved by labor. Enables recruitment of [GetMaA('santagar_leopard_maidens').GetName] as [men_at_arms|E].#!."

SANTAGAR_OATH_TO_SUNSPEAR_NO_BULLETTAB:0 "When the spotted kings were folded into Dorne, their heirs chose service over ruin. Spottswood keeps neat writs, pays toll at Sunspear, and answers Martell ravens before the ink dries. In the shadow city, their colors win place near the dais, for their hall has stood watch on the Greenblood road since the first spears of Nymeria’s people passed that way.\n#weak Fealty kept in daylight. Santagars tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

SANTAGAR_SPOTTSWOOD_TIMBER_NO_BULLETTAB:0 "Spottswood’s jungled groves are Dorne’s rare store of true timber. Santagar wardens tally axes and saw-pits, float felled logs down to Lemonwood, and turn heartwood into masts, palisades, spear-shafts, and bow-staves. Carpenters bind stockades before the desert wind can steal a post, and bowyers choose grain that sings under the string. Where others trade stone and salt, Spottswood sends wood—and with wood, quiet strength.\n#weak The forest furnishes the march."

SANTAGAR_HALL_OF_THE_SPOTTED_KINGS_NO_BULLETTAB:0 "Their throne is gone, but its echo orders the house. The great room doubles as stable when storms rise, tack racks set under carved beams, and a leopard of old oak watches the court from the high seat. Petitions are heard before the noon blaze, tolls kept fair on the Greenblood road, and the hall’s ledger binds neighbors with the quiet authority of a memory no sand can bury.\n#weak Order kept where the crown once sat."

santagar_leopard_maidens:0 "Leopard Maidens"
santagar_leopard_maidens_flavor:0 "Through Spottswood’s green shade they run silent—golden corselets flashing between trunks, round shields of jungle heartwood patterned like a leopard’s rosettes. Chosen from kin and sworn companions, they drill at dawn in the hall and test their guard on the jungle paths at dusk. On the Greenblood road or in Sunspear’s courts, they keep a close eye on their lord; sword-hand sure, shield-hand steady, the golden axe of Santagar at their center."

#SWYFT

swyft_legacy_track_name: "Swyft"
swyft_legacy_track_desc: "Awake! Awake!"
swyft_legacy_1_name: "Rooster’s Call"
swyft_legacy_2_name: "Goldroad Toll & Watch"
swyft_legacy_3_name: "White Cloak of Cornfield"
swyft_legacy_4_name: "Sharp Tongues, Shrewd Ledgers"
swyft_legacy_5_name: "Awake! Awake!"

SWYFT_ROOSTERS_CALL_NO_BULLETTAB:0 "At Cornfield the day begins with cockcrow and bells. Stallboards go up while the mist still hugs the hedges; provosts walk the lanes crying “Awake! Awake!” and the blue bantam flies from milepost and market awning alike. Travelers learn that a Swyft hall fills fast at dawn and its lord remembers faces as quickly as names.\n#weak Dawn becomes custom. Swyfts tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

SWYFT_GOLDROAD_TOLL_AND_WATCH_NO_BULLETTAB:0 "Cornfield’s guards are famous for caution that most call craven. Their captains test a bend before they take it and turn back when fortune turns against them, preferring a cleared hedge and a counted toll to a bloody skirmish. They will pay for a warning, run when running saves lives, and live to raise the alarm. Along the Goldroad, that timidity keeps caravans whole.\n#weak Fear makes them careful. Swyfts tend to be [GetTrait('craven').GetName( GetNullCharacter )]."

SWYFT_WHITE_CLOAK_OF_CORNFIELD_NO_BULLETTAB:0 "Addison Hill, the Bastard of Cornfield, took a white cloak under the Conqueror and rose to command the first brotherhood of kingsguard. In the Swyft library a faded copy of that oath is still read aloud to squires before they are loosed to the yard. The rooster is a small bird, but it stands its ground; so too the house, which keeps its drills plain and its doors well held.\n#weak Honor recalled; forms kept. Enables recruitment of [GetMaA('swyft_bantam_riders').GetName] as [men_at_arms|E].#!."

SWYFT_SHARP_TONGUES_SHREWD_LEDGERS_NO_BULLETTAB:0 "Cornfield’s stewards speak bluntly and count clean. Harys Swyft’s smiling career in lion courts—famous for toadying and a match that tied his line to Ser Kevan—taught that a rude truth in the ledger outweighs a gilded lie at table. Rents come in on time, fines are posted where all can read them, and the coffers do not wander.\n#weak Plain speech, full chests. Swyfts tend to be [GetTrait('rude').GetName( GetNullCharacter )]."

SWYFT_AWAKE_AWAKE_NO_BULLETTAB:0 "The house words are not a boast but a routine. Lists are checked at first light, spears laid out the night before, and a tower bell keeps codes for fire, foe, and flood. When horns sound along the Goldroad, Cornfield’s men are on their feet while other villages still stir.\n#weak Roused before trouble."

swyft_bantam_riders:0 "Bantam Riders"
swyft_bantam_riders_flavor:0 "Blue bantam on yellow at the fore, bells at their saddles for coded calls—Swyft light horse that ride the Goldroad ahead of trains and levies. They nose out bad bends and false fords, mark hedges that hide ill-fortune, and turn away quick when prudence saves lives. In open country they nip at flanks, break messengers, and keep caravans whole by seeing trouble first and outrunning it when they must."


#JAST

jast_legacy_track_name: "Jast"
jast_legacy_track_desc: "Born to Glory"
jast_legacy_1_name: "Pall and Pride"
jast_legacy_2_name: "Pact of Stone and Steel"
jast_legacy_3_name: "Melee That Shamed the Rock"
jast_legacy_4_name: "Lions on the March"
jast_legacy_5_name: "Peace Paid in Full"

JAST_PALL_AND_PRIDE_NO_BULLETTAB:0 "Yellow on black: an inverted pall like three gold roads meeting beneath three lion heads. Maesters say the sign recalls the high tracks where Jast watchfires once linked hill to hill, and singers claim each lion marks a forebear who bent a rival banner to the west wind. In musters, the device rides before the van and in halls it hangs where oaths are sworn—an old westward habit that makes small men stand a little taller.\n#weak Bright arms breed bold hearts. Jasts tend to be [GetTrait('brave').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('jast_three_lion_vanguard').GetName] as [men_at_arms|E].#!."

JAST_PACT_OF_STONE_AND_STEEL_NO_BULLETTAB:0 "When the Andals pressed over the passes, Jast hearths did not let the First Men name die nor the Seven’s bell be slighted. A sept rose beside the godswood, and a hall was framed where elm lintels sit on Andal iron straps. The old runes were read once a year and the new prayers every holy day, and marriages braided hill clans and mailed newcomers until the quarrels dulled to kinship. Their keeps show both hands at work and both bloods at table.\n#weak Two lineages, one keep. Jasts tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

JAST_MELEE_THAT_SHAMED_THE_ROCK_NO_BULLETTAB:0 "In the soft years of Lord Tytos, Jast and Falwell turned a grievance into a melee that ran like a fever: nine dead, twenty-seven maimed, and still the qaurrel continued. The Rock stirred at last and shame spread faster than the blood had. Jast annalists write the names of the fallen plain and leave a blank page after, so no lord forgets how quick a boast becomes a tragedy when judgment is traded for sport.\n#weak The lesson cost blood. Jasts tend to be [GetTrait('impatient').GetName( GetNullCharacter )]."

JAST_LIONS_ON_THE_MARCH_NO_BULLETTAB:0 "Jast captains read the west as a book of tracks over old mine cuts, fog that pools in the same hollows each spring, and ridges that make redoubts before noon’s shadow has moved a hand. Their levies sling picks into carts after their spears, mend wheels where carts groan, and water at springs most travelers miss. When the gold road calls for scouts or Lannisport drums for levy, their feet are moving before the summons clears the next milepost.\n#weak Hills teach quick steps."

JAST_PEACE_PAID_IN_FULL_NO_BULLETTAB:0 "After the shameful melee the house set new habits: reeves take quarrels at dawn on bench and stone; fines count in coin, cattle, and time for the mines; rival speech is cooled with witnesses from sept and godswood both. A Jast lord keeps a strongbox for sureties and a ledger for oaths, and when warning must be given it rides swift and clear so steel can stay sheathed. The west remembers who learned the hard way to make endings that do not need graves.\n#weak Being calm costs less than burying corpses."

jast_three_lion_vanguard:0 "Three-Lion Vanguard"
jast_three_lion_vanguard_flavor:0 "The first feet on the road and the first helms in the press. Jast heavy foot muster under an inverted pall sewn bright between three lion heads, then climb ahead of the host to break the ground—stakes set, lanes seized, and the hill’s brow taken before noon. In the west they say a line holds truer when the lions have already stood there."


#FALWELL

falwell_legacy_track_name: "Falwell"
falwell_legacy_track_desc: "None So Foolish"
falwell_legacy_1_name: "The Fighting Fool"
falwell_legacy_2_name: "Five Suns of Piety"
falwell_legacy_3_name: "Ashes of Balerion"
falwell_legacy_4_name: "Melee Lesson at the Great Fork"
falwell_legacy_5_name: "Motley Can Still Rule"

FALWELL_THE_FIGHTING_FOOL_NO_BULLETTAB:0 "At the Great Fork in 42 AC, Rupert Falwell rode beneath motley and sunlight, a jester’s cap on his helm and a lion’s heart in his chest. He broke through the royal van, found white cloaks in the press, and cut down two of the Kingsguard before Lord Mooton answered him stroke for stroke. The west remembers the charge as bright folly and truer steel: a deed that made singers lower their voices when they reached the ending.\n#weak A painted crest, a killing edge. Falwells tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

FALWELL_FIVE_SUNS_OF_PIETY_NO_BULLETTAB:0 "The fool on black juggles five suns, and Falwell annals say those suns once named five companies of heavy foot mustered under sept-bells. Mail blessed with seven oil-drops, shields painted bright, axes and bills stacked by pews—penitent soldiers drilled till the kettle drums matched the litany. When the Faith Militant rose, their shieldwall marched to the Blackwater and held ford and bank in turns before the tide turned to dragonfire. Piety filled the ranks; iron kept them standing.\n#weak Bright faith, steadied by steel. Falwells tend to be [GetTrait('zealous').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('falwell_fighting_fools').GetName] as [men_at_arms|E].#!."

FALWELL_ASHES_OF_BALERION_NO_BULLETTAB:0 "After the Fighting Fool fell, Maegor answered with the Black Dread. Flame took roof and rafter; stone ran and set like glass; orchard trees cracked where the heat found them. Falwells sifted the cinders for iron, laid new beams on old footings, and raised a brazier that burns on remembrance days. The hall smells of smoke and oak pitch still, a vow in timber that dragonfire did not unhouse them for good.\n#weak Burned, rebuilt, remembered. Falwells tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

FALWELL_MELEE_LESSON_AT_THE_GREAT_FORK_NO_BULLETTAB:0 "Long after dragonfire, shame found them close to home. In Tytos Lannister’s soft years a quarrel with Jast was thrown to a melee in place of judgment. Nine dead, twenty-seven maimed, and still the feud raged on until the Rock stirred and the west turned its face away. In Falwell books, the page for that summer is inked heavy, and new captains are told the names that paid for a lord’s temper so they do not add more lines.\n#weak Fury tallied in blood. Falwells tend to be [GetTrait('impatient').GetName( GetNullCharacter )]."

FALWELL_MOTLEY_CAN_STILL_RULE_NO_BULLETTAB:0 "A fool’s cap hides sharp eyes. Falwell lords learned to turn laughter to place-setting, to trade a jest for a signature, and to wear motley as a sign that pride can be tempered by wit. When the Rock watches, a well-timed toast wins a hearing; when the Faith listens, a modest vow opens doors. Their banner is loud, their speech measured, and their tables crowded when roads must be made smoother than steel can make them.\n#weak Wit where iron would stumble."

falwell_fighting_fools:0 "The Fighting Fools"
falwell_fighting_fools_flavor:0 "Red-and-gold visors grinning like jester masks, greatswords and bills held low for the shove. These heavy ranks take their name—and their nerve—from Rupert the Fighting Fool: piety whispered under the breath, iron spoken in the crush. In hill country or on a distant battlefield, they close by the count and let the jest end when the line breaks."

#HAYFORD

hayford_legacy_track_name: "Hayford"
hayford_legacy_track_desc: "Loyalty Binds Us"
hayford_legacy_1_name: "Gate of King’s Landing"
hayford_legacy_2_name: "Lance on the Green"
hayford_legacy_3_name: "Oath to the Iron Throne"
hayford_legacy_4_name: "Fretty and Pale"
hayford_legacy_5_name: "Parley at the Pale"

HAYFORD_GATE_OF_KINGS_LANDING_NO_BULLETTAB:0 "Less than a day from the Dragon’s own hill, Hayford keeps the king’s road as if it were a forecourt: milestones set true, bridges faced anew each spring, and wagon ruts filled before they turn to traps. Lantern posts stand at fords, patrols know every small woods that harbors knives, and travelers learn that a night at Hayford means a safe dawn toward the city.\n#weak The approach kept sound. Enables recruitment of [GetMaA('hayford_pikes_of_the_pale').GetName] as [men_at_arms|E].#!."

HAYFORD_LANCE_ON_THE_GREEN_NO_BULLETTAB:0 "When Maegor’s reign curdled and Jaehaerys was named by half the realm, Lord Hayford rode in with lesser lords to speak plain. He urged the king to lay down the crown and lost his head for it; his head was spiked on a lance before his own gate until sun and rain had their say. In the hall, the tale is kept without embroidery, and boys learn where the post once stood on the green.\n#weak Courage kept as witness. Hayfords tend to be [GetTrait('honest').GetName( GetNullCharacter )]."

HAYFORD_OATH_TO_THE_IRON_THRONE_NO_BULLETTAB:0 "Hayford bends the knee to no banner between their gate and the Iron Throne. Ravens fly a short sky, writs need no second seal, and summons ride a single road. Royal progresses water horses at Hayford troughs; crown levies muster there before the last march; and disputes that might sour the king’s peace are settled with care so the city does not taste their bitterness.\n#weak Fealty answered first. Hayfords tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

HAYFORD_FRETTY_AND_PALE_NO_BULLETTAB:0 "Green frets on gold and a green pale river—the Hayford arms mirror their ground: hedged fields in ordered squares and a stream that feeds mill and meadow before the road to the city. Within sight of the Red Keep’s towers, reeves mark bounds by season, culverts are cleared before flood, and tall carts of grain take the last day’s roll to market by habit older than memory.\n#weak Order that shows and pays well."

HAYFORD_PARLEY_AT_THE_PALE_NO_BULLETTAB:0 "So near the city that ravens barely rest, Hayford makes a habit of talk before steel. Envoys share bread under green-and-gold hangings, betrothals are struck in rooms that look toward the road, and quarrels from the king’s verge are softened with measured words. A mile from the Red Keep, a calm voice carries farther than any horn.\n#weak Tongues win what lances would lose."

hayford_pikes_of_the_pale:0 "Pikes of the Pale"
hayford_pikes_of_the_pale_flavor:0 "Green frets on gold, spearheads bright at dawn. Raised within a day’s march of the Red Keep, Hayford pikemen hold road and riverbank in deep files—butts sunk, shafts braced, and points leveled where horseflesh breaks. They keep the king’s way straight and the green pale secure by doing simple things the same way every time."

#BALL

ball_legacy_track_name: "Ball"
ball_legacy_track_desc: "Pride in Our Blood"
ball_legacy_1_name: "Blood of Florys the Fox"
ball_legacy_2_name: "Rosamund’s Vigil"
ball_legacy_3_name: "A Fireball Forged"
ball_legacy_4_name: "Fireball’s Campaign"
ball_legacy_5_name: "Redgrass Lesson"

BALL_BLOOD_FLORYS_THE_FOX_NO_BULLETTAB:0 "The Balls claim one of the three husbands of Florys the Fox, daughter of Garth Greenhand—hence their habit of nimble matches and sly approach to power. From small halls on crownland roads they placed daughters in great households and sons in royal yards, turning feast into alliances and power. Maesters note the Balls are a line that seldom wore the tallest crowns yet dined within their light, and took care to leave with a favor in hand.\n#weak Old root, cunning as a fox. Balls tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

BALL_ROSAMUNDS_VIGIL_NO_BULLETTAB:0 "Lady Rosamund Ball stood near Alysanne Targaryen not for beauty alone but for clear eyes and a steadier hand. When knives glittered at Maidenpool in 55 AC—singers argue whether in the sept’s porch or at a narrow stair—Rosamund stepped first and fell first, buying the queen’s breath with her own. Since then, Ball retinues rehearse lamp routes, guard changes, and the trick of seeing a threat before it wears a face.\n#weak The body takes the blow; the duty stands. Balls tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

BALL_FIREBALL_FORGED_NO_BULLETTAB:0 "Quentyn “Fireball” Ball ruled the Red Keep’s yard in Aegon the Unworthy’s day, a red-haired terror whose temper was as hot as his practice was plain: cut, bind, recover, again. He drilled princes Baelor, Aerys, Rhaegel, and Maekar; he blooded Daemon Waters and set grudge to steel between Bittersteel and Bloodraven. Aegon swore him a white cloak; Quentyn sent his wife to the silent sisters to be ready—then the king died, and Daeron II gave the cloak to another.\n#weak Promises can be forged and broken, but be weary of the consequence. Enables recruitment of [GetMaA('ball_red_lances').GetName] as [men_at_arms|E].#!."

BALL_FIREBALLS_CAMPAIGN_NO_BULLETTAB:0 "Denied the white, Fireball chose the black dragon. He lifted Daemon from the Kingsguard’s net, left Lord Lefford cold outside Lannisport’s gate, and matched Lord Damon Lannister blow for blow before sending him back to the Rock with the tale. At the Mander he slew all the sons of Penrose, sparing the youngest as a kindness to their mother—a mercy that bards remember because so few others could. His marches were swift, his camps strict, and his blade mastery the measure used in Free City schools for years after.\n#weak A hot heart, a hard road, and deeds the west still weighs. Balls tend to be [GetTrait('wrathful').GetName( GetNullCharacter )]."

BALL_REDGRASS_LESSON_NO_BULLETTAB:0 "On the eve of Redgrass Field the greatest blade of his age stooped to drink and a common arrow found his throat. Fire ends not always in flame. The house keeps the water-skin he dropped and the memory of that dusk: helms buckled in camp, pickets doubled, and bowmen drilled beside swords in every levy. Steel wins the yard; fletching decides the day; fortune asks no leave.\n#weak Train for the duel, fear the distant shot. Balls can be great [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]s."

ball_red_lances:0 "Red Lances"
ball_red_lances_flavor:0 "Mirror-black plate and a quiet crimson pennon: riders who wear Fireball’s name like a vow rather than a boast. They keep their tack spotless, their voices low, and their tempers stern in the yard, courteous on the road, stoic in the hall. Where they wait on the rise, horses breathing slow and even, the field seems to hold its breath with them before the charge."


#BOTLEY

botley_legacy_track_name: "Botley"
botley_legacy_track_desc: "Strengthened When Gathered"
botley_legacy_1_name: "Port of Pyke"
botley_legacy_2_name: "Shoal of Silver"
botley_legacy_3_name: "Tide Oaths"
botley_legacy_4_name: "Pyke’s Eastward Hand"
botley_legacy_5_name: "Keepers of Lordsport"

BOTLEY_PORT_OF_PYKE_NO_BULLETTAB:0 "Lordsport is located on the gentler side of Pyke, a pocket of piers beneath the black cliffs where lanterns burn green on fog nights. Botley pilots know every tooth of reef between Orkmont and Great Wyk; their harbor-masters time the tide to heartbeats and can smell a weather change coming round the point. Wreckers, salvagers, and chandlers all answer the same whistle, and old logs in the counting house list callers from Seagard, Fair Isle, and Braavos besides.\n#weak A harbor with a long memory. Enables recruitment of [GetMaA('botley_shoal_reavers').GetName] as [men_at_arms|E].#!."

BOTLEY_SHOAL_OF_SILVER_NO_BULLETTAB:0 "A shoal on pale green marks what fed them: herring and mackerel in their season, lampreys in barrels, and cod laid by the thousand to dry on frames. Salt pans hiss on the headland; tar and fish oil pay for oars and iron; and Botley tallymen can price a storm by how many casks turn up empty in Fairmarket. When krakens raid, they raid; when the catch runs fat, they trade.\n#weak Coin and catch ride the same tide. Botleys tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

BOTLEY_TIDE_OATHS_NO_BULLETTAB:0 "Botley sons take the sea as a sacrament. Drowned men press them under while kin sing, and they rise choking brine to swear by the cold god. Their keels carry driftwood idols, their prows wear prayer-knots of kelp, and every launch drinks a cup to the deeps. ‘What is dead may never die’ is not a boast on their lips so much as the way a man breathes before he slips the moorings.\n#weak Salt in the veins, iron on the belt. Botleys tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

BOTLEY_PYKES_EASTWARD_HAND_NO_BULLETTAB:0 "Across the rock-bridges stands Pyke; across the harbor stands Lordsport. Between them runs Botley duty—victuals tallied, berths cleared, men mustered, and messages set afloat faster than ravens in a contrary wind. When kraken banners rise, the Botley piers empty with practiced speed and fill again just as neatly.\n#weak Close to power, close at hand."

BOTLEY_KEEPERS_OF_LORDSPORT_NO_BULLETTAB:0 "Breakwaters hide chain sockets, signalers stand above the tide line, and towers can swap beacons for scorpions faster than a squall turns the sea. Botley wardens meter customs by daylight and stone a reaver by dusk; they billet sellsails in calm years and crew longships when Pyke drums for blood. A gate that smiles for coin and shuts like a visor for foes keeps the island in bread and iron both.\n#weak Open for trade; shut for war."

botley_shoal_reavers:0 "Shoal Reavers"
botley_shoal_reavers_flavor:0 "Fishers and dock-men of Lordsport turned swift fighters—oar-callused hands on axes, round shields scuffed by salt, and coil-ropes ready to snare ankles on slick planks. They know every tide and quay-post on Pyke’s westward shore, rushing from skiffs and piers to seize a deck or bar a landing. Work at dawn, war by dusk."

#STOUT

stout_legacy_track_name: "Stout"
stout_legacy_track_desc: "Stand Tall, Stay Alert"
stout_legacy_1_name: "Goldgrass Wardens"
stout_legacy_2_name: "First Men Tongue"
stout_legacy_3_name: "Wynton’s Breath"
stout_legacy_4_name: "Barrowland Farmsteads"
stout_legacy_5_name: "Muster of the East Gate"


STOUT_GOLDGRASS_WARDENS_NO_BULLETTAB:0 "Our lineage commands the timber gatehouse of Goldgrass, positioned precisely where the Kingsroad curves toward the eastern frontier of the barrowlands. We do not gamble our security on soft southern courtly vanities; our outriders watch the sweeping barley fields and burial mounds, keeping our iron gates firmly barred against outlaws or uninvited hosts.\n#weak A small, heavy door can guard a wide territory. Members of the Stout dynasty are usually born [GetTrait('strong').GetName( GetNullCharacter )]."

STOUT_FIRST_MEN_TONGUE_NO_BULLETTAB:0 "We carry a name like a blunt iron cudgel—short, First Men, and engineered to stand firm against the frost. Our family tree runs back to the ancient days when the barrow-kings laid down their bronze crowns, and we still swear our blood-oaths directly to the bone-white heart trees without the need for silk speech.\n#weak We trade fewer words to preserve the absolute firmness of our bonds. Members of the Stout dynasty are frequently born [GetTrait('honest').GetName( GetNullCharacter )]."

STOUT_WYNTONS_BREATH_NO_BULLETTAB:0 "We carry the freezing, legendary resilience of Ser Wynton Stout, who survived eighty brutal years as a veteran Ranger of the Night's Watch along the Wall. We drill our boys to string their bows with numb fingers in the teeth of arctic blizzards, teaching them the precise campaign patience required to outlast the long winters.\n#weak The deep frost takes the rash, but it leaves our ready trackers standing. Enables recruitment of [GetMaA('stout_goldgrass_bowmen').GetName] as [men_at_arms|E]."

STOUT_BARROWLAND_FARMSTEADS_NO_BULLETTAB:0 "Living between the sleeping crypts of ancient kings and the standing stones of the First Men, our hands have carved heavy turf-dykes to protect our winter stores. We audit our grain-barns and keep our cattle-pens secured with a calculating administrative clarity, making our house an indispensable anchor of the Barrowton markets.\n#weak Quiet, disciplined labor keeps the local troubles small while our cellars grow fat."

STOUT_MUSTER_OF_THE_EAST_GATE_NO_BULLETTAB:0 "The moment the war-horns sound at Barrowton, the Goldgrass levy marches on paths we meticulously keep open, our ranks dressed flawlessly to the freezing barrow wind. We do not field flashy cavalry vanguards; we bring a highly disciplined, well-ordered infantry that obeys commands with absolute northern stoicism.\n#weak A tidy, well-drilled muster systematically flattens an untidy fight. Members of the Stout dynasty are frequently born [GetTrait('calm').GetName( GetNullCharacter )]."


stout_goldgrass_bowmen:0 "Goldgrass Mound-Archers"
stout_goldgrass_bowmen_flavor:0 "Drawn from the veteran peat-scouts and horse-pasture guards of the eastern barrowlands, these elite marksmen are the lethal vanguard of Goldgrass. Equipped with short, heavy-draw yew bows specifically bound to counter the screaming northern crosswinds, they form up where the barley fields meet the ancient burial mounds. Drilled to ignore incoming cavalry rushes, they loose devastating, synchronized volleys of fire-hardened shafts to systematically freeze enemy vanguard movements across the flats."


#LYNDERLY

lynderly_legacy_track_name: "Lynderly"
lynderly_legacy_track_desc: "Cast Off and Renewed"
lynderly_legacy_1_name: "Serpents on Black"
lynderly_legacy_2_name: "Viper’s Courage"
lynderly_legacy_3_name: "Paths Beneath the Boughs"
lynderly_legacy_4_name: "Serpent’s Guile"
lynderly_legacy_5_name: "Wardens of Snakewood"

LYNDERLY_SERPENTS_ON_BLACK_NO_BULLETTAB:0 "The Lynderlys name their seat for the forest that raised them—Snakewood, where the canopy knots so thick that noon walks like dusk. Their banner, black strewn with writhing green serpents, recalls the adders that warm on old stones and the vipers that nest in stump and root. Timber from these trees roofed septs along the Long Lake and floored chambers in the Eyrie itself; hunts from these glades fed falcon-lords when snows pressed lean. In halls paneled with their own heartwood, the Lynderlys speak softly, as folk do who learned to listen before they step.\n#weak Deep shade grows steady names. Lynderlys tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

LYNDERLY_VIPERS_COURAGE_NO_BULLETTAB:0 "In the high hall of the Eyrie, when a Lannister demanded trial by combat, a young knight in green viper livery rose first, steel bare under the moonstones—Snakewood mettle shown before older crests could find their feet. In the telling at home, the moment begins earlier: with boys posted at dark doorways to learn the feel of thresholds, and with masters who teach that a swift, clean offer weighs more than a noisy oath. The viper strikes when it must and not a heartbeat later; so too the house that wears it.\n#weak The first step says the rest. Lynderlys tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

LYNDERLY_PATHS_BENEATH_THE_BOUGHS_NO_BULLETTAB:0 "Snakewood is laced with coppiced lanes and game paths the Lynderlys have walked since the First Men cut their first notch. Waystones carved with curling serpents hide among fern and foxglove; bark-blazes fade and are renewed by foresters who know which trees ‘bleed light’ and which keep secrets. Patrols slip from shaded ridge to shaded run without showing a helm, and mules reach the Eyrie’s lower stores on tracks not drawn on any lord’s neat map. In Snakewood, distance is measured in breaths, not miles.\n#weak The wood answers those who listen. Lynderlys tend to be great [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]s. Enables recruitment of [GetMaA('lynderly_vipers_of_the_bough').GetName] as [men_at_arms|E].#!."

LYNDERLY_SERPENTS_GUILE_NO_BULLETTAB:0 "The viper’s lesson is patience. Snakewood stewards sit long over ledgers and longer over gossip; a poacher’s snares tell more than his tongue, and a traveling singer’s set-list says which house paid him last. In market at the Bloody Gate and in the penny courts of the Vale, Lynderly envoys trade soft words for hard sense. A whisper placed at the right hearth can turn a levy, and a path left uncleared can steer a raid into a wet hollow. The coil is quiet until it closes.\n#weak Quiet coils, certain bite."

LYNDERLY_WARDENS_OF_SNAKEWOOD_NO_BULLETTAB:0 "Where the trees thin, the Lynderlys raise palisade and ditch; where the ground softens, they lay plank to carry boots and carts alike. Hunting laws are kept with a fair hand but a fast rope, for the wood feeds more than one hall; signal-posts speak from outer ride to castle gate by horn and mirrored plate when leaves are wet. Archers fletch short, stiff shafts for close boughs, and the muster knows the glades that hold firm after rain. When war comes, trunk and bow stand as one wall.\n#weak Bough and bow make one wall."

lynderly_vipers_of_the_bough:0 "Vipers of the Bough"
lynderly_vipers_of_the_bough_flavor:0 "Green-serpent cords on dark leathers, bowstaves waxed against the drip. These archers move like shadow under Snakewood’s canopy, reading tree marks and fern-bends for range, then striking from root and trunk with shafts cut short for close boughs. The forest is their screen and their snare."

#WAXLEY

waxley_legacy_track_name: "Waxley"
waxley_legacy_track_desc: "Light in Darkness"
waxley_legacy_1_name: "Candles of Wickenden"
waxley_legacy_2_name: "Bees and Bay"
waxley_legacy_3_name: "Keepers of the Wick"
waxley_legacy_4_name: "Scented Courts"
waxley_legacy_5_name: "Master Chandlers’ Guild"

WAXLEY_CANDLES_OF_WICKENDEN_NO_BULLETTAB:0 "Six white candles on grey, and a town that smells of honey even in rain. Wickenden’s hills keep long rows of bee hives shaded by fruit trees; wax is washed clear in copper pans, wicked on frames, and poured in molds beside jars of clove, rose, cedar, and bay. From these benches candles go to septs on the High Road and chambers in the Eyrie itself—soft flames that make marble kinder and councils calmer. The ledgers say ‘wax,’ but the Waxleys know they sell light, scent, and a memory that lingers after the wick is gone.\n#weak Prosperity by a steady flame. Waxleys tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

WAXLEY_BEES_AND_BAY_NO_BULLETTAB:0 "Bees hum in the hedgerows while casks thump on the quay. Wickenden sits snug on the Bay of Crabs, sending crates to Gulltown and brailed bundles westward, and taking back spice, fine threads, and staves for cooperage. Factors keep salt-damp from the stores and pilots know a dozen back entries when the weather turns. In lean years the wax still moves, for a lord will trim bread before he darkens his hall; in fat years, Wickenden’s smoke rises like incense from every roof.\n#weak Trade follows the light. Waxleys tend to be [GetTrait('shrewd').GetName( GetNullCharacter )]."

WAXLEY_KEEPERS_OF_THE_WICK_NO_BULLETTAB:0 "Lantern-posts mark the lanes to strand and storehouse, trimmed by lamplighters who carry brass shears and pride in equal measure. Watchmen count their rounds by the burn of a standard taper; beacon-baskets at the headland take pitch when fog crawls in from the bay. A bright town invites coin and blunts knives, and the Waxleys keep it so—dark corners lit, quays swept, and a bell ready to wake the street when shadows gather.\n#weak Bright posts make safer streets. Enables recruitment of [GetMaA('waxley_bright_pikes').GetName] as [men_at_arms|E].#!."

WAXLEY_SCENTED_COURTS_NO_BULLETTAB:0 "A cedar taper for the Eyrie’s cold stones, rose-blend for Gulltown’s parlors, myrrh and beeswax for the sept on the cliff—Wickenden learned what each great house favors and bottled that favor in light. Courtiers speak of ‘Waxley weather’ when a meeting feels warmer than the words warrant; stewards swear a calm room keeps tongues from catching fire. From Crackclaw to the Fingers, folk know that a Waxley gift arrives before a Waxley request.\n#weak Soft light wins hard rooms. Waxleys tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

WAXLEY_MASTER_CHANDLERS_GUILD_NO_BULLETTAB:0 "Wickenden’s guild binds hive to hall: wax-weights stamped true, wicks twisted to measure, and storehouses dry as bone under slate. Masters set prices that keep the poorest chapel alight in winter and the richest lord willing to pay for silk-wrapped pillars in spring. Lending chests see a farmer through a bad blossom, and a tithe of candles lights the road shrines. Silver pools in Waxley coffers without noise, then flows again—into ships, stone, and promises that burn as slow and sure as their best tapers.\n#weak Wealth poured, wealth kept."

waxley_bright_pikes:0 "Waxley Bright Pikes"
waxley_bright_pikes_flavor:0 "Polearms ranked like candleflames along a window sill—straight, steady, and hard to snuff. Raised among hives and harbor lights, these Wickenden men keep the roads as carefully as a wick, their good harness bought by wax, their discipline by habit. On the Vale’s hill-paths they plant steel and make the dusk step back."

#VAREZYS

varezys_legacy_track_name: "Varezys"
varezys_legacy_track_desc: "From the Ashes"
varezys_legacy_1_name: "Emperor of the New Valyria"
varezys_legacy_2_name: "True Blood of the Dragon"
varezys_legacy_3_name: "Qohorik Settlers"
varezys_legacy_4_name: "Restorers of the Old Legacy"
varezys_legacy_5_name: "Sons of the Fourteen Flames"

VAREZYS_EMPEROR_OF_THE_NEW_VALYRIA_NO_BULLETTAB:0 "A crown spoken over cinders still casts a long shadow. Aurion Varezys rode south through the red rain and named an empire reborn; his line keeps that bearing—ledgers ordered, banners squared, and judgments struck like coin. The Doom burned the world, not their will. Where they plant their standard, fields are counted, roads numbered, and lords reminded that dominion is a habit learned by doing.\n#weak Rule as if the fire never went out. Varezys tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

VAREZYS_TRUE_BLOOD_OF_THE_DRAGON_NO_BULLETTAB:0 "Silver hair like strands drawn bright, eyes like dawn on molten glass, and faces the court calls ‘Valyrian-fair’ whether it flatters or frightens. The old blood runs hot in Varezys veins, guarded in match and custom since the mountains broke. Midwives murmur that beauty sits easier on their babes, and singers swear the fire favours them—subtly, surely, stubborn as lineage can be.\n#weak The flame remembers its own. Varezys tend to be [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

VAREZYS_QOHORIK_SETTLERS_NO_BULLETTAB:0 "Columns of settlers marched under Qohor’s ironwork, hands hard from forge and field alike. They set palisades where maps showed only ash, drilled to the beat of smiths’ hammers, and learned to live lean without breaking. A Varezys camp rises straight, fights steady, and pays its men before the pot cools; when ruin stands in their way, they level it and build on the bones.\n#weak Discipline turns exile into a foothold. Enables recruitment of [GetMaA('varezys_bloody_mummer_skirmishers').GetName] as [men_at_arms|E].#!."

VAREZYS_RESTORERS_OF_THE_OLD_LEGACY_NO_BULLETTAB:0 "Stone whispers Valyrian truths if you listen: black basalt laid tight as scales, pale marble to catch the sun, streets ruled true, and arches that remember dragons. The Varezys keep those languages alive—mason by mason, tally by tally—pulling roads from scrub and halls from slag. Every pier set, every tower faced, is a prayer that the Freehold can be measured back into the world.\n#weak Rebuild the shape of greatness."

VAREZYS_SONS_OF_THE_FOURTEEN_FLAMES_NO_BULLETTAB:0 "Before crowns and chains, the Valyrians were herdsmen tending flocks beneath mountains that bled fire. When they found dragons lairing in the Fourteen Flames, they named them children of the volcanoes and mastered both beast and earth alike. From those fiery roots rose their Freehold—fueled by ore, blood, and the breath of monsters. Slaves from a hundred nations toiled in shafts of searing stone, where the air reeked of brimstone and firewyrms coiled unseen. Many died screaming, yet gold and dragonsteel still poured upward to feed Valyria’s pride. When the Doom came, the mountains roared as one and unmade their makers. The Fourteen Flames burned their shepherds and their dragons both, leaving only the Smoking Sea to whisper their name. The Varezys remember that the gods of their people were volcanoes, and that their prayers were always paid in pain. Their rites are half reverence, half remembrance—libations poured on coals, words spoken over heat. From the mines of death they take strength; from the ashes, purpose.\n#weak Fire birthed us, fire broke us, fire endures. Varezys tend to be [GetTrait('zealous').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('varezys_bloody_mummer_zorse_riders').GetName] as [men_at_arms|E].#!."

varezys_bloody_mummer_skirmishers:0 "Bloody Mummer Skirmishers"
varezys_bloody_mummer_skirmishers_flavor:0 "Despire their outrageous appearance, the Bloody Mummers remain a deadly band of mercenaries, noted for cruelty, itself excessive for even low-brow mercenaries. They're loyal to coin alone, but meet their price and their ranks will fill whatever role an army requires. The Skirmishers are lightly armed and armored, grandting them the mobility needed for rapid flanking."

varezys_bloody_mummer_zorse_riders:0 "Bloody Mummer Zorse Riders"
varezys_bloody_mummer_zorse_rigers_flavor:0 "Never lacking for outrageous flair, Bloody Mummer cavalry ride Zorses into battle. These unusual beasts originate from Essos, where striped animals and horses were interbred to create the species. Zorses can survive on little food and water for extended periods, but remain as swift as their western counterparts. Zorse Riders fill a classic light cavalry role in the Mummer ranks, flanking and charging pinned units and exposed archers."


#BELAERYS

belaerys_legacy_track_name: "Belaerys"
belaerys_legacy_track_desc: "Without End"
belaerys_legacy_1_name: "Founders of Flame"
belaerys_legacy_2_name: "Bloodbinders"
belaerys_legacy_3_name: "Masters of the Sky"
belaerys_legacy_4_name: "The Sothoryi Expedition"
belaerys_legacy_5_name: "Wyrmblood Ascendant"

BELAERYS_BLOOD_OF_THE_FIRST_FLAME_NO_BULLETTAB:0 "Before the Fourteen Flames ever smoked, the Belaerys kindled the first. Their blood shines bright and cold as dragonfire, their faces cut in the shape of forgotten gods. Singers call them beautiful; rivals call them unnatural. Theirs is the first fire, undimmed by time or ruin.\n#weak The first fire does not fade. Belaeryses tend to be [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

BELAERYS_BLOODBINDERS_NO_BULLETTAB:0 "They say the Belaerys dragons were the mightiest ever born—and that each one cost a life. In caverns cut deep beneath the Fourteen Flames, blood mingled with fire until both obeyed their will. They called it art, not sacrifice, and few dared argue while their beasts yet lived.\n#weak Blood is the leash and the key. Belaeryses tend to be [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]s."

BELAERYS_MASTERS_OF_THE_SKY_NO_BULLETTAB:0 "The skies above Valyria belonged to them. No host dared march while a Belaerys dragon wheeled overhead. Their banners were smoke and shadow; their messengers, wings. Even among dragonlords, they stood apart—as if the sun itself bowed its light before their flight.\n#weak The sky remembers its masters. Enables recruitment of [GetMaA('belaerys_terrax_longspears').GetName] as [men_at_arms|E].#!."

BELAERYS_SOTHORYI_EXPEDITION_NO_BULLETTAB:0 "Jaenara Belaerys and her dragon Terrax flew where maps end and madness begins. For three years she ruled the air above steaming jungles and black rivers, returning to tell of a world without edge. From her courage the house learned that fear is only wind—and every horizon, a promise.\n#weak South to the world’s bones."

BELAERYS_WYRMBLOOD_ASCENDANT_NO_BULLETTAB:0 "Their dragons grew vast as towers, their wings searing the clouds. Few survived to full strength, for their masters fed them blood and bound them with song. Yet even the Doom could not kill their will to rule.\n#weak The fire that crowns and consumes. Belaeryses tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

belaerys_terrax_longspears:0 "Terrax Longspears"
belaerys_terrax_longspears_flavor:0 "Named for Jaenara’s great dragon, the Terrax Longspears were drilled to hold while dragons wheeled above. Their ash-hafted pikes lock into a living hedge that breaks charges and bleeds knights dry, whether on Valyrian land or the steaming paths of Sothoryos. Under Belaerys banners, they advance in measured steps."

#ROGARE

rogare_legacy_track_name: "Rogare"
rogare_legacy_track_desc: "Prosperity and Peace"
rogare_legacy_1_name: "The Rogare Bank"
rogare_legacy_2_name: "The Merchants' Dominion"
rogare_legacy_3_name: "Web of Intrigue"
rogare_legacy_4_name: "The Magnificent’s Ambition"
rogare_legacy_5_name: "The Fall and the Crypt"

ROGARE_THE_ROGARE_BANK_NO_BULLETTAB:0 "The Rogare Bank stood once as the richest vault in Lys, rivaling even the Iron Bank of Braavos. From its counting-halls, loans flowed to kings, sellswords, and Septs alike. Each coin bore the mark of the dragon, each contract a whisper of power. When the Dance ended, even Westeros turned its gaze eastward to borrow from the House that had outlasted the dragons themselves.\n#weak Wealth is the purest fire—it consumes and refines alike. Rogares can be [GetTrait('shrewd').GetName( GetNullCharacter )]."

ROGARE_THE_MERCHANTS_DOMINION_NO_BULLETTAB:0 "From the quays of Lys to the marble courts of Oldtown, Rogare coin ruled trade like a crown. They bought fleets, founded guilds, and dictated the price of grain in half the Free Cities. Their ledgers reached farther than their swords, and no Magister’s decision was made without one of their seals beneath it. To the Rogares, commerce was faith, and profit divine will.\n#weak Trade brings coin that buys power. Rogares tend to be [GetTrait('greedy').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('rogare_vaultwardens_of_lys').GetName] as [men_at_arms|E].#!."

ROGARE_WEB_OF_INTRIGUE_NO_BULLETTAB:0 "The Rogares banked not only in coin but in secrets. They financed lovers, lords, and liars across two continents and collected collateral in whispers. A jest in the court of the Dragon could travel to Lys by sunrise, priced and purchased before sunset. When their rivals demanded repayment, the Rogares paid in silence—and that silence cost more than blood.\n#weak Every debt has its due; some are paid in tongues."

ROGARE_THE_MAGNIFICENTS_AMBITION_NO_BULLETTAB:0 "Lysandro Rogare, head of the Rogare Bank, ruled the wealth of half the known world. After his daughter Larra wed Prince Viserys Targaryen, gold and blood bound Lys and Westeros alike. Flush with triumph, he named himself First Magister for Life, and Lys called him the Magnificent. For a brief, blinding season, his bank outshone even the Iron Bank of Braavos—until knives in the dark redressed the balance. Within a single day, Lysandro and his brother were found dead, their coffers plundered, their ledgers burned. Some whisper the Iron Bank paid the Faceless Men not for debt, but dominion.\n#weak Gold may buy kingdoms, but never safety. Rogares tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

ROGARE_THE_FALL_AND_THE_CRYPT_NO_BULLETTAB:0 "When Lysaro’s embezzlement bled the vaults dry, the Rogare empire imploded overnight. Riots tore through Lys; nobles and paupers alike clawed at the bank’s iron doors. In the Temple of Trade, Lysaro’s death was taken as penance enough for all. Yet in secret, Moredo gathered what remained of their fortune, buried it with their bones, and left a warning to those who would rise too fast: ‘All accounts close in blood.’\n#weak Fortune forgives nothing—not even its favorites."

rogare_vaultwardens_of_lys:0 "Vault Wardens of Lys"
rogare_vaultwardens_of_lys_flavor:0 "Raised from the sons of merchants and the bastards of magisters, the Vaultwardens guard Rogare fortunes with gilded armor and quiet devotion. Their crimson cloaks mark them as more than soldiers—they are symbols of order bought by coin and bound by oath. Within the marble courtyards of Lys, their drills echo like the clink of coin against stone. When the family and the bank fell, many still stood their post before sealed vaults, blades drawn against mobs and memory alike."

#SAAN

saan_legacy_track_name: "Saan"
saan_legacy_track_desc: "On Grim Tides"
saan_legacy_1_name: "Blood of the Basilisk King"
saan_legacy_2_name: "Princes of the Narrow Sea"
saan_legacy_3_name: "The Brotherhood of Bones"
saan_legacy_4_name: "The Band of Nine"
saan_legacy_5_name: "The Pirate King’s Promise"

SAAN_BLOOD_OF_THE_BASILISK_KING_NO_BULLETTAB:0 "Saathos Saan was sent by Lys to purge the Basilisk Isles of pirates. He did — by crowning himself their king. For thirty years his black galleys ruled those fever jungles, flying a banner of chained serpents and silver oars. He built his throne from driftwood and skulls, and his treasure vault from the wrecks of foreign fleets. From him the Saans learned their creed: if you can take it, you deserve it.\n#weak Rule is seized, never granted. Saans tend to be [GetTrait('deceitful').GetName( GetNullCharacter )]."

SAAN_PRINCES_OF_THE_NARROW_SEA_NO_BULLETTAB:0 "Salladhor Saan, the last of the great corsairs, called himself 'Prince of the Narrow Sea' with a smile and a sword. His galleas Valyrian and his striped galleys carried both plunder and laughter to the Blackwater’s edge. Every Saan since has claimed the same right—to rule what cannot be ruled, to own nothing and everything at once. Their fleets fight under Lysene silk, but their hearts beat to a freer rhythm than any king’s law.\n#weak The sea crowns its own. Saans tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

SAAN_THE_BROTHERHOOD_OF_BONES_NO_BULLETTAB:0 "When the Basilisk Isles rotted with plague and corsair warlords rose anew, it was the Saans who whispered their return. They rebuilt their grandfather’s empire not with fleets, but with oaths carved in bone and sealed with blood. The Brotherhood of Bones swore loyalty to coin and kin, binding smugglers, assassins, and thieves beneath the same skull-marked banner. Every debt was paid in flesh, and every betrayal displayed for the crows.\n#weak Brotherhood is worth more than banners. Saans tend to be [GetTrait('callous').GetName( GetNullCharacter )]. Enables recruitment of [GetMaA('saan_basilisk_marauders').GetName] as [men_at_arms|E].#!."

SAAN_THE_BAND_OF_NINE_NO_BULLETTAB:0 "Samarro Saan, called the Last Valyrian, stood beneath the Tree of Crowns with outlaws and exiles, and forged the Band of Nine. They promised each other kingdoms, and for a season they nearly took them. The Disputed Lands burned, Tyrosh fell, and the Stepstones bowed to their fleet. Samarro’s banner flew beside Blackfyre’s, proof that even in ruin, Valyrian blood still sought dominion. When the Nine fell, the Saans endured, their gold carried home in coffers and corpses alike.\n#weak Ambition sails longer than loyalty. Enables recruitment of [GetMaA('saan_corsairs').GetName] as [men_at_arms|E].#!."

SAAN_THE_PIRATE_KINGS_PROMISE_NO_BULLETTAB:0 "The Saans are eternal as the tide. Kings rise and drown; the Saans only drift to new harbors. Salladhor laughed that every Saan dies rich and free, and if he does not, he wasn’t truly Saan. Their galleys vanish into the Stepstones, their gold into rumor, their names into legend. No crown has ever bound them, no god ever owned them, and no man has ever found the end of their treasure or their tale.\n#weak Freedom is worth more than any kingdom."

saan_basilisk_marauders:0 "Basilisk Marauders"
saan_basilisk_marauders_flavor:0 "Sworn to the Saans and blooded in the jungles of the Basilisk Isles, the Basilisk Marauders are the Brotherhood’s iron hand. They strike from mangrove and mist, cutting down oathbreakers, rival corsairs, and any fool who forgets who rules the green isles. Their loyalty is branded into their flesh with the serpent sigil of House Saan, and their oaths are renewed with every kill. When the Marauders march, they carry both tribute and terror in the Saan name."

saan_corsairs:0 "Saan Corsairs"
saan_corsairs_flavor:0 "The Saan Corsairs are the sea-hardened veterans of a hundred fights from the Stepstones to the Basilisk Isles. Their armor is darkened leather and sea-scarred mail underneath, and their curved blades nicked but true. They fight in loose ranks and close quarters, trusting in instinct and each other more than any drill. Discipline born of survival keeps their lines unbroken, and loyalty to House Saan keeps them fed. When the Corsairs land, they fight for gold, for pride, and for the house whose flag still rules the tide."


#HAEN

haen_legacy_track_name: "Haen"
haen_legacy_track_desc: "Union Through Truth"
haen_legacy_1_name: "Silk and Sapphire"
haen_legacy_2_name: "Perfumed Courts"
haen_legacy_3_name: "Magisters’ Masks"
haen_legacy_4_name: "The Maiden’s Day Curse"
haen_legacy_5_name: "The Feast of Ashes"

HAEN_SILK_AND_SAPPHIRE_NO_BULLETTAB:0 "Lys made them beautiful, and beauty made them dangerous. House Haen’s daughters shine like cut gems and move like whispers through smoke. Courts remember their silks longer than their words, and that is how they mean it to be.\n#weak The sheen of silk hides sharper edges. Haens tend to be [GetTrait('fashionable').GetName( GetNullCharacter )]."

HAEN_PERFUMED_COURTS_NO_BULLETTAB:0 "Haens perfume every chamber they enter—cedar for confidence, rose for charm, myrrh for menace. Their tongues are honeyed and their promises intoxicating; few remember the sting until the scent has faded.\n#weak Every favor smells sweet until it rots. Haens tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

HAEN_MAGISTERS_MASKS_NO_BULLETTAB:0 "In the palaces of Lys, no one rules without a mask. The Haens wear theirs in gold and silk, trading smiles like coin. Behind each sits a ledger of names, debts, and quiet threats that make magisters dance.\n#weak Smile, and count the knives. Enables recruitment of [GetMaA('haen_azure_phalanx').GetName] as [men_at_arms|E].#!."

HAEN_MAIDENS_DAY_CURSE_NO_BULLETTAB:0 "When Myrmadora Haen came before Aegon in translucent silk, even the Seven blushed. Yet her family’s beauty and ambition both proved fatal. They say the Maiden’s Day curse still follows those who seek crowns by desire alone.\n#weak Every glance is a gamble. Haens tend to be [GetTrait('ambitious').GetName( GetNullCharacter )]."

HAEN_FEAST_OF_ASHES_NO_BULLETTAB:0 "Torreo Haen toasted his own triumph as First Magister of Lys. Moments later, every cup turned grave. The feast left no heir, only rumors, recipes, and a dynasty that learned to sip slow and smile often.\n#weak The sweetest wine hides the deadliest draught."

haen_azure_phalanx:0 "Azure Phalanx"
haen_azure_phalanx_flavor:0 "The Azure Phalanx stand as the mailed pride of House Haen, drilled from the harbor wards of Lys and armored in the city’s own colors. Bronze-scaled cuirasses shimmer like fish beneath the sun, and azure sashes mark their rank. They fight with short, leaf-bladed swords and heavy shields, forming shining walls in narrow streets. Merchants call them ornaments; foes call them immovable. Whether guarding magisters’ gates or cutting through riots, the Phalanx moves as one—beautiful, disciplined, and deadly."


#ANTARYON

antaryon_legacy_track_name: "Antaryon"
antaryon_legacy_track_desc: "Steel and Song"
antaryon_legacy_1_name: "Keys of Freedom"
antaryon_legacy_2_name: "Bankers' Blood"
antaryon_legacy_3_name: "Masters of Coin and Tide"
antaryon_legacy_4_name: "Witnesses of the Pact"
antaryon_legacy_5_name: "The Iron Law"

ANTARYON_KEYS_OF_FREEDOM_NO_BULLETTAB:0 "Ilaro the Freed took a key instead of a crown, and from that iron token rose a house that would never bow. The Antaryons guard liberty with ledgers and oaths alike, their manse a monument to what no chain can hold.\n#weak Freedom is the first fortune. Antaryons tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

ANTARYON_BANKERS_BLOOD_NO_BULLETTAB:0 "Their ancestors, one of twenty-three original members, founded the Iron Bank, and the blood that bought Braavos its freedom still runs cold and calculating. The Antaryons lend carefully, collect ruthlessly, and never forget a debt—whether owed in coin or blood.\n#weak Credit is trust, and trust is power. Antaryons can be [GetTrait('shrewd').GetName( GetNullCharacter )]."

ANTARYON_MASTERS_OF_COIN_AND_TIDE_NO_BULLETTAB:0 "Braavos lives by its waters, and the Antaryons rule the flow. Their barges bear silk, spice, and soldiers; their fleets chase storms and profits alike. Gold and tide obey the same master.\n#weak Fortune sails with the brave. Enables recruitment of [GetMaA('antaryon_free_company_of_the_key').GetName] as [men_at_arms|E].#!."

ANTARYON_WITNESSES_OF_THE_PACT_NO_BULLETTAB:0 "When kings and princes swore oaths in shadow, it was Ferrego Antaryon, Sealord of Braavos, who bore silent witness. The Sealord’s ink sealed a pact between dragon and sun, and the house learned that secrets are worth more than gold. In Braavos, silence is a language—and they speak it fluently.\n#weak The ink outlasts the crown."

ANTARYON_THE_IRON_LAW_NO_BULLETTAB:0 "When all the world was chains, Braavos made law its shield. The Antaryons remember this better than any. Their courts ring with justice as hard as forged iron, and every decree is a hammer blow against tyranny.\n#weak The law is our chain, and our freedom both. Antaryons tend to be [GetTrait('just').GetName( GetNullCharacter )]."

antaryon_free_company_of_the_key:0 "Free Company of the Key"
antaryon_free_company_of_the_key_flavor:0 "Forged from contracts and coin, the Free Company of the Key are Braavos’s answer to the sellsword hordes of Essos. Hardened by years on foreign soil, these mercenaries serve House Antaryon in exchange for pay weighed in iron and gold alike. Their captains carry the sigil of the iron key on their shields—a reminder that debt and death are both forms of payment. They march in mail and leather, wielding broad swords and heavy shields, as ready to collect a debt as to win a war."

#TARBECK

tarbeck_legacy_track_name: "Tarbeck"
tarbeck_legacy_track_desc: "Honor in Defiance"
tarbeck_legacy_1_name: "Ancient Star"
tarbeck_legacy_2_name: "Reforged Hall"
tarbeck_legacy_3_name: "Starforged Retainers"
tarbeck_legacy_4_name: "Pride Unbent"
tarbeck_legacy_5_name: "Ashes of the West"

TARBECK_ANCIENT_STAR_NO_BULLETTAB:0 "House Tarbeck was old when many younger banners were still rising. Though their halls weathered long decline, their name endured in the west as one spoken with a certain grave respect—ancient, honorable, and proud in the way only old houses can be.\n#weak Even a dim star may still command the night. Tarbecks tend to be [GetTrait('honest').GetName( GetNullCharacter )]."

TARBECK_REFORGED_HALL_NO_BULLETTAB:0 "Where others faded with time and want, the Tarbecks turned to coin and resolve, restoring their hall and raising their standing anew. What they lacked in fortune, they rebuilt in stone and resolve, until their strength could no longer be dismissed.\n#weak Gold can raise what time has worn thin."

TARBECK_STARFORGED_RETAINERS_NO_BULLETTAB:0 "The strength of Tarbeck Hall was not inherited—it was reforged. These retainers stand as proof of that ambition, armored in fresh steel and bound by oath to a house determined to rise beyond its station.\n#weak Not born to greatness, but made for it. Enables recruitment of [GetMaA('tarbeck_starforged_retainers').GetName] as [men_at_arms|E].#!."

TARBECK_PRIDE_UNBENT_NO_BULLETTAB:0 "The Tarbecks did not prosper quietly. Wealth sharpened old pride into open defiance, and they bore themselves less as chastened bannermen than as near-equals among the great houses. They laughed where others would have bowed, and answered demands as though insult were a greater wound than steel.\n#weak Some houses bend to survive. Others would sooner dare the lion. Tarbecks tend to be [GetTrait('arrogant').GetName( GetNullCharacter )]."

TARBECK_ASHES_OF_THE_WEST_NO_BULLETTAB:0 "The name of Tarbeck is spoken with a certain weight, remembered for the heights it reached and the defiance it carried. Its legacy lingers in the west as both example and warning—proof that ambition may raise a house high, but pride will decide how it is remembered.\n#weak Some names endure not for what they built, but for how they stood."

tarbeck_starforged_retainers:0 "Starforged Retainers"
tarbeck_starforged_retainers_flavor:0 "The Starforged Retainers are heavy infantry sworn to Tarbeck Hall, equipped with bright mail, sturdy shields, and simple blades. Raised during the house’s resurgence, they are drilled to fight in close formation, holding lines and guarding strongholds with steady discipline. They are not famed for tradition, but for proving their worth in the field."

#COSTAYNE

costayne_legacy_track_name: "Costayne"
costayne_legacy_track_desc: "Grace in Division"
costayne_legacy_1_name: "Black Chalice Courtesy"
costayne_legacy_2_name: "Keepers of the Whispering Sound"
costayne_legacy_3_name: "Guests of Greater Courts"
costayne_legacy_4_name: "Their Own Counsel"
costayne_legacy_5_name: "A Name Among Lords"

COSTAYNE_BLACK_CHALICE_COURTESY_NO_BULLETTAB:0 "House Costayne carries itself with a careful grace, balancing reverence and quiet pride. Their words are measured, their presence refined, and their place among the Reach’s nobility secured through composure rather than spectacle.\n#weak Courtesy is not submission—it is control. Costaynes tend to be [GetTrait('calm').GetName( GetNullCharacter )]."

COSTAYNE_KEEPERS_OF_THE_SOUND_NO_BULLETTAB:0 "From their towers along the Whispering Sound, the Costaynes have long guarded the coast with steady vigilance. Their strength lies not in grand fleets or bold offensives, but in watchfulness, discipline, and a readiness to meet what comes from sea or shore alike.\n#weak The tide does not announce itself. Enables recruitment of [GetMaA('costayne_chalice_wardens').GetName] as [men_at_arms|E].#!."

COSTAYNE_GUESTS_OF_GREATER_COURTS_NO_BULLETTAB:0 "Rarely the highest voice, yet seldom absent, the Costaynes have made their way through courts where greater powers gather. They listen well, speak carefully, and leave impressions that linger longer than their station might suggest.\n#weak To be present is to matter."

COSTAYNE_THEIR_OWN_COUNSEL_NO_BULLETTAB:0 "Though sworn as any other, the Costaynes have not always followed where expectation leads. At times they have chosen differently, guided by their own judgment rather than another’s command.\n#weak Loyalty may bend, but it does not always break. Costaynes tend to be [GetTrait('stubborn').GetName( GetNullCharacter )]."

COSTAYNE_A_NAME_AMONG_LORDS_NO_BULLETTAB:0 "House Costayne endures not through dominance, but through constancy. Their name appears where it must—in courts, in councils, and among those whose voices shape the realm—never foremost, but never absent.\n#weak Some houses seize power. Others are never without it."

costayne_chalice_wardens:0 "Chalice Wardens"
costayne_chalice_wardens_flavor:0 "The Chalice Wardens are sworn retainers of House Costayne, drawn from trusted knights and household men. Bearing the chalice and rose upon dark surcoats, they serve in both court and field, equally suited to escort, watch, and war. They fight in ordered ranks, relying on discipline and steadiness rather than fury."

#FISHER

fisher_legacy_track_name: "Fisher"
fisher_legacy_track_desc: "Kings Beneath the Waters"
fisher_legacy_1_name: "Crowned Catfish"
fisher_legacy_2_name: "Lords of the Blackwater Mouth"
fisher_legacy_3_name: "Shadows of Oldstones"
fisher_legacy_4_name: "River Kings Remembered"
fisher_legacy_5_name: "The Lost Crown"


FISHER_CROWNED_CATFISH_NO_BULLETTAB:0 "Our lineage commands a primordial antiquity that existed thousands of years before the first stone of Riverrun was laid, tracing back to the Bronze Age Kings of the Misty Isle. We ruled the shifting channels of the Trident not by southern parchment laws, but by an absolute mastery of the current.\n#weak The river has swallowed our ancient palaces, but the blood of the first kings still runs deep. Members of the Fisher dynasty are frequently born [GetTrait('patient').GetName( GetNullCharacter )]."

FISHER_BLACKWATER_MOUTH_NO_BULLETTAB:0 "Long before the Targaryens raised their Aegonfort, our ancestors commanded the strategic mouth of the Blackwater Rush where the river meets the salt-sea. We deployed hidden skiff-vanguards along the shallows, auditing every merchant barge and foreign longship to extract a heavy toll from the realm's trade.\n#weak We rule the vital arteries of the lowlands, and our arrows defend the banks. Enables recruitment of [GetMaA('fisher_kings_bowmen').GetName] as [men_at_arms|E]."

FISHER_SHADOWS_OF_OLDSTONES_NO_BULLETTAB:0 "We have never forgotten how the upstart Mudds of Oldstones violently shattered our ancient kingdom and stole our river-throne during the Age of Heroes. Our displaced bloodline has spent millennia hoarding our claims in the dark, watching the current shift with a dangerous, sharp-eyed opportunism to reclaim what was stolen.\n#weak The crown of the Mudds turned to dust, but the red catfish banner rises to conquer. Members of the Fisher dynasty are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

FISHER_RIVER_KINGS_REMEMBERED_NO_BULLETTAB:0 "The common smallfolk and marsh-fishermen of the Trident still murmur the names of our ancient rulers in their nocturnal hearth-tales. We do not view ourselves as secondary vassals to newer great houses; we carry the majestic echo of a prehistoric kingship that refuses to bow to upstart lords.\n#weak A crown drowned in the current is not a crown surrendered, and our honor never fades."

FISHER_THE_LOST_CROWN_NO_BULLETTAB:0 "Though centuries of Andal crusades and ironborn tyrants have stripped our incomes, the soul of the Misty Isle remains completely unbent. We use our deep knowledge of the hidden causeways, reed-choked bogs, and tidal flats to manipulate the local markets and freeze the movements of foreign hosts.\n#weak We stand midstream, our ancient legal claim an absolute weapon against our debtors."


fisher_kings_bowmen:0 "Misty Isle Reed-Archers"
fisher_kings_bowmen_flavor:0 "Drawn from the most agile, water-wise marsh-dwellers and eel-weir collectors of the central Trident forks, these elite marksmen are the resurrected shield of the Fisher kings. Wearing camouflaged canvas surcoats and light iron caps, they are meticulously drilled to utilize heavy reed-stakes and mobile wicker screens along the riverbanks. Wielding short, high-tension bows engineered to fire true in dense river-fogs, they specialize in high-attrition bottleneck skirmishing, ruthlessly pinning down enemy outriders in the mud before a blade can be drawn."


#PAYNE

payne_legacy_track_name: "Payne"
payne_legacy_track_desc: "Duty Without Voice"
payne_legacy_1_name: "Chequy Coin"
payne_legacy_2_name: "Sworn to the Rock"
payne_legacy_3_name: "The Silent Blade"
payne_legacy_4_name: "King’s Justice"
payne_legacy_5_name: "Obedience Without Question"

PAYNE_CHEQUY_COIN_NO_BULLETTAB:0 "The coins upon House Payne’s sigil speak to a long service tied to gold and obligation. Whether through duty, reward, or necessity, their fortunes have ever been bound to those they serve.\n#weak Coin passes hands. Duty does not. Paynes tend to be [GetTrait('just').GetName( GetNullCharacter )]."

PAYNE_SWORN_TO_THE_ROCK_NO_BULLETTAB:0 "House Payne stands close to power through their service. Their loyalty is not loudly declared, but proven through action, time and again, wherever their liege has need.\n#weak Some men rule, while others protect that rule. Paynes tend to be [GetTrait('loyal').GetName( GetNullCharacter )]."

PAYNE_THE_SILENT_BLADE_NO_BULLETTAB:0 "There are those who speak, and those who act. The Paynes have long been counted among the latter, carrying out grim duties without hesitation or complaint, their silence as notable as their obedience.\n#weak Not all service is meant to be heard. Enables recruitment of [GetMaA('payne_silent_guard').GetName] as [men_at_arms|E].#!."

PAYNE_KINGS_JUSTICE_NO_BULLETTAB:0 "When judgment must be carried out, it is not always done by those who pass sentence. House Payne has long been entrusted with the final act, delivering justice with a steady hand and no need for words.\n#weak The sentence is spoken by one, fulfilled by another."

PAYNE_OBEDIENCE_WITHOUT_QUESTION_NO_BULLETTAB:0 "The strength of House Payne lies not in ambition, but in certainty. Orders are followed, duties fulfilled, and burdens carried without hesitation. In this, they have earned both trust—and unease.\n#weak To obey is simple. To never question is something else entirely."

payne_silent_guard:0 "Silent Guard"
payne_silent_guard_flavor:0 "The Silent Guard are sworn men of House Payne, trained to carry out orders without hesitation or distraction. They are known less for valor than for reliability, and once set to a task, they see it done."