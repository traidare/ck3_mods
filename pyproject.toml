[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The CLI is Go. Python is retained only for the generator sidecar the Go core
# runs as `python -m gen`, which needs numpy and Pillow for the map and world
# data generators. The sidecar is imported off PYTHONPATH rather than installed;
# this file exists so those requirements and the lint settings have one home.
[project]
name = "ck3mm-gen"
version = "0.2.0"
description = "Generator sidecar for the ck3mm CK3 mod workspace manager"
requires-python = ">=3.11"
authors = [{ name = "traidare" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["tools"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
known-first-party = ["gen"]

[tool.ruff.lint.per-file-ignores]
"workspace/**/implementation.py" = ["E501"]
"workspace/**/map_merge.py" = ["E501"]
"workspace/**/runtime_fixes/*.py" = ["E501"]
