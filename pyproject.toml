[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ck3mm"
version = "0.1.0"
description = "Repository-local Crusader Kings III mod workspace manager"
requires-python = ">=3.11"
authors = [{ name = "traidare" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
]

[project.scripts]
ck3mm = "ck3mm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"workspace/**/implementation.py" = ["E501"]
"workspace/**/map_merge.py" = ["E501"]
