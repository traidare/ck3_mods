[[groups]]
name = "beach_detail"
role = "detail"
reason = "Coast dressing does not determine a province-wide gameplay terrain."
patterns = ["beach_02*_mask.png"]

[[groups]]
name = "rock_detail"
role = "detail"
reason = "Rock overlays refine a primary mountain, hill, desert, or ground mask."
patterns = [
  "coastline_cliff_grey_mask.png",
  "gravel *_elis_mask.png",
  "rock *_elis_mask.png",
  "rusty *_elis_mask.png",
]

[[groups]]
name = "ground_detail"
role = "detail"
reason = "Generic ground overlays are intentionally subordinate to semantic masks."
patterns = [
  "ground *_elis_mask.png",
  "stone *_elis_mask.png",
  "stonetile_mask.png",
]

[[groups]]
name = "road_detail"
role = "detail"
reason = "Road masks cannot justify road terrain without route topology."
patterns = [
  "kingsroad_mask.png",
  "road *_elis_mask.png",
]
